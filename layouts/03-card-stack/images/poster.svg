<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <!-- Design Style · 布局 03 · 卡片层叠 Card Stack —— 海报 / 1080×1350 -->
  <defs>
    <style>
      .d { font-family: 'Inter Display', 'Noto Sans SC', sans-serif; }
      .t { font-family: 'Inter', 'Noto Sans SC', sans-serif; }
      .m { font-family: 'Geist Mono', 'SFMono-Regular', Menlo, monospace; }
      .c { font-family: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    </style>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0F172A" flood-opacity=".08"/></filter>
    <filter id="lift" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="22" stdDeviation="28" flood-color="#0F172A" flood-opacity=".12"/></filter>
    <filter id="dim1"><feColorMatrix type="matrix" values="0.92 0 0 0 0  0 0.92 0 0 0  0 0 0.92 0 0  0 0 0 1 0"/></filter>
    <filter id="dim2"><feColorMatrix type="matrix" values="0.84 0 0 0 0  0 0.84 0 0 0  0 0 0.84 0 0  0 0 0 1 0"/></filter>
    <filter id="dim3"><feColorMatrix type="matrix" values="0.76 0 0 0 0  0 0.76 0 0 0  0 0 0.76 0 0  0 0 0 1 0"/></filter>
    
  </defs>
  <rect x="0" y="0" width="1080" height="1350" rx="0" fill="#F4F5F7" />
  <circle cx="77" cy="96" r="5" fill="#2563EB"/>
  <text x="92" y="103" class="m" font-size="18" font-weight="500" fill="#64748B" >Design Style · 布局 03</text>
  <text x="1008" y="103" class="t" font-size="16" font-weight="500" fill="#94A3B8" text-anchor="end" >iOS sheet · Stripe dashboard</text>
  <text x="68" y="210" class="d" font-size="86" font-weight="700" fill="#0F172A" letter-spacing="-3" >CARD STACK</text>
  <text x="72" y="278" class="c" font-size="42" font-weight="700" fill="#0F172A" letter-spacing="3" >卡片层叠</text>
  <text x="72" y="330" class="c" font-size="22" font-weight="500" fill="#64748B" >3–4 张。一张在焦点。</text>
  <g filter="url(#dim3)"><rect x="202" y="542" width="620" height="280" rx="26" fill="#FFFFFF" /></g><g filter="url(#dim2)"><rect x="218" y="568" width="620" height="280" rx="26" fill="#FFFFFF" /></g><g filter="url(#dim1)"><rect x="234" y="594" width="620" height="280" rx="26" fill="#FFFFFF" /></g><g transform="rotate(-1.2 560 760)" filter="url(#lift)"><rect x="250" y="602" width="620" height="280" rx="26" fill="#FFFFFF" /><circle cx="278" cy="632" r="6" fill="#2563EB"/><text x="292" y="637" class="t" font-size="15" font-weight="600" fill="#64748B" >Focusus</text><text x="842" y="637" class="m" font-size="12" font-weight="500" fill="#94A3B8" text-anchor="end" >04</text><text x="278" y="670" class="c" font-size="20" font-weight="700" fill="#0F172A" >This week</text><rect x="278" y="688" width="564" height="1" rx="0" fill="rgba(15,23,42,.08)" /><rect x="278" y="702" width="276" height="44" rx="10" fill="#F1F5F9" /><rect x="566" y="702" width="276" height="44" rx="10" fill="#F1F5F9" /><rect x="282" y="817.7" width="70.3" height="40.3" rx="3" fill="#D9DEE7" /><rect x="360.3" y="802" width="70.3" height="56" rx="3" fill="#D9DEE7" /><rect x="438.6" y="824.4" width="70.3" height="33.6" rx="3" fill="#D9DEE7" /><rect x="516.9" y="781.8" width="70.3" height="76.2" rx="3" fill="#D9DEE7" /><rect x="595.1" y="813.2" width="70.3" height="44.8" rx="3" fill="#D9DEE7" /><rect x="673.4" y="746" width="70.3" height="112" rx="3" fill="#2563EB" /><rect x="751.7" y="808.7" width="70.3" height="49.3" rx="3" fill="#D9DEE7" /></g>
  <text x="540" y="980" class="t" font-size="18" font-weight="500" fill="#64748B" text-anchor="middle" >Focus the top sheet. Dim what sits behind.</text>
  <text x="72" y="1088" class="d" font-size="28" font-weight="600" fill="#0F172A" >3–4 sheets. One in focus.</text>
  <text x="72" y="1136" class="c" font-size="22" font-weight="400" fill="#64748B" >后层轻轻压暗、顶部微抬、微旋——</text>
  <text x="72" y="1172" class="c" font-size="22" font-weight="400" fill="#64748B" >像 iOS sheet，也像 Stripe 的抽屉。</text>
  <text x="540" y="1294" class="m" font-size="15" font-weight="400" fill="#94A3B8" text-anchor="middle" >@guanmo_ai   ·   github.com/guanmo-ai/design-style</text>
</svg>
