  <rect x="72" y="942" width="458" height="330" rx="20" fill="#17181B" stroke="rgba(255,255,255,.07)"/>
  <text x="100" y="992" class="c" font-size="24" font-weight="700" fill="#F4F2EE" >CSS（2025 起）</text>
  <text x="502" y="991" class="m" font-size="14" font-weight="400" fill="#8C8A86" text-anchor="end" >display: grid-lanes</text>
  <text x="100" y="1034" class="m" font-size="15" font-weight="400" fill="#B9B7B2" >.wall {</text>
  <text x="100" y="1059" class="m" font-size="15" font-weight="500" fill="#F2462E" >  display: grid-lanes;</text>
  <text x="100" y="1084" class="m" font-size="15" font-weight="400" fill="#B9B7B2" >  grid-template-columns:</text>
  <text x="100" y="1109" class="m" font-size="15" font-weight="400" fill="#B9B7B2" >    repeat(auto-fill,</text>
  <text x="100" y="1134" class="m" font-size="15" font-weight="400" fill="#B9B7B2" >      minmax(240px, 1fr));</text>
  <text x="100" y="1159" class="m" font-size="15" font-weight="400" fill="#B9B7B2" >  gap: 16px;</text>
  <text x="100" y="1184" class="m" font-size="15" font-weight="400" fill="#B9B7B2" >}</text>
