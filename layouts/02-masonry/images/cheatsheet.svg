  <rect x="0" y="0" width="1080" height="1350" rx="0" fill="#0D0E10" />
  <circle cx="77" cy="96" r="5" fill="#F2462E"/>
  <text x="92" y="103" class="c" font-size="20" font-weight="500" fill="#8C8A86" letter-spacing="1" >布局 02 · 速查卡</text>
  <text x="1008" y="103" class="c" font-size="16" font-weight="400" fill="#8C8A86" text-anchor="end" >这张卡本身就是一面两列的瀑布流</text>
  <text x="69" y="196" class="sf" font-size="96" font-weight="400" fill="#F4F2EE" letter-spacing="-1.5" >Masonry</text>
  <text x="412" y="190" class="c" font-size="38" font-weight="900" fill="#F4F2EE" letter-spacing="2" >瀑布流 · 一页记住</text>
  <rect x="72" y="232" width="936" height="290" rx="20" fill="#17181B" stroke="rgba(255,255,255,.07)"/>
  <text x="100" y="282" class="c" font-size="24" font-weight="700" fill="#F4F2EE" >算法：最短列优先</text>
  <text x="980" y="281" class="m" font-size="14" font-weight="400" fill="#8C8A86" text-anchor="end" >O(n · 列数)</text>
  <rect x="102" y="312" width="70" height="150" rx="8" fill="#24262A" />
  <text x="137" y="486" class="m" font-size="13" font-weight="500" fill="#8C8A86" text-anchor="middle" >600</text>
  <rect x="186" y="312" width="70" height="100" rx="8" fill="#24262A" />
  <text x="221" y="436" class="m" font-size="13" font-weight="500" fill="#8C8A86" text-anchor="middle" >400</text>
