  <rect x="354" y="400" width="70" height="56" rx="8" fill="rgba(242,70,46,.12)" stroke="#F2462E" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="389" y="434" class="c" font-size="16" font-weight="700" fill="#F2462E" text-anchor="middle" >新</text>
  <text x="450" y="336" class="m" font-size="14.5" font-weight="400" fill="#B9B7B2" >heights = [0] * 列数</text>
  <text x="450" y="366" class="m" font-size="14.5" font-weight="400" fill="#B9B7B2" >for card in cards:</text>
  <rect x="440" y="375" width="550" height="30" rx="6" fill="rgba(242,70,46,.16)" />
  <text x="450" y="396" class="m" font-size="14.5" font-weight="500" fill="#F4F2EE" >  i = argmin(heights)</text>
  <text x="450" y="426" class="m" font-size="14.5" font-weight="400" fill="#B9B7B2" >  place(card, 列 i)</text>
  <text x="450" y="456" class="m" font-size="14.5" font-weight="400" fill="#B9B7B2" >  heights[i] += card.h + gap</text>
  <text x="450" y="492" class="c" font-size="15" font-weight="400" fill="#8C8A86" >一样短取最左边 → 顺序大致还是从左到右。</text>
  <rect x="72" y="542" width="458" height="380" rx="20" fill="#17181B" stroke="rgba(255,255,255,.07)"/>
