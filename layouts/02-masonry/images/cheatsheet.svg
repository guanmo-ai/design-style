  <text x="100" y="642" class="m" font-size="16" font-weight="500" fill="#F2462E" >01</text>
  <text x="142" y="642" class="c" font-size="21" font-weight="700" fill="#F4F2EE" >列宽固定</text>
  <text x="142" y="668" class="c" font-size="15" font-weight="400" fill="#8C8A86" >宽度统一，高度跟着内容走</text>
  <text x="100" y="698" class="m" font-size="16" font-weight="500" fill="#F2462E" >02</text>
  <text x="142" y="698" class="c" font-size="21" font-weight="700" fill="#F4F2EE" >最短优先</text>
  <text x="142" y="724" class="c" font-size="15" font-weight="400" fill="#8C8A86" >按顺序，每张放进最短的那一列</text>
  <text x="100" y="754" class="m" font-size="16" font-weight="500" fill="#F2462E" >03</text>
  <text x="142" y="754" class="c" font-size="21" font-weight="700" fill="#F4F2EE" >统一间距</text>
  <text x="142" y="780" class="c" font-size="15" font-weight="400" fill="#8C8A86" >横缝竖缝一样宽，8–24px</text>
  <text x="100" y="810" class="m" font-size="16" font-weight="500" fill="#F2462E" >04</text>
  <text x="142" y="810" class="c" font-size="21" font-weight="700" fill="#F4F2EE" >保持比例</text>
  <text x="142" y="836" class="c" font-size="15" font-weight="400" fill="#8C8A86" >图片按原比例放，不裁切</text>
  <text x="100" y="866" class="m" font-size="16" font-weight="500" fill="#F2462E" >05</text>
  <text x="142" y="866" class="c" font-size="21" font-weight="700" fill="#F4F2EE" >先占位</text>
  <text x="142" y="892" class="c" font-size="15" font-weight="400" fill="#8C8A86" >先写好宽高再加载，页面不跳</text>
  <rect x="550" y="542" width="458" height="270" rx="20" fill="#17181B" stroke="rgba(255,255,255,.07)"/>
  <text x="578" y="592" class="c" font-size="24" font-weight="700" fill="#F4F2EE" >断点：变的是列数</text>
  <text x="980" y="591" class="m" font-size="14" font-weight="400" fill="#8C8A86" text-anchor="end" >columns · gap</text>
