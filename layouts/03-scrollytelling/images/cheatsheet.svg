  <text x="104" y="856" class="m" font-size="18" font-weight="500" fill="#2997FF" >01</text>
  <text x="144" y="856" class="c" font-size="20" font-weight="700" fill="#F5F5F7" >钉住舞台，不劫持滚动</text>
  <text x="358" y="856" class="c" font-size="16" font-weight="400" fill="#86868B" >用 sticky，滚多快由读者定</text>
  <text x="574" y="856" class="m" font-size="18" font-weight="500" fill="#2997FF" >02</text>
  <text x="614" y="856" class="c" font-size="20" font-weight="700" fill="#F5F5F7" >一步只变一件事</text>
  <text x="768" y="856" class="c" font-size="16" font-weight="400" fill="#86868B" >一张卡片 = 一个变化</text>
  <text x="104" y="908" class="m" font-size="18" font-weight="500" fill="#2997FF" >03</text>
