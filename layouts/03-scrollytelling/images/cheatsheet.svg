p</text><text x="418.8" y="1090" class="m" font-size="16.5" font-weight="400" fill="#86868B" xml:space="preserve">: </text><text x="438.6" y="1090" class="m" font-size="16.5" font-weight="400" fill="#FFB86B" xml:space="preserve">0</text><text x="448.5" y="1090" class="m" font-size="16.5" font-weight="400" fill="#86868B" xml:space="preserve">; </text><text x="468.3" y="1090" class="m" font-size="16.5" font-weight="400" fill="#7CC4FF" xml:space="preserve">height</text><text x="527.7" y="1090" class="m" font-size="16.5" font-weight="400" fill="#86868B" xml:space="preserve">: </text><text x="547.5" y="1090" class="m" font-size="16.5" font-weight="400" fill="#FFB86B" xml:space="preserve">100vh</text><text x="597" y="1090" class="m" font-size="16.5" font-weight="400" fill="#86868B" xml:space="preserve">; }</text><text x="102" y="1118" class="m" font-size="16.5" font-weight="400" fill="#F5F5F7" xml:space="preserve">.step   </text><text x="181.2" y="1118" class="m" font-size="16.5" font-weight="400" fill="#86868B" xml:space="preserve"> { </text><text x="210.9" y="1118" class="m" font-size="16.5" font-weight="400" fill="#7CC4FF" xml:space="preserve">min-height</text><text x="309.9" y="1118" class="m" font-size="16.5" font-weight="400" fill="#86868B" xml:space="preserve">: </text><text x="329.7" y="1118" class="m" font-size="16.5" font-weight="400" fill="#FFB86B" xml:space="preserve">100vh</text><text x="379.2" y="1118" class="m" font-size="16.5" font-weight="400" fill="#86868B" xml:space="preserve">; }  </text><text x="428.7" y="1118" class="m" font-size="16.5" font-weight="400" fill="#48484A" xml:space="preserve">/* 观察：rootMargin -50% 0px -50% 0px */</text><text x="102" y="1146" class="m" font-size="16.5" font-weight="400" fill="#FF7AB6" xml:space="preserve">@media</text><text x="161.4" y="1146" class="m" font-size="16.5" font-weight="400" fill="#86868B" xml:space="preserve"> (max-width: 768px) { </text><text x="379.2" y="1146" class="m" font-size="16.5" font-weight="400" fill="#F5F5F7" xml:space="preserve">.scrolly</text><text x="458.4" y="1146" class="m" font-size="16.5" font-weight="400" fill="#86868B" xml:space="preserve"> { </text><text x="488.1" y="1146" class="m" font-size="16.5" font-weight="400" fill="#7CC4FF" xml:space="preserve">display</text><text x="557.4" y="1146" class="m" font-size="16.5" font-weight="400" fill="#86868B" xml:space="preserve">: </text><text x="577.2" y="1146" class="m" font-size="16.5" font-weight="400" fill="#FFB86B" xml:space="preserve">block</text><text x="626.7" y="1146" class="m" font-size="16.5" font-weight="400" fill="#86868B" xml:space="preserve">; } }</text><text x="102" y="1174" class="m" font-size="16.5" font-weight="400" fill="#FF7AB6" xml:space="preserve">@media</text><text x="161.4" y="1174" class="m" font-size="16.5" font-weight="400" fill="#86868B" xml:space="preserve"> (prefers-reduced-motion: reduce) { </text><text x="517.8" y="1174" class="m" font-size="16.5" font-weight="400" fill="#48484A" xml:space="preserve">/* 直接给终态 */</text><text x="659.7" y="1174" class="m" font-size="16.5" font-weight="400" fill="#86868B" xml:space="preserve"> }</text>
