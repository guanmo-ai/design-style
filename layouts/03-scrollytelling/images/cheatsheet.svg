  <text x="338" y="908" class="c" font-size="16" font-weight="400" fill="#86868B" >50%，不早不晚</text>
  <text x="574" y="908" class="m" font-size="18" font-weight="500" fill="#2997FF" >04</text>
  <text x="614" y="908" class="c" font-size="20" font-weight="700" fill="#F5F5F7" >能倒着滚</text>
  <text x="708" y="908" class="c" font-size="16" font-weight="400" fill="#86868B" >状态 = f(滚动位置)</text>
  <text x="104" y="960" class="m" font-size="18" font-weight="500" fill="#2997FF" >05</text>
  <text x="144" y="960" class="c" font-size="20" font-weight="700" fill="#F5F5F7" >手机上叠起来</text>
  <text x="278" y="960" class="c" font-size="16" font-weight="400" fill="#86868B" >窄屏改覆盖式；尊重减少动态</text>
