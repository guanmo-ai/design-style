<text x="130" y="1194" class="c" font-size="31" font-weight="700" fill="#F1EDE4" >手机上叠成上下</text>
<text x="130" y="1228" class="c" font-size="20" font-weight="400" fill="#9B9893" >文字在上，一屏只讲一件事</text>
