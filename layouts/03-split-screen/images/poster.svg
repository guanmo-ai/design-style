<text x="130" y="834" class="c" font-size="31" font-weight="700" fill="#F1EDE4" >只有一条中线</text>
<text x="130" y="868" class="c" font-size="20" font-weight="400" fill="#9B9893" >不加阴影、不加描边，色块自己说话</text>
<text x="72" y="922" class="m" font-size="22" font-weight="700" fill="#8E95FF" >02</text>
<text x="130" y="924" class="c" font-size="31" font-weight="700" fill="#F1EDE4" >比例要有意思</text>
<text x="130" y="958" class="c" font-size="20" font-weight="400" fill="#9B9893" >50:50 对等，62:38 主次，70:30 导航</text>
<text x="72" y="1012" class="m" font-size="22" font-weight="700" fill="#8E95FF" >03</text>
<text x="130" y="1014" class="c" font-size="31" font-weight="700" fill="#F1EDE4" >两边要有反差</text>
<text x="130" y="1048" class="c" font-size="20" font-weight="400" fill="#9B9893" >明暗、图文、静动，一次只选一对</text>
<text x="72" y="1102" class="m" font-size="22" font-weight="700" fill="#8E95FF" >04</text>
<text x="130" y="1104" class="c" font-size="31" font-weight="700" fill="#F1EDE4" >一边固定，一边滚</text>
<text x="130" y="1138" class="c" font-size="20" font-weight="400" fill="#9B9893" >position: sticky；左边不动，右边流</text>
