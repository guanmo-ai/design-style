<text x="72" y="838" class="h" font-size="22" font-weight="700" fill="#E30613" >01</text>
<text x="130" y="840" class="c" font-size="31" font-weight="700" fill="#111111" >只有一条中线</text>
<text x="130" y="874" class="c" font-size="20" font-weight="400" fill="#6B6B68" >不加阴影、不加描边，色块自己说话</text>
<text x="72" y="928" class="h" font-size="22" font-weight="700" fill="#E30613" >02</text>
<text x="130" y="930" class="c" font-size="31" font-weight="700" fill="#111111" >比例要有意思</text>
<text x="130" y="964" class="c" font-size="20" font-weight="400" fill="#6B6B68" >50:50 对等，62:38 主次，70:30 导航</text>
<text x="72" y="1018" class="h" font-size="22" font-weight="700" fill="#E30613" >03</text>
<text x="130" y="1020" class="c" font-size="31" font-weight="700" fill="#111111" >两边要有反差</text>
<text x="130" y="1054" class="c" font-size="20" font-weight="400" fill="#6B6B68" >明暗、图文、静动，一次只选一对</text>
<text x="72" y="1108" class="h" font-size="22" font-weight="700" fill="#E30613" >04</text>
<text x="130" y="1110" class="c" font-size="31" font-weight="700" fill="#111111" >一边固定，一边滚</text>
<text x="130" y="1144" class="c" font-size="20" font-weight="400" fill="#6B6B68" >position: sticky；左边不动，右边流</text>
<text x="72" y="1198" class="h" font-size="22" font-weight="700" fill="#E30613" >05</text>
<text x="130" y="1200" class="c" font-size="31" font-weight="700" fill="#111111" >手机上叠成上下</text>
<text x="130" y="1234" class="c" font-size="20" font-weight="400" fill="#6B6B68" >文字在上，一屏只讲一件事</text>
<text x="704" y="772" class="c" font-size="20" font-weight="900" fill="#111111" letter-spacing="3" >三种常用比例</text>
