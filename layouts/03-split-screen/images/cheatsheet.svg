<text x="52" y="550" class="c" font-size="19" font-weight="700" fill="#F1EDE4" >50 : 50  对等</text>
<text x="52" y="574" class="m" font-size="15" font-weight="400" fill="#C9C8E9" >1fr 1fr</text>
<rect x="52" y="612" width="191" height="22" rx="0" fill="#0E0E10" />
<rect x="243" y="612" width="118" height="22" rx="0" fill="#F1EDE4" />
<text x="52" y="662" class="c" font-size="19" font-weight="700" fill="#F1EDE4" >62 : 38  主次</text>
<text x="52" y="686" class="m" font-size="15" font-weight="400" fill="#C9C8E9" >1.618fr 1fr</text>
<rect x="52" y="724" width="216.3" height="22" rx="0" fill="#0E0E10" />
<rect x="268.3" y="724" width="92.7" height="22" rx="0" fill="#F1EDE4" />
<text x="52" y="774" class="c" font-size="19" font-weight="700" fill="#F1EDE4" >70 : 30  内容 + 侧栏</text>
<text x="52" y="798" class="m" font-size="15" font-weight="400" fill="#C9C8E9" >7fr 3fr</text>
<text x="52" y="862" class="m" font-size="18" font-weight="700" fill="#F1EDE4" letter-spacing="3" >断点</text>
<line x1="52" y1="878" x2="361" y2="878" stroke="#8488F3" stroke-width="1.5" />
<text x="50" y="984" class="a" font-size="110" font-weight="900" fill="#F1EDE4" letter-spacing="-4" >768</text>
<text x="56" y="1018" class="c" font-size="19" font-weight="500" fill="#F1EDE4" >px · 窄过它，左右叠成上下</text>
<text x="56" y="1044" class="m" font-size="15" font-weight="400" fill="#C9C8E9" >@media (max-width: 767px)</text>
<text x="52" y="1112" class="m" font-size="18" font-weight="700" fill="#F1EDE4" letter-spacing="3" >色板</text>
<line x1="52" y1="1128" x2="361" y2="1128" stroke="#8488F3" stroke-width="1.5" />
