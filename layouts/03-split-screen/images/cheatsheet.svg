<text x="52" y="126" class="c" font-size="24" font-weight="700" fill="#F1EDE4" >布局 03 · 速查</text>
<text x="48" y="300" class="a" font-size="140" font-weight="900" fill="#F1EDE4" letter-spacing="-6" >61.8</text>
<text x="52" y="346" class="c" font-size="20" font-weight="500" fill="#F1EDE4" >黄金分割：默认的中线位置</text>
<text x="52" y="372" class="c" font-size="16" font-weight="400" fill="#C9C8E9" >1 : 1.618，左大右小或反过来都行</text>
<text x="52" y="460" class="m" font-size="18" font-weight="700" fill="#F1EDE4" letter-spacing="3" >三种比例</text>
