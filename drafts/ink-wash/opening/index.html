<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><title>水墨 · 开场 8 秒</title>
<style>

@import url(../../../public/fonts/fontsource/geist-mono/400.css);
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:1920px; height:1080px; overflow:hidden; background:#F2EDE1; color:#141413; font-family:'Noto Serif SC', serif; }

#cs { font-size:20px; color:#2a2a28; margin-top:6px; }

.sig { position:absolute; right:64px; bottom:46px; font-family:'Geist Mono', monospace; font-size:13px; letter-spacing:.12em; color:#6b6b66; }
.rd { position:absolute; left:0; top:0; font-family:'Geist Mono', monospace; font-size:17px; color:#141413; background:rgba(242,237,225,.88); border-left:3px solid #C8372D; padding:4px 10px; white-space:nowrap; opacity:0; }
.rd b { color:#C8372D; font-weight:400; }

<div class="rd" id="rd"></div><div class="rd" id="r1"></div><div class="rd" id="r2"></div><div class="rd" id="r3"></div>

<div class="rd" id="r4"></div><div class="rd" id="r5"></div><div class="rd" id="r6"></div><div class="rd" id="r7"></div>
