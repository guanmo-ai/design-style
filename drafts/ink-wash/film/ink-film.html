<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><title>水墨 · 墨入水 · 6s</title>
<style>
@import url(../../../public/fonts/fontsource/noto-serif-sc/200.css);
@import url(../../../public/fonts/fontsource/noto-serif-sc/400.css);
@import url(../../../public/fonts/fontsource/noto-serif-sc/900.css);
@import url(../../../public/fonts/fontsource/geist/300.css);
@import url(../../../public/fonts/fontsource/geist-mono/400.css);
* { margin:0; padding:0; box-sizing:border-box; }
:root { --paper:#F3EEE2; --ink:#1A1A18; --zhu:#C8372D; --mid:#6B6B66; }
html, body { width:1920px; height:1080px; overflow:hidden; background:var(--paper); color:var(--ink); font-family:'Noto Serif SC', serif; }
#c { position:absolute; inset:0; width:1920px; height:1080px; display:block; }
.vt { position:absolute; right:150px; top:110px; writing-mode:vertical-rl; font-weight:900; font-size:300px; line-height:1; letter-spacing:.04em; filter:url(#bleed); clip-path:inset(0 0 100% 0); }
.vs { position:absolute; right:460px; top:120px; writing-mode:vertical-rl; font-weight:200; font-size:64px; letter-spacing:.42em; color:var(--mid); opacity:0; }
.seal { position:absolute; right:172px; bottom:110px; width:132px; height:132px; background:var(--zhu); color:var(--paper); display:flex; align-items:center; justify-content:center; font-weight:900; font-size:86px; border-radius:6px; box-shadow:0 0 0 6px var(--paper), 0 0 0 7px var(--zhu); opacity:0; filter:url(#bleed); }
.en { position:absolute; left:72px; bottom:190px; font-family:Geist; font-weight:300; font-size:70px; letter-spacing:.2em; text-transform:uppercase; opacity:0; line-height:1.2; }
.lede { position:absolute; left:72px; bottom:70px; font-size:22px; line-height:1.8; color:#3a3a36; opacity:0; }
.tag { position:absolute; left:72px; top:56px; font-family:'Geist Mono', monospace; font-size:13px; color:var(--mid); opacity:0; }
</style></head>
<body>
<svg width="0" height="0" style="position:absolute"><filter id="bleed" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="3" seed="7" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="9" xChannelSelector="R" yChannelSelector="G"/></filter></svg>
<canvas id="c" width="1920" height="1080"></canvas>
<div class="tag" id="tag">水墨 Ink Wash · v2 · 墨入水</div>
<div class="vs" id="vs">留白</div>
<div class="vt" id="vt">水墨</div>
<div class="seal" id="seal">墨</div>
<div class="en" id="en">Ink<br>in water</div>
<div class="lede" id="lede">一滴墨落进清水，它不扩散成圆，<br>而是长出卷须、墨丝和留白。</div>
<script src="../ink-water.js"></script>
<script>
const $ = id => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const eo3 = x => 1 - Math.pow(1 - clamp(x), 3);
const eio = x => { x = clamp(x); return x < .5 ? 4*x*x*x : 1 - Math.pow(-2*x + 2, 3) / 2; };
const eback = x => { x = clamp(x); const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };

window.frame = async f => {
  const t = f / 30;
  // 墨：0–1.4s 落墨并扩到第一圈，之后继续慢慢散开；流场随时间推进
  const spread = t < 1.4 ? .03 + .19 * eo3(t / 1.4) : .22 + .10 * eo3((t - 1.4) / 3.6);
  const cx = .42 + .025 * Math.sin(t * .6), cy = .52 + .012 * Math.cos(t * .45);
  // 朱砂：2.6s 起从右下渗入
  const redOn = t >= 2.6;
  const redR = .07 + .09 * eo3((t - 2.6) / 1.8);
  window.InkWater.paint($('c'), {
    t: 1.0 + t * .42, seed: 3.7, c: [cx, cy], spread, scale: 2.4,
    red: redOn ? [.70 + .01 * Math.sin(t), .30, redR, 1] : [0, 0, .1, 0]
  });
  // 竖排标题：3.4–5.0s 从上往下写出
  const p = eio((t - 3.4) / 1.6);
  $('vt').style.clipPath = `inset(0 0 ${(1 - p) * 100}% 0)`;
  $('vs').style.opacity = clamp((t - 3.0) / .8);
  // 印章：4.5s 盖下
  const sp = clamp((t - 4.5) / .22);
  $('seal').style.opacity = sp;
  const s = 1.5 + (1 - 1.5) * eback(sp);
  $('seal').style.transform = `scale(${sp > 0 ? s : 1})`;
  $('en').style.opacity = clamp((t - .4) / .8);
  $('en').style.transform = `translateY(${(1 - clamp((t - .4) / .8)) * 18}px)`;
  $('lede').style.opacity = clamp((t - 5.0) / .6);
  $('tag').style.opacity = clamp((t - .2) / .6);
};
window.frame(0);
window.ready = true;
</script></body></html>
