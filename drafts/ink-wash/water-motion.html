<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><title>水墨 v2 · 02 动效分镜</title>
<style>
@import url(../../public/fonts/fontsource/geist-mono/400.css);
@import url(../../public/fonts/fontsource/noto-serif-sc/900.css);
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:1920px; height:1080px; overflow:hidden; background:#F3EEE2; color:#1A1A18; font-family:'Geist Mono', monospace; }
.hd { position:absolute; left:150px; top:56px; right:150px; display:flex; justify-content:space-between; align-items:flex-end; }
.hd h2 { font-family:'Noto Serif SC', serif; font-weight:900; font-size:52px; }
.hd p { font-size:14px; line-height:1.7; text-align:right; color:#6B6B66; }
.grid { position:absolute; left:170px; top:136px; width:1580px; display:grid; grid-template-columns:780px 780px; gap:20px; }
.grid canvas { width:780px; height:439px; display:block; }
.lb { position:absolute; left:14px; top:14px; font-size:13px; background:#1A1A18; color:#F3EEE2; padding:5px 10px; }
.cell { position:relative; }
.ft { position:absolute; left:170px; right:170px; bottom:22px; font-size:13px; color:#6B6B66; display:flex; justify-content:space-between; }
</style></head>
<body>
<div class="hd"><h2>墨入水 · 散开一圈</h2><p>同一滴墨，4 个时间点：1.0s → 2.1s → 3.4s → 4.6s<br>注入处浓，卷须沿流场向外推，朱砂从另一侧慢慢渗出</p></div>
<div class="grid">
  <div class="cell"><canvas id="f0" width="780" height="439"></canvas><span class="lb">1.0s · 落墨</span></div>
  <div class="cell"><canvas id="f1" width="780" height="439"></canvas><span class="lb">2.1s · 长出卷须</span></div>
  <div class="cell"><canvas id="f2" width="780" height="439"></canvas><span class="lb">3.4s · 朱砂渗入</span></div>
  <div class="cell"><canvas id="f3" width="780" height="439"></canvas><span class="lb">4.6s · 留白</span></div>
</div>
<div class="ft"><span>循环 5.0s · 流场 fbm×5 · 域扭曲两层 · 缓动 easeOutCubic 注入</span><span>WEBGL2 · 0 TEXTURES</span></div>
<script src="ink-water.js"></script>
<script>
window.__done = false;
document.fonts.ready.then(() => {
  const ts = [1.0, 2.1, 3.4, 4.6];
  ts.forEach((t, i) => {
    window.InkWater.paint(document.getElementById('f' + i), {
      t, seed: 3.7, c: [0.42, 0.52], spread: 0.22, scale: 2.4,
      red: i >= 2 ? [0.70, 0.30, 0.16, 1] : [0, 0, .1, 0]
    });
  });
  window.__done = true;
});
</script></body></html>
