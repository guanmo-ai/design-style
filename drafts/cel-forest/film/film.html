<script>
// 手绘动画 v4 · 一顶草帽从夜里飞到天亮：银河下的终点站（拆开五层纸）→ 黎明云海 → 午后树林，落在一丛灌木上。全片同一套画风（vibe-vedio 的分色平涂）。
// 120 BPM，一拍 30 帧，一小节 120 帧，共 960 帧（16 秒）。window.frame(f) 画第 f 帧（帧号的纯函数）。
// 背景是 bake.cjs 预先画好的分层 PNG（layers/），这里只合成：镜头一拍一（每帧都动，按深度视差），帽子、叶子、萤火一拍二（每 5 帧一张）。
// 换场景不硬切：前景的一整片东西（树冠 / 云团）扫过画面，盖满的那一帧底下换景；帽子始终在最前面，接力到底。
const END = 960, BEAT = 30, Qs = new URLSearchParams(location.search);
const F = FK, q5 = f => Math.floor(f / 5) * 5;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const IMG = {};
const NAMES = { forest: ['far', 'mid', 'front', 'canopy'], clouds: ['sky', 'towers', 'sea1', 'sea2', 'wisp'], night: ['sky', 'far', 'mid', 'fg'] };
const load = src => new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = no; i.src = src; });

// ───── 时间轴（帧）
const TL = {
  explode: [96, 140, 196, 236],       // 夜景五层：开始拆 · 拆开 · 开始合 · 合上
  a: [244, 296],                       // 夜 → 云海：往上摇，云团从上往下扫过（中点换景）
  b: [514, 566],                       // 云海 → 树林：往下扎，云团从下往上扫过
  lamp: -100, star: [40, 84], land: 750, strip: 786, title: 804, sign: 840,
};
const SW = { a: (TL.a[0] + TL.a[1]) / 2, b: (TL.b[0] + TL.b[1]) / 2 };
const sceneAt = f => f < SW.a ? 'night' : f < SW.b ? 'clouds' : 'forest';
const CAPS = [
  [100, '01 · 一个镜头，五层纸', '天、远山、中景、帽子、前景，各画一张，叠起来才是一帧', 232],
  [304, '02 · 一天换一套色，影子从不用灰', '夜里整张是蓝，黎明的影是紫；暖色只留给灯和太阳', 500],
  [574, '03 · 镜头 1 拍 1，帽子 1 拍 2', '背景每秒 60 格滑过去，帽子每秒 12 张：手绘的“顿挫”就在这里', 760],
];
const PALS = {
  forest: { name: '午后 · 树林', cut: 'CUT 031', c: ['#F6EAD0', '#BCD0AD', '#93B449', '#4F7D35', '#1F3D2B', '#FFF2C8'] },
  clouds: { name: '黎明 · 云海', cut: 'CUT 047', c: ['#1D2A64', '#7C5AA0', '#EE8F7C', '#FFD79C', '#A983B6', '#5F548F'] },
  night: { name: '夜 · 终点站', cut: 'CUT 012', c: ['#070E2A', '#1F3470', '#6A6FA6', '#3F6488', '#2F6AA8', '#FFD27A'] },
};

// ───── 各场景的世界大小、层的深度、镜头
const SC = {
  forest: { LW: 2300, LH: 1240, C0: [1150, 620], D: { far: .45, mid: 1, front: 1.35 } },
  clouds: { LW: 2400, LH: 1350, C0: [1200, 675], D: { sky: .1, towers: .3, sea1: .6, sea2: 1.1 } },
  night: { LW: 2300, LH: 1294, C0: [1150, 647], D: { sky: .08, far: .3, mid: 1, fg: 1.5 } },
};
// 镜头：场景世界里的中心点 + 推近倍数。每段都是五次缓动（起停速度为 0），换景的那一段和扫过去的东西同向。
const CAM = {
  night: f => ({ x: F.keys([[0, 1250], [96, 1200], [236, 1200], [296, 1150]], f), y: F.keys([[0, 600], [96, 620], [236, 620], [296, 260]], f), z: F.keys([[0, 1.3], [96, 1.18], [236, 1.18], [296, 1.35]], f) }),
  clouds: f => ({ x: F.keys([[244, 1000], [296, 1040], [514, 1380], [566, 1380]], f), y: F.keys([[244, 1300], [296, 940], [460, 760], [514, 760], [566, 1000]], f), z: F.keys([[244, 1.35], [296, 1.28], [514, 1.04], [566, 1.3]], f) }),
  forest: f => ({ x: F.keys([[514, 900], [566, 1000], [780, 1180], [960, 1190]], f), y: F.keys([[514, 260], [566, 560], [700, 640], [960, 650]], f), z: F.keys([[514, 1.32], [566, 1.2], [780, 1.08], [960, 1.1]], f) }),
};
// 某一层（深度 d）在当前镜头下：源图里取哪一块（世界坐标）
function viewOf(s, c, d) {
  const S = SC[s], z = 1 + (c.z - 1) * d, x = S.C0[0] + (c.x - S.C0[0]) * d, y = S.C0[1] + (c.y - S.C0[1]) * d, w = 1920 / z, h = 1080 / z;
  return { sx: F.clamp(x - w / 2, 0, S.LW - w), sy: F.clamp(y - h / 2, 0, S.LH - h), w, h, z };
}
function drawLayer(g, s, name, c, o = {}) {
  const img = IMG[s + '-' + name], S = SC[s], k = img.width / S.LW, v = viewOf(s, c, o.d ?? S.D[name]);
  g.drawImage(img, v.sx * k, v.sy * k, v.w * k, v.h * k, o.dx || 0, o.dy || 0, 1920, 1080);
  return v;
}
// 世界坐标 → 屏幕（给活的东西用：灯、萤火、帽子落点）
const toScreen = (s, c, d, X, Y) => { const v = viewOf(s, c, d); return [(X - v.sx) * v.z, (Y - v.sy) * v.z, v.z]; };

// ───── 帽子（赛璐璐：色线 + 一层影 + 一块高光；拷自第二版）
function hat(g, x, y, rot, sc, spin, flut) {
  const LINE = '#5b3b22';
  g.save(); g.translate(x, y); g.rotate(rot); g.scale(sc * Math.max(.18, Math.abs(Math.cos(spin))) * (Math.cos(spin) < 0 ? -1 : 1), sc);
  const tail = (ox, oy, len, amp, ph, wd) => { const P = []; for (let s = 0; s <= 1; s += .05) P.push([ox - len * s, oy + Math.sin(s * 5.2 + ph) * amp * s + s * 26, wd * (1 - s * .55) * (.55 + .45 * Math.abs(Math.cos(s * 5.2 + ph)))]);
    for (let i = 0; i < P.length - 1; i++) { const [a, b, w0] = P[i], [c2, d2, w1] = P[i + 1]; g.fillStyle = Math.cos(i / P.length * 5.2 + ph) > 0 ? '#e0483a' : '#a92f2e'; g.beginPath(); g.moveTo(a, b - w0 / 2); g.lineTo(c2, d2 - w1 / 2); g.lineTo(c2, d2 + w1 / 2); g.lineTo(a, b + w0 / 2); g.closePath(); g.fill(); }
    g.strokeStyle = LINE; g.lineWidth = 2; g.beginPath(); P.forEach(([a, b, w], i) => i ? g.lineTo(a, b - w / 2) : g.moveTo(a, b - w / 2)); g.stroke(); g.beginPath(); P.forEach(([a, b, w], i) => i ? g.lineTo(a, b + w / 2) : g.moveTo(a, b + w / 2)); g.stroke(); };
  tail(-40, -18, 230, 26, .4 + flut, 22); tail(-46, -8, 190, 30, 2.2 + flut * 1.3, 18);
  g.fillStyle = '#f1d38e'; g.beginPath(); g.ellipse(0, 0, 142, 56, 0, 0, 7); g.fill();
  g.save(); g.beginPath(); g.ellipse(0, 0, 142, 56, 0, 0, 7); g.clip(); g.fillStyle = '#c99b55'; g.beginPath(); g.ellipse(18, 16, 132, 44, 0, 0, 7); g.fill(); g.fillStyle = '#b5853f'; g.beginPath(); g.ellipse(10, -6, 70, 26, 0, 0, 7); g.fill();
  g.strokeStyle = 'rgba(140,100,40,.35)'; g.lineWidth = 1; for (let k = 1; k < 9; k++) { g.beginPath(); g.ellipse(0, 0, 70 + k * 9, 26 + k * 3.7, 0, 0, 7); g.stroke(); } g.restore();
  g.strokeStyle = LINE; g.lineWidth = 2.6; g.beginPath(); g.ellipse(0, 0, 142, 56, 0, 0, 7); g.stroke();
  const crownP = () => { g.beginPath(); g.moveTo(-66, -8); g.bezierCurveTo(-70, -78, 66, -82, 64, -8); g.ellipse(0, -8, 65, 24, 0, 0, Math.PI); g.closePath(); };
  crownP(); g.fillStyle = '#f5da98'; g.fill();
  g.save(); crownP(); g.clip(); g.fillStyle = '#d4a65e'; g.beginPath(); g.moveTo(20, -90); g.bezierCurveTo(46, -60, 52, -30, 40, 20); g.lineTo(90, 20); g.lineTo(90, -90); g.fill();
  g.fillStyle = 'rgba(255,252,236,.95)'; g.beginPath(); g.moveTo(-40, -52); g.bezierCurveTo(-30, -66, -6, -70, 8, -66); g.bezierCurveTo(-8, -62, -26, -56, -34, -44); g.closePath(); g.fill();
  g.fillStyle = '#e0483a'; g.beginPath(); g.ellipse(0, -10, 70, 26, 0, 0, Math.PI); g.lineTo(-70, -30); g.ellipse(0, -30, 70, 24, Math.PI, Math.PI, 0, true); g.closePath(); g.fill(); g.fillStyle = '#a92f2e'; g.fillRect(30, -60, 60, 60); g.restore();
  g.strokeStyle = LINE; g.lineWidth = 2.6; g.beginPath(); g.moveTo(-66, -8); g.bezierCurveTo(-70, -78, 66, -82, 64, -8); g.stroke(); g.beginPath(); g.ellipse(0, -8, 65, 24, 0, .05, Math.PI - .05); g.stroke();
  g.lineWidth = 1.8; g.beginPath(); g.ellipse(0, -30, 67, 22, 0, .15, Math.PI - .15); g.stroke();
  g.fillStyle = '#e0483a'; g.beginPath(); g.moveTo(-52, -22); g.quadraticCurveTo(-84, -48, -78, -14); g.quadraticCurveTo(-74, 2, -52, -14); g.fill(); g.lineWidth = 2; g.stroke();
  g.restore();
}
// 帽子的路线（屏幕坐标，和动画里一样：赛璐璐不动、背景在动）。关键点之间用 Catmull-Rom，按帧号取 → 每 5 帧取一次 = 一拍二
// [帧, x, y, 大小, 翻转圈数（累计）, 倾角]
const HK = [
  [-40, 420, 300, 1.12, -.6, -.3], [0, 760, 380, 1.05, 0, -.25], [60, 1100, 300, .9, 1.0, .2], [96, 1240, 340, .75, 1.6, -.15],
  [140, 1240, 340, .62, 2.1, -.1], [196, 1200, 360, .62, 2.6, -.15], [236, 1160, 380, .7, 3.1, .1], [270, 960, 200, .85, 4.2, -.3],
  [330, 760, 420, .8, 5.0, .2], [400, 1180, 330, .74, 6.0, -.15], [470, 1100, 460, .76, 6.8, .1], [540, 900, 220, .86, 7.8, -.3],
  [600, 1040, 520, .9, 8.7, .3], [660, 880, 640, .82, 9.6, -.25], [710, 1080, 560, .7, 10.4, .15], [750, 0, 0, .6, 11, 0],
];
function hatAt(f) {
  if (f > TL.land + 60) f = TL.land + 60;
  const fq = q5(f);
  // 落点：树林里那一丛灌木顶上（跟着中景层走）
  const land = toScreen('forest', CAM.forest(TL.land), 1, 1170, 860 - 92 * 1.05 - 20);
  const K = HK.map(k => k[0] === TL.land ? [k[0], land[0], land[1], .52 * land[2], k[4], k[5]] : k);
  let i = 0; while (i < K.length - 2 && K[i + 1][0] <= fq) i++;
  const a = K[Math.max(0, i - 1)], b = K[i], c = K[i + 1], d = K[Math.min(K.length - 1, i + 2)], t = F.clamp((fq - b[0]) / (c[0] - b[0]));
  const cr = j => { const t2 = t * t, t3 = t2 * t; return .5 * (2 * b[j] + (-a[j] + c[j]) * t + (2 * a[j] - 5 * b[j] + 4 * c[j] - d[j]) * t2 + (-a[j] + 3 * b[j] - 3 * c[j] + d[j]) * t3); };
  let x = cr(1), y = cr(2), sc = cr(3), spin = cr(4) * Math.PI * 2 / 2, rot = cr(5);
  if (fq >= TL.land) { const u = (fq - TL.land) / 60; spin = 11 * Math.PI; rot = -.05 + Math.exp(-u * 5) * Math.sin(u * 20) * .25; y -= Math.abs(Math.exp(-u * 6) * Math.sin(u * 16)) * 26; }
  return { x, y, sc, spin, rot, flut: fq * .16 };
}

// ───── 拆开的多层摄影台（夜景那五层）：每层一个仿射矩阵（世界坐标 → 屏幕），从“这一层平常的镜头”插值到“斜着排开”
const EXO = ['sky', 'far', 'mid', 'cel', 'fg'];
const EXN = { sky: ['天', 'SKY', '×0.08'], far: ['远山', 'FAR BG', '×0.3'], mid: ['中景', 'BG · 站牌 · 路灯', '×1.0'], cel: ['赛璐璐', 'A-CEL', '1 拍 2'], fg: ['前景', 'FG BOOK', '×1.5'] };
const EXA = { sky: [420, 200], far: [700, 840], mid: [1480, 740], cel: [1240, 520], fg: [2060, 1160] };
function exMatrix(i, u, c) {
  const S = SC.night, d = EXO[i] === 'cel' ? 1 : S.D[EXO[i]], v = viewOf('night', c, d);
  const A = [v.z, 0, 0, v.z, -v.sx * v.z, -v.sy * v.z];
  const k = (1 + i * .03) * 1920 / S.LW, B = [.30 * k, -.04 * k, 0, .28 * k, 170 + i * 268, 300 + i * 48];
  return A.map((a, j) => F.lerp(a, B[j], u));
}
const exU = f => { const [a, b, c, d] = TL.explode; return f <= a || f >= d ? 0 : f < b ? F.quint((f - a) / (b - a)) : f < c ? 1 : F.quint(1 - (f - c) / (d - c)); };

// ───── 各场景里活的东西
const birdsAt = (g, t, seed, n, x0, y0, sp, col, s) => { const r = RNG(seed); for (let i = 0; i < n; i++) { const ox = r.range(-160, 160), oy = r.range(-60, 60), ph = r() * 6; bird(g, x0 + ox + t * sp, y0 + oy + Math.sin(t * 1.3 + ph) * 8, s * r.range(.8, 1.2), twos(t) * 9 + ph, col); } };
function leafFall(g, t, seed, n, x0, x1, y0, y1, sz = 1, wind = 0) {
  const r = RNG(seed), tt = twos(t), cols = ['#6f9a3f', '#a7c055', '#c9a24a', '#8a6a3a', '#4f7d35', '#d8c26a'];
  for (let i = 0; i < n; i++) {
    const x = r.range(x0, x1), sp = r.range(40, 110), ph = r() * TAU, w = r.range(0.8, 1.8), A = r.range(20, 70), c = r.pick(cols), s = r.range(5, 11) * sz, off = r() * (y1 - y0);
    const yy = y0 + ((off + tt * sp) % (y1 - y0)), xx = x + Math.sin(tt * w + ph) * A + wind * tt, flip = Math.cos(tt * w * 2 + ph);
    g.save(); g.translate(xx, yy); g.rotate(Math.sin(tt * w + ph) * 0.9); g.scale(1, Math.max(0.15, Math.abs(flip))); qd(g, 0, 0, s, 0, flip > 0 ? c : mixc(c, '#2a3a20', 0.35)); g.restore();
  }
}
function motes(g, t, seed, n, col = '#fff6d0') { const r = RNG(seed), tt = twos(t); for (let i = 0; i < n; i++) { const x = r.range(0, 1920) + Math.sin(tt * .4 + i) * 30, y = r.range(80, 1000) + Math.sin(tt * .6 + i * 1.7) * 20 - tt * 6; const a = .5 + .5 * Math.sin(tt * 2 + i); dab(g, x, y, 2, 2, 0, rgba(col, .6 * a)); } }
let GRAIN = [], VIG, OCC = {}, NOHUD = false;

function exTags(g, f, u, c) {
  const a = F.smr(.75, 1, u);
  EXO.forEach((name, i) => {
    const M = exMatrix(i, u, c), [X, Y] = EXA[name], ax = M[0] * X + M[2] * Y + M[4], ay = M[1] * X + M[3] * Y + M[5];
    const t0 = TL.explode[1] - 16 + i * 5, p = F.easeOut((f - t0) / 10) * a; if (p <= 0) return;
    g.save(); g.globalAlpha = p; g.fillStyle = '#ffd36e'; g.beginPath(); g.arc(ax, ay, 4.5, 0, 7); g.fill();
    g.strokeStyle = 'rgba(255,211,110,.85)'; g.lineWidth = 1.4; g.beginPath(); g.moveTo(ax, ay); g.lineTo(ax, ay - 40 * p); g.stroke(); g.restore();
    const [zh, en, sp] = EXN[name];
    F.rise(g, zh, ax - 6, ay - 74, f, t0, { font: '700 26px SansSC', size: 26, color: '#fff', out: TL.explode[2] + 4, rate: .8, dur: 10, kind: 'tick', shadow: 'rgba(0,0,0,.8)', shadowBlur: 10 });
    F.rise(g, `${String(i + 1).padStart(2, '0')} · ${en} · ${sp}`, ax - 6, ay - 46, f, t0 + 2, { font: '500 15px Mono', size: 15, color: '#ffd36e', out: TL.explode[2] + 4, rate: .2, dur: 10, kind: 'none', shadow: 'rgba(0,0,0,.8)', shadowBlur: 8 });
  });
}
function drawForest(g, f, c) {
  const t = f / 60;
  drawLayer(g, 'forest', 'far', c);
  drawLayer(g, 'forest', 'mid', c);
  const v = viewOf('forest', c, 1);
  g.save(); g.setTransform(v.z, 0, 0, v.z, -v.sx * v.z, -v.sy * v.z);
  beams(g, 1380, 110, [[2.02, 120, 1100, 1], [2.14, 70, 1000, .7], [1.9, 60, 1000, .6], [2.28, 90, 900, .5]], .62 + .15 * Math.sin(t * .8));
  butterflies(g, t, 163, 3, 600, 1700, 720, 880);
  g.restore();
  motes(g, t, 161, 70);
  leafFall(g, t, 162, 22, -100, 2000, -40, 1100, 1.3, 50);
  drawLayer(g, 'forest', 'front', c);
}
function drawClouds(g, f, c) {
  const t = f / 60, set = F.smr(560, 760, f);
  drawLayer(g, 'clouds', 'sky', c);
  // 太阳慢慢沉下去：天顶一点点变暗（多一层冷色）
  g.save(); g.globalCompositeOperation = 'multiply'; g.fillStyle = `rgba(90,80,150,${.32 * set})`; g.fillRect(0, 0, 1920, 1080); g.restore();
  const k = SC.clouds; let v = viewOf('clouds', c, .1);
  const sun = [(1620 - v.sx) * v.z, (820 + set * 40 - v.sy) * v.z];
  drawLayer(g, 'clouds', 'towers', c);
  birdsAt(g, t, 91, 6, 600, 420, 60, '#3a2c5a', 1.6);
  for (const [name, sp] of [['sea1', 14], ['sea2', 34]]) drawLayer(g, 'clouds', name, { ...c, x: c.x + (f - 480) / 60 * sp / k.D[name] }); // 云海在自己流（各层速度不同）
  // 逆光：太阳的光晕和一道横向的镜头光斑
  g.save(); g.globalCompositeOperation = 'screen';
  glow(g, sun[0], sun[1], 700, '#ffb46a', .45 * (1 - set * .5), 'screen'); glow(g, sun[0], sun[1], 160, '#fff4d8', .8 * (1 - set * .4), 'screen');
  const lf = g.createLinearGradient(0, sun[1], 1920, sun[1]); lf.addColorStop(0, 'rgba(255,190,140,0)'); lf.addColorStop(sun[0] / 1920, 'rgba(255,214,170,.35)'); lf.addColorStop(1, 'rgba(255,190,140,0)');
  g.fillStyle = lf; g.fillRect(0, sun[1] - 3, 1920, 6); g.restore();
}
function drawNight(g, f, c) {
  const t = f / 60, tt = twos(t), u = exU(f), S = SC.night, live = 1 - F.smr(0, .3, u);
  if (u > 0) { g.fillStyle = '#0b1220'; g.fillRect(0, 0, 1920, 1080); const bg = g.createRadialGradient(1100, 380, 50, 1100, 420, 1300); bg.addColorStop(0, `rgba(40,58,92,${u})`); bg.addColorStop(1, 'rgba(7,11,20,0)'); g.fillStyle = bg; g.fillRect(0, 0, 1920, 1080); }
  EXO.forEach((name, i) => {
    const M = exMatrix(i, u, c); g.save(); g.setTransform(M[0], M[1], M[2], M[3], M[4], M[5]);
    if (u > 0 && i) { g.globalAlpha = u; g.fillStyle = 'rgba(0,0,0,.22)'; g.fillRect(-30, 40, S.LW, S.LH); g.globalAlpha = 1; }
    if (name === 'cel') { if (u > .01) { g.globalAlpha = u; g.fillStyle = 'rgba(160,200,255,.06)'; g.fillRect(0, 0, S.LW, S.LH); g.globalAlpha = 1; } }
    else g.drawImage(IMG['night-' + name], 0, 0, S.LW, S.LH);
    if (name === 'sky') { // 星星一闪一闪（一拍二）
