// 手绘动画 v3 · 一顶草帽被风吹过一整天：正午稻田 → （拆开七层纸）→ 午后树林 → 黄昏云海 → 夜里的终点站。

const END = 1080, BEAT = 30, Qs = new URLSearchParams(location.search);
const F = FK, q5 = f => Math.floor(f / 5) * 5;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const IMG = {};
const NAMES = { field: ['sky', 'clouds', 'mountains', 'field', 'poles', 'fg'], forest: ['far', 'mid', 'front', 'canopy'], clouds: ['sky', 'towers', 'sea1', 'sea2', 'wisp'], night: ['sky', 'far', 'mid', 'fg'] };
const load = src => new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = no; i.src = src; });

// ───── 时间轴（帧）
const TL = {
  explode: [150, 205, 268, 312],      // 开始拆 · 拆开 · 开始合 · 合上
  whip: [304, 356],                    // 稻田 → 树林：横摇 + 树冠扫过（中点换景）
  tilt: [482, 538],                    // 树林 → 云海：往上摇，树冠从上往下扫过
  dive: [694, 746],                    // 云海 → 夜：往下扎，云团从下往上扫过
  lamp: 784, star: [812, 850], land: 870, strip: 900, title: 918, sign: 950,
};
const SW = { whip: (TL.whip[0] + TL.whip[1]) / 2, tilt: (TL.tilt[0] + TL.tilt[1]) / 2, dive: (TL.dive[0] + TL.dive[1]) / 2 };
const sceneAt = f => f < SW.whip ? 'field' : f < SW.tilt ? 'forest' : f < SW.dive ? 'clouds' : 'night';
const CAPS = [
  [160, '01 · 一个镜头，七层纸', '天、云、远山、稻田、电线杆、帽子、前景草，各画一张，叠起来才是一帧', 296],
  [372, '02 · 镜头 1 拍 1，帽子 1 拍 2', '背景每秒 60 格滑过去，帽子每秒 12 张：手绘的“顿挫”就在这里', 486],
  [556, '03 · 一天换一套色，影子从不用灰', '正午的影是蓝紫，黄昏是紫，夜里整张都是蓝', 704],
  [772, '04 · 暖色只留给灯', '夜景整张冷下来，路灯和萤火是唯一的暖', 892],
];
const PALS = {
  field: { name: '正午 · 稻田', cut: 'CUT 024', c: ['#1648A6', '#A9D9F0', '#7F8CBF', '#5AA646', '#D8EE8A', '#F1D38E'] },
  forest: { name: '午后 · 树林', cut: 'CUT 031', c: ['#F6EAD0', '#BCD0AD', '#93B449', '#4F7D35', '#1F3D2B', '#FFF2C8'] },
  clouds: { name: '黄昏 · 云海', cut: 'CUT 047', c: ['#1D2A64', '#7C5AA0', '#EE8F7C', '#FFD79C', '#A983B6', '#5F548F'] },
  night: { name: '夜 · 终点站', cut: 'CUT 052', c: ['#070E2A', '#1F3470', '#6A6FA6', '#3F6488', '#2F6AA8', '#FFD27A'] },
};

// ───── 各场景的世界大小、层的深度、镜头
const SC = {
  field: { LW: 1920, LH: 1080, C0: [960, 540], D: { sky: .05, clouds: .15, mountains: .3, field: .6, poles: 1, fg: 1.6 } },
  forest: { LW: 2300, LH: 1240, C0: [1150, 620], D: { far: .45, mid: 1, front: 1.35 } },
  clouds: { LW: 2400, LH: 1350, C0: [1200, 675], D: { sky: .1, towers: .3, sea1: .6, sea2: 1.1 } },
  night: { LW: 2300, LH: 1294, C0: [1150, 647], D: { sky: .08, far: .3, mid: 1, fg: 1.5 } },

// 镜头：场景世界里的中心点 + 推近倍数。每段都是五次缓动（起停速度为 0），换景的那一段和扫过去的东西同向。
const CAM = {
  field: f => ({ x: F.keys([[0, 780], [150, 1080], [304, 1100], [356, 1500]], f), y: F.keys([[0, 600], [150, 540], [356, 520]], f), z: F.keys([[0, 1.34], [150, 1.1], [304, 1.12], [356, 1.4]], f) }),
  forest: f => ({ x: F.keys([[304, 600], [356, 880], [482, 1300], [538, 1300]], f), y: F.keys([[304, 660], [356, 660], [474, 600], [538, 260]], f), z: F.keys([[304, 1.4], [356, 1.28], [482, 1.05], [538, 1.2]], f) }),
  clouds: f => ({ x: F.keys([[482, 1000], [538, 1040], [694, 1380], [746, 1380]], f), y: F.keys([[482, 1300], [538, 940], [640, 760], [694, 760], [746, 1000]], f), z: F.keys([[482, 1.35], [538, 1.28], [694, 1.04], [746, 1.3]], f) }),
  night: f => ({ x: F.keys([[694, 1150], [746, 1180], [880, 1060], [1020, 1040]], f), y: F.keys([[694, 260], [746, 480], [880, 760], [1020, 770]], f), z: F.keys([[700, 1.3], [752, 1.15], [880, 1.18], [1020, 1.2]], f) }),
};
// 某一层（深度 d）在当前镜头下：源图里取哪一块（世界坐标）
function viewOf(s, c, d) {
  const S = SC[s], z = 1 + (c.z - 1) * d, x = S.C0[0] + (c.x - S.C0[0]) * d, y = S.C0[1] + (c.y - S.C0[1]) * d, w = 1920 / z, h = 1080 / z;
  return { sx: F.clamp(x - w / 2, 0, S.LW - w), sy: F.clamp(y - h / 2, 0, S.LH - h), w, h, z };

function drawLayer(g, s, name, c, o = {}) {
  const img = IMG[s + '-' + name], S = SC[s], k = img.width / S.LW, v = viewOf(s, c, o.d ?? S.D[name]);

// 世界坐标 → 屏幕（给活的东西用：灯、萤火、帽子落点）
const toScreen = (s, c, d, X, Y) => { const v = viewOf(s, c, d); return [(X - v.sx) * v.z, (Y - v.sy) * v.z, v.z]; };

// ───── 帽子（赛璐璐：色线 + 一层影 + 一块高光；拷自第二版）
function hat(g, x, y, rot, sc, spin, flut) {

  g.save(); g.translate(x, y); g.rotate(rot); g.scale(sc * Math.max(.18, Math.abs(Math.cos(spin))) * (Math.cos(spin) < 0 ? -1 : 1), sc);

    for (let i = 0; i < P.length - 1; i++) { const [a, b, w0] = P[i], [c2, d2, w1] = P[i + 1]; g.fillStyle = Math.cos(i / P.length * 5.2 + ph) > 0 ? '#e0483a' : '#a92f2e'; g.beginPath(); g.moveTo(a, b - w0 / 2); g.lineTo(c2, d2 - w1 / 2); g.lineTo(c2, d2 + w1 / 2); g.lineTo(a, b + w0 / 2); g.closePath(); g.fill(); }
    g.strokeStyle = LINE; g.lineWidth = 2; g.beginPath(); P.forEach(([a, b, w], i) => i ? g.lineTo(a, b - w / 2) : g.moveTo(a, b - w / 2)); g.stroke(); g.beginPath(); P.forEach(([a, b, w], i) => i ? g.lineTo(a, b + w / 2) : g.moveTo(a, b + w / 2)); g.stroke(); };
  tail(-40, -18, 230, 26, .4 + flut, 22); tail(-46, -8, 190, 30, 2.2 + flut * 1.3, 18);
  g.fillStyle = '#f1d38e'; g.beginPath(); g.ellipse(0, 0, 142, 56, 0, 0, 7); g.fill();
  g.save(); g.beginPath(); g.ellipse(0, 0, 142, 56, 0, 0, 7); g.clip(); g.fillStyle = '#c99b55'; g.beginPath(); g.ellipse(18, 16, 132, 44, 0, 0, 7); g.fill(); g.fillStyle = '#b5853f'; g.beginPath(); g.ellipse(10, -6, 70, 26, 0, 0, 7); g.fill();
  g.strokeStyle = 'rgba(140,100,40,.35)'; g.lineWidth = 1; for (let k = 1; k < 9; k++) { g.beginPath(); g.ellipse(0, 0, 70 + k * 9, 26 + k * 3.7, 0, 0, 7); g.stroke(); } g.restore();
  g.strokeStyle = LINE; g.lineWidth = 2.6; g.beginPath(); g.ellipse(0, 0, 142, 56, 0, 0, 7); g.stroke();
  const crownP = () => { g.beginPath(); g.moveTo(-66, -8); g.bezierCurveTo(-70, -78, 66, -82, 64, -8); g.ellipse(0, -8, 65, 24, 0, 0, Math.PI); g.closePath(); };
  crownP(); g.fillStyle = '#f5da98'; g.fill();
  g.save(); crownP(); g.clip(); g.fillStyle = '#d4a65e'; g.beginPath(); g.moveTo(20, -90); g.bezierCurveTo(46, -60, 52, -30, 40, 20); g.lineTo(90, 20); g.lineTo(90, -90); g.fill();
  g.fillStyle = 'rgba(255,252,236,.95)'; g.beginPath(); g.moveTo(-40, -52); g.bezierCurveTo(-30, -66, -6, -70, 8, -66); g.bezierCurveTo(-8, -62, -26, -56, -34, -44); g.closePath(); g.fill();
  g.fillStyle = '#e0483a'; g.beginPath(); g.ellipse(0, -10, 70, 26, 0, 0, Math.PI); g.lineTo(-70, -30); g.ellipse(0, -30, 70, 24, Math.PI, Math.PI, 0, true); g.closePath(); g.fill(); g.fillStyle = '#a92f2e'; g.fillRect(30, -60, 60, 60); g.restore();
  g.strokeStyle = LINE; g.lineWidth = 2.6; g.beginPath(); g.moveTo(-66, -8); g.bezierCurveTo(-70, -78, 66, -82, 64, -8); g.stroke(); g.beginPath(); g.ellipse(0, -8, 65, 24, 0, .05, Math.PI - .05); g.stroke();
  g.lineWidth = 1.8; g.beginPath(); g.ellipse(0, -30, 67, 22, 0, .15, Math.PI - .15); g.stroke();
  g.fillStyle = '#e0483a'; g.beginPath(); g.moveTo(-52, -22); g.quadraticCurveTo(-84, -48, -78, -14); g.quadraticCurveTo(-74, 2, -52, -14); g.fill(); g.lineWidth = 2; g.stroke();
  g.restore();
}
// 帽子的路线（屏幕坐标，和动画里一样：赛璐璐不动、背景在动）。关键点之间用 Catmull-Rom，按帧号取 → 每 5 帧取一次 = 一拍二
// [帧, x, y, 大小, 翻转圈数（累计）, 倾角]
const HK = [
  [-40, 300, 520, 1.1, -.6, -.4], [0, 640, 360, 1.0, 0, -.3], [60, 980, 250, .86, .9, .15], [150, 1360, 300, .7, 1.8, -.2],
  [205, 1300, 300, .62, 2.3, -.1], [268, 1240, 330, .62, 2.8, -.15], [312, 1180, 360, .7, 3.3, .1],
  [352, 820, 430, 1.05, 4.6, -.35], [400, 1040, 560, .9, 5.5, .3], [440, 880, 700, .82, 6.4, -.25], [478, 1000, 560, .8, 7.0, .1], [534, 980, 300, .78, 8.0, -.2],
  [580, 760, 420, .78, 8.8, .2], [640, 1180, 330, .72, 9.8, -.15], [700, 1100, 460, .74, 10.6, .1], [752, 900, 160, .8, 11.6, -.3],
  [800, 1160, 420, .72, 12.2, .35], [840, 960, 560, .66, 12.8, -.3], [870, 0, 0, .6, 13, 0],
];
function hatAt(f) {
  if (f > TL.land + 60) f = TL.land + 60;
  const fq = q5(f);
  // 落点：站牌顶上（跟着夜景中景层走）
  const land = toScreen('night', CAM.night(TL.land), 1, 1480, 1070 - 262 * 1.25 - 26);
  const K = HK.map(k => k[0] === TL.land ? [k[0], land[0], land[1], .52 * land[2], k[4], k[5]] : k);
  let i = 0; while (i < K.length - 2 && K[i + 1][0] <= fq) i++;
  const a = K[Math.max(0, i - 1)], b = K[i], c = K[i + 1], d = K[Math.min(K.length - 1, i + 2)], t = F.clamp((fq - b[0]) / (c[0] - b[0]));
  const cr = j => { const t2 = t * t, t3 = t2 * t; return .5 * (2 * b[j] + (-a[j] + c[j]) * t + (2 * a[j] - 5 * b[j] + 4 * c[j] - d[j]) * t2 + (-a[j] + 3 * b[j] - 3 * c[j] + d[j]) * t3); };
  let x = cr(1), y = cr(2), sc = cr(3), spin = cr(4) * Math.PI * 2 / 2, rot = cr(5);
  if (fq >= TL.land) { const u = (fq - TL.land) / 60; spin = Math.round(13 * Math.PI) / 1; spin = 13 * Math.PI; rot = -.05 + Math.exp(-u * 5) * Math.sin(u * 20) * .25; y -= Math.abs(Math.exp(-u * 6) * Math.sin(u * 16)) * 26; }
  return { x, y, sc, spin, rot, flut: fq * .16 };
}

// ───── 拆开的多层摄影台（稻田那七层）：每层一个仿射矩阵，从“铺满屏幕”插值到“斜着排开”
const EXO = ['sky', 'clouds', 'mountains', 'field', 'poles', 'cel', 'fg'];
const EXN = { sky: ['天', 'SKY', '×0.05'], clouds: ['云', 'CLOUD', '×0.15'], mountains: ['远景', 'FAR BG', '×0.3'], field: ['中景', 'BG', '×0.6'], poles: ['电线杆', 'BOOK', '×1.0'], cel: ['赛璐璐', 'A-CEL', '1 拍 2'], fg: ['前景', 'FG BOOK', '×1.6'] };
const EXA = { sky: [160, 110], clouds: [1180, 330], mountains: [560, 700], field: [1500, 860], poles: [330, 150], cel: [1250, 330], fg: [1720, 830] };
function exMatrix(i, u, c) {
  const S = SC.field, d = i === 5 ? 1 : S.D[EXO[i]], v = viewOf('field', c, d);
  const A = [v.z, 0, 0, v.z, -v.sx * v.z, -v.sy * v.z];                   // 铺满：就是这一层平常的镜头
  const k = 1 + i * .025, B = [.30 * k, -.04 * k, 0, .28 * k, 140 + i * 182, 296 + i * 34];   // 拆开
  return A.map((a, j) => F.lerp(a, B[j], u));
}
const exU = f => { const [a, b, c, d] = TL.explode; return f <= a || f >= d ? 0 : f < b ? F.quint((f - a) / (b - a)) : f < c ? 1 : F.quint(1 - (f - c) / (d - c)); };

// ───── 各场景里活的东西
const birdsAt = (g, t, seed, n, x0, y0, sp, col, s) => { const r = RNG(seed); for (let i = 0; i < n; i++) { const ox = r.range(-160, 160), oy = r.range(-60, 60), ph = r() * 6; bird(g, x0 + ox + t * sp, y0 + oy + Math.sin(t * 1.3 + ph) * 8, s * r.range(.8, 1.2), twos(t) * 9 + ph, col); } };
function leafFall(g, t, seed, n, x0, x1, y0, y1, sz = 1, wind = 0) {
  const r = RNG(seed), tt = twos(t), cols = ['#6f9a3f', '#a7c055', '#c9a24a', '#8a6a3a', '#4f7d35', '#d8c26a'];
  for (let i = 0; i < n; i++) {
    const x = r.range(x0, x1), sp = r.range(40, 110), ph = r() * TAU, w = r.range(0.8, 1.8), A = r.range(20, 70), c = r.pick(cols), s = r.range(5, 11) * sz, off = r() * (y1 - y0);
    const yy = y0 + ((off + tt * sp) % (y1 - y0)), xx = x + Math.sin(tt * w + ph) * A + wind * tt, flip = Math.cos(tt * w * 2 + ph);
    g.save(); g.translate(xx, yy); g.rotate(Math.sin(tt * w + ph) * 0.9); g.scale(1, Math.max(0.15, Math.abs(flip))); qd(g, 0, 0, s, 0, flip > 0 ? c : mixc(c, '#2a3a20', 0.35)); g.restore();
  }
}
function motes(g, t, seed, n, col = '#fff6d0') { const r = RNG(seed), tt = twos(t); for (let i = 0; i < n; i++) { const x = r.range(0, 1920) + Math.sin(tt * .4 + i) * 30, y = r.range(80, 1000) + Math.sin(tt * .6 + i * 1.7) * 20 - tt * 6; const a = .5 + .5 * Math.sin(tt * 2 + i); dab(g, x, y, 2, 2, 0, rgba(col, .6 * a)); } }
let FIELD_LIT, FIELD_YEL, GRAIN = [], VIG, OCC = {}, NOHUD = false;

function drawField(g, f, c) {
  const t = f / 60, u = exU(f);
  if (u > 0) { // 摄影棚的暗背景
    g.fillStyle = '#0b1220'; g.fillRect(0, 0, 1920, 1080);
    const bg = g.createRadialGradient(1100, 380, 50, 1100, 420, 1300); bg.addColorStop(0, `rgba(40,58,92,${u})`); bg.addColorStop(1, 'rgba(7,11,20,0)'); g.fillStyle = bg; g.fillRect(0, 0, 1920, 1080);
  }
  EXO.forEach((name, i) => {
    const M = exMatrix(i, u, c);
    g.save(); g.setTransform(M[0], M[1], M[2], M[3], M[4], M[5]);
    if (u > 0 && i) { g.globalAlpha = u; g.fillStyle = 'rgba(0,0,0,.2)'; g.fillRect(-30, 40, 1920, 1080); g.globalAlpha = 1; }
    if (name === 'cel') { if (u > .01) { g.globalAlpha = u; g.fillStyle = 'rgba(160,200,255,.06)'; g.fillRect(0, 0, 1920, 1080); g.globalAlpha = 1; } }
    else {
      let ox = 0;
      if (name === 'clouds') ox = -t * 6;                                   // 云在自己走
      if (name === 'fg') { const sw = Math.sin(twos(t) * 2.2) * .012 + Math.sin(twos(t) * 5.1) * .004; g.transform(1, 0, sw, 1, -sw * 1080, 0); }
      g.drawImage(IMG['field-' + name], ox, 0, 1920, 1080);
      if (name === 'field') { // 风：一块偏黄的亮从左往右滑过稻田
        const W2 = FIELD_LIT; const gx = ((t * 520) % 3400) - 900;
        const m = W2.g; m.save(); m.globalCompositeOperation = 'source-over'; m.clearRect(0, 0, 1920, 1080); m.drawImage(FIELD_YEL, 0, 0, 1920, 1080);
        m.globalCompositeOperation = 'destination-in'; const gr = m.createLinearGradient(gx - 420, 0, gx + 420, 0); gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(.5, 'rgba(0,0,0,1)'); gr.addColorStop(1, 'rgba(0,0,0,0)'); m.fillStyle = gr; m.fillRect(0, 0, 1920, 1080); m.restore();
        g.save(); g.globalCompositeOperation = 'screen'; g.globalAlpha = .3; g.drawImage(W2, 0, 0); g.restore();
      }
      if (name === 'mountains' && u < .5) birdsAt(g, t, 71, 4, 1500, 470, -40, '#2a3550', 1.3 * (1 - u));
    }
    if (u > 0) { g.globalAlpha = u; g.lineWidth = 2.6; g.strokeStyle = 'rgba(255,255,255,.55)'; g.strokeRect(0, 0, 1920, 1080); g.fillStyle = 'rgba(255,255,255,.6)'; [-110, 0, 110].forEach(q => { g.beginPath(); g.ellipse(960 + q, 1050, q ? 18 : 28, 12, 0, 0, 7); g.fill(); }); g.globalAlpha = 1; }
    if (name === 'cel') { const hp = hatAt(f); if (hp) { // 帽子在赛璐璐层里：拆开时跟着这一层走（屏幕坐标 → 这一层的纸面坐标）
      const M0 = exMatrix(5, 0, c), px = (hp.x - M0[4]) / M0[0], py = (hp.y - M0[5]) / M0[3]; hat(g, px, py, hp.rot, hp.sc / M0[0], hp.spin, hp.flut); } }
    g.restore();
  });
  if (u < 1) { // 太阳：左上角的暖光 + 光柱（拆开时淡掉）
