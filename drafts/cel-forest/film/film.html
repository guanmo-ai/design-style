<script>
// 手绘动画 v6 ·《小蓝鸟和草帽》：一只睡在草帽里的小蓝鸟，帽子被风吹走，它追了一整个早上——夜里的终点站 → 夜空 → 云海日出 → 树林 → 正午山坡上的大树，帽子落进树杈，它钻回去。
// 当作一部短片拍：九个镜头，每个镜头一个事件、一个镜头运动；镜头之间硬切在音乐的拍子上；中间不放讲解字幕。画风全片同一套（vibe-vedio 的分色平涂）。
// 配乐：Sonilo 生成的 Anime Film Score Variation 2，从 8.13 秒起取 50.87 秒；120 BPM，一小节 120 帧。共 3052 帧。小鸟和帽子一拍一（丝滑），落叶、草一拍二。
const END = 3052, BEAT = 30, Qs = new URLSearchParams(location.search);
const F = FK, cv = document.getElementById('c'), ctx = cv.getContext('2d');
const IMG = {}, LOOP = {};
const NAMES = { night: ['sky', 'far', 'mid', 'fg'], clouds: ['sky', 'towers', 'sea1', 'sea2'], forest: ['far', 'mid', 'front'], hill: ['sky', 'far', 'mid', 'fg'], trunks: ['strip'], branch: ['sky', 'limb', 'leaves'] };
const load = src => new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = no; i.src = src; });
const SC = {
  night: { LW: 2300, LH: 1294, C0: [1150, 647], D: { sky: .08, far: .3, mid: 1, fg: 1.5 } },
  clouds: { LW: 2400, LH: 1350, C0: [1200, 675], D: { sky: .1, towers: .3, sea1: .6, sea2: 1.1 } },
  forest: { LW: 2300, LH: 1240, C0: [1150, 620], D: { far: .45, mid: 1, front: 1.35 } },
  hill: { LW: 2400, LH: 1350, C0: [1200, 675], D: { sky: .1, far: .3, mid: 1, fg: 1.5 } },
  branch: { LW: 1920, LH: 1080, C0: [960, 540], D: { sky: .25, limb: 1, leaves: 1.25 } },
};
// 镜头表（帧）：0 封面 · 240 特写 · 480 起风（音乐抬起来）· 720 夜空 · 960 云海（段落）· 1440 树林 · 1920 山坡（最满）· 2400 树杈 · 2760 拉开（最后两记重音）
const SHOTS = [[0, 'S1'], [240, 'S2'], [480, 'S3'], [720, 'S4'], [960, 'S5'], [1440, 'S6'], [1920, 'S7'], [2400, 'S8'], [2760, 'S9']];
const shotAt = f => { let s = SHOTS[0]; for (const x of SHOTS) if (f >= x[0]) s = x; return s; };
const PALS = {
  night: { name: '夜 · 终点站', c: ['#070E2A', '#1F3470', '#6A6FA6', '#3F6488', '#2F6AA8', '#FFD27A'] },
  clouds: { name: '黎明 · 云海', c: ['#1D2A64', '#7C5AA0', '#EE8F7C', '#FFD79C', '#A983B6', '#5F548F'] },
  forest: { name: '清晨 · 树林', c: ['#F6EAD0', '#BCD0AD', '#93B449', '#4F7D35', '#1F3D2B', '#FFF2C8'] },
  hill: { name: '正午 · 山坡', c: ['#2A64B8', '#8CC4EC', '#FFFFFF', '#6FAA44', '#F6D24A', '#6B4F3A'] },
};

function viewOf(s, c, d) { const S = SC[s], z = 1 + (c.z - 1) * d, x = S.C0[0] + (c.x - S.C0[0]) * d, y = S.C0[1] + (c.y - S.C0[1]) * d, w = 1920 / z, h = 1080 / z; return { sx: F.clamp(x - w / 2, 0, S.LW - w), sy: F.clamp(y - h / 2, 0, S.LH - h), w, h, z }; }
function drawLayer(g, s, name, c, o = {}) { const img = IMG[s + '-' + name], S = SC[s], k = img.width / S.LW, v = viewOf(s, c, o.d ?? S.D[name]); if (o.blur) g.filter = `blur(${o.blur}px)`; g.drawImage(img, v.sx * k, v.sy * k, v.w * k, v.h * k, 0, o.dy || 0, 1920, 1080); g.filter = 'none'; return v; }
const worldT = (g, s, c, d = 1) => { const v = viewOf(s, c, d); g.setTransform(v.z, 0, 0, v.z, -v.sx * v.z, -v.sy * v.z); return v; };
// 横着循环滚动的层（原图 + 左右翻过来的一份接在后面，接缝看不出来）：off = 世界坐标里往左滚了多少
function drawLoop(g, s, name, c, off, o = {}) {
  const L = LOOP[s + '-' + name], S = SC[s], k = L.height / S.LH, d = S.D[name] ?? 1, z = 1 + (c.z - 1) * d, w = 1920 / z, h = 1080 / z;
  const y = F.clamp(S.C0[1] + (c.y - S.C0[1]) * d - h / 2, 0, S.LH - h), per = L.width / k; let x = ((off % per) + per) % per;
  const W1 = Math.min(w, per - x);
  g.drawImage(L, x * k, y * k, W1 * k, h * k, 0, o.dy || 0, W1 * z, 1080);
  if (W1 < w) g.drawImage(L, 0, y * k, (w - W1) * k, h * k, W1 * z, o.dy || 0, (w - W1) * z, 1080);
}
function hat(g, x, y, rot, sc, spin, flut) {
  const LINE = '#5b3b22';
  g.save(); g.translate(x, y); g.rotate(rot); g.scale(sc * Math.max(.18, Math.abs(Math.cos(spin))) * (Math.cos(spin) < 0 ? -1 : 1), sc);
  const tail = (ox, oy, len, amp, ph, wd) => { const P = []; for (let s = 0; s <= 1; s += .05) P.push([ox - len * s, oy + Math.sin(s * 5.2 + ph) * amp * s + s * 26, wd * (1 - s * .55) * (.55 + .45 * Math.abs(Math.cos(s * 5.2 + ph)))]);
    for (let i = 0; i < P.length - 1; i++) { const [a, b, w0] = P[i], [c2, d2, w1] = P[i + 1]; g.fillStyle = Math.cos(i / P.length * 5.2 + ph) > 0 ? '#e0483a' : '#a92f2e'; g.beginPath(); g.moveTo(a, b - w0 / 2); g.lineTo(c2, d2 - w1 / 2); g.lineTo(c2, d2 + w1 / 2); g.lineTo(a, b + w0 / 2); g.closePath(); g.fill(); }
    g.strokeStyle = LINE; g.lineWidth = 2; g.beginPath(); P.forEach(([a, b, w], i) => i ? g.lineTo(a, b - w / 2) : g.moveTo(a, b - w / 2)); g.stroke(); g.beginPath(); P.forEach(([a, b, w], i) => i ? g.lineTo(a, b + w / 2) : g.moveTo(a, b + w / 2)); g.stroke(); };
  tail(-40, -18, 230, 26, .4 + flut, 22); tail(-46, -8, 190, 30, 2.2 + flut * 1.3, 18);
  g.fillStyle = '#f1d38e'; g.beginPath(); g.ellipse(0, 0, 142, 56, 0, 0, 7); g.fill();
  g.save(); g.beginPath(); g.ellipse(0, 0, 142, 56, 0, 0, 7); g.clip(); g.fillStyle = '#c99b55'; g.beginPath(); g.ellipse(18, 16, 132, 44, 0, 0, 7); g.fill(); g.fillStyle = '#b5853f'; g.beginPath(); g.ellipse(10, -6, 70, 26, 0, 0, 7); g.fill();
  g.strokeStyle = 'rgba(140,100,40,.35)'; g.lineWidth = 1; for (let k = 1; k < 9; k++) { g.beginPath(); g.ellipse(0, 0, 70 + k * 9, 26 + k * 3.7, 0, 0, 7); g.stroke(); } g.restore();
  g.strokeStyle = LINE; g.lineWidth = 2.6; g.beginPath(); g.ellipse(0, 0, 142, 56, 0, 0, 7); g.stroke();
  const crownP = () => { g.beginPath(); g.moveTo(-66, -8); g.bezierCurveTo(-70, -78, 66, -82, 64, -8); g.ellipse(0, -8, 65, 24, 0, 0, Math.PI); g.closePath(); };
  crownP(); g.fillStyle = '#f5da98'; g.fill();
  g.save(); crownP(); g.clip(); g.fillStyle = '#d4a65e'; g.beginPath(); g.moveTo(20, -90); g.bezierCurveTo(46, -60, 52, -30, 40, 20); g.lineTo(90, 20); g.lineTo(90, -90); g.fill();
  g.fillStyle = 'rgba(255,252,236,.95)'; g.beginPath(); g.moveTo(-40, -52); g.bezierCurveTo(-30, -66, -6, -70, 8, -66); g.bezierCurveTo(-8, -62, -26, -56, -34, -44); g.closePath(); g.fill();
  g.fillStyle = '#e0483a'; g.beginPath(); g.ellipse(0, -10, 70, 26, 0, 0, Math.PI); g.lineTo(-70, -30); g.ellipse(0, -30, 70, 24, Math.PI, Math.PI, 0, true); g.closePath(); g.fill(); g.fillStyle = '#a92f2e'; g.fillRect(30, -60, 60, 60); g.restore();
  g.strokeStyle = LINE; g.lineWidth = 2.6; g.beginPath(); g.moveTo(-66, -8); g.bezierCurveTo(-70, -78, 66, -82, 64, -8); g.stroke(); g.beginPath(); g.ellipse(0, -8, 65, 24, 0, .05, Math.PI - .05); g.stroke();
  g.lineWidth = 1.8; g.beginPath(); g.ellipse(0, -30, 67, 22, 0, .15, Math.PI - .15); g.stroke();
  g.fillStyle = '#e0483a'; g.beginPath(); g.moveTo(-52, -22); g.quadraticCurveTo(-84, -48, -78, -14); g.quadraticCurveTo(-74, 2, -52, -14); g.fill(); g.lineWidth = 2; g.stroke();
  g.restore();
}

// 帽子：flip = 1 正放、-1 倒扣（当窝）；倒扣时前沿另画一遍，盖住坐在里面的小鸟的下半身
function hatAt(g, x, y, s, rot, flip = 1, flut = 0, wob = 0) { g.save(); g.translate(x, y); g.rotate(rot); g.scale(1, flip); hat(g, 0, 0, 0, s, wob, flut); g.restore(); }
function nestLip(g, x, y, s, rot = 0) { g.save(); g.translate(x, y); g.rotate(rot); g.scale(s, s); g.beginPath(); g.ellipse(0, 0, 142, 56, 0, 0, Math.PI); g.lineTo(-142, 0); g.closePath(); g.fillStyle = '#f1d38e'; g.fill();
  g.strokeStyle = 'rgba(140,100,40,.35)'; g.lineWidth = 1; for (let k = 5; k < 9; k++) { g.beginPath(); g.ellipse(0, 0, 70 + k * 9, 26 + k * 3.7, 0, 0, Math.PI); g.stroke(); }
  g.strokeStyle = '#5b3b22'; g.lineWidth = 2.6; g.beginPath(); g.ellipse(0, 0, 142, 56, 0, 0, Math.PI); g.stroke(); g.restore(); }
function leafFall(g, t, seed, n, x0, x1, y0, y1, sz = 1, wind = 0) {
  const r = RNG(seed), tt = twos(t), cols = ['#6f9a3f', '#a7c055', '#c9a24a', '#8a6a3a', '#4f7d35', '#d8c26a'];
  for (let i = 0; i < n; i++) {
    const x = r.range(x0, x1), sp = r.range(40, 110), ph = r() * TAU, w = r.range(0.8, 1.8), A = r.range(20, 70), c = r.pick(cols), s = r.range(5, 11) * sz, off = r() * (y1 - y0);
    const yy = y0 + ((off + tt * sp) % (y1 - y0)), xx = x + Math.sin(tt * w + ph) * A + wind * tt, flip = Math.cos(tt * w * 2 + ph);
    g.save(); g.translate(xx, yy); g.rotate(Math.sin(tt * w + ph) * 0.9); g.scale(1, Math.max(0.15, Math.abs(flip))); qd(g, 0, 0, s, 0, flip > 0 ? c : mixc(c, '#2a3a20', 0.35)); g.restore();
  }
}

function fireflies(g, t, seed, n, x0, x1, y0, y1, s = 1, a0 = 1) { const r = RNG(seed); for (let i = 0; i < n; i++) { const X = r.range(x0, x1), Y = r.range(y0, y1), ph = r() * 6, x = X + Math.sin(t * .9 + ph) * 50 * s, y = Y + Math.sin(t * 1.3 + ph * 2) * 26 * s - t * 6, a = a0 * (.5 + .5 * Math.sin(t * 3 + ph)); glow(g, x, y, 22 * s, '#ffe08a', .55 * a); dab(g, x, y, 2.2 * s, 2.2 * s, 0, `rgba(255,248,200,${a})`); } }
const SIGN_P = { post: '#3a4060', postLit: '#6a72a0', board: '#2f6aa8', boardSh: '#1f4a7a', rust: '#8a5a40', text: '#f4f0e0' };
const NEST = [1480, 712];                      // 夜景世界里：站牌顶上那顶倒扣的帽子
const LAMP = { x: 1680, y: 534, w: 40, h: 66, cx: 1700, cy: 567, s: 1 };
const kf = F.keys, smr = F.smr;
const flap = (f, sp = .11) => (f * sp) % 1;

// ───── S1 · 封面：银河下的终点站，小鸟睡在站牌顶上的帽子里（0—240）
function S1(g, f) {
  const t = f / 60, c = { x: kf([[0, 1455], [240, 1475]], f), y: kf([[0, 610], [240, 640]], f), z: kf([[0, 2.45], [240, 2.75]], f) };
  drawLayer(g, 'night', 'sky', c); drawLayer(g, 'night', 'far', c); drawLayer(g, 'night', 'mid', c);
  worldT(g, 'night', c); drawSign(g, 1480, 1070, 1.25, SIGN_P); lampLight(g, LAMP, 1); glow(g, 1700, 1027, 360, '#ffcf7a', .22, 'lighter');
  hatAt(g, NEST[0], NEST[1], .62, 0, -1); blueBird(g, NEST[0] + 4, NEST[1] - 26, 2.2, { blink: true, hop: .5 + .5 * Math.sin(t * 2.4), head: .25 }); nestLip(g, NEST[0], NEST[1], .62);
  fireflies(g, t, 511, 30, 1100, 1900, 600, 1200);
  g.setTransform(1, 0, 0, 1, 0, 0); drawLayer(g, 'night', 'fg', c);
  liveGrass(g, t, { seed: 520, n: 150, x0: -40, x1: 1960, y: 1090, dy: 10, h0: 60, h1: 170, cols: ['#0a1422', '#0f1c30', '#16263e', '#1d3150'], wind: 1 });
  if (f > 70 && f < 125) { const u = (f - 70) / 55, x = 1500 - u * 800, y = 60 + u * 220, a = Math.sin(u * Math.PI); const gr = g.createLinearGradient(x, y, x + 300, y - 110); gr.addColorStop(0, `rgba(255,250,235,${a})`); gr.addColorStop(1, 'rgba(255,250,235,0)'); g.strokeStyle = gr; g.lineWidth = 3; g.beginPath(); g.moveTo(x, y); g.lineTo(x + 300, y - 110); g.stroke(); glow(g, x, y, 26, '#ffffff', a); }
}
// ───── S2 · 特写：一只萤火虫落在它嘴上，它醒了；风起来，帽檐在抖（240—480）
function S2(g, f) {
  const t = f / 60, u = f - 240, c = { x: 1500, y: kf([[240, 690], [480, 680]], f), z: kf([[240, 5.2], [480, 5.6]], f) };
  drawLayer(g, 'night', 'sky', c, { blur: 4 }); drawLayer(g, 'night', 'far', c, { blur: 7 }); drawLayer(g, 'night', 'mid', c, { blur: 10 });
  const v = worldT(g, 'night', c); drawSign(g, 1480, 1070, 1.25, SIGN_P);
  g.save(); g.filter = 'blur(6px)'; lampLight(g, LAMP, 1); g.restore();
  const wind = smr(160, 230, u), shake = Math.sin(u * .9) * .05 * wind + Math.sin(u * 2.3) * .02 * wind;
  const awake = u > 112, head = awake ? kf([[112, 0], [140, -.35], [190, -.2], [215, .25]], u) : .25;
  hatAt(g, NEST[0], NEST[1], .62, shake, -1, u * .2 * wind, 0);
  blueBird(g, NEST[0] + 4, NEST[1] - 26 - wind * 4 * Math.abs(Math.sin(u * .7)), 2.2, { blink: !awake || (u > 176 && u < 182), hop: awake ? 0 : .5 + .5 * Math.sin(t * 2.4), head });
  nestLip(g, NEST[0], NEST[1], .62, shake);
  // 萤火虫：从左边飘过来，停在嘴尖上，亮两下，飞走
  const fx = u < 90 ? lerp(1380, 1517, F.quint(u / 90)) : u < 160 ? 1517 + Math.sin(u * .3) * .6 : lerp(1517, 1600, F.quint((u - 160) / 60)), fy = u < 90 ? lerp(620, 668, F.quint(u / 90)) - Math.sin(u / 90 * Math.PI) * 20 : u < 160 ? 668 : lerp(668, 600, F.quint((u - 160) / 60));
  const fa = .6 + .4 * Math.sin(u * .25); glow(g, fx, fy, 14, '#ffe08a', .8 * fa); dab(g, fx, fy, 1.6, 1.6, 0, `rgba(255,250,210,${fa})`);
  g.setTransform(1, 0, 0, 1, 0, 0);
  // 前景的虚化光斑
  { const r = RNG(77); for (let i = 0; i < 9; i++) { const x = r.range(0, 1920) + Math.sin(t * .4 + i) * 30, y = r.range(0, 1080), R = r.range(40, 110); glow(g, x, y, R, '#ffe08a', .18 + .1 * Math.sin(t * 2 + i)); } }
}
// 帽子被吹上天的路线（夜景世界坐标）
const LIFT = [[486, 1480, 712], [520, 1460, 600], [580, 1330, 470], [640, 1170, 330], [720, 980, 150]];
const pathK = (K, f, j) => { if (f <= K[0][0]) return K[0][j]; for (let i = 1; i < K.length; i++) if (f <= K[i][0]) { const a = K[Math.max(0, i - 2)], b = K[i - 1], c = K[i], d = K[Math.min(K.length - 1, i + 1)], tt = (f - b[0]) / (c[0] - b[0]), t2 = tt * tt, t3 = t2 * tt; return .5 * (2 * b[j] + (-a[j] + c[j]) * tt + (2 * a[j] - 5 * b[j] + 4 * c[j] - d[j]) * t2 + (-a[j] + 3 * b[j] - 3 * c[j] + d[j]) * t3); } return K[K.length - 1][j]; };
// ───── S3 · 起风（音乐抬起来）：帽子被掀上天，小鸟翻出来、扑腾着追（480—720）
function S3(g, f) {
  const t = f / 60, u = f - 480, c = { x: kf([[480, 1380], [720, 1200]], f), y: kf([[480, 700], [560, 690], [720, 380]], f), z: kf([[480, 1.5], [720, 1.3]], f) };
  drawLayer(g, 'night', 'sky', c); drawLayer(g, 'night', 'far', c); drawLayer(g, 'night', 'mid', c);
  worldT(g, 'night', c); drawSign(g, 1480, 1070, 1.25, SIGN_P); lampLight(g, LAMP, 1); glow(g, 1700, 1027, 360, '#ffcf7a', .22, 'lighter');
  const hx = pathK(LIFT, f, 1), hy = pathK(LIFT, f, 2), lift = smr(486, 530, f), flip = lerp(-1, 1, smr(500, 560, f)), rot = (f > 486 ? Math.sin(u * .08) * .5 - u * .004 : 0);
  // 小鸟：先翻出来往下掉一点，再扑腾着追（跟着帽子 25 帧前的位置）
  const bx = u < 40 ? NEST[0] + u * .6 : pathK(LIFT, f - 26, 1) + 70, by = u < 40 ? NEST[1] - 26 + 30 * Math.sin(u / 40 * Math.PI) : pathK(LIFT, f - 26, 2) + 110;
  if (u < 6) { hatAt(g, NEST[0], NEST[1], .62, 0, -1); blueBird(g, NEST[0] + 4, NEST[1] - 26, 2.2, { head: .25 }); nestLip(g, NEST[0], NEST[1], .62); }
  else { hatAt(g, hx, hy, .62, rot, flip, u * .25, Math.sin(u * .05) * .4); blueBird(g, bx, by, 2.2, u < 40 ? { tilt: u * .12, blink: u < 20 } : { flap: flap(f, .14), tilt: -.35, flip: true }); }
  fireflies(g, t, 511, 30, 1100, 1900, 600, 1200, 1 + u * .01, 1 - smr(500, 600, f));
  leafFall(g, t, 531, 40 * smr(480, 520, f), 800, 2300, 300, 1300, 1.6, -300);
  g.setTransform(1, 0, 0, 1, 0, 0); drawLayer(g, 'night', 'fg', c);
  liveGrass(g, t, { seed: 520, n: 150, x0: -40, x1: 1960, y: 1090, dy: 10, h0: 60, h1: 170, cols: ['#0a1422', '#0f1c30', '#16263e', '#1d3150'], wind: 1 + 3 * smr(480, 520, f), gust: (tt, x) => -.5 * smr(480, 520, f) });
}
// ───── S4 · 夜空：往上追，天一点点亮（720—960）
function S4(g, f) {
  const t = f / 60, u = f - 720, c = { x: 1100 + u * .4, y: kf([[720, 640], [960, 160]], f), z: 1.35 };
  drawLayer(g, 'night', 'sky', c);
  // 天亮：下面越来越橙
  const dawn = smr(780, 960, f); g.save(); g.globalCompositeOperation = 'screen'; const gr = g.createLinearGradient(0, 300, 0, 1080); gr.addColorStop(0, 'rgba(255,140,100,0)'); gr.addColorStop(1, `rgba(255,170,120,${.55 * dawn})`); g.fillStyle = gr; g.fillRect(0, 0, 1920, 1080); g.restore();
  // 星星往下流（镜头在往上冲）
  { const r = RNG(41); for (let i = 0; i < 70; i++) { const x = r() * 1920, y0 = r() * 1200, sp = r.range(2, 6), y = ((y0 + u * sp) % 1200) - 60, a = (1 - dawn) * r.range(.4, .9); g.strokeStyle = `rgba(255,255,255,${a})`; g.lineWidth = 1.5; g.beginPath(); g.moveTo(x, y); g.lineTo(x, y - sp * 4); g.stroke(); } }
  // 云海的顶从下面升上来
  if (f > 860) { const k = smr(860, 960, f); drawLayer(g, 'clouds', 'sea2', { x: 1200, y: 760, z: 1.2 }, { dy: lerp(900, 380, k) }); }
  const hx = 1180 + Math.sin(u * .05) * 60, hy = lerp(420, 300, u / 240) + Math.cos(u * .07) * 30, bx = lerp(760, 960, F.easeOut(u / 240)) + Math.sin(u * .09) * 20, by = lerp(820, 520, F.easeOut(u / 240));
  hatAt(g, hx, hy, 1.1, Math.sin(u * .06) * .5, 1, u * .25, Math.sin(u * .04) * .5);
