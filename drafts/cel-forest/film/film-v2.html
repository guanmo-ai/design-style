const u0smooth = div => false;

// ───── 帽子（赛璐璐：色线 + 一层影 + 一块高光），在中景世界坐标里飞，一拍二
function hat(g, x, y, rot, sc, spin, flut) {

  g.save(); g.beginPath(); g.ellipse(0, 0, 142, 56, 0, 0, 7); g.clip(); g.fillStyle = '#c99b55'; g.beginPath(); g.ellipse(18, 16, 132, 44, 0, 0, 7); g.fill(); g.fillStyle = '#b5853f'; g.beginPath(); g.ellipse(10, -6, 70, 26, 0, 0, 7); g.fill();

// 帽子的路线：从右上角被风吹进来，打个圈，落在开场那一丛灌木上
const HATP = (() => { const K = [[2450, 40], [1900, 330], [1500, 140], [1180, 260], [1000, 520], [1120, 700], [HERO.x + 10, HERO.y - HERO.ry * 1.05 - 18]]; const P = []; for (let i = 0; i < K.length - 1; i++) { const a = K[Math.max(0, i - 1)], b = K[i], c = K[i + 1], d = K[Math.min(K.length - 1, i + 2)]; for (let s = 0; s < 1; s += .02) { const t = s, t2 = t * t, t3 = t2 * t; P.push([.5 * (2 * b[0] + (-a[0] + c[0]) * t + (2 * a[0] - 5 * b[0] + 4 * c[0] - d[0]) * t2 + (-a[0] + 3 * b[0] - 3 * c[0] + d[0]) * t3), .5 * (2 * b[1] + (-a[1] + c[1]) * t + (2 * a[1] - 5 * b[1] + 4 * c[1] - d[1]) * t2 + (-a[1] + 3 * b[1] - 3 * c[1] + d[1]) * t3)]); } } P.push(K[K.length - 1]); const cum = [0]; for (let i = 1; i < P.length; i++) cum.push(cum[i - 1] + Math.hypot(P[i][0] - P[i - 1][0], P[i][1] - P[i - 1][1])); return { P, cum, L: cum[cum.length - 1] }; })();

  resetT(ctx); view(ctx, MID, vm.sx, vm.sy, vm.z);
  camT(ctx, vm.sx, vm.sy, vm.z);
  const reveal = F.smr(TL.pull[0] + 40, TL.pull[1], f);
  // 教学：灌木本身（拉出之前画在 MID 上面；之后和 MID 里那一丛完全一样，不再画）

  if (HB && f < TL.pull[0] + 40) lessonMarks(ctx, f, HB);

  const beamA = .3 + .45 * reveal + .15 * Math.sin(t * .6);
  beams(ctx, 1380, 110, [[2.02, 120, 1100, 1], [2.14, 70, 1000, .7], [1.9, 60, 1000, .6], [2.28, 90, 900, .5]], beamA);
  motes(ctx, t, 161, 60, 500, 1800, 260, 900);
  const gust = F.smr(TL.gust[0], TL.gust[0] + 40, f) * (1 - F.smr(TL.gust[1] - 60, TL.gust[1], f));
  leafFall(ctx, t, 162, 10 + Math.round(16 * gust), 300, 2000, 80, 1000, 1.1, 40 * gust);
  butterflies(ctx, t, 163, 3, 600, 1700, 720, 880);
  const hp = hatAt(f); if (hp) hat(ctx, hp.x, hp.y, hp.rot, hp.sc, hp.spin, hp.flut);
  // 近景
  resetT(ctx); view(ctx, FRONT, vn.sx, vn.sy, vn.z);

  resetT(ctx);
  if (reveal > 0) { ctx.globalAlpha = reveal; liveGrass(ctx, t, { seed: 160, n: 240, x0: -40, x1: W + 40, y: H + 8, dy: 10, h0: 60, h1: 170, cols: ['#1d3a25', '#26462b', '#2f5530', '#3f6b35', '#4d7a3a'], wind: 1 + gust * 1.5, gust: (tt, x) => gust * .35 * Math.max(0, Math.sin(tt * 3 - x * .004)) }); ctx.globalAlpha = 1; }

  ctx.globalCompositeOperation = 'soft-light'; ctx.fillStyle = 'rgba(248,214,158,.3)'; ctx.fillRect(0, 0, W, H);
  ctx.globalCompositeOperation = 'screen'; ctx.fillStyle = 'rgba(22,48,46,.16)'; ctx.fillRect(0, 0, W, H);
  ctx.globalCompositeOperation = 'source-over'; ctx.drawImage(VIGNETTE, 0, 0, W, H);

}
// 教学段落的标注：分界线、5 个色块、网格
function lessonMarks(g, f, HB) {
  const { div } = heroParams(f), a = 1 - F.smr(TL.pull[0], TL.pull[0] + 30, f), z = cam(f).z, lw = 1.6 / z;
  g.save(); g.globalAlpha = a;
  if (div > -1.05) { const x = HERO.x + div * HERO.rx; g.strokeStyle = 'rgba(255,248,230,.95)'; g.lineWidth = lw * 1.6; g.setLineDash([6 / z, 5 / z]); g.beginPath(); g.moveTo(x, HERO.y - HERO.ry * 1.45); g.lineTo(x, HERO.y + HERO.ry * 1.45); g.stroke(); g.setLineDash([]);
    g.font = `600 ${24 / z}px Mono`; g.fillStyle = '#fff8ea'; g.textAlign = 'right'; g.fillText('渐变 GRADIENT', x - 8 / z, HERO.y - HERO.ry * 1.25); g.textAlign = 'left'; g.fillText('5 色 · 5 TONES', x + 8 / z, HERO.y - HERO.ry * 1.25); }
  // 5 个色块（灌木右边）
  const sw = 34 / z, gx = HERO.x + HERO.rx * 1.12, gy = HERO.y - sw * 2.6;
  HB.T.forEach((C, i) => { const s = F.spring((f - 10 - i * 3) / 14, .5, 9); if (s <= 0) return; g.fillStyle = `rgb(${C[0]},${C[1]},${C[2]})`; g.fillRect(gx, gy + i * sw * 1.05, sw * 1.6 * s, sw); g.font = `500 ${16 / z}px SansSC`; g.fillStyle = 'rgba(255,248,234,.9)'; g.fillText(['阴', '暗', '中', '亮', '高光'][i], gx + sw * 1.8, gy + i * sw * 1.05 + sw * .7); });
  // 网格：变粗的那一下闪一下
  for (const tc of TL.cells) { const e = Math.exp(-Math.max(0, f - tc) / 10) * (f >= tc ? 1 : 0); if (e < .02) continue;
    g.strokeStyle = `rgba(255,248,230,${.5 * e})`; g.lineWidth = .6 / z; g.beginPath();
    for (let i = 0; i <= HB.cw; i += Math.max(1, Math.round(4 / HB.cs))) { const x = HB.x0 + i * HB.cs; g.moveTo(x, HB.y0); g.lineTo(x, HB.y0 + HB.ch * HB.cs); }
    for (let j = 0; j <= HB.ch; j += Math.max(1, Math.round(4 / HB.cs))) { const y = HB.y0 + j * HB.cs; g.moveTo(HB.x0, y); g.lineTo(HB.x0 + HB.cw * HB.cs, y); } g.stroke(); }

function hud(g, f) {
  resetT(g);

  const capA = Math.max(0, ...CAPS.map(([t0, , , t1]) => F.smr(t0 - 6, t0 + 10, f) * (1 - F.smr(t1, t1 + 24, f))));
  if (capA > 0) { g.globalAlpha = capA; g.fillStyle = band; g.fillRect(0, 860, W, 220); g.globalAlpha = 1; }
  for (const [t0, title, sub, t1] of CAPS) { if (f < Math.max(0, t0) || f > t1 + 30) continue;
    F.rise(g, title, 72, 1004, f, t0, { font: '700 44px SerifSC', size: 44, color: '#FFF8EA', out: t1, rate: .9, dur: 12, shadow: 'rgba(30,24,16,.6)' });
    F.rise(g, sub, 74, 1046, f, t0 + 5, { font: '400 24px SansSC', size: 24, color: 'rgba(255,248,234,.86)', out: t1, kind: 'small', rate: .5, dur: 12, shadow: 'rgba(30,24,16,.6)' }); }
  const p = heroParams(f);
  g.save(); g.font = '500 15px Mono'; g.textAlign = 'right'; g.fillStyle = 'rgba(255,248,234,.85)'; g.shadowColor = 'rgba(30,24,16,.5)'; g.shadowBlur = 8;
  g.fillText(`HAND-PAINTED BG · 5 TONES · CELL ${(f < TL.pull[0] ? p.cs : HERO.cs).toFixed(2)} PX`, 1848, 52);
  g.fillStyle = 'rgba(255,248,234,.6)'; g.fillText('LIGHT + NOISE → POSTERIZE · ON TWOS', 1848, 76); g.restore();
  // 片尾
  if (f >= TL.title) {
    const a = F.smr(TL.title, TL.title + 20, f);
    g.save(); g.globalAlpha = a; const gr = g.createRadialGradient(960, 330, 40, 960, 330, 560); gr.addColorStop(0, 'rgba(255,246,222,.55)'); gr.addColorStop(1, 'rgba(255,246,222,0)'); g.fillStyle = gr; g.fillRect(0, 0, W, 700); g.restore();
    F.rise(g, '手绘动画', 960, 360, f, TL.title, { font: '700 120px SerifSC', size: 120, color: '#3a3024', align: 'center', kind: 'title', rate: 4, ls: 18, shadow: 'rgba(255,248,230,.8)', shadowBlur: 24 });
    F.rise(g, 'HAND-PAINTED ANIMATION · 光照 + 噪声 → 5 色', 960, 420, f, TL.title + 16, { font: '500 22px Mono', size: 22, color: '#5a4a36', align: 'center', kind: 'small', rate: .4, ls: 3 });
    F.rise(g, '观默', 960, 492, f, TL.sign, { font: '700 46px SerifSC', size: 46, color: '#3a3024', align: 'center', kind: 'title', rate: 5 });
  }
}

window.frame = async f => { draw(f); };

  const hatFlips = []; for (let f = TL.hat[0]; f < TL.hat[1] + 40; f += 5) hatFlips.push(f);

};
