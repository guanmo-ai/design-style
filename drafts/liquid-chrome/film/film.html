<canvas id="gl"></canvas>

<script src="../../_lib/glkit.js"></script>
<script src="../chrome.js"></script>

<script>
const Q = new URLSearchParams(location.search);
const SCALE = +(Q.get('scale') || 1);
const W = 1920, H = 1080, FPS = 60;
let gl, P, target, post, text;
const Y0 = 2.25, C0 = [0, 2.65, 0], R2 = 0.46 * Math.cbrt(4);
const TINT = { silver: [0.86, 0.87, 0.9], gold: [1.0, 0.74, 0.32], magenta: [1.0, 0.16, 0.6], black: [0.045, 0.045, 0.05], dark: [0.035, 0.035, 0.04] };
const mixv = (a, b, t) => a.map((v, i) => v + (b[i] - v) * t);

// —— 相机 ——
const CAM = (pos, tgt, fov = 30, shift = [0, 0]) => ({ pos, tgt, fov, shift });
const cmix = (a, b, t) => ({ pos: mixv(a.pos, b.pos, t), tgt: mixv(a.tgt, b.tgt, t), fov: lerp(a.fov, b.fov, t), shift: mixv(a.shift, b.shift, t) });
const orb = (c, r, a, y, fov = 30) => CAM([c[0] + Math.sin(a) * r, y, c[2] + Math.cos(a) * r], c, fov);
const OPEN_A = CAM([0.15, 1.0, 6.2], [0.15, 0.85, 0]), OPEN_B = CAM([0, 1.05, 10.6], [0, 1.75, 0], 30, [0, 0.02]);
const BIRD = (t) => orb([0, 2.0, 0], 9.6, lerp(-0.35, 0.3, t), lerp(0.4, 0.9, t), 34);
const DOG = (t) => orb([0.2, 1.2, 0], lerp(8.4, 7.4, t), lerp(0.7, -0.35, t), 2.4, 30);
const FERRO = (t) => orb([0, 0.55, 0], lerp(6.0, 5.0, t), lerp(0.25, -0.25, t), lerp(1.7, 1.4, t), 30);
const BEAN = (t) => orb([0, 1.2, 0], lerp(9.6, 8.6, t), lerp(-0.3, 0.2, t), 1.2, 30);
const UNDER = CAM([0.0, 0.32, 1.6], [0.0, 2.2, -0.5], 58);
const RULE = (t) => CAM([0, 2.65, lerp(7.2, 6.6, t)], [0, 2.65, 0], 30);
const PHONE = CAM([0, 2.6, 12.6], [0, 2.6, 0], 30, [0, -0.15]);
function camKeys(f) {
  if (f < 24) return OPEN_A;
  if (f < 100) return cmix(OPEN_A, OPEN_B, ease.inOut3(prog(f, 24, 80)));
  if (f < 128) return cmix(OPEN_B, BIRD(0), ease.inOut3(prog(f, 100, 128)));
  if (f < 200) return BIRD(prog(f, 128, 200));
  if (f < 220) return cmix(BIRD(1), DOG(0), ease.inOut3(prog(f, 200, 220)));
  if (f < 296) return DOG(prog(f, 220, 296));
  if (f < 312) return cmix(DOG(1), FERRO(0), ease.inOut3(prog(f, 290, 312)));
  if (f < 380) return FERRO(prog(f, 312, 380));
  if (f < 396) return cmix(FERRO(1), BEAN(0), ease.inOut3(prog(f, 376, 396)));
  if (f < 448) return BEAN(prog(f, 396, 448));
  if (f < 480) return cmix(BEAN(1), UNDER, ease.inOut3(prog(f, 448, 478)));
  if (f < 630) { const k = Math.floor((f - 480) / 30); return f < 484 ? cmix(UNDER, RULE(0), ease.out3(prog(f, 478, 484))) : RULE(prog(f, 480 + k * 30, 510 + k * 30)); }
  if (f < 900) return cmix(RULE(1), PHONE, ease.inOut3(prog(f, 630, 672)));
  return cmix(PHONE, OPEN_B, ease.inOut3(prog(f, 900, 950)));
}
const shake = (f, hits) => { let x = 0, y = 0; for (const [h, A] of hits) { const s = (f - h) / FPS; if (s >= 0 && s < 0.5) { const e = Math.exp(-s / 0.08) * A; x += e * Math.sin(s * 90); y += e * Math.cos(s * 77); } } return [x, y]; };
function unproject(cam, px, py, z0 = 0) {
  const n = v => { const l = Math.hypot(...v); return v.map(x => x / l); };
  const cr = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
  const fw = n(cam.tgt.map((v, i) => v - cam.pos[i])), rt = n(cr(fw, [0, 1, 0])), up = cr(rt, fw);
  const k = 2 * Math.tan(cam.fov * Math.PI / 360), sx = (px / W - 0.5) * (W / H) + cam.shift[0], sy = (0.5 - py / H) + cam.shift[1];
  const d = n([0, 1, 2].map(i => fw[i] + (sx * rt[i] + sy * up[i]) * k)); const t = (z0 - cam.pos[2]) / d[2];
  return [cam.pos[0] + d[0] * t, cam.pos[1] + d[1] * t, z0];
}
const proj = (cam, p) => CHROME.project({ cam, shift: cam.shift }, p, W, H);

// —— 四个字：每个字一个弹簧，晚 12 帧出发 ——
const glyphY = (f, i) => {
  const a = TL.glyphs[i], b = TL.glyphs2[i];
  if (f < a) return -3.4;
  if (f < TL.melt[1] + 4) return -3.4 * (1 - spring((f - a) / FPS, 1.15, 0.55));
  if (f < b) return -3.4;
  return -3.4 * (1 - spring((f - b) / FPS, 1.3, 0.55));
};
let PICKS = [];
function buildPicks() {
  const G = text.glyphs, out = [];
  G.forEach(([l, r], gi) => {
    const xs = []; for (let x = l + 0.04; x <= r - 0.04; x += 0.01) xs.push([x, text.bottom(x)]);
    const mins = [];
    for (let i = 3; i < xs.length - 3; i++) { const y = xs[i][1]; if (y == null) continue; let ok = true;
      for (let k = -3; k <= 3; k++) { const yk = xs[i + k][1]; if (yk == null || yk < y - 1e-4) { ok = false; break; } }
      if (ok && !mins.some(m => Math.abs(m[0] - xs[i][0]) < 0.22)) mins.push([xs[i][0], y]); }
    const low = Math.min(...mins.map(m => m[1]));
    mins.filter(m => m[1] < low + 0.45).slice(0, 3).forEach(([x, yb], k) => out.push({ gi, x, yb, r: 0.05 + 0.03 * ((k * 7 + gi * 3) % 5) / 4, Lb: Math.min(yb - 0.3, 0.55 + 0.25 * ((k + gi) % 3)), z: 0.03 * ((k % 3) - 1) }));
  });
  return out;
}
// —— 一帧 ——
const G_ = 30;
function sceneAt(f) {
  const s = { bounces: 2, T: f / FPS, R: 0.28, H: 0, wob: 0.006, floorY: 0, floorTint: [0.62, 0.64, 0.7], tint: TINT.silver, capK: 0.06,
    backdrop: { top: [0.0006, 0.0007, 0.0012], bot: [0.0025, 0.003, 0.0055], glow: [0.004, 0.009, 0.03], glowPos: [0, 0.05] },
    drips: [], drops: [], blobs: [], ripples: [], crowns: [], pools: [], caps: [], spikes: [], envRot: 0.25 * Math.sin(f / 240), envHue: 0 };
  const cam = camKeys(f), sh = shake(f, [[TL.dropHit, 0.05], [TL.birdParts[0], 0.02], [212, 0.03], [TL.rings[0], 0.03], [TL.drop2[1], 0.05]]);
  s.cam = { pos: [cam.pos[0] + sh[0], cam.pos[1] + sh[1], cam.pos[2]], tgt: [cam.tgt[0] + sh[0] * 0.6, cam.tgt[1] + sh[1] * 0.6, cam.tgt[2]], fov: cam.fov, shift: cam.shift };
  s.shift = s.cam.shift;
  const rip = [];
  const addRip = (x, z, f0, amp, sp = 1.0) => { if (f >= f0 && f < f0 + 150) rip.push([x, z, (f - f0) / FPS * sp, amp * Math.exp(-(f - f0) / 110)]); };
  const splash = (x, z, at, big = 1) => {
    if (f < at) return;
    const p = (f - at) / 24; if (p < 1) s.crowns.push([x, z, (0.08 + 0.26 * ease.out3(p)) * big, 0.3 * big * Math.pow(Math.sin(Math.PI * p), 0.8) + 0.001]);
    addRip(x, z, at, 0.022 * big, 1.2);
    for (let k = 0; k < 7; k++) { const a = k / 7 * 6.283 + 0.4, sp = (0.9 + (k % 3) * 0.35) * big, vy = (2.4 + (k % 2) * 0.9) * big, t = (f - at - 2) / FPS, y = vy * t - 7.5 * t * t;
      if (t > 0 && y > 0) s.drops.push([x + Math.cos(a) * sp * t, y + 0.03, z + Math.sin(a) * sp * t * 0.6, 0.028 + (k % 3) * 0.008]); }
  };
  const fall = (x, z, f0, hit, y0, r = 0.11) => { if (f >= f0 && f < hit) { const t = (f - f0) / (hit - f0), y = y0 * (1 - t * t), v = 2 * y0 * t / ((hit - f0) / FPS); s.drops.push([x, y + r, z, r, [0.88, 1 + Math.min(0.5, v / 50), 0.88]]); } };
  const checkerOn = f < 130 || f >= 930;
  s.checker = checkerOn ? 1 : 0; if (checkerOn) s.floorTint = [0.42, 0.43, 0.46];

  // —— 00 开场：一滴落在棋盘格上，四个字一个个站起来 ——
  fall(0.15, 1.15, -12, TL.dropHit, 2.4); splash(0.15, 1.15, TL.dropHit);
  fall(-0.35, 1.0, TL.drop2[0], TL.drop2[1], 5); splash(-0.35, 1.0, TL.drop2[1]);
  const gr = [0, 1, 2, 3].map(i => glyphY(f, i));
  const textUp = gr.some(v => v + text.capTop > -0.05) && (f < TL.melt[1] || f >= TL.glyphs2[0] - 2);
  if (textUp) {
    s.text = text; s.gRise = gr; s.gSplit = [0, 1, 2].map(i => (text.glyphs[i][1] + text.glyphs[i + 1][0]) / 2);
    const R = f < TL.glyphs2[0] ? 0 : 1;
    for (const p of PICKS) {
      const g0 = R === 0 ? TL.glyphs[p.gi] : TL.glyphs2[p.gi], gy = gr[p.gi], L = gy + p.yb;
      if (L <= 0 || f < g0) continue;
      let brk = null; for (let q = g0; q <= f; q++) if (glyphY(q, p.gi) + p.yb >= p.Lb) { brk = q; break; }
      const retract = R === 0 ? 1 - ease.inOut3(prog(f, TL.melt[0], TL.melt[0] + 14)) : 1;
      if (brk == null) { const t = clamp(L / p.Lb), rm = p.r * 0.8 * Math.pow(1 - t, 0.8) + 0.01, ym = p.yb - L * 0.5;
        s.drips.push([[p.x, p.yb + 0.04 + gy, p.z, p.r * 0.95], [p.x, ym + gy, p.z, rm]], [[p.x, ym + gy, p.z, rm], [p.x, 0, p.z, p.r * 1.25]]); continue; }
      const since = (f - brk) / FPS; const hang = (0.08 + (p.Lb * 0.45 - 0.08) * Math.exp(-since / 0.07) + wobble(since, 0.06, 4, 0.18)) * retract;
      if (hang > 0.02) s.drips.push([[p.x, p.yb + 0.04 + gy, p.z, p.r * 0.36], [p.x, p.yb - hang + gy, p.z, p.r]]);
      const fy = p.Lb * 0.4 - 0.5 * G_ * since * since; if (fy > 0) s.drops.push([p.x, fy, p.z, p.r * 1.1, [0.92, 1.2, 0.92]]);
      addRip(p.x, p.z, brk + Math.round(Math.sqrt(2 * p.Lb * 0.4 / G_) * FPS), 0.012);
    }
    // 字合成一滴
    if (f >= TL.melt[0] && f < TL.melt[1]) { s.morph = ease.inOut3(prog(f, TL.melt[0], TL.melt[1])); s.mtarK = 0.5; s.morphSweep = [0, 1, 0]; s.mtar = [[0, Y0 + 0.1, 0, 0.95, [1, 1, 1]]]; }
  }
  // —— 01 鸟 ——
  if (f >= TL.melt[1] - 2 && f < TL.birdMelt[1]) {
    s.obj = 1; s.tint = mixv(TINT.silver, TINT.gold, ease.inOut3(prog(f, 120, 140)));
    const g = f < TL.birdParts[2] ? 0.02 * prog(f, TL.birdParts[0], TL.birdParts[2]) : 0.02 + 0.98 * spring((f - TL.birdParts[2]) / FPS, 1.1, 0.42);
    s.objP = [g, ease.in3(prog(f, TL.birdMelt[0], TL.birdMelt[1])), 0, 0];
    // 那一滴往下落，变成鸟脚下的底座
    if (f < 140) { const t = ease.in2(prog(f, TL.melt[1] - 2, 136)); s.blobs.push([0, lerp(Y0 + 0.1, 0.2, t), 0, lerp(0.95, 0.25, t), 0.4, [1, 1 + 0.4 * t, 1]]); }
    if (f >= TL.birdParts[0]) addRip(0, 0, 134, 0.016);
    // 喙尖挂出一滴，掉下去
    const tipY = 4.3 * Math.min(1.05, g) * (1 - 0.85 * s.objP[1]);
    if (f >= TL.tipDrop[0]) { const t = (f - TL.tipDrop[0]) / FPS; const y = 4.15 - 0.5 * 9.8 * t * t * 1.6; if (y > 0.1) s.drops.push([0.22, y, 0, 0.12, [0.9, 1.25, 0.9]]); }
    if (f >= TL.birdMelt[0]) addRip(0, 0, TL.birdMelt[0] + 4, 0.02, 1.1);
  }
  if (f >= TL.tipDrop[0]) splash(0.22, 0, 212, 0.8);
  // —— 02 气球狗 ——
  const DOGP = [
    ['前腿', [1.0, 0.0, 0.42], [0.82, 1.02, 0.32], 0.2], ['前腿', [1.0, 0.0, -0.42], [0.82, 1.02, -0.32], 0.2],
    ['后腿', [-0.95, 0.0, 0.42], [-0.78, 1.02, 0.32], 0.2], ['后腿', [-0.95, 0.0, -0.42], [-0.78, 1.02, -0.32], 0.2],
    ['身体', [-0.82, 1.12, 0], [0.86, 1.12, 0], 0.31], ['尾巴', [-0.86, 1.2, 0], [-1.22, 1.95, 0], 0.15],
    ['脖子', [0.88, 1.2, 0], [1.22, 2.02, 0], 0.24], ['嘴', [1.2, 2.06, 0], [1.98, 1.96, 0], 0.22],
    ['耳朵', [1.12, 2.16, 0.18], [0.98, 2.68, 0.3], 0.15], ['耳朵', [1.12, 2.16, -0.18], [0.98, 2.68, -0.3], 0.15]];
  if (f >= TL.dogPops[0] - 1 && f < TL.deflate[1]) {
    s.tint = TINT.magenta; s.capK = 0.07;
    const dc = [0.2, 1.12, 0], def = ease.in3(prog(f, TL.deflate[0], TL.deflate[1]));
    DOGP.forEach(([, a, b, r], i) => { const t0 = TL.dogPops[i]; if (f < t0) return; const k = clamp(ease.outBack(prog(f, t0, t0 + 9), 2.6), 0, 1.3);
      const m = mixv(a, b, 0.5), A = mixv(m, a, k), B = mixv(m, b, k);
      s.caps.push([mixv(A, mixv(dc, [0, 0, 0], 0), def).map((v, j) => v + [0.2, 0, 0][j]), mixv(B, dc, def).map((v, j) => v + [0.2, 0, 0][j]), r * k * (1 - def)]); });
    if (f >= TL.deflate[0]) s.blobs.push([0.4, 1.12, 0, 0.95 * Math.cbrt(def), 0.4, [1, 1, 1]]);
  }
