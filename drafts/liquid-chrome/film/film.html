<script>
const Q = new URLSearchParams(location.search);
const SCALE = +(Q.get('scale') || 1);            // 预览用 0.25 / 0.5
const W = 1920, H = 1080, FPS = 60;
let gl, P, target, post, text, picks, envCanvas;
const Y0 = 2.25;
let seed = 11; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

// —— 相机 ——
const camKeys = (f) => {
  // 00：先贴近落点，字站起来时往后拉；01：往前推；02：绕着转；03：拉远看柱子；04：对准手机；05：回到开场
  const A = { pos: [0.15, 1.15, 6.6], tgt: [0.15, 0.95, 0], fov: 30, shift: [0, 0] };
  const B = { pos: [0.0, 1.05, 10.6], tgt: [0.0, 1.75, 0], fov: 30, shift: [0, 0.02] };
  const Cc = { pos: [0.0, 2.05, 8.2], tgt: [0.0, 2.35, 0], fov: 30, shift: [0, 0] };
  const mix = (a, b, t) => ({ pos: a.pos.map((v, i) => lerp(v, b.pos[i], t)), tgt: a.tgt.map((v, i) => lerp(v, b.tgt[i], t)), fov: lerp(a.fov, b.fov, t), shift: a.shift.map((v, i) => lerp(v, b.shift[i], t)) });
  if (f < 26) return A;
  if (f < 150) return mix(A, B, ease.inOut3(prog(f, 26, 84)));
  if (f < 330) return mix(B, Cc, ease.inOut3(prog(f, 150, 300)));
  if (f < 480) { // 绕着珠子转
    const a = lerp(-0.5, 0.45, ease.inOut3(prog(f, 330, 480))), R = lerp(8.2, 6.6, ease.inOut3(prog(f, 330, 380)));
    const D = { pos: [Math.sin(a) * R, lerp(2.05, 2.9, ease.inOut3(prog(f, 330, 380))), Math.cos(a) * R], tgt: [0, 2.45, 0], fov: 30, shift: [0, 0] };
    return f < 360 ? mix(Cc, D, ease.inOut3(prog(f, 330, 360))) : D;
  }
  const E = { pos: [Math.sin(0.45) * 6.6, 2.9, Math.cos(0.45) * 6.6], tgt: [0, 2.45, 0], fov: 30, shift: [0, 0] };
  const F = { pos: [0.0, 2.7, 10.4], tgt: [0.0, 2.7, 0], fov: 30, shift: [0, 0] };
  const Gp = { pos: [0.0, 2.6, 12.6], tgt: [0.0, 2.6, 0], fov: 30, shift: [0, -0.15] };
  if (f < 600) return mix(E, F, ease.inOut3(prog(f, 480, 540)));
  if (f < 900) return mix(F, Gp, ease.inOut3(prog(f, 600, 670)));
  const Hh = { pos: [0.0, 1.05, 10.6], tgt: [0.0, 1.75, 0], fov: 30, shift: [0, 0.02] };
  return mix(Gp, Hh, ease.inOut3(prog(f, 900, 950)));
};
// 镜头被“撞”一下：衰减抖动
const shake = (f, hits) => { let x = 0, y = 0; for (const [h, A] of hits) { const s = (f - h) / FPS; if (s >= 0 && s < 0.5) { const e = Math.exp(-s / 0.08) * A; x += e * Math.sin(s * 90); y += e * Math.cos(s * 77); } } return [x, y]; };

// —— 屏幕像素 → 世界（落在 z = z0 平面上）——
function unproject(cam, px, py, z0 = 0) {
  const n = v => { const l = Math.hypot(...v); return v.map(x => x / l); };
  const cr = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
  const fw = n(cam.tgt.map((v, i) => v - cam.pos[i])), rt = n(cr(fw, [0, 1, 0])), up = cr(rt, fw);
  const k = 2 * Math.tan(cam.fov * Math.PI / 360), sx = (px / W - 0.5) * (W / H) + cam.shift[0], sy = (0.5 - py / H) + cam.shift[1];
  const d = n([0, 1, 2].map(i => fw[i] + (sx * rt[i] + sy * up[i]) * k)); const t = (z0 - cam.pos[2]) / d[2];
  return [cam.pos[0] + d[0] * t, cam.pos[1] + d[1] * t, z0];
}
const proj = (cam, p) => CHROME.project({ cam, shift: cam.shift }, p, W, H);

// —— 字从水银里站起来：每个挂点的拉丝 / 断开 / 掉落 ——
const RISE = [{ f0: TL.rise[0], freq: 0.9, zeta: 0.62 }, { f0: TL.rise2[0], freq: 1.25, zeta: 0.6 }];
const riseY = (f) => {
  if (f < RISE[0].f0) return -3.3;
  if (f < TL.out[1] + 22) return -3.3 * (1 - spring((f - RISE[0].f0) / FPS, RISE[0].freq, RISE[0].zeta));
  if (f < RISE[1].f0) return -3.3;
  return -3.3 * (1 - spring((f - RISE[1].f0) / FPS, RISE[1].freq, RISE[1].zeta));
};
function buildPicks() {
  const G = text.glyphs, minima = [];
  for (const [l, r] of G) {
    const xs = []; for (let x = l + 0.04; x <= r - 0.04; x += 0.01) xs.push([x, text.bottom(x)]);
    for (let i = 3; i < xs.length - 3; i++) { const y = xs[i][1]; if (y == null) continue; let ok = true;
      for (let k = -3; k <= 3; k++) { const yk = xs[i + k][1]; if (yk == null || yk < y - 1e-4) { ok = false; break; } }
      if (ok && !minima.some(m => Math.abs(m[0] - xs[i][0]) < 0.2)) minima.push([xs[i][0], y]); }
  }
  const low = Math.min(...minima.map(m => m[1]));
  let ps = minima.filter(m => m[1] < low + 0.5); while (ps.length > 12) ps.splice(Math.floor(rnd() * ps.length), 1);
  return ps.map(([x, yb]) => {
    const p = { x, yb, r: 0.05 + rnd() * 0.035, Lb: Math.min(yb - 0.3, 0.5 + rnd() * 1.0), l: 0.08 + rnd() * rnd() * 0.5, z: (rnd() - 0.5) * 0.12, rel: rnd() < 0.45 ? 104 + Math.floor(rnd() * 40) : null };
    // 每一次站起来时，找出拉丝断开的那一帧
    p.brk = RISE.map(R => { for (let f = R.f0; f < R.f0 + 120; f++) if (riseY(f) + yb >= p.Lb) return f; return null; });
    return p;
  });
}
const G_ = 30; // 掉落用的重力（世界单位 / 秒²）
// 一根拉丝：上下两段圆锥（两头粗、中间细）
function stringDrips(p, gy, L, k) { const t = clamp(L / p.Lb), rm = p.r * 0.8 * Math.pow(1 - t, 0.8) + 0.01, ym = p.yb - L * 0.5;
  return [[[p.x, p.yb + 0.04, p.z, p.r * 0.95], [p.x, ym, p.z, rm]], [[p.x, ym, p.z, rm], [p.x, -gy, p.z, p.r * 1.25]]]; }

// —— 一帧的场景 ——
function sceneAt(f) {
  const s = { bounces: 2, T: f / FPS, R: 0.28, H: 0, wob: 0.006, floorY: 0, floorTint: [0.62, 0.64, 0.7], tint: [0.86, 0.87, 0.9],
    backdrop: { top: [0.0006, 0.0007, 0.0012], bot: [0.0025, 0.003, 0.0055], glow: [0.004, 0.009, 0.03], glowPos: [0, 0.05] },
    drips: [], drops: [], blobs: [], ripples: [], crowns: [], pools: [], envRot: 0.25 * Math.sin(f / 240), envHue: 0 };
  const cam = camKeys(f); const sh = shake(f, [[TL.dropHit, 0.05], [TL.snap1, 0.025], [TL.snap2, 0.035], [TL.brk, 0.03], [TL.drop2[1], 0.05]]);
  s.cam = { pos: [cam.pos[0] + sh[0], cam.pos[1] + sh[1], cam.pos[2]], tgt: [cam.tgt[0] + sh[0] * 0.6, cam.tgt[1] + sh[1] * 0.6, cam.tgt[2]], fov: cam.fov, shift: cam.shift };
  s.shift = s.cam.shift;
  const ripples = [];
  const addRip = (x, z, f0, amp, speed = 1.0) => { if (f >= f0 && f < f0 + 150) ripples.push([x, z, (f - f0) / FPS * speed, amp * Math.exp(-(f - f0) / 110)]); };
  // —— 第一滴（以及片尾那一滴）——
  const DROPS = [{ x: 0.15, z: 1.15, f0: -12, hit: TL.dropHit, y0: 2.4 }, { x: -0.35, z: 1.0, f0: TL.drop2[0], hit: TL.drop2[1], y0: 5 }];
  const worldDrops = [];
  for (const D of DROPS) {
    if (f >= D.f0 && f < D.hit) { const t = (f - D.f0) / (D.hit - D.f0); const y = D.y0 * (1 - t * t); const v = 2 * D.y0 * t / ((D.hit - D.f0) / FPS);
      worldDrops.push([D.x, y + 0.11, D.z, 0.11, [0.88, 1 + Math.min(0.5, v / 50), 0.88]]); }
    if (f >= D.hit) {
      const p = (f - D.hit) / 24;
      if (p < 1) s.crowns.push([D.x, D.z, 0.08 + 0.26 * ease.out3(p), 0.3 * Math.pow(Math.sin(Math.PI * p), 0.8) + 0.001]);
      addRip(D.x, D.z, D.hit, 0.022, 1.2);
      // 溅起来的小珠：抛物线
      for (let k = 0; k < 7; k++) { const a = k / 7 * 6.283 + 0.4, sp = 0.9 + (k % 3) * 0.35, vy = 2.4 + (k % 2) * 0.9; const t = (f - D.hit - 2) / FPS;
        const y = vy * t - 0.5 * 15 * t * t; if (t > 0 && y > 0) worldDrops.push([D.x + Math.cos(a) * sp * t, y + 0.03, D.z + Math.sin(a) * sp * t * 0.6, 0.028 + (k % 3) * 0.008]);
        const land = D.hit + 2 + (2 * vy / 15) * FPS; addRip(D.x + Math.cos(a) * sp * (2 * vy / 15), D.z + Math.sin(a) * sp * (2 * vy / 15) * 0.6, land, 0.006, 1.4); }
      // 沃辛顿射流：落点中间往上窜一根细柱，顶上甩出一颗珠
      const j = (f - D.hit - 8) / 26;
      if (j > 0 && j < 1) { const hj = 0.85 * Math.sin(Math.PI * Math.min(1, j * 1.15)); s.column = { a: [D.x, 0.0, D.z], b: [D.x, hj, D.z], r: 0.055 * (1 - j * 0.5), amp: 0.25 + 0.6 * j, lam: 0.22 }; }
    }
  }
  // —— 字 ——
  const gy = riseY(f);
  const textOn = (f < TL.morph[1]) || (f >= TL.rise2[0] - 2);
  if (textOn && gy + text.capTop > -0.05) {
    s.text = text; s.gpos = [0, gy, 0];
    const R = f < TL.rise2[0] ? 0 : 1, f0 = RISE[R].f0;
    for (const p of picks) {
      const L = gy + p.yb; // 字底到水银面的距离
      const brk = p.brk[R];
      const retract = R === 0 ? 1 - ease.inOut3(prog(f, TL.morph[0], TL.morph[0] + 22)) : 1;
      if (L <= 0) continue;
      if (brk == null || f < brk) { if (f >= f0) { s.drips.push(...stringDrips(p, gy, L)); s.pools.push([p.x, p.z, 0.22, 0.03]); } continue; }
      // 断了：上半截缩回成挂着的一滴，下半截掉回去
      const since = (f - brk) / FPS; const Lb = p.Lb;
      let hang = p.l + (Lb * 0.45 - p.l) * Math.exp(-since / 0.07) + wobble(since, 0.06, 4, 0.18);
      const relF = R === 0 ? p.rel : null;
      if (relF && f >= relF) hang = Math.max(0.06, p.l * Math.exp(-(f - relF) / 6));
      hang *= retract;
      if (hang > 0.02) s.drips.push([[p.x, p.yb + 0.04, p.z, p.r * 0.36], [p.x, p.yb - hang, p.z, p.r]]);
      const fallY = Lb * 0.4 - 0.5 * G_ * since * since; if (fallY > 0) s.drops.push([p.x, fallY - gy, p.z, p.r * 1.1, [0.92, 1.2, 0.92]]);
      addRip(p.x, p.z, brk + Math.round(Math.sqrt(2 * Lb * 0.4 / G_) * FPS), 0.012);
      if (relF && f >= relF) { const t = (f - relF) / FPS, y0 = p.yb - p.l + gy; const y = y0 - 0.5 * G_ * t * t; if (y > 0) s.drops.push([p.x, y - gy, p.z, p.r * 1.05, [0.92, 1.18, 0.92]]);
        addRip(p.x, p.z, relF + Math.round(Math.sqrt(2 * y0 / G_) * FPS), 0.012); }
    }
  }
  // —— 01 融合：字 → 四颗珠 → 两颗 → 一颗 ——
  const gc = text.glyphs.map(([l, r]) => (l + r) / 2), r0 = 0.46, r1 = r0 * Math.cbrt(2), r2 = r0 * Math.cbrt(4);
  const lift = Y0 + 0.2 * ease.out3(prog(f, 172, 200));
  if (f >= TL.morph[0] && f < 276) {
    s.morph = prog(f, TL.morph[0], TL.morph[1]); s.morphSweep = [text.glyphs[0][0], text.glyphs[3][1], 0.8]; s.mtarK = f < 240 ? 0.3 : 0.34;
    const pair = (xa, xb, ra, fA, fS, fE) => { // 两颗靠近：先慢后快，碰上的一刻“啪”地合上
      const m = (xa + xb) / 2, D0 = xb - xa, touch = 2 * ra + 0.05;
      let d = D0; if (f >= fA) d = lerp(D0, touch, ease.in3(prog(f, fA, fS))); if (f >= fS) d = lerp(touch, 0, ease.out3(prog(f, fS, fE)));
      const merged = f >= fE, rr = merged ? ra * Math.cbrt(2) : lerp(ra, ra * Math.cbrt(2), ease.out3(prog(f, fS, fE)));
      const stretch = 1 + 0.12 * ease.in2(prog(f, fA, fS)) * (1 - prog(f, fS, fE));
      const wb = wobble((f - fE) / FPS, 0.22, 3.0, 0.24);
      if (merged) return [[m, 0, 0, rr, [1 + wb, 1 - wb * 0.5, 1 - wb * 0.5]]];
      return [[m - d / 2, 0, 0, rr, [stretch, 1 / Math.sqrt(stretch), 1 / Math.sqrt(stretch)]], [m + d / 2, 0, 0, rr, [stretch, 1 / Math.sqrt(stretch), 1 / Math.sqrt(stretch)]]];
    };
    let ts;
    if (f < 240) ts = [...pair(gc[0], gc[1], r0, TL.merge1[0], 206, 214), ...pair(gc[2], gc[3], r0, TL.merge1[0] + 4, 207, 215)];
    else { const m01 = (gc[0] + gc[1]) / 2, m23 = (gc[2] + gc[3]) / 2; ts = pair(m01, m23, r1, TL.merge2[0], 266, 274); }
    s.mtar = ts.map(([x, , , r, sc]) => [x, lift, 0, r, sc]);
    if (f >= TL.morph[1]) { s.text = null; s.morph = 1; }
    else if (f < TL.morph[0] + 2) s.morph = 0;
  }
  // —— 02 倒影：一颗珠不动，世界在转 ——
  const BY = (f) => lerp(Y0 + 0.2, 2.45, ease.inOut3(prog(f, 276, 340)));

  const flash = [[TL.dropHit, 0.35], [TL.snap1, 0.15], [TL.snap2, 0.22], [TL.brk, 0.08], [TL.drop2[1], 0.35], [TL.final, 0.12]].reduce((a, [h, A]) => a + (f >= h ? A * Math.exp(-(f - h) / 5) : 0), 0);
  await post(target.tex, { exposure: 1.25 * (1 + flash), bloom: 0.5, threshold: 1.2, grain: 0.03, vignette: 0.45, ca: 0.006, saturation: 1.08, seed: f * 0.37 });
  if (Q.get('prof')) { gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px); console.log('render', (t2 - t1).toFixed(0), 'post', (performance.now() - t2).toFixed(0), 'rect', JSON.stringify(s._rect), JSON.stringify(s._bb), 'drops', s.drops.length, 'blobs', s.blobs.length, 'pools', s.pools.length, 'crowns', s.crowns.length, 'drips', s.drips.length, 'mtar', (s.mtar||[]).length, 'col', !!s.column); }
  drawHUD(f, s); drawUI(f, s);
  gl.finish();
};
window.events = () => TL;
