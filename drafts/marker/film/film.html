// ================= 笔 =================
const KINDC = { pencil: ['#4F82D8', 'pencil'], liner: ['#15161A', 'liner'], white: ['#EDEBE4', 'white'] };

// ================= 画一个场景 =================
function lighter(h) { return mixc(h, '#ffffff', .07); }

  if (S.k === 4) { c.save(); setM(c, mul(M, S.G.dev(f))); c.clip(S.PHCLIP); c.setTransform(1, 0, 0, 1, 0, 0); phoneUI(c, S, f, M, false); c.restore(); c.setTransform(1, 0, 0, 1, 0, 0); }

function pens(c, S, f, M, z, only) { for (const k in S.TOOLS) { if (only && k !== only) continue; if (!only && k === 'giant') continue; const T = S.TOOLS[k]; const p = penAt(T, f); if (!p) continue; const [X, Y] = apply(M, p.x, p.y); drawPen(c, X, Y, z * (T.scale || 1), T.color, T.kind, p.lift); } }

function restPen(f, M, c, S) {

const MB = +(Q.get('mb') || 3);
function frameMB(f) { if (MB <= 1) { draw(f); out.drawImage(sub, 0, 0); return; }

(async () => {
