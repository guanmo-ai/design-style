<script type="module">

const Q = new URLSearchParams(location.search), PR = +(Q.get('pr') || 2), VIEW = Q.get('view') || 'hero';
if (VIEW === 'reveal') { tl.textContent = '风格 · SUPERGRAPHICS · 换个角度'; tr.textContent = '同一个圆 · 同一条长廊'; t1.textContent = '换个位置，它就碎了'; t1.style.fontSize = '96px'; t2.textContent = '往左走 9 米：红色散在门框、地面和墙上，看不出是一个圆。'; }

{ const c = document.createElement('canvas'); c.width = 4; c.height = 512; const x = c.getContext('2d'); const g = x.createLinearGradient(0, 0, 0, 512);

  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; scene.background = t; }
scene.fog = new THREE.Fog('#F4DCC8', 16, 80);

const HERO = { pos: [0, 1.7, 7], look: [0, 3.4, -40], fov: 38 };

{ const x = pc.getContext('2d'); x.fillStyle = C.red; x.beginPath(); x.arc((doorC.x * 0.5 + 0.5) * W, (1 - (doorC.y * 0.5 + 0.5)) * H, H * 0.36, 0, Math.PI * 2); x.fill(); }

{ const pm = new THREE.MeshStandardMaterial({ color: '#2A1E1E', roughness: 1 }), g = new THREE.Group();
