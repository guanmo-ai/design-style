import { buildRoom, bandsCanvas, person, beams } from './room.js';
const Q = new URLSearchParams(location.search), PR = +(Q.get('pr') || 2);

const A = projector(bandsCanvas(), { pos: [-3.2, 1.2, 5.0], look: [2.0, 3.8, -6], fov: 86 });

{ const x = tc.getContext('2d');

scene.add(person([6.4, 3.0, -5.3], 0.2));
scene.add(person([1.5, 1.25, -5.4], -0.4, 0.97));

const key = sun(scene, { color: '#FFE0B4', intensity: 8.0, pos: [20, 13, 12], target: [0, 2, -3], size: 13, map: 4096, bias: -0.0003 });
