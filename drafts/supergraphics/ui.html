<!doctype html><meta charset="utf-8">
<!-- 超级平面 · 用起来：一组四色带从地面翻上墙，横穿三部手机——导视 App 的三拍（找楼层 → 跟着色带走 → 到了）。
     色带从镜头投出去，所以墙、地、三块屏是同一张纸；屏上的字和卡片是另一层，压在色带上面。
     cd drafts/_3d && node shoot.cjs ../supergraphics/ui.html ../supergraphics/png/ui.png -->
<style>
@font-face{font-family:GM;src:url(/public/fonts/GeistMono.ttf)}
@font-face{font-family:NSB;src:url(/public/fonts/NotoSansSC-Bold.otf)}
@font-face{font-family:NSK;src:url(/public/fonts/NotoSansSC-Black.otf)}
@font-face{font-family:NSM;src:url(/public/fonts/NotoSansSC-Medium.otf)}
@font-face{font-family:UB;src:url(/public/fonts/Unbounded.ttf)}
html,body{margin:0;overflow:hidden;background:#000}
#hud{position:absolute;inset:0;pointer-events:none;color:#161616;font-family:GM}
.tl{position:absolute;left:64px;top:52px;font-size:22px;letter-spacing:.06em}
.tr{position:absolute;right:64px;top:52px;font-size:22px;letter-spacing:.06em}
.ttl{position:absolute;left:64px;top:104px;font-family:NSK;font-size:64px;letter-spacing:.01em}
.ttl small{font-family:GM;font-size:22px;letter-spacing:.14em;margin-left:18px;color:#161616aa}
.rules{position:absolute;left:64px;right:64px;bottom:46px;display:flex;gap:56px}
.r{flex:1;font-family:NSB;font-size:27px}
.r b{display:inline-block;font-family:GM;font-size:17px;background:#161616;color:#fff;border-radius:20px;padding:2px 9px;margin-bottom:8px}
.r small{display:block;font-family:NSM;font-size:16px;color:#161616a0;margin-top:5px;letter-spacing:.02em}
</style>
<div id="hud"><div class="tl">风格 · SUPERGRAPHICS · 用起来</div><div class="tr">WAYFINDING APP · 3 SCREENS</div>
<div class="ttl">一条色带，从墙走进手机<small>ONE BAND · WALL → SCREEN</small></div>
<div class="rules">
<div class="r"><b>01</b><br>色带不认边界<small>墙、地、屏是同一张纸 · 色带穿过卡片，不绕开</small></div>
<div class="r"><b>02</b><br>四条一组，带宽 : 缝 = 7 : 1<small>色带 56 px · 缝 8 px · 蓝 / 红 / 橙 / 黄 + 黑字</small></div>
<div class="r"><b>03</b><br>只转大弯<small>转弯半径 R ≥ 带宽 × 4 · 只用直线和四分之一圆</small></div>
</div></div>
<script type="importmap">{"imports":{"three":"/drafts/_3d/node_modules/three/build/three.module.js","three/addons/":"/drafts/_3d/node_modules/three/examples/jsm/"}}</script>
<script type="module">
import { THREE, setup, finish, sun, mesh } from '/drafts/_3d/lib.js';
import { envMap, cyc } from '/drafts/_3d/craft.js';
import { projector, patchPaint } from '/drafts/_3d/project.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { BAND } from './room.js';
const Q = new URLSearchParams(location.search), PR = +(Q.get('pr') || 2);
const ctx = setup({ pr: PR, bg: '#F1ECE3', tone: 'neutral' });
const { renderer, scene } = ctx;
scene.environment = envMap(renderer); scene.environmentIntensity = 0.45;
for (const f of ['NSK', 'NSB', 'NSM', 'UB', 'GM']) await document.fonts.load(`40px ${f}`);

const W = 3840, H = 2160;
const CP = [0, 2.5, 10.2], CL = [0, 2.2, 0];
const cam = new THREE.PerspectiveCamera(30, 16 / 9, 0.1, 200); cam.position.set(...CP); cam.lookAt(...CL); cam.updateMatrixWorld(); cam.updateProjectionMatrix();

// 三部手机：正对镜头，浮在地面上方
const PW = 1.32, PH = 2.78, PD = 0.16, SW = 1.22, SH = 2.66;
const phones = [-2.05, 0, 2.05].map((x, i) => ({ x, y: 2.15 + (i === 1 ? 0.12 : 0), z: i === 1 ? 0.25 : 0 }));
// 屏幕在投影画面里的像素框
const toPx = (v) => { const p = v.clone().project(cam); return [(p.x * 0.5 + 0.5) * W, (1 - (p.y * 0.5 + 0.5)) * H]; };
phones.forEach(p => { const zf = p.z + PD / 2 + 0.002; const a = toPx(new THREE.Vector3(p.x - SW / 2, p.y + SH / 2, zf)), b = toPx(new THREE.Vector3(p.x + SW / 2, p.y - SH / 2, zf)); p.px = { x0: a[0], y0: a[1], x1: b[0], y1: b[1] }; });

// 色带：从左下的地面翻起来，横穿三块屏，到右边翻上墙
const bw = H * 0.03, gap = bw / 7, R = bw * 5;
const yMid = (phones[0].px.y0 + phones[0].px.y1) / 2 - H * 0.02;
const bc = document.createElement('canvas'); bc.width = W; bc.height = H;
{ const x = bc.getContext('2d'); x.lineCap = 'butt';
  const Rc = R * 1.9, xb = W * 0.945;
  BAND.forEach((col, i) => {
    const off = (i - 1.5) * (bw + gap), y = yMid + off;
    x.strokeStyle = col; x.lineWidth = bw; x.beginPath();
    // 左边从地面竖着上来，转一个大弯（同心）；右边再翻上墙
    // 从左边水平进来，横穿三块屏，到右边转一个大弯往下翻到地面（同心）
    x.moveTo(-10, y); x.arc(xb - Rc, yMid + Rc, Rc - off, Math.PI * 1.5, 0); x.lineTo(xb + Rc - Rc + (-off) + 0, H * 1.05);
    x.stroke();
  });
}
const A = projector(bc, { pos: CP, look: CL, fov: 30 });
const BANDY = BAND.map((_, i) => yMid + (i - 1.5) * (bw + gap));

const studio = cyc('#EFE9DF', { w: 70, d: 40, r: 7, h: 30 }); studio.position.z = -1.5;
studio.material = patchPaint(new THREE.MeshStandardMaterial({ color: '#EFE9DF', roughness: 0.85, side: THREE.DoubleSide }), [A]);
scene.add(studio);

// 每块屏：底层（白 + 色带投影）+ 上层（字、卡片，透明底），上层按投影里的像素框画
const SCW = 720, SCH = Math.round(720 * SH / SW);
function uiLayer(p, draw) {
  const c = document.createElement('canvas'); c.width = SCW; c.height = SCH; const x = c.getContext('2d');
  const ly = (py) => (py - p.px.y0) / (p.px.y1 - p.px.y0) * SCH;   // 投影像素 y → 屏幕本地 y
  const lx = (px) => (px - p.px.x0) / (p.px.x1 - p.px.x0) * SCW;
  draw(x, ly, lx);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;
  return t;
}
const ink = '#141414';
function status(x) { x.fillStyle = ink; x.font = '600 26px GM'; x.fillText('9:41', 44, 58); x.textAlign = 'right'; x.fillText('B2 · 5G', SCW - 44, 58); x.textAlign = 'left'; }
const draws = [
  (x, ly) => { status(x);   // 1. 你在哪一层
    x.fillStyle = ink; x.font = '900 46px NSK'; x.fillText('美术馆导览', 44, 150);
    x.font = '500 30px NSM'; x.fillStyle = '#141414cc'; x.fillText('你在 B2 · 现代展厅', 44, 196);
    x.fillStyle = ink; x.font = '700 330px UB'; x.fillText('B2', 30, ly(BANDY[0]) - 40);
    const yb = ly(BANDY[3]) + 160; x.font = '900 40px NSK'; x.fillText('跟着色带走', 44, yb);
    x.font = '500 30px NSM'; x.fillStyle = '#141414cc'; x.fillText('四条色带 = 四条路线', 44, yb + 46);
    BAND.forEach((col, i) => { x.fillStyle = col; x.fillRect(44 + i * 70, yb + 84, 56, 56); });
    x.fillStyle = ink; x.beginPath(); x.roundRect(44, SCH - 190, SCW - 88, 110, 55); x.fill(); x.fillStyle = '#fff'; x.font = '900 36px NSK'; x.fillText('开始导览  →', 92, SCH - 122); },
  (x, ly, lx) => { status(x);   // 2. 跟着色带
    x.fillStyle = ink; x.font = '900 46px NSK'; x.fillText('去 · 天井展厅', 44, 150);
    x.font = '500 30px NSM'; x.fillStyle = '#141414cc'; x.fillText('红线 · 4 分钟 · 120 米', 44, 196);
    const yr = ly(BANDY[1]);
    [[60, '入口'], [250, '楼梯'], [440, '天井'], [630, '到']].forEach(([px, lab], k) => {
      x.fillStyle = '#fff'; x.beginPath(); x.arc(px, yr, 24, 0, 7); x.fill(); x.lineWidth = 9; x.strokeStyle = ink; x.stroke();
      if (k === 1) { x.fillStyle = ink; x.beginPath(); x.arc(px, yr, 11, 0, 7); x.fill(); }
      x.fillStyle = ink; x.font = '700 34px NSB'; x.textAlign = 'center'; x.fillText(lab, px, ly(BANDY[3]) + 70); x.textAlign = 'left'; });
    const yc = ly(BANDY[3]) + 140; x.fillStyle = '#fff'; x.beginPath(); x.roundRect(36, yc, SCW - 72, 300, 34); x.fill();
    x.fillStyle = ink; x.font = '700 120px UB'; x.fillText('02:40', 70, yc + 150); x.font = '500 30px NSM'; x.fillStyle = '#141414cc'; x.fillText('上楼梯，看到红色转弯就右转', 72, yc + 210);
    x.fillStyle = BAND[1]; x.fillRect(72, yc + 240, (SCW - 144) * 0.42, 14); x.fillStyle = '#14141420'; x.fillRect(72 + (SCW - 144) * 0.42, yc + 240, (SCW - 144) * 0.58, 14);
    x.fillStyle = ink; x.font = '700 300px UB'; x.fillText('→', 300, ly(BANDY[0]) - 70); },
  (x, ly) => { status(x);   // 3. 到了：色带在这里收成一个圆
    x.fillStyle = ink; x.font = '900 46px NSK'; x.fillText('到了', 44, 150);
    x.font = '500 30px NSM'; x.fillStyle = '#141414cc'; x.fillText('天井展厅 · 3F', 44, 196);
    const yt = ly(BANDY[0]) - 230; x.fillStyle = ink; x.beginPath(); x.arc(SCW / 2, yt, 150, 0, 7); x.fill();
    x.strokeStyle = '#fff'; x.lineWidth = 26; x.lineCap = 'round'; x.lineJoin = 'round'; x.beginPath(); x.moveTo(SCW / 2 - 66, yt + 4); x.lineTo(SCW / 2 - 14, yt + 56); x.lineTo(SCW / 2 + 74, yt - 44); x.stroke();
    const yb = ly(BANDY[3]) + 110; x.fillStyle = '#fff'; x.beginPath(); x.roundRect(36, yb, SCW - 72, 380, 34); x.fill();
    x.fillStyle = ink; x.font = '900 40px NSK'; x.fillText('超级平面 1966—', 70, yb + 74);
    x.font = '500 30px NSM'; x.fillStyle = '#141414cc'; x.fillText('四条色带爬过墙角、楼梯和天花板，', 70, yb + 124); x.fillText('图形比建筑还大。', 70, yb + 162);
    BAND.forEach((col, i) => { x.fillStyle = col; x.fillRect(70, yb + 210 + i * 30, SCW - 140 - i * 90, 22); });
    x.fillStyle = ink; x.beginPath(); x.roundRect(44, SCH - 190, SCW - 88, 110, 55); x.fill(); x.fillStyle = '#fff'; x.font = '900 36px NSK'; x.fillText('再走一条  ↺', 92, SCH - 122); },
];

const body = new THREE.MeshPhysicalMaterial({ color: '#1A1A1C', roughness: 0.32, metalness: 0.7, clearcoat: 1, clearcoatRoughness: 0.15 });
phones.forEach((p, i) => {
  const g = new THREE.Group(); g.position.set(p.x, p.y, p.z);
  g.add(mesh(new RoundedBoxGeometry(PW, PH, PD, 8, 0.17), body));
  const scrMat = patchPaint(new THREE.MeshStandardMaterial({ color: '#F7F4EE', roughness: 0.35 }), [A]);
  const scr = mesh(new RoundedBoxGeometry(SW, SH, 0.01, 6, 0.004), scrMat, { cast: false }); scr.position.z = PD / 2; g.add(scr);
  // 屏幕的圆角：用一个只在四角发黑的遮罩层
  const ui = new THREE.Mesh(new THREE.PlaneGeometry(SW, SH), new THREE.MeshStandardMaterial({ map: uiLayer({ ...p, px: p.px }, draws[i]), transparent: true, roughness: 0.35 }));
  ui.position.z = PD / 2 + 0.008; g.add(ui);
  scene.add(g);
});

const key = sun(scene, { color: '#FFF1DE', intensity: 3.2, pos: [-9, 14, 12], target: [0, 1.5, 0], size: 10, map: 4096, bias: -0.0003 });
key.shadow.radius = 9; key.shadow.blurSamples = 20;
scene.add(new THREE.HemisphereLight('#FFFFFF', '#BFB2A0', 0.9));
const fill = new THREE.DirectionalLight('#FFF6EC', 0.9); fill.position.set(8, 4, 12); scene.add(fill);
finish(ctx, cam, { aoRadius: 0.5, aoDist: 0.25, vig: 0.3, grain: 0.022 });
</script>
