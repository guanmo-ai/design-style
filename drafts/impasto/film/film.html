<!doctype html><meta charset="utf-8">
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style>
<canvas id="c" width="1920" height="1080"></canvas>
<script src="../../hand-drawn/lib.js"></script>
<script src="../../hand-drawn/painterly/paint.js"></script>
<script src="../../hand-drawn/filmkit.js"></script>
<script>
// 厚涂 · 一笔一笔画出来。window.frame(f) 画第 f 帧（帧号的纯函数；按帧号递增渲染时缓存已画完的笔）。
const Q = new URLSearchParams(location.search), MS = +(Q.get('ms') || 3);
const W = 1920, H = 1080, END = 1080, { clamp, lerp, smr, keys, rise, rng } = FK;
const cv = document.getElementById('c'), sc = cv.getContext('2d');
const shC = HD.canvas(W, H), sh = shC.getContext('2d');
const FOCAL = [890, 560];
const PAL = [['夜青', '#0E3442'], ['雾橙', '#B07A4C'], ['灯黄', '#FFC478'], ['霓虹红', '#FF465A'], ['霓虹青', '#46EBD7'], ['伞红', '#B8231F']];
const TL = { flow: [165, 300], push: [430, 620], alive: 640, palette: 700, glaze: 860, title: 905, sign: 990, under: 1012 };
const CAPS = [[-40, '01', '大笔铺色', '22 px 的刷子，先把明暗和冷暖站住', 150], [165, '02', '笔顺着形走', '方向 = 边的切线；湿地面一律竖着拖', 270],
  [285, '03', '小笔只给焦点', '11 → 5.5 → 2.8 px，越小越靠近红伞', 420], [440, '04', '亮处厚，暗处薄', '每一笔都有厚度，侧光一扫就看见', 640],
  [690, '05', '暖光，冷影', '影子用青，光用橙黄；整张画只有一块纯红', 860]];

let REF, REFD, FL, LIST, BYEND, BYSTART, master, cacheF = -1e9, ci = 0, UNDER;
const cam = f => ({ cx: keys([[0, 960], [400, 905], [620, 886], [660, 886], [860, 960]], f), cy: keys([[0, 540], [400, 552], [620, 522], [660, 522], [860, 540]], f),
  z: keys([[0, 1.0], [400, 1.1], [620, 3.0], [660, 3.06], [860, 1.0], [1080, 1.035]], f) });
const lightAt = f => { const a = keys([[0, -128.7], [430, -128.7], [440, -165], [640, -18], [760, -128.7]], f) * Math.PI / 180; return [Math.cos(a) * .96, Math.sin(a) * .96]; };
const ampAt = f => keys([[0, 1], [430, 1], [530, 1.7], [640, 1.55], [760, 1.0]], f);

function build() {
  REF = PAINT.ref(1); FL = PAINT.flow(REF); REFD = REF.getContext('2d').getImageData(0, 0, W, H).data;
  LIST = PAINT.plan(REF, FL, { fx: FOCAL[0], fy: FOCAL[1], rain: 0 });
  const r = rng(5), n = HD.makeNoise(9);
  const len = s => { let L = 0; for (let i = 1; i < s.path.length; i++) L += Math.hypot(s.path[i][0] - s.path[i - 1][0], s.path[i][1] - s.path[i - 1][1]); return L + s.R; };
  for (const s of LIST) {
    const [x, y] = s.path[0], dist = Math.hypot((x - FOCAL[0]) / 1.3, y - FOCAL[1]), nn = n(x * .004, y * .004);
    if (s.pass === 0) { s.t0 = -105 + (x / W * .85 + y / H * .15 + nn * .2) * 190; s.d = clamp(len(s) / 16, 5, 11); }
    else if (s.pass === 1) { s.t0 = 135 + (x / W * .6 + y / H * .4 + nn * .08) * 125; s.d = clamp(len(s) / 12, 4, 10); }
    else if (s.pass === 2) { s.t0 = 255 + clamp(dist / 1100 + nn * .06) * 115; s.d = clamp(len(s) / 9, 4, 9); }
    else if (s.pass === 3) { s.t0 = 300 + clamp(dist / 900 + nn * .05) * 90; s.d = clamp(len(s) / 8, 4, 8); }
    else { s.t0 = 362 + clamp(dist / 1000) * 50 + r() * 16; s.d = 4; }
  }
  // 片尾：左下先刷一层暗（原色压暗），再写字，最后一笔红
  for (let y = 740; y < H + 20; y += 15) for (let x = -20; x < 1000; x += 17) {
    const e = (x / 980) ** 2 + ((H - y) / 330) ** 2; if (e > 1 - r() * .25) continue;
    const rc = REF.getContext('2d').getImageData(clamp(x, 0, W - 1), clamp(y, 0, H - 1), 1, 1).data, k = .78 + r() * .1;
    LIST.push({ path: [[x, y], [x + 18, y + (r() - .5) * 4], [x + 36, y + (r() - .5) * 6]], R: 14 + r() * 6, col: [lerp(rc[0], 10, k), lerp(rc[1], 22, k), lerp(rc[2], 28, k)], pass: 6, imp: .8, seed: (r() * 1e9) | 0, t0: TL.glaze + x / 980 * 34 + r() * 8, d: 7 });
  }
  const tc = HD.canvas(W, H), tg = tc.getContext('2d');
  tg.font = '900 210px SerifSC'; tg.fillStyle = '#F4E8D2'; tg.fillText('厚涂', 84, 984);
  const tfl = PAINT.flow(tc, { def: (X, Y, nz) => HD.fbm(nz, X * .01, Y * .01, 2) * .5, edge: () => 1.2 });
  const tl = PAINT.plan(tc, tfl, { passes: [{ R: 8, step: 5.5, len: 6, thr: 90, p: 1 }, { R: 3.4, step: 2.6, len: 5, thr: 90, p: 1 }], hi: 0, rain: 0, jv: .06, jw: 8, seed: 21 });
  for (const s of tl) { s.pass = 7; s.imp = 1.3; s.t0 = TL.title + (s.path[0][0] - 84) / 440 * 52 + (s.R < 5 ? 22 : 0) + r() * 6; s.d = 6; LIST.push(s); }
  PAL.forEach(([nm, hex], i) => { const x = W - 70 - (PAL.length - i) * 114 + 18, y = 968, col = HD.hex(hex);
    for (let k = 0; k < 3; k++) LIST.push({ path: [[x + 4, y - 8 + k * 9 + r() * 3], [x + 40, y - 12 + k * 9], [x + 88, y - 6 + k * 9 + r() * 3]], R: 8 + r() * 2, col: col.map(v => v * (1 + (r() - .5) * .12)), pass: 8, imp: 1.2, seed: (r() * 1e9) | 0, t0: TL.palette + i * 14 + k * 3, d: 7 }); });
  { const P = []; for (let k = 0; k <= 12; k++) { const u = k / 12; P.push([92 + u * 470, 1014 + Math.sin(u * 3) * 4 - u * 6]); } LIST.push({ path: P, R: 7.5, col: [196, 42, 36], pass: 9, imp: 1.6, seed: 77, t0: TL.under, d: 14 }); }
  BYEND = LIST.slice().sort((a, b) => (a.t0 + a.d) - (b.t0 + b.d));
  BYSTART = LIST.slice().sort((a, b) => a.t0 - b.t0);
  // 底布：赭色、有一点深浅；炭笔起稿 = 不带雨的参考帧的边（先模糊再求梯度，线是一条不是两条）
  UNDER = HD.canvas(W, H); const ug = UNDER.getContext('2d');
  const R0 = PAINT.ref(1, { norain: true }), bl = HD.canvas(W, H), bg2 = bl.getContext('2d'); bg2.filter = 'blur(1.6px)'; bg2.drawImage(R0, 0, 0);
  const im = ug.createImageData(W, H), d = im.data, rd = bg2.getImageData(0, 0, W, H).data, nb = HD.makeNoise(31), nt = HD.makeNoise(33);
  const lum = i => (rd[i * 4] * .3 + rd[i * 4 + 1] * .59 + rd[i * 4 + 2] * .11) / 255;
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const i = y * W + x, mot = HD.fbm(nb, x * .003, y * .003, 3) * .12;
    let e = 0; if (x > 0 && y > 0 && x < W - 1 && y < H - 1) { const gx = lum(i + 1) - lum(i - 1), gy = lum(i + W) - lum(i - W); e = Math.hypot(gx, gy); }
    const tooth = .5 + .5 * nt(x * .7, y * .9);
    const ch = HD.smooth(.035, .11, e) * HD.smooth(.15, .6, tooth + HD.smooth(.035, .2, e) * .4) * .9;
    const base = [118 * (1 + mot), 84 * (1 + mot), 56 * (1 + mot)];
    d[i * 4] = lerp(base[0], 30, ch); d[i * 4 + 1] = lerp(base[1], 21, ch); d[i * 4 + 2] = lerp(base[2], 16, ch); d[i * 4 + 3] = 255;
  }
  ug.putImageData(im, 0, 0);
}
function resetMaster() {
  if (!master) master = PAINT.surface(MS, null, { under: false });
  master.g.save(); master.g.setTransform(1, 0, 0, 1, 0, 0); master.g.drawImage(UNDER, 0, 0, W * MS, H * MS); master.g.restore();
  // 厚度层回到画布纹
  const fresh = PAINT.surface(MS, null, { under: false }); master.hg.save(); master.hg.setTransform(1, 0, 0, 1, 0, 0); master.hg.drawImage(fresh.hc, 0, 0); master.hg.restore();
  ci = 0; cacheF = -1e9;
}
function advance(f) {
  if (f < cacheF) resetMaster();
  while (ci < BYEND.length && BYEND[ci].t0 + BYEND[ci].d <= f) { PAINT.draw1(master, BYEND[ci], 1, 1); ci++; }
  cacheF = f;
}
// 正在画的笔：t0 ≤ f < t0 + d
function wet(f) { let lo = 0, hi = BYSTART.length; while (lo < hi) { const m = (lo + hi) >> 1; BYSTART[m].t0 < f - 20 ? lo = m + 1 : hi = m; } const out = []; for (let i = lo; i < BYSTART.length && BYSTART[i].t0 <= f; i++) { const s = BYSTART[i]; if (f < s.t0 + s.d) out.push(s); } return out; }
const LAMPS = []; for (let z = 8; z < 150; z += 12) LAMPS.push([1010 + 4.1 * 880 / z, 548 - (6.1 - 1.7) * 880 / z, z]);
const RAIN = (() => { const r = rng(41); return Array.from({ length: 300 }, () => ({ x: r() * 2100 - 60, y: r() * 1200, v: 13 + r() * 10, L: 16 + r() * 28, R: .9 + r() * .9, seed: (r() * 1e9) | 0 })); })();

function draw(f) {
  advance(f);
  const { cx, cy, z } = cam(f), ox = 960 - cx * z, oy = 540 - cy * z;
  for (const [g, src] of [[sc, master.out], [sh, master.hc]]) { g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = 1; g.drawImage(src, (cx - 960 / z) * MS, (cy - 540 / z) * MS, W / z * MS, H / z * MS, 0, 0, W, H); }
  const SF = { g: sc, hg: sh };
  sc.setTransform(z, 0, 0, z, ox, oy); sh.setTransform(z, 0, 0, z, ox, oy); sc.lineCap = sh.lineCap = 'round'; sc.lineJoin = sh.lineJoin = 'round';
  for (const s of wet(f)) PAINT.draw1(SF, s, (f - s.t0) / s.d, 1);
  const alive = smr(TL.alive, TL.alive + 120, f);
  if (alive > 0) {
    // 雨：也是笔，斜着落
    const rd = REF.getContext('2d');
    sc.globalAlpha = sh.globalAlpha = alive;
    for (const d of RAIN) {
      const t = f - TL.alive, yy = ((d.y + d.v * t) % 1240) - 80, xx = d.x - .16 * (yy - d.y);
      const k = (clamp(yy | 0, 0, H - 1) * W + clamp(xx | 0, 0, W - 1)) * 4, px = [REFD[k], REFD[k + 1], REFD[k + 2]];
      PAINT.stroke(sc, sh, [[xx, yy], [xx - d.L * .16, yy + d.L]], d.R, [Math.min(255, px[0] * .7 + 74), Math.min(255, px[1] * .7 + 82), Math.min(255, px[2] * .7 + 88)], rng(d.seed), 1);
    }
    sc.globalAlpha = sh.globalAlpha = 1;
    // 倒影晃：地面一条条横着错开一点
    sc.setTransform(1, 0, 0, 1, 0, 0); sh.setTransform(1, 0, 0, 1, 0, 0);
    const gy0 = Math.max(0, Math.floor(540 + (590 - cy) * z));
    for (let y = gy0; y < H; y += 3) { const wy = cy + (y - 540) / z, A = 2.6 * alive * clamp((wy - 580) / 300) * z, dx = Math.sin(wy * .11 + f * .14) * A + Math.sin(wy * .037 - f * .07) * A * .6;
      if (Math.abs(dx) > .05) { sc.drawImage(cv, 0, y, W, 3, dx, y, W, 3); sh.drawImage(shC, 0, y, W, 3, dx, y, W, 3); } }
  }
  sc.setTransform(1, 0, 0, 1, 0, 0);
  PAINT.relight(cv, shC, lightAt(f), ampAt(f), .95 * Math.pow(z, .25));
  // 路灯呼吸
  if (alive > 0) {
    sc.globalCompositeOperation = 'lighter';
    LAMPS.forEach(([x, y, lz], i) => { const X = ox + x * z, Y = oy + y * z, R = 3.4 * 880 / lz * z, a = .16 * alive * (.55 + .45 * Math.sin(f * .045 + i * 1.7)) * (1 - clamp(lz / 150));
      const g = sc.createRadialGradient(X, Y, 0, X, Y, R); g.addColorStop(0, `rgba(255,200,130,${a})`); g.addColorStop(1, 'rgba(255,200,130,0)'); sc.fillStyle = g; sc.beginPath(); sc.arc(X, Y, R, 0, 7); sc.fill(); });
    sc.globalCompositeOperation = 'source-over';
  }
  // 方向场：短线一条条亮出来再淡掉
  const fe = smr(TL.flow[0], TL.flow[0] + 30, f) * (1 - smr(TL.flow[1] - 40, TL.flow[1], f));
  if (fe > 0) {
    sc.setTransform(z, 0, 0, z, ox, oy); sc.lineCap = 'round';
    for (let y = 8; y < H; y += 24) for (let x = 8 + (y % 48 ? 12 : 0); x < W; x += 24) {
      const delay = clamp((x / W) * .6 + (y / H) * .4), a = fe * clamp((f - TL.flow[0] - delay * 50) / 14);
      if (a <= 0) continue; const ang = FL.ang[FL.at(x, y)], L = 8;
      sc.strokeStyle = `rgba(250,232,200,${.8 * a})`; sc.lineWidth = 1.7 / Math.sqrt(z);
      sc.beginPath(); sc.moveTo(x - Math.cos(ang) * L, y - Math.sin(ang) * L); sc.lineTo(x + Math.cos(ang) * L, y + Math.sin(ang) * L); sc.stroke();
    }
    sc.setTransform(1, 0, 0, 1, 0, 0);
  }
  hud(sc, f);
}

function hud(ctx, f) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  // 左上压一点暗，给字
  const capA = Math.max(...CAPS.map(([t0, , , , t1]) => smr(t0 - 6, t0 + 14, f) * (1 - smr(t1 - 10, t1 + 20, f))));
  if (capA > 0) { ctx.save(); ctx.translate(330, 150); ctx.scale(1.9, .8); const g = ctx.createRadialGradient(0, 0, 0, 0, 0, 300); g.addColorStop(0, `rgba(4,9,12,${.55 * capA})`); g.addColorStop(1, 'rgba(4,9,12,0)'); ctx.fillStyle = g; ctx.fillRect(-300, -300, 600, 600); ctx.restore(); }
  for (const [t0, no, title, sub, t1] of CAPS) {
    if (f < Math.max(0, t0) || f > t1 + 40) continue;
    rise(ctx, no + ' ·', 74, 104, f, t0, { font: '600 20px Mono', size: 20, color: '#FFC478', out: t1, kind: 'none', ls: 2 });
    rise(ctx, title, 72, 166, f, t0 + 3, { font: '900 58px SerifSC', size: 58, color: '#FFF4E6', out: t1, shadow: 'rgba(0,0,0,.6)' });
    rise(ctx, sub, 74, 212, f, t0 + 12, { font: '400 26px SansSC', size: 26, color: 'rgba(255,240,225,.88)', out: t1, kind: 'small', rate: .8, shadow: 'rgba(0,0,0,.7)' });
  }
  { const g = ctx.createRadialGradient(1760, 96, 0, 1760, 96, 260); g.addColorStop(0, 'rgba(4,9,12,.5)'); g.addColorStop(1, 'rgba(4,9,12,0)'); ctx.fillStyle = g; ctx.fillRect(1400, 0, 520, 360); }
  // 右上：笔数
  const done = ci + wet(f).length, brush = f < 140 ? 22 : f < 255 ? 11 : f < 300 ? 5.5 : 2.8;
  if (f >= 4) {
    rise(ctx, 'STROKES', 1848, 66, f, 4, { font: '500 16px Mono', size: 16, color: 'rgba(255,236,214,.7)', align: 'right', kind: 'small', ls: 3 });
    ctx.save(); ctx.font = '600 34px Mono'; ctx.textAlign = 'right'; ctx.fillStyle = `rgba(255,244,230,${smr(6, 20, f)})`; ctx.shadowColor = 'rgba(0,0,0,.6)'; ctx.shadowBlur = 12;
    ctx.fillText(Math.min(done, LIST.length).toLocaleString('en'), 1848, 108);
    ctx.font = '500 16px Mono'; ctx.fillStyle = `rgba(255,236,214,${.7 * smr(10, 24, f)})`; ctx.fillText(f < 430 ? `BRUSH ${brush} PX` : 'OIL ON CANVAS', 1848, 136); ctx.restore();
  }
  // 色板的字
  PAL.forEach(([nm, hex], i) => { const x = W - 70 - (PAL.length - i) * 114 + 18, t = TL.palette + i * 14 + 8;
    rise(ctx, nm, x, 1012, f, t, { font: '500 15px SansSC', size: 15, color: '#FFF4E6', kind: 'small', shadow: 'rgba(0,0,0,.8)', shadowBlur: 8 });
    rise(ctx, hex, x, 1032, f, t + 4, { font: '500 13px Mono', size: 13, color: 'rgba(255,236,214,.75)', kind: 'none', shadow: 'rgba(0,0,0,.8)', shadowBlur: 8 }); });
  // 片尾的小字
  rise(ctx, 'PAINTERLY · IMPASTO', 96, 1056, f, TL.title + 50, { font: '500 22px Corm', size: 22, color: 'rgba(255,232,205,.92)', kind: 'small', ls: 9, rate: .7 });
  rise(ctx, '观默', 560, 984, f, TL.sign, { font: '700 44px SerifSC', size: 44, color: '#FFF4E6', kind: 'title', rate: 5, shadow: 'rgba(0,0,0,.6)' });
  rise(ctx, `${LIST.length.toLocaleString('en')} 笔 · 全部由代码画成`, 560, 1024, f, TL.sign + 10, { font: '400 20px SansSC', size: 20, color: 'rgba(255,240,225,.8)', kind: 'small', rate: .7 });
  // 暗角
  const v = ctx.createRadialGradient(960, 560, 520, 960, 560, 1200); v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,4,8,.42)'); ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
}

window.frame = async f => { draw(f); };
window.events = () => {
  const dummy = HD.canvas(W, H).getContext('2d');
  for (let f = 0; f < END; f++) hud(dummy, f);
  const starts = k => { const a = new Array(END).fill(0); for (const s of LIST) if (k(s) && s.t0 >= 0 && s.t0 < END) a[Math.floor(s.t0)]++; return a; };
  return { cues: [...FK.cues.values()].filter(c => c[3] !== 'none').sort((a, b) => a[0] - b[0]),
    big: starts(s => s.pass === 0 || s.pass === 6), mid: starts(s => s.pass === 1), small: starts(s => s.pass === 2 || s.pass === 3), hi: starts(s => s.pass === 4), title: starts(s => s.pass === 7),
    palette: PAL.map((_, i) => TL.palette + i * 14), TL, end: END };
};
(async () => {
  await FK.fonts([['SerifSC', 'NotoSerifSC.ttf', '200 900'], ['SansSC', 'NotoSansSC-Regular.otf', '400'], ['Mono', 'GeistMono.ttf', '100 900'], ['Corm', 'Cormorant.ttf', '300 700']]);
  await document.fonts.load('900 210px SerifSC', '厚涂'); await document.fonts.load('400 26px SansSC', '大笔铺色');
  const t = performance.now(); build(); resetMaster(); console.log('build', ((performance.now() - t) / 1000).toFixed(1), 's · strokes', LIST.length);
  if (!Q.has('nodraw')) draw(+(Q.get('f') || 0));
  window.ready = true;
})();
</script>
