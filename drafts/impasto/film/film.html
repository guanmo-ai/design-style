  const fe = smr(TL.flow[0], TL.flow[0] + 26, f) * (1 - smr(TL.flow[1] - 34, TL.flow[1], f));
  if (fe > 0) { const FL = SCN[1].FL; sc.setTransform(z, 0, 0, z, ox, oy); sc.lineCap = 'round';
    for (let y = 8; y < H; y += 24) for (let x = 8 + (y % 48 ? 12 : 0); x < W; x += 24) { const delay = clamp((x / W) * .6 + (y / H) * .4), a = fe * clamp((f - TL.flow[0] - delay * 44) / 12); if (a <= 0) continue;
      const ang = FL.ang[FL.at(x, y)], L = 9; sc.strokeStyle = `rgba(255,248,232,${.85 * a})`; sc.lineWidth = 2 / Math.sqrt(z); sc.beginPath(); sc.moveTo(x - Math.cos(ang) * L, y - Math.sin(ang) * L); sc.lineTo(x + Math.cos(ang) * L, y + Math.sin(ang) * L); sc.stroke(); }
    sc.setTransform(1, 0, 0, 1, 0, 0); }
  hud(sc, f);
}

function hud(ctx, f) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  const capA = Math.max(...CAPS.map(([t0, , , , t1]) => smr(t0 - 6, t0 + 14, f) * (1 - smr(t1 - 10, t1 + 20, f))));
  if (capA > 0) { ctx.save(); ctx.translate(360, 150); ctx.scale(2.1, .85); const g = ctx.createRadialGradient(0, 0, 0, 0, 0, 300); g.addColorStop(0, `rgba(4,9,12,${.55 * capA})`); g.addColorStop(1, 'rgba(4,9,12,0)'); ctx.fillStyle = g; ctx.fillRect(-300, -300, 600, 600); ctx.restore(); }
  for (const [t0, no, title, sub, t1] of CAPS) {
    if (f < Math.max(0, t0) || f > t1 + 40) continue;
    rise(ctx, no + ' ·', 74, 104, f, t0, { font: '600 20px Mono', size: 20, color: '#FFC478', out: t1, kind: 'none', ls: 2 });
    rise(ctx, title, 72, 168, f, t0 + 3, { font: '900 62px SerifSC', size: 62, color: '#FFF4E6', out: t1, shadow: 'rgba(0,0,0,.6)' });
    rise(ctx, sub, 74, 216, f, t0 + 12, { font: '400 27px SansSC', size: 27, color: 'rgba(255,240,225,.9)', out: t1, kind: 'small', rate: .7, shadow: 'rgba(0,0,0,.7)' });
  }
  // 封面的大字（第 0 帧就在，1.4 秒后让给 01 章）
  if (f < 120) {
    rise(ctx, '厚涂', 72, 1000, f, -40, { font: '900 200px SerifSC', size: 200, color: '#FFF4E6', out: 52, kind: 'title', rate: 4, shadow: 'rgba(0,0,0,.55)', shadowBlur: 30 });
    rise(ctx, '一张画布，湿上加湿，画完五幅', 486, 990, f, -40, { font: '500 32px SansSC', size: 32, color: 'rgba(255,240,225,.95)', out: 52, kind: 'small', rate: .6, shadow: 'rgba(0,0,0,.7)' });
  }
  { const g = ctx.createRadialGradient(1760, 96, 0, 1760, 96, 280); g.addColorStop(0, 'rgba(4,9,12,.5)'); g.addColorStop(1, 'rgba(4,9,12,0)'); ctx.fillStyle = g; ctx.fillRect(1400, 0, 520, 360); }
  // 右上：画到第几幅 + 笔数（一直在涨）
  const si = sceneIdx(f), done = ci + wet(f).length;
  ctx.save(); ctx.textAlign = 'right'; ctx.shadowColor = 'rgba(0,0,0,.6)'; ctx.shadowBlur = 12;
  ctx.font = '500 16px Mono'; ctx.fillStyle = 'rgba(255,236,214,.75)'; ctx.fillText(`STROKES · ${si + 1} / ${SCN.length} · ${SCN[si].name}`, 1848, 66);
  ctx.font = '600 36px Mono'; ctx.fillStyle = '#FFF4E6'; ctx.fillText(Math.min(done, LIST.length).toLocaleString('en'), 1848, 110);
  ctx.font = '500 16px Mono'; ctx.fillStyle = 'rgba(255,236,214,.7)'; ctx.fillText('OIL ON CANVAS · WET ON WET', 1848, 138); ctx.restore();
  // 片尾：四幅画的色板标签、署名
  if (f >= TL.palette[0]) SCN.forEach((S, i) => rise(ctx, S.name, 1010 + i * 176, 1010, f, TL.palette[0] + i * 12 + 4, { font: '500 17px SansSC', size: 17, color: '#FFF4E6', kind: 'small', rate: .5, shadow: 'rgba(0,0,0,.8)', shadowBlur: 8 }));
  rise(ctx, 'PAINTERLY · IMPASTO', 96, 1048, f, TL.title + 36, { font: '500 22px Corm', size: 22, color: 'rgba(255,232,205,.92)', kind: 'small', ls: 9, rate: .7 });
  rise(ctx, '观默', 560, 960, f, TL.sign, { font: '700 46px SerifSC', size: 46, color: '#FFF4E6', kind: 'title', rate: 5, shadow: 'rgba(0,0,0,.6)' });
  rise(ctx, `${LIST.length.toLocaleString('en')} 笔 · 全部由代码画成`, 560, 1000, f, TL.sign + 10, { font: '400 20px SansSC', size: 20, color: 'rgba(255,240,225,.82)', kind: 'small', rate: .7 });
  const v = ctx.createRadialGradient(960, 560, 520, 960, 560, 1200); v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,4,8,.42)'); ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
}

window.frame = async f => { draw(f); };
window.events = () => {
  const dummy = HD.canvas(W, H).getContext('2d');
  for (let f = 0; f < END; f++) hud(dummy, f);
  const starts = k => { const a = new Array(END).fill(0); for (const s of LIST) if (k(s) && s.t0 >= 0 && s.t0 < END) a[Math.floor(s.t0)]++; return a; };
  return { cues: [...FK.cues.values()].filter(c => c[3] !== 'none').sort((a, b) => a[0] - b[0]),
    big: starts(s => s.pass === 0 || s.pass === 6), mid: starts(s => s.pass === 1), small: starts(s => s.pass === 2 || s.pass === 3), hi: starts(s => s.pass === 4), title: starts(s => s.pass === 7),
    palette: SCN.map((_, i) => TL.palette[0] + i * 12), scenes: SCN.map(S => S.t), TL, end: END, beat: BEAT };
};
(async () => {
  await FK.fonts([['SerifSC', 'NotoSerifSC.ttf', '200 900'], ['SansSC', 'NotoSansSC-Regular.otf', '400'], ['SansSC', 'NotoSansSC-Medium.otf', '500'], ['Mono', 'GeistMono.ttf', '100 900'], ['Corm', 'Cormorant.ttf', '300 700']]);
  await document.fonts.load('900 210px SerifSC', '厚涂'); await document.fonts.load('400 26px SansSC', '大笔铺色'); await document.fonts.load('500 26px SansSC', '一张画布');
  const t = performance.now(); build(); resetMaster(); console.log('build', ((performance.now() - t) / 1000).toFixed(1), 's · strokes', LIST.length);
  if (!Q.has('nodraw')) draw(+(Q.get('f') || 0));
  window.ready = true;
})();
</script>
