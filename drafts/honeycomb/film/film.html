<body><canvas id="c" width="1920" height="1080"></canvas>
<script>
/* 蜂窝布局 · 全片 v4（18 秒 · 60fps · 120 BPM，一拍 = 30 帧）。分镜见 STORYBOARD.md。
   10 个画面、10 个转场，换章都在拍点上：
   黑底图标 →（钻进一格）→ 白底照片墙 →（波浪）→ 琥珀蜂巢 →（翻牌）→ 蓝图 →（翻牌 + 转 60°）→ 三色对称（跟着鼓点一下下转）
   →（翻牌）→ 黑底吸附 →（点开）→ 一整屏照片 →（缩进表盘）→ 影棚里的手表 →（变形）→ 手机里选兴趣 →（翻牌）→ 纸白数据地图 →（收成一点 + 弹开）→ 收束。
   字：每个画面一个主角字（多是数字，会计数），上面一行等宽小字，下面一两行中文；整行从遮罩里滑上来、滑出去；
   字出现时，那一块的格子缩小退开、给字让位（布局本来就是在分配空间）。
   同一片 169 颗格子从头到尾不换。物理：透镜（中心原大，往外位置 tanh、大小 sech²）、惯性（τ = 0.5 s）、吸附（临界阻尼 0.17 s）。
   每一帧是帧号的纯函数：window.frame(f)；window.events() 导出出字时间给配乐。 */
const W = 1920, H = 1080, FPS = 60, END = 1080, FINAL = 990;
const g = document.getElementById('c').getContext('2d');
const clamp = (x, a = 0, z = 1) => Math.min(Math.max(x, a), z);
const sm = x => { x = clamp(x); return x * x * (3 - 2 * x); };

const lerp = (a, b, t) => a + (b - a) * t;
const expoOut = x => x <= 0 ? 0 : x >= 1 ? 1 : 1 - Math.pow(2, -10 * x);
const expoIn = x => x <= 0 ? 0 : x >= 1 ? 1 : Math.pow(2, 10 * x - 10);
const spring = u => u <= 0 ? 0 : 1 - Math.exp(-u / .06) * Math.cos(Math.PI * 2 * 2.6 * u);      // u：秒；冲过头再回来
function hash(n) { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); }
function mk(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
const INK = '#F5F5F7', DIM = '#8E8E93';
const hex2 = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const rgb = (a, al = 1) => `rgba(${a[0] | 0},${a[1] | 0},${a[2] | 0},${al})`;

// ---------- 格子 ----------
const D = 150, ICON = 132, RING = 8;
const CELLS = [];
for (let q = -RING; q <= RING; q++) for (let r = Math.max(-RING, -q - RING); r <= Math.min(RING, -q + RING); r++)
  CELLS.push({ q, r, x: D * (q + r / 2), y: D * Math.sqrt(3) / 2 * r, id: CELLS.length });
const cellAt = (q, r) => CELLS.find(c => c.q === q && c.r === r);
const T1 = cellAt(3, -1), T2 = cellAt(-2, 3);

// ---------- 镜头：甩（惯性）、吸附（临界阻尼）、慢移 ----------
const TAU = 0.5, RISE = 0.06, SN = 0.17;
const Xf = u => u <= 0 ? 0 : 1 - (TAU * Math.exp(-u / TAU) - RISE * Math.exp(-u / RISE)) / (TAU - RISE);
const Sn = u => u <= 0 ? 0 : 1 - (1 + u / SN) * Math.exp(-u / SN);
function makePan(c0, moves) {
  let sx = c0.x, sy = c0.y;
  for (const m of moves) { m.A = m[1] === 'snap' ? { x: m[2].x - sx, y: m[2].y - sy } : m[2]; sx += m.A.x; sy += m.A.y; }
  return f => {
    let x = c0.x, y = c0.y;
    for (const m of moves) { const u = (f - m[0]) / FPS, k = m[1] === 'snap' ? Sn(u) : m[1] === 'glide' ? sm((f - m[0]) / m[3]) : Xf(u); x += m.A.x * k; y += m.A.y * k; }

  };
}
const OUTER = [[-19, 'flick', { x: 1300, y: -700 }], [24, 'flick', { x: -300, y: 900 }], [50, 'snap', T1]];
const INNER = [[86, 'glide', { x: 260, y: -70 }, 100], [318, 'flick', { x: 380, y: 260 }], [500, 'flick', { x: -1000, y: 800 }], [520, 'snap', T2],
  [690, 'flick', { x: 300, y: -220 }], [770, 'glide', { x: 0, y: 260 }, 60]];
const panOuter = makePan({ x: -900, y: 560 }, OUTER);
const panI = makePan({ x: -150, y: 60 }, INNER);
const panInner = f => { const p = panI(f), idle = 1 - R(f, 900, 960); return { x: p.x + Math.sin(f / 70) * 14 * idle, y: p.y + Math.cos(f / 83) * 10 * idle }; };

// ---------- 每帧的画面参数（钻进去以后的那个世界）----------
const lensW = f => R(f, 276, 302) * (1 - R(f, 380, 405)) + R(f, 482, 506) * (1 - R(f, 835, 865));   // 0 = 摊平
const DEV = f => R(f, 628, 672) * (1 - R(f, 835, 870));                        // 设备（手表 → 手机）
const MORPH = f => R(f, 735, 765);                                             // 0 = 手表，1 = 手机
const devGeo = (m) => ({ sw: lerp(560, 420, m), sh: lerp(650, 860, m), sr: lerp(96, 64, m), bw: lerp(650, 456, m), bh: lerp(750, 896, m), br: lerp(150, 80, m),
  lc: { x: 1270, y: lerp(520, 540, m), ax: lerp(250, 190, m), ay: lerp(290, 400, m) } });
const LCf = f => {
  const l = lensW(f), x = lerp(960, 1270, l), d = DEV(f), G = devGeo(MORPH(f));
  return { x: lerp(x, G.lc.x, d), y: lerp(540, G.lc.y, d), ax: lerp(660, G.lc.ax, d), ay: lerp(500, G.lc.ay, d) };
};
const zoomAt = f => Math.exp(
  Math.log(1.5) * R(f, 174, 206) * (1 - R(f, 264, 294)) + Math.log(1.14) * R(f, 206, 262) * (1 - R(f, 264, 294)) +   // 蜂巢：推近
  Math.log(1.18) * R(f, 382, 410) * (1 - R(f, 482, 506)) +                    // 对称
  Math.log(2.3) * R(f, 538, 560) * (1 - R(f, 628, 660)) +                     // 点开前放大
  Math.log(0.62) * R(f, 628, 672) + Math.log(.8 / .62) * R(f, 735, 765) + Math.log(.55 / .8) * R(f, 835, 865));
const STEPS = [420, 450];                                                      // 对称：跟着鼓点一下下转 60°
const rotAt = f => Math.PI / 3 * (R(f, 380, 410) + spring((f - STEPS[0]) / FPS) + spring((f - STEPS[1]) / FPS) + R(f, 482, 506) + R(f, 628, 672));
const BGK = [[0, '#F5F3EF'], [172, '#F5F3EF'], [204, '#1E1406'], [262, '#1E1406'], [290, '#0E2A5A'], [380, '#0E2A5A'], [405, '#121212'],
  [482, '#121212'], [506, '#000000'], [628, '#000000'], [672, '#E6E1D7'], [735, '#E6E1D7'], [765, '#CFE8DC'], [835, '#CFE8DC'], [865, '#F4F1EA'],
  [925, '#F4F1EA'], [960, '#000000']];
function bgAt(f) {
  for (let i = 0; i < BGK.length - 1; i++) { const [a, ca] = BGK[i], [b, cb] = BGK[i + 1]; if (f <= b) { const t = sm((f - a) / (b - a)), A = hex2(ca), B = hex2(cb); return A.map((v, k) => lerp(v, B[k], t)); } }
  return hex2(BGK[BGK.length - 1][1]);
}
const blueprint = f => R(f, 262, 290) * (1 - R(f, 380, 405));
const studio = f => R(f, 628, 672) * (1 - R(f, 735, 765));
const diveAt = f => R(f, 66, 100);
const openAt = f => R(f, 560, 590) * (1 - R(f, 628, 660));
const colAt = f => R(f, 925, FINAL);
const RIPS = [[68, 'outer', .32], [420, 'inner', .22], [450, 'inner', .22], [538, 'inner', .32]];
function ripple(f, dist, world) {
  let m = 1;
  for (const [r0, w, A] of RIPS) { if (w !== world) continue; const age = f - r0 - dist / 38; if (age > 0) m += A * Math.exp(-age / 13) * Math.sin(age / 3.1); }
  return m;
}
const FLIPS = [[262, 'wire'], [380, 'tri'], [482, 'icon'], [742, 'photo'], [835, 'data']];
function content(fd) {
  let mode = 'photo', mix = 0, sx = 1;
  if (fd >= 172) { mix = R(fd, 172, 204); if (mix >= 1) mode = 'honey'; }      // 照片 → 蜂蜡：波浪
  for (const [f0, to] of FLIPS) if (fd >= f0) {                                // 翻牌：12 帧，翻到侧面那一刻换内容
    const p = clamp((fd - f0) / 12);
    sx = p < 1 ? Math.max(.03, Math.abs(Math.cos(Math.PI * p))) : 1;
    if (p >= .5) { mode = to; mix = 0; }
  }
  return { mode, mix, sx };
}
const hexH = fd => 1 - R(fd, 482, 505) + R(fd, 835, 862);                      // 1 = 六边形，0 = 圆
const INR = { photo: .455, honey: .495, wire: .47, tri: .492, icon: .44, data: .47 };
const TRI = ['#F5F5F7', '#8E8E93', '#2C2C2E'];                                  // 三色就能把六边形铺满且相邻不同色
const magAt = f => R(f, 100, 116) * (1 - R(f, 160, 180));
const MAG = f => ({ x: lerp(1660, 760, sm((f - 96) / 84)), y: 420 + 120 * Math.sin((f - 96) / 20) });
let TAPS = [];                                                                 // 手机里点中的三颗：[帧, 格子]
const tapSel = (f, t) => spring((f - t) / FPS);

function lens(dx, dy, r0, L, lc) {
  const u = dx / lc.ax, v = dy / lc.ay, rr = Math.hypot(u, v) + 1e-9, Rk = .58;
  let rd, s;
  if (rr <= r0) { rd = rr; s = 1; } else { const z = (rr - r0) / Rk, th = Math.tanh(z); rd = r0 + Rk * th; s = 1 - th * th; }
  rd = lerp(rr, rd, L); s = lerp(1, s, L);
  return { x: lc.x + u / rr * rd * lc.ax, y: lc.y + v / rr * rd * lc.ay, s };
}

// ---------- 图标 / 照片 ----------
const PHOTOS = ['lake', 'dunes', 'ocean', 'stairs', 'tokyo', 'monstera', 'citrus', 'nook', 'cup', 'tulips', 'bread', 'cat'];
const IMG = {};
const COLORS = ['#FF453A', '#FF9F0A', '#FFD60A', '#30D158', '#64D2FF', '#0A84FF', '#F2F2F7', '#FF375F', '#2C2C2E'];
const SPI = [], SPP = [];
function sprite(kind, k) {
  const S = 256, c = mk(S, S), x = c.getContext('2d');
  if (kind === 'photo') {
    const im = IMG[PHOTOS[k % PHOTOS.length]], s = Math.max(S / im.width, S / im.height);
    x.drawImage(im, (S - im.width * s) / 2, (S - im.height * s) / 2, im.width * s, im.height * s);
    return c;
  }
  const bg = COLORS[k % COLORS.length], fg = bg === '#F2F2F7' || bg === '#FFD60A' ? '#1C1C1E' : '#FFFFFF';
  x.fillStyle = bg; x.fillRect(0, 0, S, S);
  x.fillStyle = fg; x.strokeStyle = fg; x.lineWidth = 18; x.lineCap = 'round'; x.lineJoin = 'round';
  const gl = Math.floor(hash(k * 7.3) * 8);
  x.beginPath();
  if (gl === 0) { x.arc(128, 128, 62, 0, 7); x.stroke(); x.beginPath(); x.moveTo(128, 128); x.lineTo(128, 82); x.moveTo(128, 128); x.lineTo(160, 140); x.stroke(); }
  else if (gl === 1) { x.moveTo(104, 78); x.lineTo(180, 128); x.lineTo(104, 178); x.closePath(); x.fill(); }
  else if (gl === 2) { for (let i = 0; i < 4; i++) x.rect(70 + i * 32, 170 - [40, 80, 60, 100][i], 20, [40, 80, 60, 100][i]); x.fill(); }
  else if (gl === 3) { x.moveTo(64, 128); for (let i = 0; i <= 32; i++) x.lineTo(64 + i * 4, 128 + Math.sin(i / 32 * Math.PI * 3) * 34); x.stroke(); }
  else if (gl === 4) { for (let i = 0; i < 3; i++) for (let j = 0; j < 3; j++) { x.moveTo(92 + i * 36 + 12, 92 + j * 36); x.arc(92 + i * 36, 92 + j * 36, 12, 0, 7); } x.fill(); }
  else if (gl === 5) { x.arc(128, 128, 60, Math.PI * .15, Math.PI * 1.85); x.stroke(); }
  else if (gl === 6) { x.rect(78, 84, 100, 88); x.stroke(); x.beginPath(); x.moveTo(78, 112); x.lineTo(178, 112); x.stroke(); }
  else { x.arc(128, 128, 26, 0, 7); x.fill(); x.beginPath(); for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4; x.moveTo(128 + Math.cos(a) * 46, 128 + Math.sin(a) * 46); x.lineTo(128 + Math.cos(a) * 70, 128 + Math.sin(a) * 70); } x.stroke(); }
  return c;
}
const HONEY = ['#F6B53D', '#EFA52C', '#FFC857', '#E8961F', '#FBBF47'];
const DATA = [[22, 46, 74], [36, 98, 132], [62, 160, 170], [240, 178, 58], [232, 72, 44]];
function dataColor(v) {
  v = clamp(v) * (DATA.length - 1); const i = Math.min(DATA.length - 2, Math.floor(v)), t = v - i, a = DATA[i], b = DATA[i + 1];
  return `rgb(${Math.round(lerp(a[0], b[0], t))},${Math.round(lerp(a[1], b[1], t))},${Math.round(lerp(a[2], b[2], t))})`;
}
function shape(c, x, y, rc, inr, h, rot = 0) {      // 圆 ↔ 六边形（尖顶，水平邻居共用竖边）
  c.beginPath();
  if (h < 0.002) { c.arc(x, y, rc, 0, 7); return; }
  for (let k = 0; k < 48; k++) {
    const th = k / 48 * Math.PI * 2, n = Math.round((th - rot) / (Math.PI / 3)) * (Math.PI / 3) + rot;
    const r = lerp(rc, inr / Math.cos(th - n), h);
    k ? c.lineTo(x + Math.cos(th) * r, y + Math.sin(th) * r) : c.moveTo(x + Math.cos(th) * r, y + Math.sin(th) * r);
  }
  c.closePath();
}

// ---------- 收束 / 数据地图 ----------
const FLOWER = new Map(); let MAPC = null;
const FC = { x: 960, y: 420 }, DF = 186;
function mapMask(cell) {
  const dx = cell.x - MAPC.x, dy = cell.y - MAPC.y;
  const blobs = [[0, 0, 520], [-380, -220, 330], [330, 260, 360], [420, -300, 260], [-300, 330, 280]];
  let m = 0; for (const [bx, by, br] of blobs) m = Math.max(m, 1 - Math.hypot(dx - bx, dy - by) / br);
  return clamp(m * 3);
}
function dataVal(cell, f) {
  const n = .5 + .25 * Math.sin(cell.x * .004 + cell.y * .003) + .2 * Math.sin(cell.x * .011 - cell.y * .007 + 1.3);
  const wave = .35 * Math.sin((cell.x * .8 + cell.y * .45) * .006 - f * .09);
  return clamp(n * .8 + wave * .6 + .1);

// ---------- 字的区块（每个画面一个）----------
// hero：主角字（可以是随帧变化的函数：计数）；meta：上面的等宽小字；cap：下面的中文；x/y：主角字的基线；zone：给字让位的区域
const BLOCKS = [
  { f0: 108, f1: 164, meta: '01 — TESSELLATION', hero: '6', hs: 330, cap: ['每一格，都挨着六格', '没有行，也没有列'], c: ['#8A8A8E', '#111111', '#3A3A3C'] },
  { f0: 208, f1: 256, meta: '02 — WHY HEXAGON', hero: f => `${Math.round(120 * expoOut((f - 212) / 22))}°`, hs: 300, cap: ['同样的面积，六边形周长最短', '蜜蜂用最少的蜡，盖最多的格子'], c: ['#D9A85C', '#FFF3D6', '#F3D29A'] },
  { f0: 298, f1: 374, meta: '03 — LENS', hero: '1:1', hs: 300, cap: ['中心一圈原大，往外越挤越小', 's = 1 − tanh²((r − r₀) / k)'], c: ['#9DB7E8', '#FFFFFF', '#D6E2FA'], mono2: true },
  { f0: 410, f1: 474, meta: '04 — SYMMETRY', hero: '60°', hs: 300, cap: ['转 60°，还是它自己', '三种颜色就能铺满，邻居永远不同色'], c: ['#8E8E93', '#F5F5F7', '#C7C7CC'] },
  { f0: 506, f1: 554, meta: '05 — SNAP', hero: f => `${(0.17 * expoOut((f - 510) / 20)).toFixed(2)}s`, hs: 280, cap: ['甩一下，停在一格上', '临界阻尼，不回弹'], c: ['#8E8E93', '#F5F5F7', '#C7C7CC'] },
  { f0: 592, f1: 624, meta: '06 — OPEN', hero: 'Open', hs: 280, cap: ['图标从蜂窝里，长成一整屏'], c: ['rgba(255,255,255,.75)', '#FFFFFF', 'rgba(255,255,255,.88)'], noZone: true },
  { f0: 676, f1: 730, meta: '07 — IN THE WILD', hero: f => `${Math.round(2000 + 15 * expoOut((f - 680) / 22))}`, hs: 280, cap: ['Apple Watch 主屏', '默认就是蜂窝'], c: ['#77736C', '#161616', '#3A3A3A'], noZone: true },
  { f0: 768, f1: 830, meta: '07 — IN THE WILD', hero: 'Pick 3', hs: 240, cap: ['注册时选你喜欢的', '点中的那颗，变大'], c: ['#4F7A66', '#10261C', '#2F4A3E'], noZone: true },
  { f0: 868, f1: 920, meta: '07 — IN THE WILD', hero: 'Hexbin', hs: 260, cap: ['六边形数据图', '一格一个区域，颜色就是数值'], c: ['#77736C', '#161616', '#3A3A3A'] },

const BX = 104, BY = 846;          // 主角字的基线（左下角）
const zoneK = f => { let k = 0; for (const b of BLOCKS) if (!b.noZone) k = Math.max(k, R(f, b.f0 - 8, b.f0 + 8) * (1 - R(f, b.f1, b.f1 + 14))); return k; };
function zoneScale(x, y, k) {      // 左下角那块：格子缩小、退开，给字让位

// ---------- 画一片格子：world = 'outer'（封面那片图标）或 'inner'（钻进去以后的一切）----------
function grid(c, f, world) {
  const outer = world === 'outer';
  const p = outer ? panOuter(f) : panInner(f);
  const Z = outer ? 1 : zoomAt(f), L = outer ? 1 : lensW(f), lc = outer ? { x: 1270, y: 540, ax: 660, ay: 500 } : LCf(f);
  const th = outer ? 0 : rotAt(f), ct = Math.cos(th), st = Math.sin(th);
  const co = outer ? 0 : colAt(f), ds = outer ? 0 : R(f, 837, 865);
  const mg = outer ? 0 : magAt(f), M = MAG(f), zk = outer ? 0 : zoneK(f), dev = outer ? 0 : DEV(f);
  const list = [];
  for (const cell of CELLS) {
    const gx = (cell.x - p.x) * Z, gy = (cell.y - p.y) * Z;
    const P = lens(gx * ct - gy * st, gx * st + gy * ct, .32, L, lc);
    let x = P.x, y = P.y;
    const dist = Math.hypot(x - lc.x, y - lc.y), fd = f - clamp(dist / 900) * 24;
    const C = outer ? { mode: 'icon', mix: 0, sx: 1 } : content(fd);
    let s = P.s * Z * ripple(f, dist, world), a = 1, rot = th, hh = outer ? 0 : hexH(fd), inrK = INR[C.mode] || .44, sel = 0;
    if (mg > 0) {      // 放大镜：附近的格子推开、放大
      const dx = x - M.x, dy = y - M.y, bb = mg * Math.exp(-((dx * dx + dy * dy) / (260 * 260)));
      x = M.x + dx * (1 + .5 * bb); y = M.y + dy * (1 + .5 * bb); s *= 1 + .9 * bb;
    }
    if (ds > 0) s *= lerp(1, mapMask(cell), ds);
    if (dev < .5 && co <= 0) s *= zoneScale(x, y, zk);
    for (const [tf, tc] of TAPS) if (tc === cell && f > tf - 2) { sel = tapSel(f, tf) * (1 - R(f, 832, 850)); s *= 1 + .6 * sel; }
    if (co > 0) {
      const fl = FLOWER.get(cell.id);
