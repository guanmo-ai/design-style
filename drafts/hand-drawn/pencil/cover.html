  { const im = pg.getImageData(0, 0, W * S, H * S), d = im.data, rr = rng(3); for (let i = 0; i < d.length; i += 4) { if (!d[i + 3]) continue; const v = (rr() - .5) * 7; d[i] += v; d[i + 1] += v; d[i + 2] += v; } pg.putImageData(im, 0, 0); }
