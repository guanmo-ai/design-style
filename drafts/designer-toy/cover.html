<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>潮玩 · Designer Toy · 第 0 帧</title>
<style>
@font-face { font-family: 'Fredoka'; src: url(../../public/fonts/Fredoka.ttf); font-weight: 300 700; font-stretch: 75% 125%; }
@font-face { font-family: 'GeistMono'; src: url(../../public/fonts/GeistMono.ttf); font-weight: 100 900; }
@font-face { font-family: 'Geist'; src: url(../../public/fonts/Geist.ttf); font-weight: 100 900; }
@font-face { font-family: 'NotoSC'; src: url(../../public/fonts/NotoSansSC-Black.otf); font-weight: 900; }
@font-face { font-family: 'NotoSC'; src: url(../../public/fonts/NotoSansSC-Bold.otf); font-weight: 700; }
@font-face { font-family: 'NotoSC'; src: url(../../public/fonts/NotoSansSC-Medium.otf); font-weight: 500; }
@font-face { font-family: 'NotoSC'; src: url(../../public/fonts/NotoSansSC-Regular.otf); font-weight: 400; }
* { margin: 0; padding: 0; box-sizing: border-box; }
:root { --ink: #2b2340; --dim: #85778f; }
html, body { width: 1920px; height: 1080px; overflow: hidden; background: #ffd9c4; color: var(--ink); font-family: Geist, NotoSC, sans-serif; }
canvas { position: absolute; display: block; }
.mono { font-family: GeistMono, monospace; letter-spacing: .05em; }
.ov { position: absolute; inset: 0; pointer-events: none; }
.tl { position: absolute; left: 64px; top: 46px; font-size: 12.5px; color: rgba(43,35,64,.62); display: flex; gap: 24px; text-transform: uppercase; }
.tl b { color: var(--ink); font-weight: 600; }
.tr { position: absolute; right: 64px; top: 46px; font-size: 12px; color: rgba(43,35,64,.62); text-align: right; line-height: 1.8; }
.tr b { color: var(--ink); font-weight: 600; }
.title { position: absolute; left: 64px; top: 118px; width: 520px; }
.title .zh { font-family: NotoSC; font-weight: 900; font-size: 128px; line-height: 1; letter-spacing: .02em; }
.title .en { font-family: Fredoka; font-weight: 600; font-stretch: 115%; font-size: 30px; letter-spacing: .14em; margin-top: 16px; }
.title p { font-family: NotoSC; font-size: 18px; line-height: 1.8; margin-top: 24px; color: #4d4260; }
.title p b { color: var(--ink); }
svg.lines { position: absolute; inset: 0; }
.call { position: absolute; width: 250px; font-size: 12.5px; line-height: 1.6; color: #5a4f6a; }
.call .k { display: block; font-family: GeistMono; font-size: 11px; color: var(--ink); margin-bottom: 4px; letter-spacing: .02em; }
.call .k i { font-style: normal; color: #fff; background: var(--ink); border-radius: 3px; padding: 0 5px; margin-right: 8px; }
.call b { display: block; font-family: NotoSC; font-weight: 700; font-size: 15px; color: var(--ink); margin-bottom: 2px; }
.ttag { position: absolute; font-size: 11px; color: var(--ink); white-space: nowrap; }
.ttag b { display: inline-block; background: var(--ink); color: #fff; border-radius: 3px; padding: 1px 6px; margin-right: 6px; font-weight: 500; }
.shelfcap { position: absolute; left: 64px; top: 742px; font-family: NotoSC; font-size: 14px; font-weight: 700; }
.shelfcap span { font-weight: 400; color: var(--dim); margin-left: 10px; font-size: 13px; }
.lab { position: absolute; top: 1006px; font-size: 10.5px; text-align: center; width: 120px; line-height: 1.5; color: var(--ink); }
.lab b { display: block; font-family: NotoSC; font-size: 12.5px; font-weight: 700; }
.lab span { color: var(--dim); }
.frame i { position: absolute; width: 22px; height: 22px; border-color: rgba(43,35,64,.4); border-style: solid; }
.foot { position: absolute; right: 64px; bottom: 34px; font-size: 11px; color: rgba(43,35,64,.55); }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="shelf"></canvas>
<div class="ov" id="ov" style="display:none">
  <div class="tl mono"><span><b>NO. 027</b></span><span>潮玩 · Designer Toy</span><span>1999 香港搪胶 → 2000s 美国 Art Toy → 2016 盲盒 → 2025 全球潮玩热</span></div>
  <div class="tr mono"><b>BOBO 啵啵 · 下雨天系列</b><br>SOFT VINYL · 9 CM · 4 + 1 SECRET</div>
  <div class="frame"><i style="left:40px;top:40px;border-width:2px 0 0 2px"></i><i style="right:40px;top:40px;border-width:2px 2px 0 0"></i><i style="left:40px;bottom:40px;border-width:0 0 2px 2px"></i><i style="right:40px;bottom:40px;border-width:0 2px 2px 0"></i></div>
  <div class="title">
    <div class="zh">潮玩</div>
    <div class="en">DESIGNER TOY</div>
    <p>大头、短手、困困的眼神，<b>一点点不耐烦</b>——<br>好的潮玩先有<b>态度</b>，再有长相。<br>最上头的是拆开那一下：<b>蹲、窜、停一拍</b>。</p>
  </div>
  <svg class="lines" id="lines" width="1920" height="1080"></svg>
  <div id="calls"></div>
  <div class="shelfcap">下雨天系列 · 4 + 1<span>同一个身体，换一顶帽子就是一个新角色</span></div>
  <div id="labs"></div>
  <div class="foot mono">原创角色 · 画面全部由代码实时渲染（光线步进 + 景深），没有一张贴图</div>
</div>
<script src="../_lib/glkit.js"></script>
<script src="toy.js"></script>
<script src="boxart.js"></script>
<script>
const Q = new URLSearchParams(location.search); const J = k => Q.get(k) ? Q.get(k).split(',').map(Number) : null;
const DPR = devicePixelRatio;
const FROG = { kind: 0, cap: [.42, .76, .4], body: [1, .8, .26], boot: [.93, .33, .28] };
const SERIES = [
  FROG,
  { kind: 1, cap: [.6, .43, .3], body: [.55, .76, .96], boot: [1, .84, .32] },
  { kind: 2, cap: [.97, .94, .92], body: [1, .58, .64], boot: [.56, .7, .96] },
  { kind: 3, cap: [.27, .24, .33], body: [1, .62, .3], boot: [.96, .95, .92] },
];
(async () => {
  await document.fonts.load('700 100px Fredoka'); await document.fonts.load('900 100px NotoSC', '潮玩'); await document.fonts.ready;
  const W = 1920, H = 1080;
  const cv = document.getElementById('gl'); cv.width = W * DPR; cv.height = H * DPR; cv.style.width = W + 'px'; cv.style.height = H + 'px';
  const gl = GLK.create(cv); const P = GLK.program(gl, TOY.FS);
  const S = window.S = {
    cam: J('cam') || [3.2, 2.4, 10.6], tgt: J('tgt') || [-1.25, 2.15, 0], fov: 30,
    figs: [
      Object.assign({ pos: [-.55, 2.05, .3], yaw: .42, sy: 1.1, arm: 1, tilt: .12, expr: 1 }, FROG),
    ],
    box: { pos: [.1, 0, -.1], yaw: .45, size: [.95, .95, .82] },
    boxTex: BOXART.boxArt(), boxCol: '#ffe9a6', boxIn: '#fff6e8',
    bgTop: '#ffcab8', bgBot: '#ffe8da', floor: '#ffdccc', key: [-.62, .88, .62], ghostA: .26,
    exposure: 1.0, saturation: 1.08, dof: { focus: 11.0, amount: 26, max: 14 },
  };
  await TOY.render(gl, P, null, S, +(Q.get('tiles') || 8));
  // —— 系列货架：四顶帽子 + 隐藏款（电镀）——
  const sc = document.getElementById('shelf'); const SW = 760, SH = 230;
  sc.width = SW * DPR; sc.height = SH * DPR; Object.assign(sc.style, { width: SW + 'px', height: SH + 'px', left: '64px', top: '772px', borderRadius: '14px' });
  const g2 = GLK.create(sc); const P2 = GLK.program(g2, TOY.FS);
  const SS = {
    cam: [0, 1.55, 17.2], tgt: [0, 1.2, 0], fov: 15.5,
    figs: SERIES.map((f, i) => Object.assign({ pos: [-3.6 + i * 1.8, 0, 0], yaw: .28 - i * .14, expr: [0, 2, 1, 0][i] }, f))
      .concat([Object.assign({ pos: [3.6, 0, 0], yaw: -.3, mat: 3, expr: 0 }, FROG, { cap: [1, .7, .25], body: [1, .78, .4], boot: [1, .78, .4] })]),
    bgTop: '#fff4ec', bgBot: '#ffe6dc', floor: '#ffe4d8', shelf: '#ffffff', floorOn: false, key: [-.5, .8, .8], exposure: 1.0, saturation: 1.08,
  };
  await TOY.render(g2, P2, null, SS, 4);
  window.__done = Q.get('ov') === '0'; if (window.__done) return;
  document.getElementById('ov').style.display = '';
  const labs = [['青蛙', 'FROG'], ['小熊', 'BEAR'], ['兔子', 'BUNNY'], ['黑猫', 'CAT'], ['电镀 · 隐藏款', '1 / 144']];
  let lh = '';
  labs.forEach(([a, b], i) => { const [x] = TOY.project(SS, SS.figs[i].pos, SW, SH); lh += `<div class="lab mono" style="left:${64 + x - 60}px"><b>${a}</b><span>${b}</span></div>`; });
  document.getElementById('labs').innerHTML = lh;
  // —— 标注 ——
  const pj = p => TOY.project(S, p, W, H);
  let svg = '', html = '';
  const call = (pt, bx, by, k, b, z) => {
    const [x, y] = pt; const ax = bx - 12;
    svg += `<circle cx="${x}" cy="${y}" r="4" fill="#2b2340"/><circle cx="${x}" cy="${y}" r="10" fill="none" stroke="#2b2340" stroke-width="1" opacity=".5"/><polyline points="${x},${y} ${ax},${by + 9} ${ax + 8},${by + 9}" fill="none" stroke="rgba(43,35,64,.55)" stroke-width="1"/>`;
    html += `<div class="call" style="left:${bx}px;top:${by}px"><span class="k">${k}</span><b>${b}</b>${z}</div>`;
  };
  call(pj([-1.0, 3.85, .55]), 1590, 150, '<i>A</i>wrap 0.4 · 暗部 = base²', '搪胶是缎面，不是亮面', '光往暗面“包”过去一点，暗面不发灰反而更饱和；反射只取大块的亮——像软胶，不像塑料。');
  call(pj([.12, 3.75, -.05]), 1590, 360, '<i>B</i>合模线 · 0.2 mm', '侧面那条细缝要留着', '搪胶是两半模具合起来的，帽子侧面一条浅浅的缝——真东西都有，画上去才可信。');
  call(pj([-.42, 3.05, 1.05]), 1590, 560, '<i>C</i>移印 · 不是贴图', '眼睛是“印”上去的', '平的、边缘干净、比皮肤亮一点点；表情只靠眼皮和一条嘴线——困、惊、笑，三个就够。');
  // 拆开那一下的闪光
  const star = (x, y, r, col) => `<path d="M${x} ${y - r} Q${x} ${y} ${x + r} ${y} Q${x} ${y} ${x} ${y + r} Q${x} ${y} ${x - r} ${y} Q${x} ${y} ${x} ${y - r}Z" fill="${col}"/>`;
  [[-1.6, 4.3, .6, 16, '#fff'], [.8, 4.6, .2, 11, '#ffd34d'], [-1.9, 2.6, .8, 9, '#ffd34d'], [.9, 2.9, .6, 13, '#fff']].forEach(([a, b, c2, r, col]) => { const [x, y] = pj([a, b, c2]); svg += star(x, y, r, col); });
  // 左边：拆开那一下的节奏
  const tx0 = 64, ty0 = 494, tw = 440, th = 120;
  const ks = [[0, 1], [.24, .76], [.4, 1.22], [.56, 1.1], [.78, 1.1], [1, 1]];
  const X = t => tx0 + t * tw, Y = v => ty0 + th - (v - .7) / .6 * th;
  let path = '';
  for (let i = 0; i <= 120; i++) { const t = i / 120; let k = 0; while (k < ks.length - 2 && t > ks[k + 1][0]) k++; const [t0, v0] = ks[k], [t1, v1] = ks[k + 1]; const u = (t - t0) / (t1 - t0), e = u * u * (3 - 2 * u); path += (i ? 'L' : 'M') + X(t).toFixed(1) + ' ' + Y(v0 + (v1 - v0) * e).toFixed(1); }
  svg += `<line x1="${tx0}" x2="${tx0 + tw}" y1="${Y(1)}" y2="${Y(1)}" stroke="rgba(43,35,64,.2)" stroke-dasharray="3 4"/><line x1="${tx0}" x2="${tx0 + tw}" y1="${ty0 + th + 14}" y2="${ty0 + th + 14}" stroke="rgba(43,35,64,.25)"/>`;
  svg += `<path d="${path}" fill="none" stroke="#2b2340" stroke-width="2.2"/>`;
  [['蹲', ks[1]], ['窜', ks[2]], ['停', ks[3]]].forEach(([n, [t, v]]) => {
    const x = X(t), y = Y(v);
    svg += `<line x1="${x}" x2="${x}" y1="${y}" y2="${ty0 + th + 14}" stroke="rgba(43,35,64,.35)" stroke-dasharray="2 3"/><circle cx="${x}" cy="${y}" r="4.5" fill="#ff6b5e" stroke="#fff" stroke-width="1.5"/>`;
    html += `<div class="ttag mono" style="left:${x - 10}px;top:${ty0 + th + 22}px"><b>${n}</b>${v}</div>`;
  });
  html += `<div class="ttag mono" style="left:${tx0}px;top:${ty0 - 38}px;font-size:11.5px"><b>节奏</b>撕开 0.6 s · 弹出 0.18 s · 停 0.25 s · 横向永远 1/√sy</div>`;
  document.getElementById('lines').innerHTML = svg; document.getElementById('calls').innerHTML = html;
  window.__done = true;
})().catch(e => { console.log('ERR', e.message.slice(0, 4000)); window.__done = true; });
</script>
</body>
</html>
