<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>潮玩 · Designer Toy · 第 0 帧</title>
<style>
@font-face { font-family: 'Fredoka'; src: url(../../public/fonts/Fredoka.ttf); font-weight: 300 700; font-stretch: 75% 125%; }
@font-face { font-family: 'GeistMono'; src: url(../../public/fonts/GeistMono.ttf); font-weight: 100 900; }
@font-face { font-family: 'Geist'; src: url(../../public/fonts/Geist.ttf); font-weight: 100 900; }
@font-face { font-family: 'KuaiLe'; src: url(../../public/fonts/ZCOOLKuaiLe.ttf); }
@font-face { font-family: 'NotoSC'; src: url(../../public/fonts/NotoSansSC-Black.otf); font-weight: 900; }
@font-face { font-family: 'NotoSC'; src: url(../../public/fonts/NotoSansSC-Bold.otf); font-weight: 700; }
@font-face { font-family: 'NotoSC'; src: url(../../public/fonts/NotoSansSC-Medium.otf); font-weight: 500; }
@font-face { font-family: 'NotoSC'; src: url(../../public/fonts/NotoSansSC-Regular.otf); font-weight: 400; }
* { margin: 0; padding: 0; box-sizing: border-box; }
:root { --ink: #2a1f3d; --dim: #7a6b8c; --acc: #ff5a5f; --line: rgba(42,31,61,.18); }
html, body { width: 1920px; height: 1080px; overflow: hidden; background: #ffd9e2; color: var(--ink); font-family: Geist, NotoSC, sans-serif; }
canvas { position: absolute; display: block; }
.mono { font-family: GeistMono, monospace; letter-spacing: .04em; }
.ov { position: absolute; inset: 0; pointer-events: none; }
.tl { position: absolute; left: 64px; top: 48px; font-size: 13px; color: rgba(42,31,61,.7); display: flex; gap: 26px; text-transform: uppercase; }
.tl b { color: var(--ink); font-weight: 600; }
.tr { position: absolute; right: 64px; top: 48px; font-size: 12px; color: rgba(42,31,61,.7); text-align: right; line-height: 1.8; }
.tr b { color: var(--ink); font-weight: 600; }
.title { position: absolute; left: 64px; top: 150px; width: 560px; }
.title .zh { font-family: KuaiLe; font-size: 168px; line-height: 1; color: var(--ink); letter-spacing: .02em; }
.title .en { font-family: Fredoka; font-weight: 600; font-stretch: 112%; font-size: 40px; letter-spacing: .06em; margin-top: 10px; color: var(--acc); }
.title p { font-family: NotoSC; font-size: 20px; line-height: 1.75; margin-top: 26px; color: #4a3d5c; }
.title p em { font-style: normal; color: var(--acc); font-weight: 700; }
svg.lines { position: absolute; inset: 0; }
.call { position: absolute; width: 292px; font-size: 13px; line-height: 1.6; color: #4a3d5c; padding: 11px 14px; background: rgba(255,255,255,.72); backdrop-filter: blur(10px); border-radius: 12px; box-shadow: 0 8px 30px rgba(120,60,90,.12); }
.call .k { display: block; font-family: GeistMono; font-size: 12px; color: var(--ink); margin-bottom: 4px; font-weight: 600; }
.call .k i { font-style: normal; color: #fff; background: var(--acc); border-radius: 6px; padding: 0 6px; margin-right: 8px; }
.call b { color: var(--ink); }
.ttag { position: absolute; font-size: 11px; color: var(--ink); white-space: nowrap; }
.ttag b { display: inline-block; background: var(--ink); color: #fff; border-radius: 5px; padding: 1px 6px; margin-right: 6px; font-weight: 500; }
.lineup { position: absolute; left: 64px; top: 718px; width: 620px; height: 40px; }
.lineup .cap { position: absolute; left: 0; top: -54px; font-family: NotoSC; font-size: 15px; font-weight: 700; color: var(--ink); }
.lineup .cap span { font-weight: 400; color: var(--dim); margin-left: 10px; font-size: 13px; }
.lab { position: absolute; top: 240px !important; font-size: 11px; text-align: center; width: 150px; line-height: 1.5; color: var(--ink); }
.lab b { display: block; font-family: NotoSC; font-size: 13px; font-weight: 700; }
.lab span { color: var(--dim); }
.lab.sec b { color: #b0841f; }
.frame i { position: absolute; width: 22px; height: 22px; border-color: rgba(42,31,61,.45); border-style: solid; }
.foot { position: absolute; right: 64px; bottom: 30px; font-size: 11px; color: rgba(42,31,61,.55); }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="shelf"></canvas>
<div class="ov" id="ov" style="display:none">
  <div class="tl mono"><span><b>NO. 027</b></span><span>潮玩 · Designer Toy</span><span>1999 香港搪胶 Gardener → 2000s 美国 Art Toy → 2016 盲盒 → 2025 全球潮玩热</span></div>
  <div class="tr mono"><b>MOGU 小菇 · 野餐系列</b><br>SOFT VINYL · 9.5 CM · 1/144 SECRET</div>
  <div class="frame"><i style="left:40px;top:40px;border-width:2px 0 0 2px"></i><i style="right:40px;top:40px;border-width:2px 2px 0 0"></i><i style="left:40px;bottom:40px;border-width:0 0 2px 2px"></i><i style="right:40px;bottom:40px;border-width:0 2px 2px 0"></i></div>
  <div class="title">
    <div class="zh">潮玩</div>
    <div class="en">DESIGNER TOY</div>
    <p>大头、小身子、哑光的软胶。<br>它最上头的不是长相，是<em>拆开那一下</em>：<br>先压扁、再弹出来、最后在空中定一拍。</p>
  </div>
  <svg class="lines" id="lines" width="1920" height="1080"></svg>
  <div id="calls"></div>
  <div class="lineup" id="lineup"><div class="cap">同一只小菇，四种材质<span>隐藏款通常就是换一种材质</span></div></div>
  <div class="foot mono">原创角色 · 画面全部由代码实时渲染（光线步进），没有一张贴图</div>
</div>
<script src="../_lib/glkit.js"></script>
<script src="toy.js"></script>
<script>
const Q = new URLSearchParams(location.search);
const DPR = devicePixelRatio * +(Q.get('scale') || 1);
const L = TOY.L;

function boxArt() {
  const c = document.createElement('canvas'); c.width = 2048; c.height = 1024;
  const x = c.getContext('2d');
  // 正面（左半）
  x.fillStyle = '#7cc6ff'; x.fillRect(0, 0, 1024, 1024);
  x.fillStyle = '#9ad4ff';
  for (let i = 0; i < 9; i++) for (let j = 0; j < 9; j++) { if ((i + j) % 2) continue; x.beginPath(); x.arc(i * 128 + 64, j * 128 + 64, 26, Math.PI, 0); x.fill(); x.fillRect(i * 128 + 54, j * 128 + 64, 20, 22); }
  x.fillStyle = '#fff6ea'; x.beginPath(); x.roundRect(120, 300, 784, 470, 60); x.fill();
  x.fillStyle = '#ff5a5f'; x.font = '700 210px Fredoka'; x.textAlign = 'center'; x.fillText('MOGU', 512, 560);
  x.fillStyle = '#2a1f3d'; x.font = '600 52px Fredoka'; x.fillText('PICNIC SERIES', 512, 660);
  x.font = '900 120px NotoSC'; x.fillStyle = '#2a1f3d'; x.fillText('小菇', 512, 230);
  x.fillStyle = '#ffd34d'; x.beginPath(); x.arc(860, 860, 92, 0, 7); x.fill();
  x.fillStyle = '#2a1f3d'; x.font = '700 130px Fredoka'; x.fillText('?', 860, 905);
  x.font = '500 40px GeistMono'; x.textAlign = 'left'; x.fillStyle = '#1d4f7a'; x.fillText('1 OF 12 + SECRET', 70, 960);
  // 侧面（右半）：系列一览
  x.fillStyle = '#ffe1ea'; x.fillRect(1024, 0, 1024, 1024);
  x.fillStyle = '#2a1f3d'; x.font = '700 64px Fredoka'; x.textAlign = 'center'; x.fillText('COLLECT THEM ALL', 1536, 130);
  for (let i = 0; i < 12; i++) {
    const cx = 1024 + 170 + (i % 4) * 230, cy = 290 + Math.floor(i / 4) * 230;
    x.fillStyle = i === 11 ? '#2a1f3d' : ['#ff5a5f', '#ffb347', '#7ccf9a', '#8fb8ff', '#c79bff', '#ff8fc7'][i % 6];
    x.beginPath(); x.ellipse(cx, cy - 20, 80, 52, 0, Math.PI, 0); x.fill();
    x.beginPath(); x.ellipse(cx, cy + 30, 48, 58, 0, 0, 7); x.fill();
    if (i === 11) { x.fillStyle = '#ffd34d'; x.font = '700 70px Fredoka'; x.fillText('?', cx, cy + 55); }
  }
  return c;
}

(async () => {
  await document.fonts.load('700 100px Fredoka'); await document.fonts.load('900 100px NotoSC', '小菇'); await document.fonts.load('100px KuaiLe', '潮玩'); await document.fonts.load('500 40px GeistMono');
  await document.fonts.ready;
  const cv = document.getElementById('gl');
  const W = 1920, H = 1080;
  cv.width = W * DPR; cv.height = H * DPR; cv.style.width = W + 'px'; cv.style.height = H + 'px';
  const gl = GLK.create(cv);
  const P = GLK.program(gl, TOY.FS);
  const cap = [1.0, 0.33, 0.3], body = [0.5, 0.84, 0.72];
  const J = k => Q.get(k) ? Q.get(k).split(',').map(Number) : null;
  const S = window.S = {
    cam: J('cam') || [3.4, 3.9, 11.6], tgt: J('tgt') || [-1.7, 2.45, 0], fov: +(Q.get('fov') || 31),
    figs: [
      { pos: [-1.05, 2.78, 0.45], yaw: 0.36, sy: 1.12, arm: 1, tilt: 0.2, cap, body, expr: 0 },
      { pos: [0.05, 1.2, 0.0], yaw: 0.0, sy: 0.74, arm: 0, tilt: 0, cap, body, ghost: true, expr: 1 },
      { pos: [-0.38, 2.05, 0.2], yaw: 0.16, sy: 1.26, arm: 0.55, tilt: 0.1, cap, body, ghost: true, expr: 1 },
    ],
    box: { pos: [0.35, 0, -0.1], yaw: +(Q.get('by') || 0.38), size: [0.98, 1.0, 0.82] },
    lid: { pos: [J('lp') ? J('lp')[0] : 1.6, J('lp') ? J('lp')[1] : 4.75, J('lp') ? J('lp')[2] : -3.2], rot: [0.85, 0.3, -0.5] },
    boxTex: boxArt(), boxCol: '#62b8ff', boxIn: '#fff1e2',
    bgTop: '#ffb8cc', bgBot: '#ffe0d2', floor: '#ffd3cf', key: [-0.6, 0.9, 0.62], ghostA: +(Q.get('ga') || 0.42),
    exposure: +(Q.get('ex') || 1.0), saturation: 1.12,
  };
  await TOY.render(gl, P, null, S, +(Q.get('tiles') || 8));
  window.__done = Q.get('ov') === '0'; if (window.__done) return;
  document.getElementById('ov').style.display = '';
  const pj = p => TOY.project(S, p, W, H);
  let svg = '', html = '';
  const call = (pt, box, k, z, side) => {
    const [x, y] = pt, [bx, by] = box;
    const ex = bx + (x < bx ? 0 : 292), ey = by + 22;
    svg += `<circle cx="${x}" cy="${y}" r="5" fill="#ff5a5f" stroke="#fff" stroke-width="2"/><polyline points="${x},${y} ${(x + ex) / 2},${ey} ${ex},${ey}" fill="none" stroke="rgba(42,31,61,.45)" stroke-width="1.2"/>`;
    html += `<div class="call" style="left:${bx}px;top:${by}px"><span class="k">${k}</span>${z}</div>`;
  };
  // 洋葱皮的帧号
  const tags = [[[0.05, 2.15, 0.0], '−8 帧', '压扁 sy 0.74'], [[-0.38, 4.3, 0.2], '−4 帧', '拉长 sy 1.26'], [[-1.05, 5.25, 0.45], '现在', '定一拍 sy 1.12']];
  tags.forEach(([p, a, b]) => { const [x, y] = pj(p); html += `<div class="ttag mono" style="left:${x + 70}px;top:${y - 8}px"><b>${a}</b>${b}</div>`; });
  call(pj([-0.05, 2.05, 0.5]), [640, 560], '<i>01</i>sx = sz = 1 / √sy', '<b>压扁、拉长，体积不变。</b>竖着拉 1.26 倍，横着就缩到 0.89——软胶的“肉感”全靠这一条。', 'r');
  call(pj([-1.3, 3.55, 0.75]), [1540, 410], '<i>02</i>wrap = 0.4 · 暗部 = base²', '<b>哑光搪胶：</b>光包过来一点，暗面不变灰、反而更饱和，像有一点透光。高光只给柔光箱的形状。', 'r');
  call(pj([1.25, 1.35, 0.55]), [1540, 640], '<i>03</i>盒子 = 第二张海报', '<b>正面认角色，侧面列全系列，</b>隐藏款只给一个“?”剪影——悬念是印在盒子上的。', 'r');
  // 拆开那一下的闪光
  const star = (x, y, r, c) => `<path d="M${x} ${y - r} Q${x} ${y} ${x + r} ${y} Q${x} ${y} ${x} ${y + r} Q${x} ${y} ${x - r} ${y} Q${x} ${y} ${x} ${y - r}Z" fill="${c}"/>`;
  [[0.9, 2.3, 0.6, 22, '#fff'], [-0.4, 2.25, 0.9, 14, '#ffd34d'], [1.35, 2.75, 0.2, 12, '#fff'], [-2.3, 4.2, 0.6, 18, '#fff'], [-2.0, 3.0, 0.9, 10, '#ffd34d'], [0.3, 5.35, 0.3, 13, '#fff']].forEach(([a, b, c, r, col]) => { const [x, y] = pj([a, b, c]); svg = star(x, y, r, col) + svg; });
  document.getElementById('lines').innerHTML = svg;
  document.getElementById('calls').innerHTML = html;

  // —— 四种材质的展示架 ——
  const sc = document.getElementById('shelf'); const SW = 620, SH = 250;
  sc.width = SW * DPR; sc.height = SH * DPR; Object.assign(sc.style, { width: SW + 'px', height: SH + 'px', left: '64px', top: '700px', borderRadius: '18px', boxShadow: '0 10px 40px rgba(120,60,90,.15)' });
  const g2 = GLK.create(sc); const P2 = GLK.program(g2, TOY.FS);
  const SS = {
    cam: [0, 1.5, 13.6], tgt: [0, 1.32, 0], fov: 15.5,
    figs: [
      { pos: [-3.3, 0, 0], yaw: 0.25, cap, body, expr: 0 },
      { pos: [-1.1, 0, 0], yaw: 0.1, mat: 1, cap: [0.82, 0.48, 0.62], body: [0.62, 0.55, 0.85], expr: 2 },
      { pos: [1.1, 0, 0], yaw: -0.1, mat: 2, cap: [1.0, 0.4, 0.62], body: [0.35, 0.78, 1.0], expr: 0 },
      { pos: [3.3, 0, 0], yaw: -0.25, mat: 3, cap: [1.0, 0.72, 0.3], body: [0.9, 0.92, 1.0], expr: 1 },
    ],
    bgTop: '#fff0ea', bgBot: '#ffd9d6', floor: '#e2c6d4', shelf: '#ffffff', floorOn: false, key: [-0.5, 0.8, 0.8], exposure: 1.0, saturation: 1.1,
  };
  await TOY.render(g2, P2, null, SS, 4);
  const labs = [['搪胶', 'SOFT VINYL', '哑光 · 包裹光'], ['植绒', 'FLOCKED', '没高光 · 边缘绒光'], ['果冻', 'CLEAR', '透出背景 · 边缘变浓'], ['电镀 · 隐藏款', 'CHROME 1/144', '整只都是倒影']];
  const lu = document.getElementById('lineup');
  labs.forEach(([a, b, c], i) => {
    const [x] = TOY.project(SS, SS.figs[i].pos, SW, SH);
    const d = document.createElement('div'); d.className = 'lab' + (i === 3 ? ' sec' : '');
    d.style.left = (x - 75) + 'px'; d.style.top = '-6px'; d.innerHTML = `<b>${a}</b><span class="mono">${b}</span>`;
    lu.appendChild(d);
  });
  window.__done = true;
})().catch(e => { console.log('ERR', e.message.slice(0, 3000)); window.__done = true; });
</script>
</body>
</html>
