<!doctype html>
<!-- 字符画 · 开头 10 秒小样（第二版）。1920×1080 · 60fps · 120 BPM。window.frame(f) 画第 f 帧，每帧是时间的纯函数（火焰模拟带缓存，乱序时从头重算）。
     ① 甜甜圈 → 炸开成字雨拼出网页 → ② 网页（点按钮、进度条）→ 每个字飞去手机 → ③ 手机播放器 → 心脏放大 → ④ 着火、烧进 ASCII → 风吹散 → ⑤ 片尾 -->
<meta charset="utf-8">
<style>
@font-face{font-family:JBM;src:url(../../../public/fonts/JetBrainsMono.ttf)}
@font-face{font-family:Anton;src:url(../../../public/fonts/Anton-Regular.ttf)}
@font-face{font-family:NotoSC;src:url(../../../public/fonts/NotoSansSC-Black.otf);font-weight:900}
@font-face{font-family:NotoSC;src:url(../../../public/fonts/NotoSansSC-Medium.otf);font-weight:500}
html,body{margin:0;background:#06060A;overflow:hidden}
canvas{display:block}
</style>
<canvas id="c" width="1920" height="1080"></canvas>
<script src="../ascii.js"></script>
<script src="timeline.js"></script>
<script>
const W = 1920, H = 1080, BG = '#06060A', FS = 18, CW = FS * 0.6, CH = FS;
const COLS = Math.ceil(W / CW), ROWS = Math.ceil(H / CH);
const g = document.getElementById('c').getContext('2d');
const LV = 48, pal = st => Array.from({length: LV + 1}, (_, k) => lerpHex(st, k / LV));
const PL = {hot: pal(HOT), cool: pal(COOL),
  fire: pal([[0, '#1A0505'], [0.25, '#7A1208'], [0.45, '#E8391B'], [0.65, '#FF8A1A'], [0.82, '#FFD23F'], [1, '#FFFBEA']]),
  pink: pal([[0, '#3A0A2A'], [0.35, '#B0105A'], [0.6, '#FF2D8A'], [0.85, '#FF9CC8'], [1, '#FFF2F8']])};
const pc = (p, L) => p[Math.max(0, Math.min(LV, Math.round(L * LV)))];
const GLY = '!<>-_\\/[]{}=+*^?#01$%&';
const hash = (i, j, k) => { let h = (i * 374761393 + j * 668265263 + k * 2147483647) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967296; };
const INK = '#FFF6DA', DIM = '#8E91B8', MUTE = '#3A3E5E', ORANGE = '#FF6A1A', GREEN = '#7CFFB2', YEL = '#FFD23F', PINK = '#FF2D8A';

// —— 字符屏：一张 COLS×ROWS 的字 + 颜色表 ——
class Screen {
  constructor() { this.g = new Array(COLS * ROWS).fill(' '); this.c = new Array(COLS * ROWS).fill(INK); this.L = new Float32Array(COLS * ROWS); }
  set(i, j, ch, c, L = 1) { if (i < 0 || j < 0 || i >= COLS || j >= ROWS) return; const k = j * COLS + i; this.g[k] = ch; this.c[k] = c; this.L[k] = L; }
  text(i, j, s, c) { [...s].forEach((ch, k) => this.set(i + k, j, ch, c)); }
  box(i0, j0, w, h, c, r = false) {
    const [a, b, d, e] = r ? ['╭', '╮', '╰', '╯'] : ['┌', '┐', '└', '┘'];
    for (let i = 1; i < w - 1; i++) { this.set(i0 + i, j0, '─', c); this.set(i0 + i, j0 + h - 1, '─', c); }
    for (let j = 1; j < h - 1; j++) { this.set(i0, j0 + j, '│', c); this.set(i0 + w - 1, j0 + j, '│', c); }
    this.set(i0, j0, a, c); this.set(i0 + w - 1, j0, b, c); this.set(i0, j0 + h - 1, d, c); this.set(i0 + w - 1, j0 + h - 1, e, c);
  }
  hline(i0, j, w, c, ch = '─') { for (let i = 0; i < w; i++) this.set(i0 + i, j, ch, c); }
  cells() { const out = []; for (let j = 0; j < ROWS; j++) for (let i = 0; i < COLS; i++) { const k = j * COLS + i; if (this.g[k] !== ' ') out.push({x: i * CW, y: j * CH, g: this.g[k], c: this.c[k], L: this.L[k]}); } return out; }
}
function drawCells(ctx, cells, glowL = 0.86) {
  ctx.textBaseline = 'top'; ctx.font = `700 ${FS}px JBM`;
  for (const q of cells) { ctx.shadowBlur = q.L > glowL ? 12 : 0; ctx.shadowColor = q.c; ctx.fillStyle = q.c; ctx.globalAlpha = q.a === undefined ? 1 : q.a; ctx.fillText(q.g, q.x, q.y); }
  ctx.shadowBlur = 0; ctx.globalAlpha = 1;
}

// —— ① 甜甜圈（donut.c 的算法：两个角转，亮度 = 法线·光）——
const DONUT = '.,-~:;=!*#$@';
function donut(S, f, cxp, cyp, scale, cs = FS, boost = 0) {
  const t = f / 60, A = 1.0 + t * 1.9, B = 0.3 + t * 1.1, cw = cs * 0.6;
  const cA = Math.cos(A), sA = Math.sin(A), cB = Math.cos(B), sB = Math.sin(B);
  const zb = new Map(), out = new Map();
  for (let th = 0; th < 6.283; th += 0.045) { const ct = Math.cos(th), st = Math.sin(th);
    for (let ph = 0; ph < 6.283; ph += 0.014) { const cp = Math.cos(ph), sp = Math.sin(ph);
      const h = ct + 2, D = 1 / (sp * h * sA + st * cA + 5), tt = sp * h * cA - st * sA;
      const x = cxp + scale * D * (cp * h * cB - tt * sB), y = cyp - scale * D * (cp * h * sB + tt * cB);
      const N = ((st * sA - sp * ct * cA) * cB - sp * ct * sA - st * cA - cp * ct * sB);
      const i = Math.floor(x / cw), j = Math.floor(y / cs), key = j * 4000 + i;
      if (D > (zb.get(key) || 0)) { zb.set(key, D); out.set(key, [i, j, N]); } } }
  const cells = [];
  for (const [, [i, j, N]] of out) { const L = clamp(N / 1.414 + boost); if (N <= 0 && boost <= 0) { cells.push({x: i * cw, y: j * cs, g: '.', c: pc(PL.hot, 0.08), L: 0.05}); continue; }
    cells.push({x: i * cw, y: j * cs, g: DONUT[Math.min(11, Math.max(0, Math.floor(L * 11.99)))], c: pc(PL.hot, 0.15 + L * 0.85), L}); }
  return cells;
}

// —— 方块（网页主图）：圆角立方体的距离场，光线步进 ——
function cube(S, f, i0, j0, w, h) {
  const t = f / 60, a = t * 1.3, b = t * 0.9;
  const rot = p => { let [x, y, z] = p; [x, z] = [x * Math.cos(a) - z * Math.sin(a), x * Math.sin(a) + z * Math.cos(a)]; [y, z] = [y * Math.cos(b) - z * Math.sin(b), y * Math.sin(b) + z * Math.cos(b)]; return [x, y, z]; };
  const sd = p => { const q = rot(p).map(v => Math.abs(v) - 0.72); return Math.hypot(Math.max(q[0], 0), Math.max(q[1], 0), Math.max(q[2], 0)) + Math.min(Math.max(q[0], q[1], q[2]), 0) - 0.12; };
  const light = norm([-0.5, 0.7, -0.6]);
  for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) {
    const u = ((i + 0.5) * CW - w * CW / 2) / (h * CH) * 1.7, v = -((j + 0.5) * CH - h * CH / 2) / (h * CH) * 1.7;
    const ro = [0, 0, -4], rd = norm([u * 0.5, v * 0.5, 1]); let d = 0, hit = false;
    for (let s = 0; s < 40; s++) { const p = add(ro, mul(rd, d)), k = sd(p); if (k < 0.004) { hit = true; break; } d += k; if (d > 8) break; }
    if (!hit) continue;
    const p = add(ro, mul(rd, d)), e = 0.003;
    const n = norm([sd(add(p, [e, 0, 0])) - sd(add(p, [-e, 0, 0])), sd(add(p, [0, e, 0])) - sd(add(p, [0, -e, 0])), sd(add(p, [0, 0, e])) - sd(add(p, [0, 0, -e]))]);
    const L = clamp(0.08 + 0.85 * Math.max(0, dot(n, light)) + 0.25 * Math.pow(Math.max(0, dot(n, norm(sub(light, rd)))), 30));
    S.set(i0 + i, j0 + j, rampChar(L), pc(PL.cool, 0.2 + 0.8 * L), L);
  }
}

// —— ② 网页 ——
let HEAD;    // 标题大字的覆盖率（Anton 拼成块字）
function web(f) {
  const S = new Screen(), x0 = 6, y0 = 2, w = COLS - 12, h = 48;
  S.box(x0, y0, w, h, MUTE); S.hline(x0 + 1, y0 + 2, w - 2, MUTE); S.set(x0, y0 + 2, '├', MUTE); S.set(x0 + w - 1, y0 + 2, '┤', MUTE);
  S.text(x0 + 2, y0 + 1, '● ● ●', '#5A5D80'); S.text(x0 + 12, y0 + 1, '│ https://orbit.dev', DIM);
  S.text(x0 + 4, y0 + 4, '[*] orbit_', INK); S.set(x0 + 13, y0 + 4, '_', ORANGE);
  S.text(x0 + 96, y0 + 4, 'docs    changelog    pricing', DIM);
  // 按钮：f ≥ click 时反色、文字变化
  const pressed = f >= TL.click, done = f >= TL.fill[1];
  const btn = done ? '[ installed + ]' : pressed ? '[ installing… ]' : '[  Install  ]';
  S.text(x0 + w - 4 - btn.length, y0 + 4, btn, pressed ? (done ? GREEN : YEL) : INK);
  // 标题块字
  for (const [i, j, m] of HEAD) S.set(i, j, m > 0.72 ? '█' : m > 0.5 ? '▓' : m > 0.3 ? '▒' : '░', j < y0 + 15 ? INK : ORANGE, m);
  S.text(x0 + 4, y0 + 29, 'An agent that lives in your terminal.', DIM);
  S.text(x0 + 4, y0 + 30, 'Every pixel on this page is a character.', DIM);
  S.box(x0 + 3, y0 + 32, 50, 3, MUTE); S.text(x0 + 5, y0 + 33, '$ curl -fsSL orbit.dev/i | sh', INK); if ((f >> 4) % 2) S.set(x0 + 36, y0 + 33, '▌', YEL);
  // 主图：转动的方块
  cube(S, f, x0 + 96, y0 + 5, 64, 30);
  // 三张卡
  const cy = y0 + 37, cw = 48;
  for (let k = 0; k < 3; k++) S.box(x0 + 3 + k * (cw + 3), cy, cw, 9, MUTE);
  S.text(x0 + 5, cy + 1, 'PLAN', YEL);
  const steps = [['read  src/auth.ts', 0], ['patch login()', 1], ['run   tests', 2]];
  steps.forEach(([s, k]) => { const ok = f > TL.fill[0] + k * 8; S.text(x0 + 5, cy + 3 + k * 2, `${ok ? '[+]' : '[ ]'} ${s}`, ok ? GREEN : DIM); });
  S.text(x0 + 3 + cw + 5, cy + 1, 'INSTALL', YEL);
  const p = clamp((f - TL.fill[0]) / (TL.fill[1] - TL.fill[0])), n = Math.round(p * 36);
  S.text(x0 + 3 + cw + 5, cy + 3, '█'.repeat(n), ORANGE); S.text(x0 + 3 + cw + 5 + n, cy + 3, '░'.repeat(36 - n), MUTE);
  S.text(x0 + 3 + cw + 5, cy + 5, `${String(Math.round(p * 100)).padStart(3)}%  ${'|/-\\'[(f >> 2) % 4]}  12,400 tok/s`, DIM);
  S.text(x0 + 3 + 2 * (cw + 3) + 2, cy + 1, 'STARS', YEL);
  S.text(x0 + 3 + 2 * (cw + 3) + 2, cy + 3, `* ${(48.2 + p * 0.3).toFixed(1)}k`, INK);
  S.text(x0 + 3 + 2 * (cw + 3) + 2, cy + 5, '▁▂▃▅▆▅▇█▇▆█', GREEN);
  return S;
}

// —— ③ 手机：心形封面、波形、歌词 ——
function sdHeart(x, y) {   // iq 的心形距离场，y 朝上，尖在 (0,0)
  x = Math.abs(x);
  if (y + x > 1) return Math.hypot(x - 0.25, y - 0.75) - Math.SQRT2 / 4;
  const a = Math.hypot(x, y - 1), m = 0.5 * Math.max(x + y, 0), b = Math.hypot(x - m, y - m);
  return Math.min(a, b) * Math.sign(x - y);
}
function heart(S, f, cxp, cyp, size, rect) {     // 鼓起来的心：高度 = √(距离)，法线 → 光
  const beat = f % 30, pulse = 1 + 0.09 * Math.exp(-beat / 5) + (beat > 8 ? 0.05 * Math.exp(-(beat - 8) / 5) : 0);
  const sz = size * pulse, li = norm([-0.5, 0.6, 0.62]);
  const hgt = (x, y) => Math.sqrt(Math.max(0, -sdHeart(x, y)) * 1.6);
  const [i0, j0, i1, j1] = rect || [0, 0, COLS, ROWS];
  for (let j = j0; j < j1; j++) for (let i = i0; i < i1; i++) {
    const x = ((i + 0.5) * CW - cxp) / sz, y = -((j + 0.5) * CH - cyp) / sz + 0.55;
    if (sdHeart(x, y) > 0) continue;
    const e = 0.01, h0 = hgt(x, y), nx = (hgt(x + e, y) - hgt(x - e, y)) / (2 * e), ny = (hgt(x, y + e) - hgt(x, y - e)) / (2 * e);
    const n = norm([-nx, -ny, 1]), L = clamp(0.12 + 0.75 * Math.max(0, dot(n, li)) + 0.4 * Math.pow(Math.max(0, n[2] * 0.9 + dot(n, li) * 0.1), 40) + h0 * 0.1);
    S.set(i, j, rampChar(L), pc(PL.pink, 0.15 + 0.85 * L), L);
  }
}
const PH = {i: 104, j: 3, w: 50, h: 54};
function phone(f, artOnly = false) {
  const S = new Screen(), {i: x0, j: y0, w, h} = PH;
  const hc = [(x0 + w / 2) * CW, (y0 + 15) * CH + 20];
  if (!artOnly) {
    S.box(x0, y0, w, h, INK, true); S.box(x0 + 2, y0 + 1, w - 4, h - 2, MUTE, true);
    S.text(x0 + 5, y0 + 2, '9:41', INK); S.text(x0 + w - 15, y0 + 2, '▂▄▆█ 100%', INK);
    S.text(x0 + 5, y0 + 4, '<  LIBRARY', DIM); S.text(x0 + w - 18, y0 + 4, 'NOW PLAYING', DIM);
    S.box(x0 + 5, y0 + 6, w - 10, 20, MUTE);
    S.text(x0 + 5, y0 + 27, 'HEARTBEAT.TXT', INK); S.text(x0 + 5, y0 + 28, 'Halo Kid - Rings, Vol.2', DIM);
    const bars = '▁▂▃▄▅▆▇█';
    for (let k = 0; k < w - 10; k++) {   // 波形：跟着鼓跳
      const beat = Math.exp(-(f % 30) / 6), v = 0.25 + 0.45 * Math.abs(Math.sin(k * 0.7 + f * 0.11)) * (0.6 + 0.4 * Math.sin(k * 0.23)) + beat * 0.35 * Math.exp(-Math.abs(k - 20) / 10);
      S.set(x0 + 5 + k, y0 + 31, bars[Math.min(7, Math.floor(v * 7.99))], k < (f - TL.phone[0]) * 0.5 + 12 ? PINK : MUTE);
    }
    const pos = Math.min(w - 12, 14 + Math.floor((f - TL.phone[0]) / 8));
    S.text(x0 + 5, y0 + 33, '━'.repeat(pos), PINK); S.set(x0 + 5 + pos, y0 + 33, '●', INK); S.text(x0 + 6 + pos, y0 + 33, '─'.repeat(w - 11 - pos), MUTE);
    S.text(x0 + 5, y0 + 34, '1:52', DIM); S.text(x0 + w - 10, y0 + 34, '-1:31', DIM);
    S.text(x0 + 10, y0 + 37, '|<<', INK); S.text(x0 + w / 2 - 3, y0 + 37, '[ > ]', PINK); S.text(x0 + w - 13, y0 + 37, '>>|', INK);
    S.hline(x0 + 4, y0 + 40, w - 8, MUTE, '·');
    const lyr = [['i keep my orbit wide', TL.phone[0] + 6], ['so you won\'t see me fall', TL.phone[0] + 30], ['lights going out one by one', TL.phone[0] + 56]];
    lyr.forEach(([s, at], k) => { [...s].forEach((ch, q) => { const lock = at + q * 1.2 + 6; if (f < at + q * 1.2) return;
      S.set(x0 + 5 + q, y0 + 42 + k * 2, f < lock ? GLY[Math.floor(hash(q, k, f) * GLY.length)] : ch, f < lock ? GREEN : k === 1 ? INK : DIM); }); });
    S.text(x0 + 5, y0 + h - 4, '[home]  [playing]  [search]  [me]', DIM); S.text(x0 + 13, y0 + h - 4, '[playing]', PINK);
  }
  return {S, hc};
}

// —— ④ 火（DOOM 火焰算法：每格往上传，减一点热，左右飘一格）——
const FIRE = {f: -1, heat: null};
let HM = null;       // 放大后心脏占的格子：前 30 帧它自己就是火源
function fireAt(f) {
  if (FIRE.f > f || !FIRE.heat) { FIRE.f = TL.fire[0] - 1; FIRE.heat = new Float32Array(COLS * ROWS); }
  const hgt = FIRE.heat;
  while (FIRE.f < f) {
    const fr = ++FIRE.f;
    for (let s = 0; s < 2; s++) {
      // 火源：底边（按噪声起伏，烧出火舌）、正在烧的心脏、片名的字母
      for (let i = 0; i < COLS; i++) { const n = 0.5 + 0.5 * Math.sin(i * 0.09 + fr * 0.13) * Math.sin(i * 0.031 - fr * 0.05);
        hgt[(ROWS - 1) * COLS + i] = fr < TL.wind[0] ? 36 * clamp(0.35 + 0.75 * n) * clamp((fr - TL.fire[0] + 4) / 14) * (fr >= TL.title ? 0.6 : 1) : 0; }
      if (fr < TL.fire[0] + 34) { const k = 1 - (fr - TL.fire[0]) / 34; for (const c of HM) hgt[c] = Math.max(hgt[c], 36 * k * (0.7 + 0.3 * hash(c, 1, fr))); }
      if (fr >= TL.title && fr < TL.wind[0]) for (let c = 0; c < hgt.length; c++) if (TITLE[c] > 0.45) hgt[c] = Math.max(hgt[c], 26 + 10 * hash(c, 2, fr));
      for (let j = 1; j < ROWS; j++) for (let i = 0; i < COLS; i++) {
        const r = hash(i, j, fr * 2 + s), dec = r < 0.3 ? 0 : r < 0.85 ? 1 : 2, dst = Math.min(COLS - 1, Math.max(0, i - Math.floor(hash(j, i, fr * 2 + s) * 3) + 1));
        hgt[(j - 1) * COLS + dst] = Math.max(0, hgt[j * COLS + i] - dec);
      }
    }
  }
  return hgt;
}
let TITLE;   // “ASCII”的覆盖率
function fire(f) {
  const S = new Screen(), hgt = fireAt(f);
  for (let j = 0; j < ROWS; j++) for (let i = 0; i < COLS; i++) {
    const k = j * COLS + i, v = clamp(hgt[k] / 36), tIn = clamp((f - TL.title) / 12);
    if (TITLE[k] > 0.45 && tIn > 0) { const L = lerp(v, 0.78 + 0.22 * v, tIn); S.set(i, j, rampChar(L), pc(PL.fire, lerp(L, 0.8 + 0.2 * hash(i, j, f >> 2), tIn)), 0.95); continue; }
    const L = v * (1 - 0.4 * tIn); if (L < 0.07) continue;      // 字母外：火压暗、压红，字母才读得出来
    S.set(i, j, rampChar(L), pc(PL.fire, L * (1 - 0.3 * tIn)), L * 0.9);
  }
  return S;
}

// —— 文字层 ——
function rise(ctx, text, x, y, font, color, f, at, dur = 16) {
  const p = ease.out3(clamp((f - at) / dur)); if (p <= 0) return;
  ctx.save(); ctx.font = font; ctx.textBaseline = 'alphabetic';
  const m = ctx.measureText(text), h = parseFloat(font.match(/(\d+)px/)[1]);
  ctx.beginPath(); ctx.rect(x - 4, y - h * 1.05, m.width + 12, h * 1.32); ctx.clip();
  ctx.fillStyle = color; ctx.fillText(text, x, y + (1 - p) * h * 1.25); ctx.restore();
}
function decode(ctx, text, x, y, font, color, f, at, per = 2, spin = 6, pool = GLY) {
  ctx.save(); ctx.font = font; ctx.textBaseline = 'alphabetic'; let xx = x;
  [...text].forEach((c, k) => { const st = at + k * per, lock = st + spin; let s = c;
    if (f < st) s = ''; else if (f < lock && c !== ' ') s = pool[Math.floor(hash(k, 3, f) * pool.length)];
    if (s) { ctx.fillStyle = f < lock ? GREEN : color; ctx.fillText(s, xx, y); } xx += ctx.measureText(c).width; });
  ctx.restore();
}
function plate(ctx, f, at, out, tag, line, x = 64, y = 960, sub) {   // 规则条：黑底，大字
  if (f < at || f >= out + 10) return;
  const q = f >= out ? ease.in3((f - out) / 10) : 0, p = ease.out3(clamp((f - at) / 12));
  ctx.save(); ctx.globalAlpha = 1 - q; ctx.font = '900 54px NotoSC'; const wl = ctx.measureText(line).width;
  ctx.fillStyle = 'rgba(6,6,10,0.88)'; ctx.fillRect(x - 20, y - 112, (wl + 48) * p, sub ? 168 : 136);
  ctx.fillStyle = YEL; ctx.fillRect(x - 20, y - 112, 6, (sub ? 168 : 136) * p);
  rise(ctx, tag, x, y - 72, '700 24px JBM', YEL, f, at + 2, 10);
  rise(ctx, line, x, y - 6, '900 54px NotoSC', INK, f, at + 5, 14);
  if (sub) decode(ctx, sub, x, y + 40, '700 26px JBM', ORANGE, f, at + 10, 0.6, 5);
  ctx.restore();
}

// —— 接力：字变成粒子飞 ——
function sortCells(cs) { return cs.sort((a, b) => a.y - b.y || a.x - b.x); }
let RAIN, MORPH;
function setupRain() {     // 甜甜圈的字 → 网页的字
  const src = sortCells(donut(null, TL.rain[0], W * 0.5, H * 0.5, 560)), dst = sortCells(web(TL.rain[1]).cells()), rnd = mulberry(4);
  const cx = W * 0.5, cy = H * 0.5;
  RAIN = dst.map((d, k) => {
    const fromDonut = rnd() < 0.55 && src.length, s = fromDonut ? src[Math.floor(rnd() * src.length)] : {x: d.x + (rnd() - 0.5) * 300, y: -40 - rnd() * 500, g: GLY[Math.floor(rnd() * GLY.length)], c: MUTE};
    const dir = Math.atan2(s.y - cy, s.x - cx), burst = 160 + rnd() * 340;
