<script>
// 铅笔原画 v3 · 一只面粉袋，一页跳到下一页：透光台 → 纸上的原野（横着跑）→ 拖影帧 → 间距表 = 缓动曲线 → 一墙 24 张 → 回到透光台签名。
// 144 BPM，一拍 25 帧，一小节 100 帧，共 1000 帧（16.7 秒）。window.frame(f) 画第 f 帧（帧号的纯函数）。
// 袋子一秒 12 张（每 5 帧换一张，每张重画 → 线在抖）；背景、镜头、翻页一拍一（每帧都动）。每一次落地都踩在拍子上。
// 换场景 = 翻页：这一页从下往上卷起来（圆柱卷曲，背面是纸的反面），下面那一页露出来。
const Qs = new URLSearchParams(location.search), W = 1920, H = 1080, END = 1000, BEAT = 25;
const { clamp, lerp, sm, smr, keys, quint, easeOut, rise, rng, spring } = FK, { GRAPH, BLUE, RED, line, catmull, roughEllipse, drawSack, write, hatchText } = PEN;
const cv = document.getElementById('c'), g = cv.getContext('2d');
const mkC = () => { const c = HD.canvas(W, H); return [c, c.getContext('2d')]; };
const [PG, pg] = mkC(), [PG2, pg2] = mkC(), [GL, gl] = mkC();
const q5 = f => Math.floor(f / 5) * 5;

// ───── 时间轴
const FLIP = { a: [92, 132], b: [300, 338], c: [432, 468], d: [672, 708] };   // 翻页（中点之前是上一页）
const ZOOM = [800, 846];                                                   // 墙上第 24 张推满屏 → 回到透光台
const SC = f => f < FLIP.a[1] ? 'desk1' : f < FLIP.b[1] ? 'run' : f < FLIP.c[1] ? 'smear' : f < FLIP.d[1] ? 'chart' : f < ZOOM[1] ? 'wall' : 'desk2';
const NEXT = { desk1: 'run', run: 'smear', smear: 'chart', chart: 'wall' };
const CAPS = [
  [150, '01 · 镜头 1 拍 1，人物 1 拍 2', '背景每秒 60 格往后跑，袋子每秒只有 12 张——两种速度叠在一起', 296],
  [348, '02 · 拖影帧 smear', '快到一张里画好几个，眼睛会把它读成速度', 430],
  [478, '03 · 间距表 = 缓动曲线', '格子挤 = 慢，格子稀 = 快；这串数直接抄进 CSS', 668],
  [716, '04 · 一秒 12 张，每张都重画', '所以线一直在轻轻地抖：line boil', 836],
];

// ───── 面粉袋的一跳：蹲（start→take）→ 空中抛物线（take→land）→ 落地压扁再弹回。耳朵晚 2 张（看的是 10 帧以前的速度）
const W0 = 210, H0 = 232;
function jumpPose(J, f) {
  const air = J.land - J.take, dir = Math.sign(J.X1 - J.X0) || 0, G = J.G;

}
const poseIn = (L, f) => { let J = L[0]; for (const j of L) if (f >= j.start) J = j; return jumpPose(J, f); };
// 各页的跳（纸面坐标，1920 × 1080）
const J1 = [{ start: -45, take: -25, land: 25, X0: 1000, X1: 1420, H: 300, G: 800, s: 1.35 }, { start: 32, take: 50, land: 160, X0: 1420, X1: 1800, H: 500, G: 800, G1: -400, s: 1.35 }];
const RUN = (() => { const L = [{ start: 90, take: 95, land: 125, X0: 760, X1: 760, H: 420, G: -200, G1: 860, s: 1.45 }]; for (let k = 0; k < 6; k++) { const l = 125 + k * 25; L.push({ start: l + 1, take: l + 6, land: l + 25, X0: 760, X1: 760, H: 150 + (k % 2) * 50, G: 860, s: 1.45 }); } L.push({ start: 276, take: 282, land: 350, X0: 760, X1: 980, H: 800, G: 860, G1: 200, s: 1.45 }); return L; })();
const JW = { start: 0, take: 10, land: 115, X0: 330, X1: 1600, H: 420, G: 960, s: 2.3 };          // 墙上那 24 张：一整跳
const J6 = [{ start: 846, take: 852, land: 900, X0: 1600, X1: 1060, H: 320, G: 960, s: 1.6, s0: 2.3 }];
const BEZ = (x1, y1, x2, y2) => xx => { const B = (t, a, b) => 3 * a * t * (1 - t) ** 2 + 3 * b * t * t * (1 - t) + t ** 3; let lo = 0, hi = 1; for (let i = 0; i < 30; i++) { const m = (lo + hi) / 2; B(m, x1, x2) < xx ? lo = m : hi = m; } return B((lo + hi) / 2, y1, y2); };
const F_IO = BEZ(.42, 0, .58, 1), F_OV = BEZ(.34, 1.56, .64, 1);
const sackDraw = (c, p, k, o = {}) => drawSack(c, p, { construct: o.construct ?? true, shade: o.shade ?? true, seed: 7 + k * 13, w: o.w || 4.4, passes: o.passes || 3, col: o.col, a: o.a, detail: o.detail });
const ghost = (c, p, k, a = .3) => drawSack(c, p, { col: [125, 120, 112], a, w: 1.8, passes: 1, detail: false, seed: 900 + k });

// ───── 纸（满屏的动画纸）、桌面、透光台、软木墙
let PAPER, BACK, DESK, CORK, TOOTH, WALLP = [];
function buildStatic() {

  [PAPER] = mkC(); { const c = PAPER.getContext('2d'), im = c.createImageData(W, H), d = im.data;
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) { const k = (y * W + x) * 4, f = HD.fbm(n, x * .004, y * .004, 3) * .03 + n2(x * .6, y * .15) * .012, e = Math.min(x, y, W - x, H - y), v = .99 + f - (1 - clamp(e / 160)) * .04;
      d[k] = 252 * v; d[k + 1] = 246 * v; d[k + 2] = 232 * v; d[k + 3] = 255; }

    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) { const k = (y * W + x) * 4, t = n(x * .35, y * .35) * .5 + n2(x * .08, y * .08) * .3, v = 1 - Math.hypot(x - 960, y - 520) / 1700;
      d[k] = (150 + t * 40) * v; d[k + 1] = (108 + t * 30) * v; d[k + 2] = (70 + t * 22) * v; d[k + 3] = 255; }
    c.putImageData(im, 0, 0); }
  const T = PEN.tooth(256, 256, 5); TOOTH = HD.canvas(256, 256); const tg = TOOTH.getContext('2d'), ti = tg.createImageData(256, 256);
  for (let i = 0; i < T.length; i++) ti.data[i * 4 + 3] = 255 * clamp(.62 + 1.0 * (T[i] - .45)); tg.putImageData(ti, 0, 0);
  // 墙上 24 张：每张一个姿势（两套线，轮着用 → 墙上的画也在抖）
  for (let v = 0; v < 2; v++) { const L = []; for (let i = 0; i < 24; i++) { const [c, x] = mkC(); x.drawImage(PAPER, 0, 0); x.lineCap = x.lineJoin = 'round'; const p = jumpPose(JW, i * 5);
      line(x, [[60, 962], [1860, 958]], { w: 6, col: BLUE, a: .6, seed: 2, taper: .05 }); drawSack(x, p, { construct: true, shade: true, seed: 7 + i * 13 + v * 500, w: 9, passes: 2 });
      write(x, `#${String(i + 1).padStart(2, '0')}`, 1620, 170, { size: 110, a: .75, col: i === 0 || i === 23 || i === 11 ? RED : GRAPH }); const s = HD.canvas(480, 270); s.getContext('2d').drawImage(c, 0, 0, 480, 270); L.push(s); } WALLP.push(L); }
}

// ───── 各页的内容（画在 c 上，纸面坐标）。BG 一拍一（固定种子，不抖），袋子一拍二（种子随张数变 → 抖）
function pageFrame(c, f, cut) {
  write(c, `SC 12 · CUT ${cut}`, 70, 110, { size: 34, a: .62 });
  write(c, `#${String(Math.floor(f / 5) + 1).padStart(3, '0')}`, 1840, 112, { size: 40, a: .7, align: 'right' });
}
function pageRun(c, f) {
  const t = f - 100, sp = 15, X = t * sp;                                      // 镜头往右跑：背景往左
  const wrap = (x0, period, par) => ((x0 - X * par) % period + period) % period - 300;
  line(c, [[0, 860], [W, 860]], { w: 2, col: BLUE, a: .45, seed: 5, taper: .02 });
  // 远山（蓝铅笔，慢）
  for (let k = -1; k < 4; k++) { const ox = wrap(k * 900, 3600, .22) - 600; const P = []; for (let i = 0; i <= 12; i++) { const u = i / 12; P.push([ox + u * 1100, 860 - Math.sin(u * Math.PI) * (210 + (k & 1) * 90) - Math.sin(u * 9 + k) * 18]); } line(c, catmull(P, false, 6), { w: 2.2, col: BLUE, a: .55, seed: 100 + k, taper: .1 }); }
  // 云（几圈松的线）
  for (let k = 0; k < 3; k++) { const ox = wrap(400 + k * 800, 2400, .12); roughEllipse(c, ox, 240 + k * 50, 150, 44, 0, { col: BLUE, a: .35, w: 1.8, seed: 200 + k, loops: 2 }); roughEllipse(c, ox + 90, 210 + k * 50, 90, 40, 0, { col: BLUE, a: .3, w: 1.6, seed: 210 + k, loops: 1 }); }
  // 电线杆 + 电线（石墨，一拍一）
  const poles = []; for (let k = 0; k < 6; k++) poles.push(wrap(k * 520, 3120, 1));
  poles.sort((a, b) => a - b);
  for (const px of poles) { line(c, [[px, 860], [px + 6, 330]], { w: 4, a: .85, seed: 300, taper: .05 }); line(c, [[px - 70, 370], [px + 76, 368]], { w: 3, a: .8, seed: 301, taper: .05 }); line(c, [[px - 50, 410], [px + 56, 409]], { w: 2.4, a: .7, seed: 302, taper: .05 }); }
  for (let i = 0; i < poles.length - 1; i++) { const a = poles[i], b = poles[i + 1]; if (b - a > 700) continue; for (const [dy, s] of [[370, 0], [410, 1]]) line(c, catmull([[a + 70, dy], [(a + b) / 2, dy + 46], [b - 70, dy]], false, 8), { w: 1.5, a: .6, seed: 310 + s, taper: .05 }); }
  // 地上的草（快，前景）
  for (let k = 0; k < 26; k++) { const gx = wrap(k * 97, 2522, 1.25); line(c, [[gx, 862], [gx + 8, 836]], { w: 2, a: .6, seed: 400 + k }); line(c, [[gx + 10, 862], [gx + 24, 842]], { w: 1.6, a: .5, seed: 430 + k }); }
  // 前景的篱笆桩（更快，偶尔扫过）
  for (let k = 0; k < 2; k++) { const fx = wrap(k * 1700 + 300, 3400, 2.1); line(c, [[fx, H + 20], [fx + 10, 760]], { w: 16, a: .7, seed: 500 + k, taper: .02 }); line(c, [[fx - 40, 820], [fx + 60, 812]], { w: 9, a: .6, seed: 510 + k, taper: .05 }); }
  const fq = q5(f), p = poseIn(RUN, fq), k = fq / 5;
  // 速度线 + 落地的土
  if (f > 128 && f < 290) for (let i = 0; i < 6; i++) { const y = p.y - 60 + i * 34, x0 = p.x - 150 - (i % 3) * 40, L = 160 + (i * 37) % 90; line(c, [[x0 - L, y], [x0, y]], { w: 1.8, a: .45, seed: 600 + i + k * 7 }); }
  for (const J of RUN) { const u = (f - J.land) / 20; if (u < 0 || u > 1 || J.G1 === 200) continue; for (let s of [-1, 1]) roughEllipse(c, J.X1 + s * (110 + u * 60), 856 - u * 10, 26 * (1 - u * .5), 14, 0, { col: GRAPH, a: .5 * (1 - u), w: 1.6, seed: 700 + J.land + s, loops: 1 }); }

}
function pageSmear(c, f) {
  const t0 = 312, tl = 425, fq = f, k = q5(f) / 5;                          // 冲着镜头掉下来那一下太快：改一拍一（线还是每 5 帧重画一次）
  // 放射的速度线（拍点之前越来越密）
  const dens = smr(t0, tl, f) * (1 - smr(tl + 4, tl + 30, f));
  for (let i = 0; i < 60; i++) { const a = i / 60 * Math.PI * 2 + (i % 3) * .02, r0 = 260 + ((i * 53 + (f - 300) * (10 + (i % 4) * 3)) % 640), r1 = r0 + 260 + (i * 31) % 420; if ((i * 7) % 10 > dens * 10) continue; line(c, [[960 + Math.cos(a) * r0, 600 + Math.sin(a) * r0], [960 + Math.cos(a) * r1, 600 + Math.sin(a) * r1]], { w: 2.2, a: .5 * clamp((r0 - 260) / 120) * clamp((900 - r0) / 200), seed: 800 + i }); } // 速度线一拍一：每帧往外流
  if (fq < tl) { // 冲着镜头掉下来：越来越大；身后拖着几个自己（拖影帧）
    const u = clamp((fq - t0) / (tl - t0)), sc = lerp(.55, 2.3, u ** 2.2), y = lerp(80, 640, u ** 1.6);

}
// 间距表：上面一排是袋子的 9 张（按缓动排开）；刻度掉下来变成曲线上的点；曲线、手柄、代码；手柄一拉 → 冲过头
const GX = 420, GY = 900, GW = 1080, GH = 420, NT = 9;
const TC = { slide: [478, 540], drop: [544, 572], curve: [572, 598], handles: [598, 608], code: [604, 628], drag: [622, 646], ride: [648, 668] };
const ovAt = f => quint(clamp((f - TC.drag[0]) / (TC.drag[1] - TC.drag[0])));
function pageChart(c, f) {
  // 蓝色方格纸
  for (let x = 0; x <= W; x += 60) line(c, [[x, 150], [x, 1000]], { w: x % 300 ? .8 : 1.3, col: BLUE, a: x % 300 ? .16 : .28, seed: 1000 + x, taper: .02, wob: .2 });
  for (let y = 180; y <= 1000; y += 60) line(c, [[40, y], [W - 40, y]], { w: y % 300 ? .8 : 1.3, col: BLUE, a: y % 300 ? .16 : .28, seed: 2000 + y, taper: .02, wob: .2 });

  const ts = TC.slide, fq = q5(f), k = fq / 5;
