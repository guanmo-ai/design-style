<script>

// 面粉袋一秒 12 张（每 5 帧换一张，每张重画 → 线在抖）；镜头、铅笔、刻度、曲线一拍一（每帧都动）。每一次落地都踩在拍子上。
const Q = new URLSearchParams(location.search), W = 1920, H = 1080, END = 900, DS = 2, BEAT = 25;
const { clamp, lerp, sm, smr, keys, quint, easeOut, rise, rng } = FK, { GRAPH, BLUE, RED, line, catmull, roughEllipse, drawSack, write, chart, hatchText } = PEN;
const cv = document.getElementById('c'), g = cv.getContext('2d');
const PL = HD.canvas(W, H), pl = PL.getContext('2d');
const PX = 905, PY = 530, PR = -.05, PW = 1250, PH = 815, GROUND = 300;
const W0 = 190, H0 = 210;

// ── 动作表：每一跳 = 蹲（start→take）→ 空中（take→land，抛物线）→ 落地压扁再弹回。帧号全部踩拍：land 在拍子上
const JUMPS = [
  { start: -45, take: -25, land: 25, X0: -420, X1: 380, H: 300 },         // 封面那一跳（第 0 帧在最高点）
  { start: 32, take: 50, land: 100, X0: 380, X1: -420, H: 320 },
  { start: 108, take: 116, land: 125, X0: -420, X1: -420, H: 55 },
  { start: 132, take: 141, land: 150, X0: -420, X1: -420, H: 70 },
  { start: 168, take: 200, land: 250, X0: -420, X1: 380, H: 300, strobe: true }, // 慢不下来的那一跳：留下洋葱皮
  { start: 708, take: 713, land: 725, X0: 380, X1: 380, H: 90 },
  { start: 733, take: 738, land: 750, X0: 380, X1: 380, H: 120 },
  { start: 758, take: 763, land: 775, X0: 380, X1: 380, H: 150 },
  { start: 792, take: 812, land: 850, X0: 380, X1: -40, H: 340 },
];
const BIG = [25, 100, 250, 850];                                          // 大落地：纸跟着一震
const q5 = f => Math.floor(f / 5) * 5;                                    // 一拍二：每 5 帧一张
function jumpPose(J, f) {
  const air = J.land - J.take, dir = Math.sign(J.X1 - J.X0) || 0;
  const traj = ff => { if (ff < J.take) return [J.X0, GROUND, 0, 0]; if (ff >= J.land) return [J.X1, GROUND, 0, 0]; const u = (ff - J.take) / air; return [lerp(J.X0, J.X1, u), GROUND - 4 * J.H * u * (1 - u), (J.X1 - J.X0) / air, -4 * J.H * (1 - 2 * u) / air]; };
  const [x, yb, vx, vy] = traj(f), vmax = Math.hypot((J.X1 - J.X0) / air, 4 * J.H / air) + 1e-6;

const camBase = f => ({ x: keys([[0, 960], [200, 950], [260, 950], [300, 1010], [340, 1060], [400, 1000], [445, 850], [500, 830], [560, 850], [600, 850], [690, 860], [712, 1120], [790, 1120], [850, 960]], f),

  z: keys([[0, 1.0], [40, 1.03], [200, 1.05], [260, 1.1], [300, 1.12], [340, 1.2], [400, 1.12], [445, 1.33], [690, 1.36], [712, 1.32], [790, 1.36], [830, 1.0], [900, 1.03]], f) });

  return { x: lerp(b.x, fx * .75 + 960 * .25, w), y: lerp(b.y, fy * .55 + 540 * .45, w), z: lerp(b.z, 1.32, w) }; };

  rg = c.createRadialGradient(0, -20, 60, 0, 0, 820); rg.addColorStop(0, '#fffdf6'); rg.addColorStop(.45, '#f9f1df'); rg.addColorStop(.85, '#e7d6b6'); rg.addColorStop(1, '#d6c19c');

<script>
// 纸面坐标 → 屏幕：镜头 ∘ 纸中心（含落地那一震）∘ 转台角度；jit = 换张时定位钉的一点点松动

function paperM(f, jit) { const m = camM(f).translate(PX, PY + thud(f)).rotate((discRot(f) + PR) * 180 / Math.PI); return jit ? m.translate(jit[0], jit[1]) : m; }

const CHX = 520, CHY = -262, CHL = 400, GX = -500, GY = 150, GW = 600, GH = 330, OFF = [1350, 1050];
const arcPts = catmull(SLOWS.map(s => [s.p.x, s.p.y]), false, 6);
const along = (P, u) => { const n = P.length - 1, t = clamp(u) * n, i = Math.min(n - 1, Math.floor(t)), v = t - i; return [lerp(P[i][0], P[i + 1][0], v), lerp(P[i][1], P[i + 1][1], v)]; };

const ovAt = f => quint((f - TL.drag[0]) / (TL.drag[1] - TL.drag[0]));

  { a: TL.arc[0], b: TL.arc[1], at: u => along(arcPts, u) },
  { a: TL.notes[0], b: TL.notes[0] + 14, at: u => [lerp(-40, 120, u), -250] },
  { a: TL.notes[0] + 18, b: TL.notes[1], at: u => [lerp(-560, -400, u), 150] },
  { a: TL.axes[0], b: TL.axes[1], at: u => u < .45 ? [GX, lerp(GY - GH - 40, GY, u / .45)] : [lerp(GX, GX + GW + 30, (u - .45) / .55), GY] },

  { a: TL.code[0], b: TL.code[1], at: u => [GX + 20 + u * 720, GY + 90] },
  { a: TL.drag[0], b: TL.drag[1], at: u => H1(quint(u)) },

function drawPencil(ctx, tip, lift) {
