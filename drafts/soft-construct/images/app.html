<script>
const W = 480, H = 1040, C = SC.cam(W, H), { path, dye, at, AX } = SC, U = AX.U, SH = 24, sh = (p, k = 1) => [p[0] + SH * k, p[1] + SH * k];
const parts = [], pose = {}; let id = 0;
const add = (draw, dyeFn, o = {}, shDraw) => { const i = id++; parts.push({ part: i, draw, dye: dyeFn, depth: 0.12, edge: 24, ...o });
  if (shDraw) parts.push({ part: id++, draw: shDraw, dye: dye.solid('shadow'), depth: 0.004, edge: 3, z: -0.015, density: 0.5 }); return i; };
// 封面：一张纸卡上，楔子沿 −30° 砸中一颗蓝球；左上一颗黄球、一根沿 60° 的黑条
const ball = { c: [300, 300], r: 112 }, hit = [ball.c[0] - U[0] * ball.r, ball.c[1] - U[1] * ball.r], tip = at(hit, 8), base = at(tip, -270);
const bBall = add(path.circle(ball.c, ball.r), dye.zebra('blue', 'ink', 26, [0.5, 0.866]), { depth: 0.2, edge: 50 }, path.circle(sh(ball.c), ball.r));
const bWedge = add(path.wedge(base, tip, 52), dye.solid('red'), { depth: 0.12, edge: 18, z: 0.18 }, path.wedge(sh(base), sh(tip), 52));
add(path.circle([112, 214], 40), dye.solid('yellow'), { depth: 0.12, edge: 26 }, path.circle(sh([112, 214], 0.7), 40));
add(path.bar([380, 520], [380 + 0.5 * 130, 520 - 0.866 * 130], 16), dye.solid('ink'), { depth: 0.06, edge: 8 });
add(path.squiggle([60, 470], [200, 470], 9, 2.5, 13), dye.solid('teal'), { depth: 0.05, edge: 6 });
const sqA = SC.squashAt(C, hit, U, 0.86); pose[bBall] = [sqA, M.mul(SC.shift(C, -U[0] * 14, -U[1] * 14), sqA)]; pose[bBall + 1] = [SC.squashAt(C, sh(hit), U, 0.86)];
pose[bWedge] = [ID, SC.shift(C, U[0] * 12, U[1] * 12)];
// 进度条：已播放的一段长毛（红），钮是粉色毛球
add(path.bar([40, 710], [262, 710], 16), dye.solid('red'), { depth: 0.05, edge: 8 });
add(path.circle([262, 710], 18), dye.solid('pink'), { depth: 0.08, edge: 12 }, path.circle(sh([262, 710], 0.5), 18));
// 播放键：被按下的那一刻（以底边为原点压扁 0.86，毛往下甩）；两边是两对小楔子
const play = [240, 844], pr = 62;
const bPlay = add(path.circle(play, pr), dye.solid('red'), { depth: 0.16, edge: 40 }, path.circle(sh(play), pr));
const pq = SC.squashAt(C, [play[0], play[1] + pr], [0, -1], 0.88); pose[bPlay] = [pq, M.mul(SC.shift(C, 0, 22), pq)];
// 底栏：当前那一格下面一颗黄色小毛球
add(path.circle([36, 997], 8), dye.solid('yellow'), { depth: 0.05, edge: 6 });
// 标注线：从说明指到屏幕上的东西（页面坐标 = 屏幕坐标 + 手机左上角）
const PH = [76, 168], lead = (x1, y1, x2, y2) => { const l = Math.hypot(x2 - x1, y2 - y1), a = Math.atan2(y2 - y1, x2 - x1) * 180 / Math.PI;
  return `<div class="lead" style="left:${x1}px;top:${y1}px;width:${l}px;transform:rotate(${a}deg)"></div><div class="dot" style="left:${x2}px;top:${y2 + 1}px"></div>`; };
document.getElementById('leads').innerHTML = lead(640, 254, PH[0] + 392, PH[1] + 236) + lead(640, 578, PH[0] + 262, PH[1] + 710) + lead(640, 860, PH[0] + 296, PH[1] + 812) + lead(640, 1150, PH[0] + 330, PH[1] + 928);
STILL.run({ W, H, C, parts, pose, s: { len: 0.06, width: 0.0042, base: 0.012 } });
</script>
