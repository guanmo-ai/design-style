<!doctype html>
<!-- 生成艺术 · 开头 10 秒小样（第二版）。1920×1080 · 60fps · 120 BPM。window.frame(f) 画第 f 帧，每帧是时间的纯函数。
     ① 流场色带 → 倒带 → ② 圆堆积 → 缩成点吸到网格 → ③ 特鲁谢瓷砖一波波转 → 缩进手机的卡 → ④ 手机钱包 + 网页生成器 → ⑤ 分叉的树开花 → 片名 -->
<meta charset="utf-8">
<style>
@font-face{font-family:JBM;src:url(../../../public/fonts/JetBrainsMono.ttf)}
@font-face{font-family:Archivo;src:url(../../../public/fonts/Archivo.ttf);font-weight:100 900;font-stretch:62% 125%}
@font-face{font-family:SG;src:url(../../../public/fonts/SpaceGrotesk.ttf);font-weight:300 700}
@font-face{font-family:NotoSC;src:url(../../../public/fonts/NotoSansSC-Black.otf);font-weight:900}
@font-face{font-family:NotoSC;src:url(../../../public/fonts/NotoSansSC-Medium.otf);font-weight:500}
html,body{margin:0;background:#F3EEE2;overflow:hidden}
canvas{display:block}
</style>
<canvas id="c" width="1920" height="1080"></canvas>
<script src="lib.js"></script>
<script src="timeline.js"></script>
<script>
const g = document.getElementById('c').getContext('2d');
const COL = ['#E8392B', '#FF7A1A', '#FFC530', '#FF8FB8', '#2346E0', '#7CC6F2', '#1F9E6A', '#161616'];
const hash = (i, j, k) => { let h = (i * 374761393 + j * 668265263 + k * 2147483647) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967296; };
const rr = (ctx, x, y, w, h, r) => { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); };
let A, CIRC, TS = 120, TC = 16, TR = 9, TREE, BLOOM, CARD = {};

// —— ② 圆堆积：随机落点，长到碰到别人（或画框）就停；先大后小 ——
function packCircles(seed, Wd, Hd, n = 420, rmax = 230) {
  const rnd = mulberry(seed), out = [];
  for (let k = 0; k < 30000 && out.length < n; k++) {
    const x = rnd() * Wd, y = rnd() * Hd; let m = Math.min(x, y, Wd - x, Hd - y, rmax * Math.pow(1 - k / 30000, 2.2) + 10);
    for (const c of out) { m = Math.min(m, Math.hypot(c.x - x, c.y - y) - c.r - 6); if (m < 7) break; }
    if (m < 7) continue;
    out.push({x, y, r: m, c: COL[Math.floor(rnd() * COL.length)], c2: COL[Math.floor(rnd() * COL.length)], type: Math.floor(rnd() * 5), rot: rnd() * 6.28});
  }
  return out;
}
function drawCircle(ctx, c, r) {
  if (r <= 0.5) return;
  ctx.fillStyle = c.c;
  if (c.type === 0) { ctx.beginPath(); ctx.arc(c.x, c.y, r, 0, 7); ctx.fill(); }
  else if (c.type === 1) { ctx.lineWidth = Math.max(2, r * 0.28); ctx.strokeStyle = c.c; ctx.beginPath(); ctx.arc(c.x, c.y, Math.max(0.5, r - ctx.lineWidth / 2), 0, 7); ctx.stroke(); }
  else if (c.type === 2) { for (let k = 0; k < 3; k++) { ctx.fillStyle = k % 2 ? PAPER : c.c; ctx.beginPath(); ctx.arc(c.x, c.y, r * (1 - k * 0.3), 0, 7); ctx.fill(); } }
  else if (c.type === 3) { ctx.beginPath(); ctx.arc(c.x, c.y, r, c.rot, c.rot + Math.PI); ctx.fill(); ctx.fillStyle = c.c2; ctx.beginPath(); ctx.arc(c.x, c.y, r, c.rot + Math.PI, c.rot + Math.PI * 2); ctx.fill(); }
  else { ctx.beginPath(); ctx.arc(c.x, c.y, r, 0, 7); ctx.fill(); ctx.fillStyle = PAPER; ctx.beginPath(); ctx.arc(c.x + r * 0.25, c.y - r * 0.25, r * 0.28, 0, 7); ctx.fill(); }
}

// —— ③ 特鲁谢瓷砖：每格两段四分之一圆，转 90° 就换一种连法 ——
function tileAngle(i, j, f, seed = 0) {
  const d = Math.hypot(i - TC / 2 + 0.5, j - TR / 2 + 0.5) / 9; let a = (hash(i, j, 9 + seed) < 0.5 ? 0 : 90);
  TL.flips.forEach((w, k) => { if (hash(i, j, k + 1 + seed * 7) < 0.55) a += 90 * ease.outBack(clamp((f - w - d * 12) / 10), 1.5); });
  return a;
}
function drawTiles(ctx, f, appear, seed = 0) {
  ctx.lineCap = 'butt';
  for (let j = 0; j < TR; j++) for (let i = 0; i < TC; i++) {
    const d = Math.hypot(i - TC / 2 + 0.5, j - TR / 2 + 0.5) / 9, p = ease.out3(clamp((f - appear - d * 12) / 12)); if (p <= 0) continue;
    const cx = (i + 0.5) * TS, cy = (j + 0.5) * TS, a = tileAngle(i, j, f, seed) * Math.PI / 180;
    ctx.save(); ctx.translate(cx, cy); ctx.rotate(a);
    ctx.lineWidth = 34;
    for (const [ox, oy, a0, k] of [[-1, -1, 0, 0], [1, 1, Math.PI, 1]]) {
      ctx.strokeStyle = COL[Math.floor(hash(i, j, k + 20 + seed) * 7)];
      ctx.beginPath(); ctx.arc(ox * TS / 2, oy * TS / 2, TS / 2, a0, a0 + Math.PI / 2 * p); ctx.stroke();
    }
    ctx.restore();
  }
}

// —— ⑤ 树：长一段，分两叉，每一叉短一点、细一点，偏一个随机角度 ——
function buildTree(seed) {
  const rnd = mulberry(seed), br = [], tips = [];
  (function grow(x, y, a, len, w, d, t0) {
    const x1 = x + Math.cos(a) * len, y1 = y + Math.sin(a) * len, dur = 6 + len / 32, t1 = t0 + dur;
    br.push({x, y, x1, y1, w, d, t0, t1});
    if (d >= 9 || len < 12) { tips.push({x: x1, y: y1, t: t1 + rnd() * 6, r: 9 + rnd() * 16, c: COL[Math.floor(rnd() * 7)], d}); return; }
    const sp = 0.32 + rnd() * 0.32;
    grow(x1, y1, a - sp + (rnd() - 0.5) * 0.2, len * (0.68 + rnd() * 0.12), w * 0.7, d + 1, t1 - 3);
    grow(x1, y1, a + sp + (rnd() - 0.5) * 0.2, len * (0.68 + rnd() * 0.12), w * 0.7, d + 1, t1 - 3 + rnd() * 3);
  })(1200, 1080, -Math.PI / 2, 240, 46, 0, TL.tree[0] + 4);
  return {br, tips};
}

// —— 网页里的生成器：流线（便宜，不做防碰撞），旋转参数跟着滑块走 ——
function streams(ctx, x0, y0, w, h, rot, seed) {
  const ang = field(seed, rot);
  ctx.save(); ctx.beginPath(); ctx.rect(x0, y0, w, h); ctx.clip(); ctx.fillStyle = PAPER; ctx.fillRect(x0, y0, w, h);
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  for (let j = 0; j < 16; j++) for (let i = 0; i < 18; i++) {
    let x = x0 + (i + hash(i, j, 3)) * w / 18, y = y0 + (j + hash(i, j, 4)) * h / 16;
    ctx.strokeStyle = COL[Math.floor(hash(i, j, 5) * 8)]; ctx.lineWidth = [4, 7, 12, 18][Math.floor(hash(i, j, 6) * 4)];
    ctx.beginPath(); ctx.moveTo(x, y);
    for (let s = 0; s < 22; s++) { const a = ang((x - x0) * 1.6, (y - y0) * 1.6); x += Math.cos(a) * 7; y += Math.sin(a) * 7; ctx.lineTo(x, y); }
    ctx.stroke();
  }
  ctx.restore();
}
function cursor(ctx, x, y, s = 1) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s); ctx.fillStyle = INK; ctx.strokeStyle = '#fff'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, 38); ctx.lineTo(10, 29); ctx.lineTo(18, 45); ctx.lineTo(25, 42); ctx.lineTo(17, 26); ctx.lineTo(30, 26); ctx.closePath(); ctx.stroke(); ctx.fill(); ctx.restore();
}

const PHONE = {x: 1370, y: 50, w: 480, h: 980}, C1 = {x: PHONE.x + 28, y: PHONE.y + 250, w: 424, h: 264};
const BROW = {x: 60, y: 50, w: 1250, h: 980}, ART = {x: 92, y: 150, w: 800, h: 780};
function setup() {
  A = build(0x2A7F, PAL_A, 0);
  const rnd = mulberry(5);
  for (const R of A.ribbons) { const x0 = Math.min(R.pts[0][0], R.pts[R.pts.length - 1][0]); R.birth = -84 + (x0 + 120) / 2160 * 150 + rnd() * 6; R.v = R.w >= 40 ? 15 : R.w >= 16 ? 20 : 26; }
  // 每条色带缩成的圆点飞去最近的网格中心
  for (const R of A.ribbons) { const m = R.pts[R.pts.length >> 1]; R.mid = m; R.gi = Math.max(0, Math.min(TC - 1, Math.floor(m[0] / TS))); R.gj = Math.max(0, Math.min(TR - 1, Math.floor(m[1] / TS))); }
  TREE = buildTree(31);
  // 手机里另外两张卡：圆堆积、流场色带（静态小图）
  const mk = draw => { const c = Object.assign(document.createElement('canvas'), {width: C1.w, height: C1.h}).getContext('2d'); draw(c); return c.canvas; };
  CARD.circ = mk(c => { c.fillStyle = '#2346E0'; c.fillRect(0, 0, C1.w, C1.h); for (const q of packCircles(12, C1.w, C1.h, 120, 70)) drawCircle(c, {...q, c: q.c === '#2346E0' ? '#FFC530' : q.c}, q.r); });
  CARD.flow = mk(c => { c.fillStyle = INK; c.fillRect(0, 0, C1.w, C1.h); c.scale(C1.w / W * 1.6, C1.h / H * 1.6); for (const R of A.ribbons) ribbon(c, R, R.L); });
}
function lenFlow(R, f) {      // 长出来；76 起往中点缩
  let l = clamp((f - R.birth) * R.v, 0, R.L);
  if (f >= TL.gather[0]) l *= 1 - ease.inOut3(clamp((f - TL.gather[0] - (R.mid[0] / W) * 6) / 12));
  return l;
}
// ② 碎石：混乱程度（分三拍变大，210 归位）
function disorder(f) {
  let d = 0; TL.steps.forEach((s, k) => { d += 0.34 * ease.outBack(clamp((f - s) / 9), 2); });
  if (f >= TL.snap[0]) d *= 1 - ease.outBack(clamp((f - TL.snap[0]) / (TL.snap[1] - TL.snap[0])), 1.6);
  return d;
}
function drawSquares(ctx, f) {
  for (let j = 0; j < TR; j++) for (let i = 0; i < TC; i++) {
    const dd = Math.hypot(i - TC / 2 + 0.5, j - TR / 2 + 0.5) / 9, p = ease.outBack(clamp((f - TL.schotter[0] - dd * 10) / 12), 2.2);
    if (p <= 0) continue;
    const fade = 1 - clamp((f - TL.tiles[0] - dd * 12) / 12); if (fade <= 0) continue;
    const rowf = Math.pow(j / (TR - 1), 1.3), D = disorder(f) * rowf;
    const rot = D * (hash(i, j, 1) - 0.5) * 2 * 0.8, ox = D * (hash(i, j, 2) - 0.5) * 2 * 34, oy = D * (hash(i, j, 3) - 0.5) * 2 * 34;
    const sz = 92 * p, c = hash(i, j, 4) < 0.32 ? COL[Math.floor(hash(i, j, 5) * 7)] : null;
    ctx.save(); ctx.globalAlpha = fade; ctx.translate((i + 0.5) * TS + ox, (j + 0.5) * TS + oy); ctx.rotate(rot);
    if (c) { ctx.fillStyle = c; ctx.fillRect(-sz / 2, -sz / 2, sz, sz); }
    ctx.lineWidth = 4; ctx.strokeStyle = INK; ctx.strokeRect(-sz / 2, -sz / 2, sz, sz); ctx.restore();
  }
}

window.frame = f => {
  g.setTransform(1, 0, 0, 1, 0, 0); g.fillStyle = PAPER; g.fillRect(0, 0, W, H);
  // ① 流场 → 缩成圆点 → 飞到网格上
  if (f < TL.gather[1]) {
    const heads = [];
    for (const R of A.ribbons) {
      const l = lenFlow(R, f);
      if (f < TL.gather[0] + 4 || l > R.w * 0.6) { const from = f >= TL.gather[0] ? (R.L - l) / 2 + (R.L / 2 - (R.pts.length >> 1) * STEP) : 0, h = ribbon(g, R, l, null, Math.max(0, from)); if (h && l < R.L - 0.5 && R.w >= 10 && f < TL.gather[0]) heads.push([R, l, h]); continue; }
      if (clamp((f - R.birth) * R.v, 0, R.L) <= 0) continue;
      const p = ease.inOut3(clamp((f - 92 - Math.hypot(R.mid[0] - W / 2, R.mid[1] - H / 2) / 1100 * 10) / 16));
      const x = lerp(R.mid[0], (R.gi + 0.5) * TS, p), y = lerp(R.mid[1], (R.gj + 0.5) * TS, p), r = lerp(Math.max(6, Math.min(R.w / 2, 16)), 8, p);
      g.fillStyle = R.c; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill();
    }
    for (const [R, l, h] of heads) penHead(g, R, l, h, R.w >= 26 ? 130 : 0);
    card(g, f, 10, TL.gather[0] - 6, 'RULE 01 · 流场', '顺着风走', 'angle = noise(x, y) × 2π', 60, 790);
  }
  // ② 碎石：方块从圆点堆里长出来，越往下越乱，拍点上一下归位
  if (f >= TL.schotter[0] && f < TL.tiles[0] + 30) {
    drawSquares(g, f);
    card(g, f, TL.schotter[0] + 12, TL.snap[1] - 4, 'RULE 02 · 秩序 → 混乱', '越往下，越乱', 'rotate = rand(±45°) × 行号 / 总行数', 60, 790);
  }
  // ③ 瓷砖
  const shrinkTiles = () => {      // 整面瓷砖缩进手机的第一张卡（画在手机上面，落定后由卡片接手）
    const p = ease.inOut3(clamp((f - TL.shrink[0]) / (TL.shrink[1] - TL.shrink[0])));
    const s = lerp(1, C1.w / W, p), sy = lerp(1, C1.h / H, p);
    g.save(); g.translate(lerp(0, C1.x, p), lerp(0, C1.y, p)); g.scale(s, sy);
    if (p > 0) { rr(g, 0, 0, W, H, 18 / s); g.fillStyle = PAPER; g.fill(); g.save(); g.clip(); drawTiles(g, f, TL.tiles[0]); g.restore(); g.lineWidth = 3 / s; g.strokeStyle = INK; g.stroke(); }
    else drawTiles(g, f, TL.tiles[0]);
    g.restore();
  };
  if (f >= TL.tiles[0] && f < TL.shrink[0]) {
    shrinkTiles();
    card(g, f, TL.tiles[0] + 18, TL.shrink[0] - 4, 'RULE 03 · 特鲁谢瓷砖', '一个格子，转 90°', 'rotate(tile, 90° × n)', 60, 790);
  }
  // ④ 手机钱包 + 网页生成器
  const SEED = [1200, 990];
  if (f >= TL.ui[0] - 6 && f < TL.collapse[1]) {
    const cp = ease.in3(clamp((f - TL.collapse[0]) / (TL.collapse[1] - TL.collapse[0] - 2))), e = 0, drop = 0;
    g.save(); g.translate(SEED[0], SEED[1]); g.rotate(cp * 0.8); g.scale(1 - cp, 1 - cp); g.translate(-SEED[0], -SEED[1]);
    // 网页
    const bx = BROW.x + lerp(-1400, 0, ease.outBack(clamp((f - TL.ui[0] - 4) / 22), 1.1));
    g.save(); g.translate(bx, drop * 1.2); g.rotate(e > 0 ? -e * 0.004 : 0);
    g.fillStyle = INK; rr(g, 10, 14, BROW.w, BROW.h, 18); g.fill();
    g.fillStyle = PAPER; rr(g, 0, 0, BROW.w, BROW.h, 18); g.fill(); g.lineWidth = 3; g.strokeStyle = INK; g.stroke();
    g.fillStyle = '#E4DDCC'; rr(g, 0, 0, BROW.w, 52, [18, 18, 0, 0]); g.fill(); g.strokeStyle = INK; g.beginPath(); g.moveTo(0, 52); g.lineTo(BROW.w, 52); g.stroke();
    for (let k = 0; k < 3; k++) { g.fillStyle = ['#E8392B', '#FFC530', '#1F9E6A'][k]; g.beginPath(); g.arc(28 + k * 22, 26, 7, 0, 7); g.fill(); }
    g.font = '600 18px JBM'; g.fillStyle = '#7A7364'; g.fillText('flowfield.studio', 120, 33);
    const dp = ease.inOut3(clamp((f - TL.drag[0]) / (TL.drag[1] - TL.drag[0]))), rot = lerp(-0.35, 1.25, dp);
    streams(g, ART.x - BROW.x, ART.y - BROW.y, ART.w, ART.h, rot, 3);
    g.strokeStyle = INK; g.lineWidth = 3; rr(g, ART.x - BROW.x, ART.y - BROW.y, ART.w, ART.h, 12); g.stroke();
    const px = ART.x - BROW.x + ART.w + 36, py = 120;
    g.font = '900 34px Archivo'; g.fillStyle = INK; g.fillText('Generator', px, py + 20);
    [['Rotation', dp, `${Math.round(rot * 57.3)}°`], ['Scale', 0.38, '0.0019'], ['Width', 0.55, '6—64'], ['Gap', 0.3, '5 px']].forEach(([n, v, t], k) => {
      const y = py + 90 + k * 78; g.font = '600 20px SG'; g.fillStyle = INK; g.fillText(n, px, y); g.font = '700 18px JBM'; g.textAlign = 'right'; g.fillText(t, px + 270, y); g.textAlign = 'left';
      g.fillStyle = '#DDD5C3'; rr(g, px, y + 18, 270, 8, 4); g.fill(); g.fillStyle = k === 0 ? '#E8392B' : INK; rr(g, px, y + 18, 270 * v, 8, 4); g.fill();
      g.fillStyle = PAPER; g.strokeStyle = k === 0 ? '#E8392B' : INK; g.lineWidth = 4; g.beginPath(); g.arc(px + 270 * v, y + 22, 13, 0, 7); g.fill(); g.stroke();
    });
    g.font = '600 16px JBM'; g.fillStyle = '#7A7364'; g.fillText('PALETTE', px, py + 430);
    COL.forEach((c, k) => { g.fillStyle = c; rr(g, px + k * 34, py + 446, 28, 28, 6); g.fill(); });
    g.fillStyle = '#E8392B'; rr(g, px, py + 740, 270, 70, 14); g.fill(); g.font = '900 26px Archivo'; g.fillStyle = '#fff'; g.fillText('Export SVG ↓', px + 52, py + 784);
    const hx = px + 270 * dp, hy = py + 90 + 22, ci = clamp((f - TL.ui[0] - 20) / 16);
    if (ci > 0 && f < TL.drag[1] + 2) cursor(g, lerp(px + 120, hx, ease.inOut3(clamp((f - TL.ui[0] - 20) / 12))) + 4, hy + 6, f >= TL.drag[0] - 2 && f < TL.drag[1] ? 0.9 : 1);
    g.restore();
    // 手机
    const pin = ease.outBack(clamp((f - TL.ui[0] + 6) / 18), 1.4);
    g.save(); g.translate(0, drop * 1.4 + (1 - pin) * 900); g.translate(PHONE.x + PHONE.w / 2, PHONE.y + PHONE.h / 2); g.rotate(e > 0 ? e * 0.006 : 0); g.translate(-PHONE.x - PHONE.w / 2, -PHONE.y - PHONE.h / 2);
    g.fillStyle = '#0B0B0B'; rr(g, PHONE.x - 14, PHONE.y - 14, PHONE.w + 28, PHONE.h + 28, 64); g.fill();
    g.fillStyle = PAPER; rr(g, PHONE.x, PHONE.y, PHONE.w, PHONE.h, 52); g.fill();
    g.font = '700 18px JBM'; g.fillStyle = INK; g.fillText('9:41', PHONE.x + 40, PHONE.y + 44); g.textAlign = 'right'; g.fillText('100%', PHONE.x + PHONE.w - 40, PHONE.y + 44); g.textAlign = 'left';
    g.font = '900 46px Archivo'; g.fillText('Cards', PHONE.x + 32, PHONE.y + 120);
    const back = (img, dy, s) => { g.save(); g.translate(C1.x + C1.w / 2, C1.y + dy); g.scale(s, s); rr(g, -C1.w / 2, 0, C1.w, C1.h, 18); g.clip(); g.drawImage(img, -C1.w / 2, 0); g.restore();
      g.save(); g.translate(C1.x + C1.w / 2, C1.y + dy); g.scale(s, s); g.lineWidth = 3 / s; g.strokeStyle = INK; rr(g, -C1.w / 2, 0, C1.w, C1.h, 18); g.stroke(); g.restore(); };
    const fan = ease.outBack(clamp((f - TL.shrink[1]) / 16), 1.6);
    back(CARD.flow, -100 * fan, 0.86); back(CARD.circ, -52 * fan, 0.93);
    // 第一张卡：瓷砖（缩进来的那一面），点“重新生成”后换种子重新长
    if (f >= TL.shrink[1]) {
      const seed = f >= TL.reroll[0] ? 1 : 0, ap = f >= TL.reroll[0] ? TL.reroll[0] + 4 : TL.tiles[0];
      g.save(); rr(g, C1.x, C1.y, C1.w, C1.h, 18); g.clip(); g.fillStyle = PAPER; g.fillRect(C1.x, C1.y, C1.w, C1.h);
      g.translate(C1.x, C1.y); g.scale(C1.w / W, C1.h / H); drawTiles(g, f, ap, seed); g.restore();
    }
    g.lineWidth = 3; g.strokeStyle = INK; rr(g, C1.x, C1.y, C1.w, C1.h, 18); g.stroke();
    g.fillStyle = INK; rr(g, C1.x + C1.w - 132, C1.y + 16, 116, 34, 8); g.fill(); g.font = '900 20px Archivo'; g.fillStyle = PAPER; g.fillText('ONE/ONE', C1.x + C1.w - 120, C1.y + 40);
    g.fillStyle = PAPER; rr(g, C1.x + 16, C1.y + C1.h - 52, 150, 36, 8); g.fill(); g.font = '700 20px JBM'; g.fillStyle = INK; g.fillText('•••• 2047', C1.x + 28, C1.y + C1.h - 27);
    const sd = f >= TL.reroll[0] + 6 ? 'B3E1' : 'A7F2';
    g.font = '700 18px JBM'; g.fillStyle = INK; g.fillText(`SEED #${sd} · 1 of 1`, PHONE.x + 32, C1.y + C1.h + 50);
    const pr = f >= TL.reroll[0] - 4 && f < TL.reroll[0] + 4 ? 0.9 : 1;
