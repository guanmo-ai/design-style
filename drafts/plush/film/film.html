<!doctype html><meta charset="utf-8"><title>毛绒 Plush · 全片</title>
<!-- 逐帧渲染：node ../../_lib/film-gl.cjs film.html <帧目录> 0 1200。预览（毛少四倍、粗一倍）：加查询串 rows=100&wmul=1.9 -->
<link rel="stylesheet" href="../../_lib/kit/hud.css">
<div id="stage"><canvas id="c" width="1920" height="1080"></canvas></div>
<script src="../../_lib/glkit.js"></script><script src="../../_lib/typefx.js"></script>
<script src="../../_lib/kit/motion.js"></script><script src="../../_lib/kit/director.js"></script><script src="../../_lib/kit/stage.js"></script><script src="../../_lib/kit/shapes.js"></script><script src="../../_lib/kit/hud.js"></script>
<script src="../../_lib/fur/fur.js"></script><script src="timeline.js"></script><script src="scenes.js"></script>
<script>
const Q = new URLSearchParams(location.search), $ = id => document.getElementById(id);
const RULES = [['根深尖浅', ['根 #7D0A3C → 尖 #FF4F97', '越靠根越暗：亮度 ×0.3']], ['乱一点', ['长短 ±28% · 方向 ±0.4', '几十根并成一撮，各倒各的']], ['逆光镶边', ['rim = (1 − N·V)³ × 毛尖', '光从背后来，轮廓会发亮']],
  ['慢半拍', ['毛尖 = 身体的运动 ⊗ 弹簧', '2.6 Hz · ζ 0.22：晚 5 帧，冲过头 30%']], ['一按就倒', ['拨开半径 0.42', '手一走，毛跟着合上']]];
const PARAMS = [[26, 120, ['409,600 根毛，每根都是一根弹簧']], [176, 225, ['长 0.15 · 宽 0.007 · 根粗尖细']], [262, 322, ['毛长 ×0.5：毛越短，越硬挺', '根 #4A2A10 → 尖 #DCAE6E']],
  [372, 427, ['身体 ×0.9 · 鼻口 ×0.42', '同一只熊，两种毛长']], [468, 510, ['毛长 ×1.3 · 下垂 0.42', '一甩：毛尖晚 5 帧才到']]];
const SPEC = [[TL.ui + 34, '点赞', ['按下 scale 1 → 0.76，5 帧', '松手 弹簧 3.6 Hz · ζ 0.26', '灰 → 粉 0.15 s']], [TL.toggle - 26, '开关', ['钮滑 66 px，过冲 12%', '毛再晚 5 帧，抖 3 下']], [TL.load[0] - 22, '加载', ['三颗球，各晚 7.5 帧', '落地压扁 0.75']]];

function hud(f, s, VP) {
  HUD.layer({ dark: f >= TL.uiMorph[0] + 24 && f < TL.outMorph[0] + 12, fade: s.fade ?? 1 });
  // 外框：左上章节、右上进度。规则卡那一章不显示左上的章节（最后 6 帧卡片已收走，也别闪回来）
  const ci = chapterAt(TL.chapters, f);
  HUD.chapter(f, TL.chapters, { total: '07', hide: ci === 7 || (f >= TL.rules[0] && f < TL.ui), noProgress: ci === 7, progress: f / TL.out });
  HUD.params(f, PARAMS);
  // 中间的大字：规则卡 / 毛的根数 / 标注
  let big = '';
  if (s.rule !== undefined) { const [w, subs] = RULES[s.rule];
    big += HUD.ruleCard(f, { at: TL.rules[s.rule], label: '规则 0' + (s.rule + 1) + ' / 05', word: w, subs, tag: s.rule === 4 ? null : { on: s.ruleOn > 0.5, onText: '开', offText: '关' }, out: prog(f, TL.uiMorph[0] - 7, TL.uiMorph[0] - 1) }); }
  if (s.countShown !== undefined && f >= TL.oneGrow) big += HUD.count(f, { text: s.countShown.toLocaleString('en-US'), at: TL.oneGrow, unit: '根' });
  if (VP && f >= TL.oneGrow + 4 && f < TL.counts[1]) { const o = 1 - prog(f, TL.counts[0], TL.counts[1]);
    big += HUD.callout(f, { p: proj(VP, [0.012, 2.135, 0]), text: '尖 #FF4F97 · 浅、细', at: TL.oneGrow + 4, opacity: o }) + HUD.callout(f, { p: proj(VP, [0.012, 2.012, 0]), text: '根 #7D0A3C · 深、粗', at: TL.oneGrow + 10, opacity: o }); }
  HUD.big(big);
  // 06 手机：先有容器（从下面弹上来），毛再倒进去；镜头贴着墙推拉，手机这层跟着一起缩放
  const inPhone = f >= TL.phone[0] && f < TL.outMorph[0] + 16, D = HUD.D;
  if (!inPhone) HUD.phone(f, { show: false });
  else { const up = pop(f, TL.phone[0], 2.4, 0.5), dn = ease.in3(prog(f, TL.outMorph[0], TL.outMorph[0] + 16));
    const k = 9 / s.eye[2], cxp = 960 + s.at[0] * UI.ppu, cyp = 540 - (s.at[1] - 1.5) * UI.ppu, lock = f >= 772 && f < TL.outMorph[0];
    const likes = f >= TL.tapHeart + 4 ? '1,025' : '1,024', t0 = TL.ui + 16;
    HUD.phone(f, { show: true, y: (1 - up) * 1100 + dn * 1150,
      wrap: lock ? `translate(${(960 - k * cxp).toFixed(2)}px,${(540 - k * cyp).toFixed(2)}px) scale(${k.toFixed(4)})` : `translate(${(960 - 1.5 * 720).toFixed(2)}px,${(540 - 1.5 * (f < 900 ? 400 : 730)).toFixed(2)}px) scale(1.5)`,
      inner: `<div class="h">${D('毛绒日记', f, t0, { rate: 2.5, kind: 'title' })}</div>
      <div class="cap">${D('捏一下 · ' + likes, f, t0 + 10, { rate: 0.8, kind: 'small' })}</div><div class="ln" style="top:580px"></div>
      <div class="row" style="top:646px">${D('消息提醒', f, t0 + 16, { rate: 1.5, kind: 'small' })}<small>${f >= TL.toggle + 6 ? '已打开' : '已关闭'}</small></div><div class="ln" style="top:762px"></div>
      <div class="cap" style="top:902px">${D('正在加载…', f, TL.load[0] - 14, { rate: 1.2, kind: 'small' })}</div>`,
      blocks: SPEC, tops: [300, 618, 800], active: f < TL.toggle - 26 ? 0 : f < TL.load[0] - 22 ? 1 : 2, specOpacity: 1 - dn }); }
  // 手指
  let cp = null, press = 0;
  if (VP && s.rule === 4 && s.push.length) cp = proj(VP, s.push[0]);
  if (VP && f >= TL.tapHeart - 16 && f < TL.tapHeart + 14) { const a = proj(VP, [LAY.heart[0], LAY.heart[1], 0.2]), t = ease.out3(prog(f, TL.tapHeart - 16, TL.tapHeart - 3)), out = ease.in2(prog(f, TL.tapHeart + 6, TL.tapHeart + 14));
    cp = [a[0] + (1 - t) * 190 + out * 150, a[1] + (1 - t) * 230 + out * 190]; press = f >= TL.tapHeart - 2 && f < TL.tapHeart + 5 ? 1 : 0; }
  if (VP && f >= TL.toggle - 18 && f < TL.toggle + 12) { const a = proj(VP, [LAY.knobOff[0], LAY.knobOff[1], 0.1]), b = proj(VP, [LAY.knobOn[0], LAY.knobOn[1], 0.1]), t = ease.out3(prog(f, TL.toggle - 18, TL.toggle - 5)), k = ease.out3(prog(f, TL.toggle, TL.toggle + 7)), out = ease.in2(prog(f, TL.toggle + 5, TL.toggle + 12));
    cp = [lerp(a[0], b[0], k) + (1 - t) * 160 + out * 120, a[1] + (1 - t) * 200 + out * 160]; press = f >= TL.toggle - 4 && f < TL.toggle + 6 ? 1 : 0; }
  HUD.cursor(cp, press);
  // 片尾：字是毛拼的，下面一行英文 + 署名
  HUD.endCard(f, { at: TL.final - 14, en: 'PLUSH', signAt: TL.sign });
}

let F;
(async () => {
  HUD.mount(); await HUD.fonts('毛绒Aa1');
  const wmul = +(Q.get('wmul') || 1);
  F = FUR.create(STAGE.create($('c')), { rows: +(Q.get('rows') || 400), K: +(Q.get('k') || 4) });
  buildShapes(F);
  for (let f = 0; f < TL.end; f++) hud(f, stateAt(F, f), null);          // 空跑一遍：把所有出字的时间登记给配乐
  window.events = () => ({ cues: TFX.list() });
  window.frame = async f => { F.tone(TONE.pink, PAL.pink); const s = stateAt(F, f); s.width *= wmul; const VP = F.render(s); hud(f, s, VP); await new Promise(r => requestAnimationFrame(() => r())); };
  await window.frame(+(Q.get('f') || 0));
  window.ready = true; window.__done = true;
})().catch(e => { console.log('ERR ' + (e.stack || e.message).slice(0, 4000)); });
</script>
