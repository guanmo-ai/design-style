<body>
<canvas id="gl"></canvas>
<div id="ui"></div>
<div id="hud"></div>
<div id="card"></div>
<script src="../../_lib/glkit.js"></script>
<script src="../pc.js"></script>
<script src="../shapes.js"></script>
<script src="timeline.js"></script>
<script>
const Q = new URLSearchParams(location.search);
const SCALE = +(Q.get('scale') || 1);
const W = 1920, H = 1080, FPS = 60, N = +(Q.get('n') || 800000);
let gl, P, target, post, S = {};
const BS = 6, BY = -2.2;                     // 盆景放大倍数和高度
const DOT = [0, 0.1, 1.2];

// —— 形状 ——
function dot(R) { const C = PC.Cloud(N + 10); for (let i = 0; i < N; i++) { const u = R() * 2 - 1, a = R() * 6.283, r = 0.02 * Math.cbrt(R()), s = Math.sqrt(1 - u * u);
  C.push(DOT[0] + Math.cos(a) * s * r, DOT[1] + u * r, DOT[2] + Math.sin(a) * s * r, 0.9, 0.97, 1.0, 0.004, R(), 0, 0); } return C.data; }
function title(R) {
  const Wm = 2400, Hm = 900, cv = document.createElement('canvas'); cv.width = Wm; cv.height = Hm; const x = cv.getContext('2d');
  x.fillStyle = '#fff'; x.font = '900 760px NotoSC'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText('点云', Wm / 2, Hm / 2 + 30);
  const m = x.getImageData(0, 0, Wm, Hm).data, inside = (px, py) => px >= 0 && py >= 0 && px < Wm && py < Hm && m[((py | 0) * Wm + (px | 0)) * 4 + 3] > 128;
  const sc = 9.4 / Wm, C = PC.Cloud(N + 10), Z = 0.26;
  const grad = (u, v) => { const t = Math.min(1, Math.max(0, u * 0.75 + (1 - v) * 0.35)); const a = [1.0, 0.12, 0.45], b = [1.0, 0.45, 0.1], c = [1.0, 0.82, 0.25];
    return t < 0.5 ? a.map((v, i) => v + (b[i] - v) * t * 2) : b.map((v, i) => v + (c[i] - v) * (t - 0.5) * 2); };
  let n = 0;
  while (n < N) { const px = R() * Wm, py = R() * Hm; if (!inside(px, py)) continue;
    const kind = R(); let z, shade; const edge = !inside(px + 6, py) || !inside(px - 6, py) || !inside(px, py + 6) || !inside(px, py - 6);
    if (edge && kind < 0.55) { z = (R() * 2 - 1) * Z; shade = 0.5; } else if (kind < 0.72) { z = -Z; shade = 0.28; } else { z = Z; shade = 1.0; }
    const g = grad(px / Wm, py / Hm), j = 0.88 + R() * 0.24;
    C.push((px - Wm / 2) * sc, -(py - Hm / 2) * sc, z, g[0] * shade * j, g[1] * shade * j, g[2] * shade * j, 0.006, R(), 0, 0); n++; }
  return C.data;
}
function xform(data, s, off, wk = 1) { const d = new Float32Array(data); for (let i = 0; i < d.length / 10; i++) { const o = i * 10; d[o] = d[o] * s + off[0]; d[o + 1] = d[o + 1] * s + off[1]; d[o + 2] = d[o + 2] * s + off[2]; d[o + 6] *= s * wk; } return d; }

// —— 相机：关键帧 + 每段自己的运动 ——
const V = { mix: (a, b, t) => a.map((v, i) => v + (b[i] - v) * t), nrm: a => { const l = Math.hypot(...a); return a.map(v => v / l); } };
const cm = (a, b, t) => ({ pos: V.mix(a.pos, b.pos, t), tgt: V.mix(a.tgt, b.tgt, t), up: V.nrm(V.mix(a.up || [0, 1, 0], b.up || [0, 1, 0], t)), fov: lerp(a.fov, b.fov, t) });
const orbit = (c, r, a, y, fov = 40) => ({ pos: [c[0] + Math.sin(a) * r, y, c[2] + Math.cos(a) * r], tgt: c, up: [0, 1, 0], fov });
const SWELL = (q) => { const th = q * Math.PI * 1.15, y = lerp(0.55, -3.6, q), r = 0.37;   // 楼梯井里螺旋往下
  return { pos: [-Math.cos(th) * r, y, -Math.sin(th) * r * 0.4 + 0.13 * (1 - q)], tgt: [Math.cos(th) * 0.35, y - 5, Math.sin(th) * 0.12], up: [Math.cos(th), 0, Math.sin(th)], fov: 64 }; };
function camAt(f) {
  if (f < 100) { const a = lerp(-0.32, 0.05, ease.inOut3(prog(f, 0, 100))), R = lerp(15.5, 12.4, ease.out3(prog(f, 0, 100))); return orbit([0, 0, 0], R, a, 0.4 - 0.3 * prog(f, 0, 100), 42); }
  const HEAD = (t) => orbit([0, -0.1, 0], lerp(7.2, 6.2, t), lerp(0.05, 0.5, t), 0.25, 40);
  if (f < 140) return cm(orbit([0, 0, 0], 12.4, 0.05, 0.1, 42), HEAD(0), ease.inOut3(prog(f, 100, 140)));
  if (f < 200) return HEAD(prog(f, 140, 200));
  const ST = (t) => ({ pos: [lerp(-2.2, 1.6, t), lerp(3.6, 5.2, t), lerp(4.6, 3.0, t)], tgt: [lerp(-0.7, 0.5, t), -1.0, 0.2], up: [0, 1, 0], fov: 50 });
  if (f < 236) return cm(HEAD(1), ST(0), ease.inOut3(prog(f, 200, 236)));
  if (f < 296) return ST(ease.inOut3(prog(f, 236, 296)));
  if (f < 312) return cm(ST(1), SWELL(0), ease.inOut3(prog(f, 296, 312)));
  const OUT = { pos: [2.6, 3.4, 4.6], tgt: [0, -3.2, 0], up: [0, 1, 0], fov: 48 };
  if (f < 360) return SWELL(ease.inOut3(prog(f, 312, 360)));
  if (f < 384) return cm(SWELL(1), OUT, ease.inOut3(prog(f, 358, 380)));
  const WALL = (t) => ({ pos: [lerp(-2.4, 2.2, t), lerp(0.5, -0.3, t), lerp(7.6, 6.4, t)], tgt: [lerp(-0.4, 0.4, t), 0, 0], up: [0, 1, 0], fov: 46 });
  if (f < 410) return cm(OUT, WALL(0), ease.inOut3(prog(f, 386, 410)));
  if (f < 470) return WALL(prog(f, 410, 470));
  const TREE = (t) => orbit([0, 0.2, 0], lerp(11.5, 10.2, t), lerp(-0.6, 0.15, t), 1.3, 40);
  if (f < 500) return cm(WALL(1), TREE(0), ease.inOut3(prog(f, 470, 500)));
  if (f < 560) return TREE(prog(f, 500, 560));
  // 规则卡：每张一个镜头
  const R1 = (t) => ({ pos: [lerp(-4.5, 1.5, t), 0.25, 3.8], tgt: [lerp(-2.0, 3.5, t), -0.9, -2], up: [0, 1, 0], fov: 60 });
  const R2 = (t) => orbit([0, -0.6, 0], 9.5, lerp(0.6, 0.9, t), 4.0, 42);
  const R3 = (t) => orbit([0, -0.6, 0], lerp(7.5, 6.8, t), lerp(-0.8, -0.6, t), 2.4, 42);
  const R4 = (t) => orbit([0, -0.6, 0], 10, lerp(2.2, 2.5, t), 3.4, 42);
  const R5 = (t) => ({ pos: [0.01, 9.5, 0.5 - 0.3 * t], tgt: [0, -1, 0], up: [0, 0, -1], fov: 46 });
  if (f < 578) return cm(TREE(1), R1(0), ease.inOut3(prog(f, 556, 578)));
  if (f < 600) return R1(prog(f, 570, 600));
  if (f < 630) return R2(prog(f, 600, 630));
  if (f < 660) return R3(prog(f, 630, 660));
  if (f < 690) return R4(prog(f, 660, 690));
  if (f < 720) return R5(prog(f, 690, 720));
  const PH = (a) => orbit([0, 0.0, 0], 12.5, a, 1.6, 40);
  if (f < 744) return cm(R5(1), PH(0.5), ease.inOut3(prog(f, 712, 744)));
  if (f < 930) return PH(lerp(0.5, 1.1, prog(f, 744, 930)));
  const END = orbit([0, 0, 0], 12.4, 0.0, 0.2, 42);
  return cm(PH(1.1), END, ease.inOut3(prog(f, 940, 1004)));
}
function unproject(cam, px, py, planePt) {
  const n = V.nrm, cr = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]], dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
  const fw = n(cam.tgt.map((v, i) => v - cam.pos[i])), rt = n(cr(fw, cam.up)), up = cr(rt, fw), k = Math.tan(cam.fov * Math.PI / 360);
  const d = n([0, 1, 2].map(i => fw[i] + rt[i] * ((px / W - 0.5) * 2 * k * W / H) + up[i] * ((0.5 - py / H) * 2 * k)));
  const t = dot(planePt.map((v, i) => v - cam.pos[i]), fw) / dot(d, fw);
  return cam.pos.map((v, i) => v + d[i] * t);
}

// —— 一帧 ——
const MO = (m, o) => Object.assign({ m, spread: 0.5, dur: 0.5, swirl: 0, lift: 0, curl: 0, axis: [0, 0, 0], trails: 6, trailStep: 0.012, alpha: 0.08 }, o);
function sceneAt(f) {
  const s = { N, T: f / FPS, cam: camAt(f), minSize: 1.25, sizeK: 0.75, gain: 1.0, falloff: 1.43, near: [0.05, 0.3], dof: { focus: 12, aperture: 0.003 } };
  let A, B, mo = { m: 0 };
  const seg = (a, b) => f >= a && f < b;
  if (f < 100) {
    A = S.dot; B = S.title; mo = MO(ease.out3(prog(f, TL.assemble[0], TL.assemble[1])), { swirl: 2.6, lift: 2.6, curl: 2.2, axis: [0, 0, 1.2], trails: 8, trailStep: 0.01, alpha: 0.11 });
    if (f >= TL.assemble[1]) { A = B = S.title; mo = { m: 0 }; }
    if (f >= TL.lock) s.sweep = { y: lerp(2.3, -2.3, ease.inOut3(prog(f, TL.lock, TL.lock + 22))), w: 0.06, ghostA: -1, glow: 0.35 };
  } else if (f < TL.dissolve[0]) {
    A = S.title; B = S.head; mo = MO(ease.inOut3(prog(f, TL.toHead[0], TL.toHead[1])), { spread: 0.7, dur: 0.3, swirl: 0.6, lift: -0.6, curl: 0.3, trails: 5, alpha: 0.06 });
    if (f >= TL.toHead[1]) { A = B = S.head; mo = { m: 0 }; }
    // 每个十六分音符错一次行，6 帧内回位
    for (const [k, g] of TL.glitch.entries()) if (f >= g && f < g + 6) s.glitch = [0.04 + 0.02 * (k % 3), 0.55 * (1 - (f - g) / 6), g * 1.37];
    s.dof = { focus: 6.5, aperture: 0.004 };
  } else if (f < TL.drain[0]) {
    A = S.head; B = S.street; mo = MO(ease.inOut3(prog(f, TL.dissolve[0], TL.dissolve[1])), { spread: 0.75, dur: 0.25, curl: 0.6, wind: [3.2, 0.8, -0.6], lift: 0.2, trails: 8, trailStep: 0.008, alpha: 0.12 });
    if (f >= TL.dissolve[1]) { A = B = S.street; mo = { m: 0 }; }
    if (f >= TL.beam[0]) s.sweep = { mode: 2, c: [0, 0, 0], y: lerp(0, 4 * Math.PI, prog(f, TL.beam[0], TL.beam[1])), w: 0.05, glow: 0.5, ghost: 0, ghostA: 0, col: [0.6, 1.0, 1.0] };
    if (f < TL.dissolve[1] && f >= TL.beam[0]) s.sweep = null;
    s.sizeK = 0.9; s.dof = { focus: 6, aperture: 0.003 };
  } else if (f < TL.toWall[0]) {
    A = S.street; B = S.stairs; mo = MO(ease.inOut3(prog(f, TL.drain[0], TL.drain[1])), { spread: 0.55, dur: 0.45, swirl: 2.2, lift: -1.2, curl: 0.4, axis: [0, 0, 0], trails: 6, alpha: 0.06 });
    if (f >= TL.drain[1]) { A = B = S.stairs; mo = { m: 0 }; }
    s.sizeK = 0.62; s.near = [0.2, 1.2];
    const sy = lerp(0.2, -8.2, ease.inOut3(prog(f, TL.sweep[0], 360)));
    if (f >= TL.drain[0] + 10) s.sweep = { y: sy, w: 0.03, dir: 1, ramp: true, rampLen: 5.7, glow: 0.14, col: [0.35, 0.95, 1.0] };
    if (f >= TL.voxel[0]) s.vox = [0.16, ease.inOut3(prog(f, TL.voxel[0], TL.voxel[1]))];
  } else if (f < TL.toBonsai[0]) {
    A = S.stairs; B = S.wall; mo = MO(ease.inOut3(prog(f, TL.toWall[0], TL.toWall[1])), { spread: 0.45, dur: 0.55, swirl: 1.0, lift: 1.5, curl: 0.5, trails: 0, alpha: 0.05 });
    if (f >= TL.toWall[1]) { A = B = S.wall; mo = { m: 0 }; }
    s.vox = [0.16, 1 - ease.inOut3(prog(f, 404, 424))];
    if (f >= TL.flow[0]) s.flow = [0.9 * ease.inOut3(prog(f, TL.flow[0], TL.flow[0] + 30)), 0.55, 0];
    s.sizeK = 0.9; s.dof = { focus: 7, aperture: 0.004 };
  } else if (f < TL.toTerrain[0]) {
    A = S.wall; B = S.bonsai; mo = MO(ease.inOut3(prog(f, TL.toBonsai[0], TL.toBonsai[1])), { spread: 0.5, dur: 0.5, swirl: 2.0, lift: 1.0, curl: 0.8, axis: [0, 0, 0], trails: 4, alpha: 0.025 });
    if (f < TL.toBonsai[1]) s.flow = [0.9 * (1 - ease.inOut3(prog(f, TL.toBonsai[0], TL.toBonsai[1]))), 0.55, 0];
    if (f >= TL.toBonsai[1]) { A = B = S.bonsai; mo = { m: 0 }; }
    // 点 → 面：点越长越大，连成一片
    s.sizeK = lerp(0.55, 1.7, ease.inOut3(prog(f, TL.splat[0], TL.splat[1])));
    s.dof = { focus: lerp(10.5, 7.5, ease.inOut3(prog(f, TL.focus[0], TL.focus[0] + 8))) + 3.2 * ease.inOut3(prog(f, TL.focus[0] + 12, TL.focus[1])), aperture: 0.004 + 0.012 * Math.sin(Math.PI * prog(f, TL.focus[0], TL.focus[1])) };
    if (f >= TL.cursor[0] - 2) { s.push = []; for (let k = 0; k < 6; k++) { const q = curAt(f - k * 4); if (!q) continue; const w = unproject(s.cam, q[0], q[1], [0, 0.5, 0]); s.push.push([...w, 0.75 * Math.max(0, 1 - k * 0.15)]); } }
  } else if (f < TL.today[0]) {
    A = S.bonsai; B = S.terrain; mo = MO(ease.inOut3(prog(f, TL.toTerrain[0], TL.toTerrain[1])), { spread: 0.4, dur: 0.6, swirl: 1.4, lift: 1.0, curl: 0.4, trails: 5, alpha: 0.05 });
    if (f >= TL.toTerrain[1]) { A = B = S.terrain; mo = { m: 0 }; }
    const c = Math.floor((f - 570) / 30), lf = (f - 570) % 30;
    s.sizeK = 0.7;
    if (c === 0) { s.dof = { focus: lerp(2, 7, lf / 30), aperture: 0.018 }; s.sizeK = 0.9; }
    if (c === 1) s.sweep = { y: lerp(2.2, -2.6, ease.inOut3(lf / 30)), w: 0.05, dir: 1, ghost: 0.12, ghostA: 0.4, glow: 0.4, col: [0.35, 0.95, 1.0], ghostCol: [0.05, 0.3, 0.5] };
    if (c === 2) s.vox = [0.32, ease.outBack(clamp(lf / 14), 2.2)];
    if (c === 3) s.sweep = { y: lerp(-2.6, 2.6, ease.out3(clamp(lf / 18))), w: 0.04, dir: -1, ramp: true, rampLen: 3.2, rampGain: 1.4, glow: 0.3, col: [1, 1, 1] };

  } else if (f < TL.out[1] + 10 && f < TL.implode[0]) {

    if (f >= TL.pScan[0] && f < TL.pBuild[0] + 2) s.sweep = { y: lerp(-2.3, 2.6, ease.inOut3(prog(f, TL.pScan[0], TL.pScan[1]))), w: 0.06, dir: -1, ghost: 0.35, ghostA: 0.25, glow: 0.3, col: [0.35, 0.95, 1.0] };
    if (f >= TL.pBuild[0] && f < TL.pDone[0]) mo = MO(ease.inOut3(prog(f, TL.pBuild[0], TL.pDone[0])), { swirl: 3.0, lift: 1.5, curl: 1.0, trails: 4, alpha: 0.03 });
    if (f >= TL.pDone[0]) s.sizeK = lerp(0.85, 1.15, prog(f, TL.pDone[0], TL.pDone[0] + 12));

      if (f >= TL.implode[1]) { A = B = S.dot; mo = { m: 0 }; } }
    else { A = S.dot; B = S.title; mo = MO(ease.out3(prog(f, TL.relock[0], TL.relock[1])), { spread: 0.35, dur: 0.65, swirl: 2.6, lift: 2.0, curl: 1.8, axis: [0, 0, 1.2], trails: 8, trailStep: 0.01, alpha: 0.09 });
      if (f >= TL.relock[1]) { A = B = S.title; mo = { m: 0 }; s.sweep = { y: lerp(2.3, -2.3, ease.inOut3(prog(f, TL.final, TL.final + 26))), w: 0.06, ghostA: -1, glow: 0.35 }; } }

}
// 05 的鼠标：穿过树冠；规则 5 的鼠标：从左上划到右下
function curAt(f) { if (f < TL.cursor[0] || f > TL.cursor[1]) return null; const t = ease.inOut3(prog(f, TL.cursor[0], TL.cursor[1])); return [lerp(640, 1300, t), 420 + 110 * Math.sin(t * Math.PI * 1.2) - 40 * t]; }
function cur5(f) { if (f < 692 || f > 720) return null; const t = ease.inOut3(prog(f, 692, 720)); return [lerp(560, 1440, t), lerp(330, 760, t) + 90 * Math.sin(t * Math.PI * 2)]; }

// —— HUD ——
const hud = document.getElementById('hud'), ui = document.getElementById('ui'), card = document.getElementById('card');
function chapterAt(f) { let c = TL.chapters[0]; for (const x of TL.chapters) if (f >= x[0]) c = x; return c; }
const RULES = [['近大远小', 'SIZE = w · f / z', 'size = w · f / z'], ['扫描面', 'SWEEP', 'edge = e^(−|y − y₀| / w)'], ['体素', 'VOXEL', 'p → (⌊p / s⌋ + ½) · s'], ['高度色带', 'TURBO', 'color = turbo(y)'], ['拨开', 'PUSH', 'p += n · R(1 − d/R)²']];
function drawHUD(f, s) {
  const c = chapterAt(f); let h = '';
  const fin = ease.out3(clamp((f - c[0]) / 12));
  const inRules = f >= 570 && f < 720;
  if (c[1] !== '08' && !inRules) h += `<div class="chap" style="opacity:${fin};transform:translateY(${(1 - fin) * -12}px)"><span class="n">${c[1]} / 07</span><div><div class="t">${c[2]}</div><div class="s">${c[3]}</div></div></div>`;
  h += `<div class="prog">${TL.chapters.slice(0, 8).map((x, i) => { const nx = TL.chapters[i + 1][0]; return `<i><b style="width:${clamp((f - x[0]) / (nx - x[0])) * 100}%"></b></i>`; }).join('')}</div>`;
  const rule = (a, b) => ease.out3(clamp((f - a) / 10)) * (1 - ease.in3(clamp((f - b + 10) / 10)));
  const cam = PC.camera(s.cam, W, H);
  if (f < 30) { const p = cam.project(DOT); const o = 1 - prog(f, 10, 16), g = 1 - prog(f, 8, 14), r = 16 + 8 * Math.sin(f * 0.6);
    h += `<div style="position:absolute;left:${p[0] - 90}px;top:${p[1] - 90}px;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle, rgba(255,255,255,${g}) 0 3%, rgba(160,240,255,${0.55 * g}) 8%, rgba(111,243,255,${0.12 * g}) 30%, rgba(0,0,0,0) 62%)"></div>`;
    h += `<svg width="1920" height="1080" style="position:absolute;left:0;top:0;opacity:${o}"><circle cx="${p[0]}" cy="${p[1]}" r="${r}" fill="none" stroke="#6ff3ff" stroke-width="1.5"/></svg><div class="read" style="left:${p[0] + 40}px;top:${p[1] - 26}px;opacity:${o}">1 个点 <b>× ${N.toLocaleString('en-US')}</b></div>`; }
  if (f >= 90 && f < 120) h += `<div class="rule" style="opacity:${rule(92, 120)}">p = (x, y, z) · rgb · w &nbsp;<em>× ${N.toLocaleString('en-US')}</em><small>没有面、没有贴图：画面里的每一样东西，都是这批点之一。</small></div>`;
  if (f >= 140 && f < 200) { h += `<div class="rule" style="opacity:${rule(142, 200)}">一行 = 一次扫描 &nbsp;<em>300 行 × 2,667 点</em><small>House of Cards 用激光一行行扫出人脸；数据一抖，整行就错开。</small></div>`;
    for (const g of TL.glitch) if (f >= g && f < g + 6) { const yRow = 300 + ((g * 37) % 420); h += `<div class="tag" style="left:1240px;top:${yRow}px"><b>●</b> 第 ${Math.round(g * 1.7) % 300} 行 · 偏移 ${(0.55 * (1 - (f - g) / 6)).toFixed(2)}</div>`; } }
  if (f >= 236 && f < 296) { const a = s.sweep ? s.sweep.y : 0; h += `<div class="rule" style="opacity:${rule(238, 296)}">r<sub>k</sub> = h / tan θ<sub>k</sub> &nbsp;<em>64 束 · θ = +2° … −24.8°</em><small>每一束激光的仰角固定，转一圈就在地上画一个圈；车和人挡住它，圈就断了。</small></div>`;
    h += `<div class="read" style="right:64px;top:140px">方位 <b>${((a * 57.3) % 360).toFixed(0)}°</b> · 第 ${a < 6.283 ? 1 : 2} 圈<br>距离着色 <b>0 → 62 m</b></div>`; }
  if (f >= 312 && f < 386) { const sy = s.sweep ? s.sweep.y : 0; h += `<div class="rule" style="opacity:${rule(314, 386)}">${f < TL.voxel[0] ? `edge = e<sup>−|y − y₀| / w</sup> &nbsp;<em>y₀ = ${(sy / 0.22).toFixed(1)} m</em><small>扫过的地方是照片投上去的真颜色，下面还只有激光测出来的位置。</small>` : `体素降采样 &nbsp;<em>s = 1.0 m</em><small>每个格子只留一个点——数据少一百倍，形状还认得出来。</small>`}</div>`; }
  if (f >= 410 && f < 480) h += `<div class="rule" style="opacity:${rule(412, 480)}">p += curl(p, t) · Δt &nbsp;<em>× 3 步</em><small>每个点顺着一个会变的“风”走：一百万个点，就是一幅会流动的颜料画。</small></div>`;
  if (f >= 500 && f < 570) { h += `<div class="rule" style="opacity:${rule(502, 570)}">点 → 面 &nbsp;<em>size × ${s.sizeK.toFixed(2)}</em><small>每个点长成一个小圆片，彼此盖住，就连成了表面——高斯泼溅就是这么“画”出照片感的。</small></div>`;
    const q = curAt(f); if (q) h += `<svg style="position:absolute;left:${q[0] - 3}px;top:${q[1] - 3}px" width="30" height="30" viewBox="0 0 22 22"><path d="M2 2 L2 18 L7 13 L10 20 L13 19 L10 12 L17 12 Z" fill="#fff" stroke="#000" stroke-width="1"/></svg>`; }
  if (inRules) { const k = Math.floor((f - 570) / 30), lf = (f - 570) % 30, r = RULES[k], sc = 1 + 0.25 * (1 - ease.out3(clamp(lf / 7)));

    if (k === 4) { const q = cur5(f); if (q) h += `<svg style="position:absolute;left:${q[0] - 3}px;top:${q[1] - 3}px" width="30" height="30" viewBox="0 0 22 22"><path d="M2 2 L2 18 L7 13 L10 20 L13 19 L10 12 L17 12 Z" fill="#fff" stroke="#000" stroke-width="1"/></svg>`; } }

}
const POT = [[-1.45, BY + 0.62, 0.15], [1.45, BY + 0.62, -0.1]];
function drawUI(f, s) {
  let h = '';
  const inP = ease.inOut3(prog(f, TL.mask[0], TL.mask[1])) * (1 - ease.inOut3(prog(f, TL.out[0], TL.out[1])));
  if (inP > 0.001) {
    const w = lerp(2200, 440, inP), hh = lerp(1300, 920, inP), r = lerp(0, 60, inP), top = 540 - hh / 2;
    h += `<div id="mask" style="width:${w}px;height:${hh}px;margin:${-hh / 2}px 0 0 ${-w / 2}px;border-radius:${r}px"></div>`;
    if (inP > 0.6) h += `<div id="bezel" style="width:${w}px;height:${hh}px;margin:${-hh / 2}px 0 0 ${-w / 2}px;opacity:${(inP - 0.6) / 0.4}"></div>`;
    const o = clamp((inP - 0.85) / 0.15);
    if (o > 0) {
      h += `<div class="sb" style="left:${960 - w / 2 + 40}px;width:${w - 80}px;top:${top + 26}px;opacity:${o}"><span>9:41</span><span>●●● 100</span></div>`;
      h += `<div style="position:absolute;left:900px;top:${top + 18}px;width:120px;height:34px;border-radius:20px;background:#000;opacity:${o}"></div>`;
      const st = f < TL.pBuild[0] ? '<b>●</b> 正在扫描 · 慢一点' : f < TL.pDone[0] ? '<b>●</b> 聚拢中 · 高斯泼溅' : f < TL.tap1 ? '<b>●</b> 完成 · 可以拨开' : f < TL.place[0] ? '<b>●</b> 量尺寸' : '<b>●</b> 放进房间';
      h += `<div class="ph" style="top:${top + 92}px;opacity:${o}"><div class="lab">${st}</div></div>`;
      const cam = PC.camera(s.cam, W, H);
      if (f < TL.pBuild[0]) {
        const cov = prog(f, TL.pScan[0], TL.pScan[1]), n = Math.round(cov * 612480), C = cam.project([0, BY, 0]); let t = '';
        for (let k = 0; k < 60; k++) { const a = k / 60 * Math.PI * 2, on = k < cov * 60, r0 = 150, r1 = on ? 172 : 164;
          t += `<line x1="${C[0] + Math.cos(a) * r0}" y1="${C[1] + Math.sin(a) * r0 * 0.34}" x2="${C[0] + Math.cos(a) * r1}" y2="${C[1] + Math.sin(a) * r1 * 0.34}" stroke="${on ? '#6ff3ff' : 'rgba(255,255,255,.3)'}" stroke-width="3"/>`; }
        h += `<svg width="1920" height="1080" style="position:absolute;left:0;top:0;opacity:${o}">${t}</svg>`;
        h += `<div class="pill" style="top:${top + hh - 230}px;opacity:${o}">已采 ${n.toLocaleString('en-US')} 点 · 绕到右边</div><div class="shutter" style="top:${top + hh - 140}px;opacity:${o}"><i></i></div>`;
      } else if (f < TL.pDone[0]) {
        const p = prog(f, TL.pBuild[0], TL.pDone[0]);
        h += `<div class="pbar" style="left:${960 - 170}px;width:340px;top:${top + hh - 110}px;opacity:${o}"><div class="t"><span>聚拢 ${Math.round(p * 612480).toLocaleString('en-US')} / 612,480</span><span>${Math.round(p * 100)}%</span></div><div class="b"><i style="width:${p * 100}%"></i></div></div>`;
      } else {
        // 量尺寸：点两下，拉一根线
        const a = cam.project(POT[0]), b = cam.project(POT[1]);
        if (f >= TL.tap1) { const t = (f - TL.tap1) / 20; if (t < 1) h += `<div class="touch" style="left:${a[0] - 20 - t * 30}px;top:${a[1] - 20 - t * 30}px;width:${40 + t * 60}px;height:${40 + t * 60}px;opacity:${1 - t}"></div>`;
          h += `<svg width="1920" height="1080" style="position:absolute;left:0;top:0"><circle cx="${a[0]}" cy="${a[1]}" r="7" fill="#6ff3ff"/></svg>`; }
        if (f >= TL.tap2) { const t = (f - TL.tap2) / 20, L = ease.out3(prog(f, TL.tap2, TL.tap2 + 12)); const ex = lerp(a[0], b[0], L), ey = lerp(a[1], b[1], L);
          if (t < 1) h += `<div class="touch" style="left:${b[0] - 20 - t * 30}px;top:${b[1] - 20 - t * 30}px;width:${40 + t * 60}px;height:${40 + t * 60}px;opacity:${1 - t}"></div>`;
          h += `<svg width="1920" height="1080" style="position:absolute;left:0;top:0"><line x1="${a[0]}" y1="${a[1]}" x2="${ex}" y2="${ey}" stroke="#6ff3ff" stroke-width="3" stroke-dasharray="8 6"/><circle cx="${b[0]}" cy="${b[1]}" r="${7 * L}" fill="#6ff3ff"/></svg>`;
          const lo = ease.outBack(prog(f, TL.tap2 + 8, TL.tap2 + 18)); h += `<div class="tag" style="left:${(a[0] + b[0]) / 2 - 60}px;top:${(a[1] + b[1]) / 2 - 56}px;transform:scale(${lo});font-size:20px"><b>↔</b> 38.2 cm</div>`; }
        const ra = ease.outBack(prog(f, TL.pDone[0], TL.pDone[0] + 14));
        h += `<div class="res" style="left:${960 - 190}px;width:380px;top:${top + hh - 210}px;opacity:${clamp(ra) * o};transform:translateY(${(1 - clamp(ra)) * 30}px)"><h3>窗台上的五针松</h3><p>612,480 PTS · 宽 38.2 cm · .PLY / .SPLAT</p><div class="row"><span class="on" style="${f >= TL.place[0] && f < TL.place[0] + 8 ? 'transform:scale(.94)' : ''}">放进房间</span><span>分享</span></div></div>`;
        if (f >= TL.place[0]) { const g = ease.out3(prog(f, TL.place[0] + 4, TL.place[1])); let gl2 = '';
          for (let k = -6; k <= 6; k++) { const z0 = cam.project([k * 0.8, BY, -5]), z1 = cam.project([k * 0.8, BY, 5]); gl2 += `<line x1="${z0[0]}" y1="${z0[1]}" x2="${z1[0]}" y2="${z1[1]}"/>`; const x0 = cam.project([-5, BY, k * 0.8]), x1 = cam.project([5, BY, k * 0.8]); gl2 += `<line x1="${x0[0]}" y1="${x0[1]}" x2="${x1[0]}" y2="${x1[1]}"/>`; }
          h = h.replace('<div class="sb"', `<svg width="1920" height="1080" style="position:absolute;left:0;top:0;opacity:${g * 0.5}" stroke="#6ff3ff" stroke-width="1">${gl2}</svg><div class="sb"`); }
      }
    }
  }
  ui.innerHTML = h;
  let c = '';
  if (f >= 1040) { const a = ease.out3(prog(f, 1040, 1060)), b = ease.out3(prog(f, 1050, 1070));
    c += `<div class="ct" style="opacity:${a};transform:translateY(${(1 - a) * 16}px)"><h2>POINT CLOUD</h2><p>世界不是面，是几百万个带颜色的点。</p></div>`;
    c += `<div class="by" style="opacity:${b}"><b>观默</b><br>每天一个设计风格 · 点云</div>`; }
  card.innerHTML = c;
}

// —— 入口 ——
(async () => {
  await document.fonts.load('900 100px NotoSC', '点云'); await document.fonts.ready;
  const cv = document.getElementById('gl'); cv.width = Math.round(W * SCALE); cv.height = Math.round(H * SCALE);
  gl = GLK.create(cv); P = PC.makeMorphProgram(gl); target = GLK.fbo(gl, cv.width, cv.height); post = GLK.post(gl);
  const R = PC.mulberry(13), t0 = performance.now();
  const mk = (id, data) => { const d = PC.toN(data, N, R); return { id, buf: PC.uploadShape(gl, d) }; };
  S.dot = mk('dot', dot(R));
  S.title = mk('title', title(R));
  S.head = mk('head', SHAPES.head(N, R));
  S.street = mk('street', SHAPES.street(N, R));
  S.stairs = mk('stairs', xform(PC.staircase({ turns: 10, density: 520, falloff: 6.5 }).cloud.data, 0.22, [0, 0, 0]));
  S.wall = mk('wall', SHAPES.wall(N, R));
  S.bonsai = mk('bonsai', xform(PC.bonsai({ seed: 9 }).cloud.data, BS, [0, BY, 0], 0.8));
  S.terrain = mk('terrain', SHAPES.terrain(N, R));
  console.log('shapes ready', Math.round(performance.now() - t0), 'ms');
  window.ready = true;
})().catch(e => console.log('ERR', e.message.slice(0, 2000)));

window.frame = async (f) => {
  const s = sceneAt(f);
  await PC.drawMorph(gl, P, target, s.A, s.B, s);
  const hits = [[TL.burst, 0.5], [TL.lock, 0.25], [TL.toHead[1], 0.12], [TL.dissolve[1], 0.15], [TL.drain[1], 0.12], [TL.voxel[1], 0.15], [TL.toBonsai[1], 0.15], ...TL.cards.map(c => [c, 0.12]), [TL.mask[1], 0.1], [TL.burst2, 0.6], [TL.final, 0.25]];
  const flash = hits.reduce((a, [h, A]) => a + (f >= h ? A * Math.exp(-(f - h) / 5) : 0), 0);
  const big = f < 120 || f >= 1020;
  await post(target.tex, { exposure: 1.05 * (1 + flash), bloom: big ? 0.8 : 0.5, threshold: big ? 0.55 : 0.9, grain: 0.02, vignette: 0.4, ca: 0.004, saturation: 1.1, seed: f * 0.37 });

  gl.finish();
};
window.events = () => TL;
</script>
