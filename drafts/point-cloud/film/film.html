<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>点云 · 全片</title>
<style>
@font-face { font-family: 'Geist'; src: url(../../../public/fonts/Geist.ttf); font-weight: 100 900; }
@font-face { font-family: 'GeistMono'; src: url(../../../public/fonts/GeistMono.ttf); font-weight: 100 900; }
@font-face { font-family: 'NotoSC'; src: url(../../../public/fonts/NotoSansSC-Black.otf); font-weight: 900; }
@font-face { font-family: 'NotoSC'; src: url(../../../public/fonts/NotoSansSC-Bold.otf); font-weight: 700; }
@font-face { font-family: 'NotoSC'; src: url(../../../public/fonts/NotoSansSC-Medium.otf); font-weight: 500; }
@font-face { font-family: 'NotoSC'; src: url(../../../public/fonts/NotoSansSC-Regular.otf); font-weight: 400; }
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1920px; height: 1080px; overflow: hidden; background: #000; color: #ecf4f6; font-family: Geist, NotoSC, sans-serif; }
#gl { position: absolute; inset: 0; width: 1920px; height: 1080px; }
#hud, #ui, #card { position: absolute; inset: 0; pointer-events: none; }
.chap { position: absolute; left: 64px; top: 54px; display: flex; gap: 18px; align-items: flex-start; }
.chap .n { font-family: GeistMono; font-size: 13px; color: #000; background: #6ff3ff; padding: 3px 7px; border-radius: 3px; margin-top: 3px; }
.chap .t { font-family: NotoSC; font-weight: 700; font-size: 22px; line-height: 1.2; }
.chap .s { font-family: NotoSC; font-size: 14px; color: #93a0a8; margin-top: 6px; }
.prog { position: absolute; right: 64px; top: 62px; display: flex; gap: 6px; }
.prog i { width: 26px; height: 3px; background: rgba(255,255,255,.18); display: block; border-radius: 2px; overflow: hidden; position: relative; }
.prog i b { position: absolute; left: 0; top: 0; bottom: 0; background: #6ff3ff; display: block; }
.rule { position: absolute; left: 64px; bottom: 58px; font-family: GeistMono; font-size: 15px; color: #fff; padding: 10px 14px; background: rgba(0,0,0,.55); border-left: 2px solid #6ff3ff; }
.rule small { display: block; font-family: NotoSC; font-size: 14px; color: #a7b3ba; margin-top: 8px; letter-spacing: 0; }
.rule em { font-style: normal; color: #6ff3ff; }
.read { position: absolute; font-family: GeistMono; font-size: 14px; line-height: 1.7; color: #fff; padding: 12px 16px; background: rgba(0,0,0,.62); border: 1px solid rgba(111,243,255,.5); border-radius: 6px; white-space: nowrap; }
.read b { color: #6ff3ff; font-weight: 500; }
.ztick { position: absolute; right: 64px; top: 140px; font-family: GeistMono; font-size: 13px; color: #cfe0e5; text-align: right; line-height: 1.8; }
.ztick b { font-size: 28px; color: #6ff3ff; font-weight: 500; display: block; }
#mask { position: absolute; left: 50%; top: 50%; box-shadow: 0 0 0 3000px #030405; }
#bezel { position: absolute; left: 50%; top: 50%; border-radius: 64px; box-shadow: 0 0 0 10px #141618, 0 0 0 11px rgba(255,255,255,.18), 0 40px 120px rgba(0,0,0,.7); }
.ph { position: absolute; left: 50%; transform: translateX(-50%); text-align: center; white-space: nowrap; }
.ph .lab { font-family: GeistMono; font-size: 14px; color: #9aa6ad; }
.ph .lab b { color: #6ff3ff; font-weight: 500; }
.pill { position: absolute; left: 50%; transform: translateX(-50%); white-space: nowrap; font-family: NotoSC; font-size: 18px; font-weight: 500; background: rgba(0,0,0,.6); border: 1px solid rgba(255,255,255,.18); border-radius: 999px; padding: 10px 20px; }
.shutter { position: absolute; left: 50%; width: 92px; height: 92px; margin-left: -46px; border-radius: 50%; border: 4px solid #fff; display: grid; place-items: center; }
.shutter i { width: 70px; height: 70px; border-radius: 50%; background: #6ff3ff; display: block; box-shadow: 0 0 30px rgba(111,243,255,.6); }
.pbar { position: absolute; }
.pbar .t { display: flex; justify-content: space-between; font-family: GeistMono; font-size: 14px; color: #cfe0e5; }
.pbar .b { height: 6px; border-radius: 3px; background: rgba(255,255,255,.14); margin-top: 10px; overflow: hidden; }
.pbar .b i { display: block; height: 100%; background: linear-gradient(90deg, #6ff3ff, #fff); }
.res { position: absolute; border-radius: 28px; background: rgba(12,14,16,.8); border: 1px solid rgba(255,255,255,.14); padding: 20px 24px; }
.res h3 { font-family: NotoSC; font-weight: 700; font-size: 24px; }
.res p { font-family: GeistMono; font-size: 13px; color: #9aa6ad; margin-top: 6px; }
.res .row { display: flex; gap: 10px; margin-top: 16px; }
.res .row span { flex: 1; text-align: center; font-family: NotoSC; font-size: 17px; font-weight: 700; border-radius: 999px; padding: 11px 0; border: 1px solid rgba(255,255,255,.22); }
.res .row span.on { background: #6ff3ff; color: #031013; border-color: #6ff3ff; }
.sb { position: absolute; display: flex; justify-content: space-between; font-family: GeistMono; font-size: 16px; font-weight: 600; }
#card .ct { position: absolute; left: 64px; bottom: 60px; }
#card h2 { font-family: GeistMono; font-weight: 400; font-size: 28px; letter-spacing: .42em; }
#card p { font-family: NotoSC; font-size: 20px; color: #a7b3ba; margin-top: 14px; }
#card .by { position: absolute; right: 64px; bottom: 60px; text-align: right; font-family: GeistMono; font-size: 13px; color: #93a0a8; line-height: 1.9; }
#card .by b { font-family: NotoSC; font-size: 22px; color: #fff; font-weight: 700; letter-spacing: .1em; }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="ui"></div>
<div id="hud"></div>
<div id="card"></div>
<script src="../../_lib/glkit.js"></script>
<script src="../pc.js"></script>
<script src="timeline.js"></script>
<script>
const Q = new URLSearchParams(location.search);
const SCALE = +(Q.get('scale') || 1);
const W = 1920, H = 1080, FPS = 60, N = +(Q.get('n') || 1000000);
let gl, P, target, post, S = {}, probe = null, cursorPath = [];
const TY = 6.0, BY = -37, BS = 8, TY2 = -33.6;   // 标题高度；井底；盆景放大倍数；片尾标题高度

// —— 形状 ——
// 开场：一百万个点挤在同一个点上（半径 2 cm 的一小团）
function dot(R) {
  const C = PC.Cloud(N + 10);
  for (let i = 0; i < N; i++) { const u = R() * 2 - 1, a = R() * 6.283, r = 0.02 * Math.cbrt(R()), s = Math.sqrt(1 - u * u);
    C.push(Math.cos(a) * s * r, TY + 0.1 + u * r, 1.2 + Math.sin(a) * s * r, 0.9, 0.97, 1.0, 0.004, R(), 0, 0); }
  return C.data;
}
function title(R, cy) {
  const Wm = 2400, Hm = 900, cv = document.createElement('canvas'); cv.width = Wm; cv.height = Hm; const x = cv.getContext('2d');
  x.fillStyle = '#fff'; x.font = '900 760px NotoSC'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText('点云', Wm / 2, Hm / 2 + 30);
  const m = x.getImageData(0, 0, Wm, Hm).data, inside = (px, py) => px >= 0 && py >= 0 && px < Wm && py < Hm && m[((py | 0) * Wm + (px | 0)) * 4 + 3] > 128;
  const sc = 9.4 / Wm, C = PC.Cloud(N + 10), Z = 0.26;
  const grad = (u, v) => { // 斜向渐变：洋红 → 橙 → 暖黄
    const t = Math.min(1, Math.max(0, u * 0.75 + (1 - v) * 0.35)); const a = [1.0, 0.12, 0.45], b = [1.0, 0.45, 0.1], c = [1.0, 0.82, 0.25];
    return t < 0.5 ? a.map((v, i) => v + (b[i] - v) * t * 2) : b.map((v, i) => v + (c[i] - v) * (t - 0.5) * 2); };
  let n = 0;
  while (n < N) {
    const px = R() * Wm, py = R() * Hm; if (!inside(px, py)) continue;
    const kind = R(); let z, shade;
    const edge = !inside(px + 6, py) || !inside(px - 6, py) || !inside(px, py + 6) || !inside(px, py - 6);
    if (edge && kind < 0.55) { z = (R() * 2 - 1) * Z; shade = 0.5; } else if (kind < 0.72) { z = -Z; shade = 0.28; } else { z = Z; shade = 1.0; }
    const g = grad(px / Wm, py / Hm), j = 0.88 + R() * 0.24;
    C.push((px - Wm / 2) * sc, cy - (py - Hm / 2) * sc, z, g[0] * shade * j, g[1] * shade * j, g[2] * shade * j, 0.006, R(), 0, 0); n++;
  }
  return C.data;
}
function bonsaiBig(R) {
  const B = PC.bonsai({ seed: 9 }).cloud.data, out = new Float32Array(B.length);
  for (let i = 0; i < B.length / 10; i++) { const o = i * 10; out.set(B.subarray(o, o + 10), o); out[o] *= BS; out[o + 1] = out[o + 1] * BS + BY; out[o + 2] *= BS; out[o + 6] *= BS * 0.8; }
  return out;
}
// —— 相机 ——
const V = { add: (a, b) => a.map((v, i) => v + b[i]), mix: (a, b, t) => a.map((v, i) => v + (b[i] - v) * t), nrm: a => { const l = Math.hypot(...a); return a.map(v => v / l); } };
const camMix = (a, b, t) => ({ pos: V.mix(a.pos, b.pos, t), tgt: V.mix(a.tgt, b.tgt, t), up: V.nrm(V.mix(a.up, b.up, t)), fov: lerp(a.fov, b.fov, t) });
const WELL = { pos: [-1.7, 2.2, 0.6], tgt: [1.6, -20, -0.3], up: [1, 0, 0], fov: 62 };
const spiral = (f) => { const q = ease.inOut3(prog(f, 300, 520)), th = q * Math.PI * 1.25, y = lerp(2.2, -14, q), r = 1.7;
  return { pos: [-Math.cos(th) * r, y, -Math.sin(th) * r * 0.35 + 0.6 * (1 - q)], tgt: [Math.cos(th) * 1.6, y - 22, Math.sin(th) * 0.5], up: [Math.cos(th), 0, Math.sin(th)], fov: 62 }; };
const SIDE = (a) => ({ pos: [Math.sin(a) * 10.5, -31.2, Math.cos(a) * 10.5], tgt: [0, -34.3, 0], up: [0, 1, 0], fov: 40 });
function camAt(f) {
  if (f < 150) { const a = lerp(-0.32, 0.0, ease.inOut3(prog(f, 0, 150))), R = lerp(15.5, 12.2, ease.out3(prog(f, 0, 150))); return { pos: [Math.sin(a) * R, TY + 0.4 - 0.34 * prog(f, 0, 150), Math.cos(a) * R], tgt: [0, TY, 0], up: [0, 1, 0], fov: 42 }; }
  if (f < 236) { const z = logLerp(12.2, 0.88, ease.inOut3(prog(f, 150, 206))); const dx = 0.16 * ease.inOut3(prog(f, 190, 236)); return { pos: [0.02 + dx, TY + 0.06, z], tgt: [0.02 + dx * 0.2, TY + 0.06, z - 5], up: [0, 1, 0], fov: 42 }; }
  if (f < 306) { const a = { pos: [0.18, TY + 0.06, 0.88], tgt: [0.052, TY + 0.06, -4.12], up: [0, 1, 0], fov: 42 }; return camMix(a, WELL, ease.inOut3(prog(f, 236, 306))); }
  if (f < 520) return f < 320 ? camMix(WELL, spiral(f), prog(f, 306, 320)) : spiral(f);
  if (f < 640) return camMix(spiral(520), SIDE(0.5), ease.inOut3(prog(f, 520, 640)));
  if (f < 800) return SIDE(lerp(0.5, 0.95, ease.inOut3(prog(f, 640, 800))));
  const PH = { pos: [Math.sin(0.95) * 15, -32.6, Math.cos(0.95) * 15], tgt: [0, -33.9, 0], up: [0, 1, 0], fov: 40 };
  if (f < 960) { const a = SIDE(0.95); const b = { ...PH, pos: [Math.sin(0.95 + 0.4 * prog(f, 925, 960)) * 15, -32.6, Math.cos(0.95 + 0.4 * prog(f, 925, 960)) * 15] }; return camMix(a, b, ease.inOut3(prog(f, 800, 840))); }
  const PH2 = { pos: [Math.sin(1.35) * 15, -32.6, Math.cos(1.35) * 15], tgt: [0, -33.9, 0], up: [0, 1, 0], fov: 40 };
  const FR = { pos: [0, TY2 + 0.2, 15.5], tgt: [0, TY2, 0], up: [0, 1, 0], fov: 42 };
  return camMix(PH2, FR, ease.inOut3(prog(f, 966, 1040)));
}
function unproject(cam, px, py, planePt) {
  const n = V.nrm, cr = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]], dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
  const fw = n(cam.tgt.map((v, i) => v - cam.pos[i])), rt = n(cr(fw, cam.up)), up = cr(rt, fw), k = Math.tan(cam.fov * Math.PI / 360);
  const d = n([0, 1, 2].map(i => fw[i] + rt[i] * ((px / W - 0.5) * 2 * k * W / H) + up[i] * ((0.5 - py / H) * 2 * k)));
  const t = dot(planePt.map((v, i) => v - cam.pos[i]), fw) / dot(d, fw);
  return cam.pos.map((v, i) => v + d[i] * t);
}

// —— 一帧 ——
function sceneAt(f) {
  const s = { N, T: f / FPS, cam: camAt(f), minSize: 1.25, sizeK: 0.75, gain: 1.0, falloff: 6.5, near: [0.05, 0.3], dof: { focus: 14, aperture: 0.004 } };
  let A = S.title, B = S.title;
  if (f < 150) {
    A = S.tunnel; B = S.title;
    s.morph = { m: ease.out3(prog(f, TL.assemble[0], TL.assemble[1])), spread: 0.5, dur: 0.5, swirl: 2.6, lift: 2.6, curl: 2.2, axis: [0, TY, 1.2], trails: 8, trailStep: 0.01, alpha: 0.11 };
    if (f >= TL.assemble[1]) { A = B = S.title; s.morph = { m: 0 }; }
    s.dof = { focus: 13.5, aperture: 0.006 };
    s.near = [0.2, 2.5];
    if (f >= TL.scanTitle[0] - 4) s.sweep = { y: lerp(TY + 2.2, TY - 2.2, ease.inOut3(prog(f, TL.scanTitle[0], TL.scanTitle[1]))), w: 0.06, dir: 1, ghostA: -1, glow: 0.35 };
  } else if (f < 236) {
    s.dof = { focus: 1, aperture: 0 };
    s.sizeK = lerp(0.75, 0.26, ease.inOut3(prog(f, 166, 206))); s.gain = lerp(1.0, 1.6, prog(f, 166, 206)); s.near = [0.02, 0.06];
  } else if (f < 306) {
    A = S.title; B = S.stairs;
    s.morph = { m: ease.inOut3(prog(f, TL.pour[0], TL.pour[1])), spread: 0.5, dur: 0.5, swirl: 1.6, lift: -2.0, curl: 0.7, axis: [0, 0, 0], trails: 6, trailStep: 0.012, alpha: 0.05 };
    s.dof = { focus: 8, aperture: 0.004 }; s.near = [0.6, 4];
    s.sweep = { y: 0.6, w: 0.16, dir: 1, ramp: true, rampLen: 26, glow: 0.14, col: [0.35, 0.95, 1.0] };
  } else if (f < 640) {
    A = S.stairs; B = S.stairs; s.sizeK = 0.62; s.near = [1.5, 8];
    const sy = lerp(0.6, -30, ease.inOut3(prog(f, TL.sweep[0], TL.sweep[1])));
    s.sweep = { y: sy, w: 0.14, dir: 1, ramp: true, rampLen: 26, glow: 0.14, col: [0.35, 0.95, 1.0] };
    s.dof = { focus: Math.max(4, camAt(f).pos[1] - sy), aperture: 0.006 };
    if (f >= TL.twist[0]) {
      B = S.bonsai;
      s.morph = { m: ease.inOut3(prog(f, TL.twist[0], TL.twist[1] - 6)), spread: 0.55, dur: 0.45, swirl: 4.2, lift: 3.0, curl: 1.0, axis: [0, -30, 0], trails: 8, trailStep: 0.01, alpha: 0.03 };
      s.dof = { focus: 12, aperture: 0.004 }; s.near = [0.5, 3];
      if (f >= TL.twist[1] - 6) { A = B = S.bonsai; s.morph = { m: 0 }; }
    }
  } else {
    A = B = S.bonsai; s.sizeK = 0.85; s.dof = { focus: 11, aperture: 0.004 }; s.near = [0.5, 3];
    // 04：鼠标划过树冠
    if (f >= TL.cursor[0] - 2 && f < TL.cursor[1] + 40) {
      const c = s.cam; s.push = [];
      for (let k = 0; k < 6; k++) { const fa = f - k * 5; const q = curAt(fa); if (!q) continue; const age = (f - fa) / 30;
        const w = unproject(c, q[0], q[1], [0, -34, 0]); s.push.push([...w, 0.75 * Math.max(0, 1 - age * 0.9)]); }
    }
    // 05：手机里——从下往上扫，扫完重新聚一次
    if (f >= TL.pScan[0] && f < TL.pBuild[0] + 2) s.sweep = { y: lerp(BY - 0.2, BY + 6.2, ease.inOut3(prog(f, TL.pScan[0], TL.pScan[1]))), w: 0.08, dir: -1, ghost: 0.35, ghostA: 0.25, glow: 0.3, col: [0.35, 0.95, 1.0] };
    if (f >= TL.pBuild[0] && f < TL.pDone[0]) s.morph = { m: ease.inOut3(prog(f, TL.pBuild[0], TL.pDone[0])), spread: 0.5, dur: 0.5, swirl: 3.0, lift: 1.5, curl: 1.2, axis: [0, -34, 0], trails: 6, trailStep: 0.012, alpha: 0.06 };
    if (f >= TL.pDone[0]) s.sizeK = lerp(0.85, 1.12, prog(f, TL.pDone[0], TL.pDone[0] + 12));
    if (f >= TL.regroup[0]) {
      A = S.bonsai; B = S.title2; s.sizeK = 0.8;
      s.morph = { m: ease.inOut3(prog(f, TL.regroup[0], TL.regroup[1])), spread: 0.5, dur: 0.5, swirl: 2.2, lift: 2.5, curl: 1.0, axis: [0, -34, 0], trails: 6, trailStep: 0.012, alpha: 0.035 };
      s.dof = { focus: 15, aperture: 0.004 };
      if (f >= TL.regroup[1]) { A = B = S.title2; s.morph = { m: 0 }; s.sweep = { y: lerp(TY2 + 2.2, TY2 - 2.2, ease.inOut3(prog(f, 1046, 1076))), w: 0.06, dir: 1, ghostA: -1, glow: 0.35 }; }
    }
  }
  s.A = A; s.B = B;
  return s;
}
// 鼠标轨迹（屏幕坐标）：从左往右穿过树冠，带一点弧
function curAt(f) { if (f < TL.cursor[0] || f > TL.cursor[1]) return null; const t = ease.inOut3(prog(f, TL.cursor[0], TL.cursor[1]));
  return [lerp(560, 1360, t), 430 + 140 * Math.sin(t * Math.PI * 1.2) - 60 * t]; }

// —— HUD / 界面 ——
const hud = document.getElementById('hud'), ui = document.getElementById('ui'), card = document.getElementById('card');
function chapterAt(f) { let c = TL.chapters[0]; for (const x of TL.chapters) if (f >= x[0]) c = x; return c; }
function drawHUD(f, s, cam) {
  const c = chapterAt(f); let h = '';
  const fin = ease.out3(clamp((f - c[0]) / 14));
  if (c[1] !== '06') h += `<div class="chap" style="opacity:${fin};transform:translateY(${(1 - fin) * -10}px)"><span class="n">${c[1]} / 05</span><div><div class="t">${c[2]}</div><div class="s">${c[3]}</div></div></div>`;
  h += `<div class="prog">${TL.chapters.slice(0, 6).map((x, i) => { const nx = TL.chapters[i + 1][0]; return `<i><b style="width:${clamp((f - x[0]) / (nx - x[0])) * 100}%"></b></i>`; }).join('')}</div>`;
  const rule = (a, b) => ease.out3(clamp((f - a) / 12)) * (1 - ease.in3(clamp((f - b + 12) / 12)));
  if (f < 40) { const p = PC.camera(cam, W, H).project([0, TY + 0.1, 1.2]); const o = 1 - prog(f, 14, 26), r = 16 + 10 * Math.sin(f * 0.5), g = 1 - prog(f, 10, 18);
    h += `<div style="position:absolute;left:${p[0] - 90}px;top:${p[1] - 90}px;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle, rgba(255,255,255,${g}) 0 3%, rgba(160,240,255,${0.55 * g}) 8%, rgba(111,243,255,${0.12 * g}) 30%, rgba(0,0,0,0) 62%)"></div><div style="position:absolute;left:${p[0] - 140}px;top:${p[1] - 1}px;width:280px;height:2px;background:linear-gradient(90deg, transparent, rgba(200,250,255,${0.8 * g}), transparent)"></div><div style="position:absolute;left:${p[0] - 1}px;top:${p[1] - 100}px;width:2px;height:200px;background:linear-gradient(180deg, transparent, rgba(200,250,255,${0.6 * g}), transparent)"></div>`;
    h += `<svg width="1920" height="1080" style="position:absolute;left:0;top:0;opacity:${o}"><circle cx="${p[0]}" cy="${p[1]}" r="${r}" fill="none" stroke="#6ff3ff" stroke-width="1.5"/><line x1="${p[0] - 60}" y1="${p[1]}" x2="${p[0] - r - 6}" y2="${p[1]}" stroke="#6ff3ff"/><line x1="${p[0] + r + 6}" y1="${p[1]}" x2="${p[0] + 60}" y2="${p[1]}" stroke="#6ff3ff"/></svg><div class="read" style="left:${p[0] + 76}px;top:${p[1] - 26}px;opacity:${o}">1 个点 <b>× ${N.toLocaleString('en-US')}</b></div>`; }
  if (f >= 96 && f < 150) h += `<div class="rule" style="opacity:${rule(100, 150)}">p = (x, y, z) · rgb · w &nbsp;<em>× ${N.toLocaleString('en-US')}</em><small>没有面、没有贴图：画面里的每一样东西，都是这一百万个点之一。</small></div>`;
  if (f >= 150 && f < 236) {
    h += `<div class="rule" style="opacity:${rule(160, 236)}">size = w · f / z &nbsp;<em>z = ${(cam.pos[2] - 0.26).toFixed(2)} m</em><small>离得越近，点在屏幕上越大；再近一点，它们就散成一个个圆斑。</small></div>`;
    if (f >= TL.probe[0] && probe) {
      const o = ease.out3(prog(f, TL.probe[0], TL.probe[0] + 10)) * (1 - prog(f, 228, 236));
      const pp = PC.camera(cam, W, H).project(probe.p); const px = probe.w * PC.camera(cam, W, H).fpx / pp[2];
      h += `<svg width="1920" height="1080" style="position:absolute;left:0;top:0;opacity:${o}"><circle cx="${pp[0]}" cy="${pp[1]}" r="${Math.max(10, px * 0.6)}" fill="none" stroke="#6ff3ff" stroke-width="1.5"/><polyline points="${pp[0] + Math.max(10, px * 0.6)},${pp[1]} ${pp[0] + 120},${pp[1] - 90} ${pp[0] + 170},${pp[1] - 90}" fill="none" stroke="#6ff3ff" stroke-width="1.2"/></svg>`;
      h += `<div class="read" style="left:${pp[0] + 180}px;top:${pp[1] - 136}px;opacity:${o}">点 #${probe.i.toLocaleString('en-US')}<br><b>x</b> ${probe.p[0].toFixed(3)} &nbsp;<b>y</b> ${probe.p[1].toFixed(3)} &nbsp;<b>z</b> ${probe.p[2].toFixed(3)}<br><b>rgb</b> ${probe.c.map(v => Math.round(Math.min(1, v) * 255)).join(' ')}<span style="display:inline-block;width:12px;height:12px;margin-left:8px;background:rgb(${probe.c.map(v => Math.round(Math.min(1, v) * 255)).join(',')})"></span><br><b>w</b> ${(probe.w * 1000).toFixed(1)} mm → <b>${px.toFixed(0)} px</b></div>`;
    }
  }
  if (f >= 236 && f < 306) h += `<div class="rule" style="opacity:${rule(246, 306)}">第 i 个点：A[i] → B[i] &nbsp;<em>出发 = 0.65·排名 + 0.35·随机</em><small>两个形状都按高度排好队，字的上面倒进井的上面；一波一波地走，不是一起走。</small></div>`;
  if (f >= 306 && f < 510) { const sy = s.sweep ? s.sweep.y : 0;
    h += `<div class="rule" style="opacity:${rule(316, 510)}">edge = e<sup>−|y − y₀| / w</sup> &nbsp;<em>w = 0.14 m</em><small>扫描面往下走：上面是照片投上去的真颜色，下面还只有激光测出来的“位置”，按高度染成色带。</small></div>`;
    h += `<div class="ztick" style="opacity:${rule(316, 510)}"><b>y₀ = ${sy.toFixed(2)} m</b>扫描面</div>`; }
  if (f >= 510 && f < 640) h += `<div class="rule" style="opacity:${rule(520, 640)}">p = mix(A, B, t) + 转 · sin(πt) &nbsp;<em>swirl 4.2 rad</em><small>同一批点，从楼梯走到一棵树：路上绕着轴转一圈，所以像一阵龙卷风，而不是直线搬家。</small></div>`;
  if (f >= 640 && f < 800) h += `<div class="rule" style="opacity:${rule(650, 800)}">d &lt; R → p += n · R(1 − d/R)² &nbsp;<em>R 随时间缩回</em><small>只推垂直于视线的分量，所以屏幕上是一个干净的洞；鼠标走过去，洞像船尾的浪一样合上。</small></div>`;
  hud.innerHTML = h;
  // 鼠标
  const q = curAt(f); if (q) hud.innerHTML += `<svg style="position:absolute;left:${q[0] - 3}px;top:${q[1] - 3}px" width="30" height="30" viewBox="0 0 22 22"><path d="M2 2 L2 18 L7 13 L10 20 L13 19 L10 12 L17 12 Z" fill="#fff" stroke="#000" stroke-width="1"/></svg>`;
}
function drawUI(f, s, cam) {
  let h = '';
  const inP = ease.inOut3(prog(f, TL.mask[0], TL.mask[1])) * (1 - ease.inOut3(prog(f, TL.outro[0], TL.outro[0] + 30)));
  if (inP > 0.001) {
    const w = lerp(2200, 440, inP), hh = lerp(1300, 920, inP), r = lerp(0, 60, inP), top = 540 - hh / 2;
    h += `<div id="mask" style="width:${w}px;height:${hh}px;margin:${-hh / 2}px 0 0 ${-w / 2}px;border-radius:${r}px"></div>`;
    if (inP > 0.6) h += `<div id="bezel" style="width:${w}px;height:${hh}px;margin:${-hh / 2}px 0 0 ${-w / 2}px;opacity:${(inP - 0.6) / 0.4}"></div>`;
    const o = clamp((inP - 0.85) / 0.15);
    if (o > 0) {
      h += `<div class="sb" style="left:${960 - w / 2 + 40}px;width:${w - 80}px;top:${top + 26}px;opacity:${o}"><span>9:41</span><span>●●● 100</span></div>`;
      h += `<div style="position:absolute;left:900px;top:${top + 18}px;width:120px;height:34px;border-radius:20px;background:#000;opacity:${o}"></div>`;
      const st = f < TL.pBuild[0] ? '<b>●</b> 正在扫描 · 慢一点' : f < TL.pDone[0] ? '<b>●</b> 生成中 · 高斯泼溅' : '<b>●</b> 完成 · 可以拨开';
      h += `<div class="ph" style="top:${top + 92}px;opacity:${o}"><div class="lab">${st}</div></div>`;
      if (f < TL.pBuild[0]) {
        const cov = prog(f, TL.pScan[0], TL.pScan[1]); const n = Math.round(cov * 612480);
        const C = PC.camera(cam, W, H).project([0, BY, 0]); let t = '';
        for (let k = 0; k < 60; k++) { const a = k / 60 * Math.PI * 2, on = k < cov * 60; const r0 = 150, r1 = on ? 172 : 164;
          t += `<line x1="${C[0] + Math.cos(a) * r0}" y1="${C[1] + Math.sin(a) * r0 * 0.34}" x2="${C[0] + Math.cos(a) * r1}" y2="${C[1] + Math.sin(a) * r1 * 0.34}" stroke="${on ? '#6ff3ff' : 'rgba(255,255,255,.3)'}" stroke-width="3"/>`; }
        h += `<svg width="1920" height="1080" style="position:absolute;left:0;top:0;opacity:${o}">${t}</svg>`;
        h += `<div class="pill" style="top:${top + hh - 230}px;opacity:${o}">已采 ${n.toLocaleString('en-US')} 点 · 绕到右边</div>`;
        h += `<div class="shutter" style="top:${top + hh - 140}px;opacity:${o}"><i></i></div>`;
      } else if (f < TL.pDone[0]) {
        const p = prog(f, TL.pBuild[0], TL.pDone[0]);
        h += `<div class="pbar" style="left:${960 - 170}px;width:340px;top:${top + hh - 110}px;opacity:${o}"><div class="t"><span>聚拢 ${Math.round(p * 612480).toLocaleString('en-US')} / 612,480</span><span>${Math.round(p * 100)}%</span></div><div class="b"><i style="width:${p * 100}%"></i></div></div>`;
      } else {
        const a = ease.outBack(prog(f, TL.pDone[0], TL.pDone[0] + 14));
        h += `<div class="res" style="left:${960 - 190}px;width:380px;top:${top + hh - 210}px;opacity:${clamp(a) * o};transform:translateY(${(1 - clamp(a)) * 30}px)"><h3>窗台上的五针松</h3><p>612,480 PTS · 18.2 MB · .PLY / .SPLAT</p><div class="row"><span class="on">放进房间</span><span>分享</span></div></div>`;
      }
    }
  }
  ui.innerHTML = h;
  let c = '';
  if (f >= 1040) { const a = ease.out3(prog(f, 1040, 1060)), b = ease.out3(prog(f, 1050, 1070));
    c += `<div class="ct" style="opacity:${a};transform:translateY(${(1 - a) * 16}px)"><h2>POINT CLOUD</h2><p>世界不是面，是几百万个带颜色的点。</p></div>`;
    c += `<div class="by" style="opacity:${b}"><b>观默</b><br>每天一个设计风格 · 点云</div>`; }
  card.innerHTML = c;
}

// —— 入口 ——
(async () => {
  await document.fonts.load('900 100px NotoSC', '点云'); await document.fonts.ready;
  const cv = document.getElementById('gl'); cv.width = Math.round(W * SCALE); cv.height = Math.round(H * SCALE);
  gl = GLK.create(cv); P = PC.makeMorphProgram(gl); target = GLK.fbo(gl, cv.width, cv.height); post = GLK.post(gl);
  const R = PC.mulberry(13);
  const mk = (id, data) => { const d = PC.toN(data, N, R); const s = { id, buf: PC.uploadShape(gl, d), data: d }; return s; };
  S.tunnel = mk('dot', dot(R));
  S.title = mk('title', title(R, TY));
  S.stairs = mk('stairs', PC.staircase({ turns: 10, density: 640, falloff: 6.5 }).cloud.data);
  S.bonsai = mk('bonsai', bonsaiBig(R));
  S.title2 = mk('title2', title(R, TY2));
  // 01 里读数的那个点：正面上、离画面中心最近的一个
  { const d = S.title.data; let best = -1, bd = 1e9; for (let i = 0; i < N; i += 7) { const o = i * 10; if (Math.abs(d[o + 2] - 0.26) > 1e-3) continue; const dd = Math.hypot(d[o] - 0.2, d[o + 1] - TY - 0.12); if (dd < bd) { bd = dd; best = i; } }
    const o = best * 10; probe = { i: best, p: [d[o], d[o + 1], d[o + 2]], c: [d[o + 3], d[o + 4], d[o + 5]], w: d[o + 6] }; }
  for (const k in S) S[k].data = null;
  window.ready = true;
})().catch(e => console.log('ERR', e.message.slice(0, 2000)));

window.frame = async (f) => {
  const s = sceneAt(f);
  const cam = await PC.drawMorph(gl, P, target, s.A, s.B, s);
  const flash = [[TL.assemble[0], 0.5], [TL.lock, 0.3], [TL.pour[1], 0.12], [TL.twist[1] - 6, 0.2], [TL.regroup[1], 0.25]].reduce((a, [h, A]) => a + (f >= h ? A * Math.exp(-(f - h) / 5) : 0), 0);
  const bl = f < 150 || f >= 1040 ? 0.8 : 0.5;
  await post(target.tex, { exposure: 1.05 * (1 + flash), bloom: bl, threshold: f < 150 || f >= 1040 ? 0.55 : 0.9, grain: 0.03, vignette: 0.4, ca: 0.004, saturation: 1.1, seed: f * 0.37 });
  drawHUD(f, s, s.cam); drawUI(f, s, s.cam);
  gl.finish();
};
window.events = () => TL;
</script>
</body>
