<!doctype html><meta charset="utf-8"><title>沙画 · 全片 v2</title>
<!-- 逐帧渲染：node ../../_lib/film-gl.cjs film.html <帧目录> 0 <总帧数>。出片：bash make.sh；预览：PREVIEW=1 bash make.sh -->
<style>
@font-face { font-family: 'Brush'; src: url(../../../public/fonts/ZhiMangXing-Regular.ttf); }
@font-face { font-family: 'GeistMono'; src: url(../../../public/fonts/GeistMono.ttf); font-weight: 100 900; }
@font-face { font-family: 'NotoSC'; src: url(../../../public/fonts/NotoSansSC-Bold.otf); font-weight: 700; }
@font-face { font-family: 'NotoSC'; src: url(../../../public/fonts/NotoSansSC-Medium.otf); font-weight: 500; }
html, body { margin: 0; background: #000; overflow: hidden; }
#stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; }
canvas { position: absolute; left: 0; top: 0; }
#hud { position: absolute; inset: 0; color: #fff4dc; font-family: NotoSC; font-weight: 500; text-shadow: 0 0 16px rgba(20,9,3,.9), 0 0 3px rgba(20,9,3,.85); }
#hud > div { position: absolute; }
.mono { font-family: GeistMono, NotoSC; font-weight: 500; }
#chap { left: 72px; top: 56px; }
#chap .no { font-family: GeistMono; font-size: 24px; opacity: .75; letter-spacing: .1em; }
#chap .ti { font-family: Brush; font-size: 92px; line-height: 1.05; margin-top: 4px; }
#chap .sub { font-size: 30px; margin-top: 4px; }
#prog { right: 72px; top: 62px; font-family: GeistMono; font-size: 24px; letter-spacing: .1em; }
#prog i { display: inline-block; width: 150px; height: 3px; background: rgba(255,244,220,.25); vertical-align: middle; margin-right: 18px; position: relative; top: -2px; }
#prog i b { display: block; height: 100%; background: #fff4dc; }
#params { left: 72px; bottom: 58px; font-size: 28px; line-height: 1.6; }
.k { color: #ffd27d; }
#rule { left: 0; top: 0; }
.chip { position: absolute; width: 230px; }
.chip i { display: block; height: 64px; border-radius: 10px; box-shadow: 0 0 0 2px rgba(255,244,220,.6); }
.chip div { font-size: 24px; margin-top: 8px; white-space: nowrap; }
.big { position: absolute; font-family: Brush; font-size: 120px; white-space: nowrap; }
.lab { position: absolute; font-size: 28px; white-space: nowrap; }
.lab::before { content: ''; position: absolute; top: 50%; width: 60px; height: 2px; background: currentColor; }
.lab.l::before { right: calc(100% + 14px); } .lab.r::before { left: calc(100% + 14px); }
#end { left: 0; right: 0; top: 760px; text-align: center; color: #2a1404; text-shadow: 0 0 20px rgba(255,236,190,.9); }
#end .en { font-family: GeistMono; font-size: 30px; letter-spacing: .5em; }
#end .by { font-size: 28px; margin-top: 16px; }
</style>
<div id="stage"><canvas id="c" width="1920" height="1080"></canvas>
<div id="hud"><div id="chap"></div><div id="prog"></div><div id="params"></div><div id="rule"></div><div id="end"></div></div></div>
<script src="../../_lib/typefx.js"></script>
<script src="grains.js"></script><script src="timeline.js"></script>
<script>
const Q = new URLSearchParams(location.search), W = 1920, H = 1080, $ = id => document.getElementById(id);
const { sm, clamp } = GRAINS;
const prog = (f, a, b) => clamp((f - a) / (b - a));
const D = (h, f, f0, o = {}) => TFX.decode(h, f, f0, Object.assign({ glyphs: 'dots' }, o));

// —— 镜头：[帧, cx, cy, zoom, rot]，推拉按对数插值（每帧放大同样的倍数），段与段之间速度连续（Catmull-Rom）——
const CAM = [[-160, 1120, 600, 1.42, -0.05], [0, 1100, 560, 1.3, -0.03], [96, 1060, 510, 1.06, 0.0], [180, 980, 490, 1.12, 0.012], [244, 965, 485, 1.28, 0.0], [284, 962, 482, 2.4, -0.01], [316, 960, 480, 6.0, -0.03],
  [346, 990, 560, 1.22, 0.03], [440, 1010, 600, 1.08, -0.012], [480, 960, 560, 1.06, 0.0], [580, 960, 560, 1.14, 0.0], [670, 960, 556, 1.24, 0.0], [720, 960, 540, 1.06, 0.0],
  [790, 960, 560, 1.3, 0.035], [850, 960, 640, 1.62, -0.02], [880, 960, 560, 1.25, 0.0], [930, 960, 540, 1.34, 0.14], [970, 960, 540, 1.1, 0.0], [1120, 960, 530, 1.26, 0.0]];
function camAt(f) {
  let i = 0; while (i < CAM.length - 2 && f >= CAM[i + 1][0]) i++;
  const k0 = CAM[Math.max(0, i - 1)], k1 = CAM[i], k2 = CAM[i + 1], k3 = CAM[Math.min(CAM.length - 1, i + 2)];
  const t = clamp((f - k1[0]) / (k2[0] - k1[0]));
  const cr = (a, b, c, d) => { const t2 = t * t, t3 = t2 * t; return 0.5 * (2 * b + (-a + c) * t + (2 * a - 5 * b + 4 * c - d) * t2 + (-a + 3 * b - 3 * c + d) * t3); };
  const v = j => j === 3 ? Math.exp(cr(Math.log(k0[3]), Math.log(k1[3]), Math.log(k2[3]), Math.log(k3[3]))) : cr(k0[j], k1[j], k2[j], k3[j]);
  return { cx: v(1), cy: v(2), zoom: Math.max(1.02, v(3)), rot: v(4) };
}
// —— 灯箱的颜色接力：每一章换一种光 ——
const LIGHT = [[-160, [255, 226, 176]], [100, [255, 226, 176]], [180, [196, 218, 255]], [312, [196, 218, 255]], [330, [255, 150, 116]], [460, [255, 150, 116]], [520, [255, 246, 230]], [680, [255, 246, 230]], [750, [176, 240, 230]], [880, [176, 240, 230]], [970, [255, 214, 150]], [1120, [255, 222, 160]]];
function lightAt(f) { let i = 0; while (i < LIGHT.length - 2 && f >= LIGHT[i + 1][0]) i++; const a = LIGHT[i], b = LIGHT[i + 1], t = sm(prog(f, a[0], b[0])); return a[1].map((v, c) => v + (b[1][c] - v) * t); }
// 透光颜色（给规则卡用：三档沙厚 → 白光下的颜色）
const hex = c => '#' + c.map(v => Math.round(v).toString(16).padStart(2, '0')).join('').toUpperCase();
const colorOf = h => [0.8, 1.12, 1.75].map((t, c) => { let T = Math.exp(-2.6 * h * t); T = T * T * (3 - 2 * T) * 0.6 + T * 0.4; return [255, 246, 230][c] * T + [10, 5, 3][c] * (1 - T); });
const CHIPS = [[0.05, '薄'], [0.5, '中'], [1.6, '厚']].map(([h, n]) => [h, n, hex(colorOf(h))]);

const chapterAt = f => { let i = 0; TL.chapters.forEach((c, k) => { if (f >= c[0]) i = k; }); return i; };
const PARAMS = [[10, 98, ['2,000,000 粒沙 · 每一粒都在飞', '换幕 = 一道沙浪扫过去']], [190, 300, ['瞳孔是一层沙：它会看你']], [380, 456, ['鲸、水花、海：三层沙，各走各的']]];
function hud(f) {
  const ci = chapterAt(f), [c0, no, ti, sub] = TL.chapters[ci], last = f >= TL.storm, cs = ci === 0 ? -60 : c0 + 6;
  const nx = ci + 1 < TL.chapters.length ? TL.chapters[ci + 1][0] : 1e9;
  $('chap').style.opacity = (1 - prog(f, nx - 12, nx)).toFixed(3);
  $('chap').innerHTML = last ? '' : `<div class="no">${D(no + ' / 04', f, cs, { rate: 1 })}</div><div class="ti">${D(ti, f, cs + 3, { rate: 3, kind: 'title' })}</div><div class="sub">${D(sub, f, cs + 14, { rate: 0.8 })}</div>`;
  $('prog').style.opacity = (1 - prog(f, TL.storm - 12, TL.storm)).toFixed(3);
  $('prog').innerHTML = `<i><b style="width:${(clamp(f / TL.storm) * 100).toFixed(1)}%"></b></i>${no} / 04`;
  const pr = PARAMS.find(p => f >= p[0] && f < p[1]); $('params').style.opacity = pr ? (1 - prog(f, pr[1] - 12, pr[1])).toFixed(3) : 0;
  $('params').innerHTML = pr ? pr[2].map((l, i) => `<div class="mono">${D(l, f, pr[0] + i * 14, { rate: 0.7 })}</div>`).join('') : '';
  let r = '';
  // 规则 1：越厚越暗（三个色块从沙带上“取样”出来）
  if (f >= 516 && f < 580) { const a = 1 - prog(f, 564, 578);
    r += `<div class="big" style="left:240px;top:250px;opacity:${a}">${D('越厚，越暗', f, 518, { rate: 3, kind: 'title' })}</div><div class="lab mono" style="left:240px;top:400px;opacity:${a}">${D('透过来的光 <span class="k">T = e<sup>−k·h</sup></span> · k = 2.6', f, 526, { rate: 0.7 })}</div>`;
    CHIPS.forEach(([h, n, c], i) => { const x = [250, 950, 1640][i] - 115, k = sm(prog(f, 528 + i * 5, 546 + i * 5)); r += `<div class="chip" style="left:${x}px;top:${676 + (1 - k) * 40}px;opacity:${(k * a).toFixed(3)}"><i style="background:${c}"></i><div class="mono">${D(c, f, 532 + i * 5, { rate: 0.8 })}</div><div>${D('h ' + h + ' · ' + n, f, 538 + i * 5, { rate: 0.8 })}</div></div>`; }); }
  // 规则 2：沙守恒（一指分开，沙堆到两边）
  if (f >= 590 && f < 684) { const a = 1 - prog(f, 668, 682);
    r += `<div class="big" style="left:240px;top:250px;opacity:${a}">${D('沙不会消失', f, 592, { rate: 3, kind: 'title' })}</div><div class="lab mono" style="left:240px;top:400px;opacity:${a}">${D('一指划过：中间推空 = <span class="k">两边堆高</span> · 总量不变', f, 600, { rate: 0.7 })}</div>`;
    if (f >= 630) r += `<div class="lab mono l" style="left:1760px;top:${FIN.y0 - FIN.R - 64}px;opacity:${a}">${D('沙脊 ↑', f, 630, { rate: 1 })}</div><div class="lab mono l" style="left:1760px;top:${FIN.y0 + FIN.R + 34}px;opacity:${a}">${D('沙脊 ↓', f, 634, { rate: 1 })}</div>`; }
  // 界面
  if (f >= 756 && f < 892) { const a = 1 - prog(f, 876, 890), p = Math.round(100 * (0.08 + 0.64 * sm(prog(f, TL.ui + 10, TL.ui + 100))));
    r += `<div class="lab mono l" style="left:${PH.x + 330}px;top:${UIY.bar - 22}px;opacity:${a}">${D('进度：沙流过去', f, 762, { rate: 0.8 })} <span class="k">${p}%</span></div>`;
    if (f >= 770) r += `<div class="lab mono r" style="right:${W - PH.x + 330}px;top:${UIY.btn - 20}px;opacity:${a}">${D('按钮：三角是空出来的', f, 772, { rate: 0.8 })}</div>`;
    if (f >= 810) r += `<div class="lab mono l" style="left:${PH.x + 330}px;top:${UIY.tog - 22}px;opacity:${a}">${D('开关：圆钮拨过去', f, 812, { rate: 0.8 })}</div>`; }
  $('rule').innerHTML = r;
  $('end').innerHTML = f >= TL.title + 30 ? `<div class="en">${D('SAND ANIMATION', f, TL.title + 30, { rate: 2, kind: 'title' })}</div><div class="by">${D('每天一个设计风格 · 观默 @guanmo_ai', f, TL.sign, { rate: 1.2 })}</div>` : '';
}

(async () => {
  await Promise.all(['400 300px Brush', '700 30px NotoSC', '500 30px NotoSC', '500 24px GeistMono'].map(s => document.fonts.load(s, '沙画月亮掉进海里定时关灯Aa1%'))); await document.fonts.ready;
  await new Promise(r => { const sc = document.createElement('script'); sc.src = 'targets.js'; sc.onload = r; document.body.appendChild(sc); });   // 字体到了再画每一幕（片名、歌名是用字体画进沙里的）
  const empty = { layers: [{ dens: new Float32Array(GW * GH) }] };
  const scenes = [empty, S_moon, S_eye, S_whale, S_wedge, S_band, S_ui, S_title];
  const TR = { wind: { spread: 0.6, lift: 0.75, amp: 80 }, vortex: { spread: 0.45, lift: 0.45, turns: 0.9 }, burst: { spread: 0.5, lift: 0.9, amp: 300 }, pour: { spread: 0.6, lift: 0.7 }, storm: { spread: 0.45, lift: 0.8, turns: 1.3 } };
  const DIRS = [Math.PI, -0.4, -0.7, 0, Math.PI, Math.PI / 2, 0.3];
  const CEN = [null, [1070, 415], [960, 480], null, null, null, [960, 540]];
  const trans = TL.trans.map(([f0, f1, from, to, kind], i) => Object.assign({ f0, f1, from, to, kind, dir: DIRS[i], c: CEN[i] }, TR[kind]));
  trans[4].amp = 20; trans[4].lift = 0.25; trans[4].spread = 0.35; trans[2].amp = 160; trans[2].spread = 0.6; trans[2].lift = 0.48;
  let mx = 0; for (const s of scenes) { let t = 0; for (const l of s.layers) for (const v of l.dens) t += v; mx = Math.max(mx, t); }
  const N = +(Q.get('n') || 2000000), m = mx / (N * 0.985);
  const AW = 1920, AH = 1080;
  const RW = 1920, RH = 1080; const G = GRAINS.build({ W, H, GW, GH, N, m, AW, AH, RW, RH, scenes, trans, seed: 5 });
  const ground = new Float32Array(RW * RH), air = new Float32Array(AW * AH), airZ = new Float32Array((AW >> 2) * (AH >> 2));
  const draw = GRAINS.renderer($('c').getContext('2d'), W, H, RW, RH, AW, AH);
  for (let f = 0; f < TL.end; f++) hud(f);
  window.events = () => ({ cues: TFX.list() });
  window.frame = async f => {
    G.frame(f, ground, air, airZ);
    draw(ground, air, airZ, camAt(f), { col: lightAt(f), c: [960, 560] });
    hud(f);
    await new Promise(r => requestAnimationFrame(() => r()));
  };
  if (!Q.get('noinit')) await window.frame(+(Q.get('f') || 0));
  window.ready = true; window.__done = true;
})().catch(e => { console.log('ERR ' + (e.stack || e.message).slice(0, 4000)); });
</script>
