<!doctype html><meta charset="utf-8"><title>沙画 · 全片</title>
<!-- 逐帧渲染：node ../../_lib/film-gl.cjs film.html <帧目录> 0 <总帧数>。出片：bash make.sh；预览：PREVIEW=1 bash make.sh -->
<style>
@font-face { font-family: 'Brush'; src: url(../../../public/fonts/ZhiMangXing-Regular.ttf); }
@font-face { font-family: 'GeistMono'; src: url(../../../public/fonts/GeistMono.ttf); font-weight: 100 900; }
@font-face { font-family: 'NotoSC'; src: url(../../../public/fonts/NotoSansSC-Bold.otf); font-weight: 700; }
@font-face { font-family: 'NotoSC'; src: url(../../../public/fonts/NotoSansSC-Medium.otf); font-weight: 500; }
html, body { margin: 0; background: #000; overflow: hidden; }
#stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; }
canvas { position: absolute; left: 0; top: 0; }
#hud { position: absolute; inset: 0; color: #fff1d6; font-family: NotoSC; font-weight: 500; text-shadow: 0 0 14px rgba(20,9,3,.95), 0 0 3px rgba(20,9,3,.9); }
#hud > div { position: absolute; }
.mono { font-family: GeistMono, NotoSC; font-weight: 500; letter-spacing: .02em; }
#chap { left: 72px; top: 56px; }
#chap .no { font-family: GeistMono; font-size: 24px; opacity: .75; letter-spacing: .1em; }
#chap .ti { font-family: Brush; font-size: 84px; line-height: 1.05; margin-top: 4px; color: #ffe6b5; }
#chap .sub { font-size: 30px; margin-top: 6px; }
#prog { right: 72px; top: 62px; font-family: GeistMono; font-size: 24px; letter-spacing: .1em; opacity: .85; }
#prog i { display: inline-block; width: 150px; height: 3px; background: rgba(255,241,214,.25); vertical-align: middle; margin-right: 18px; position: relative; top: -2px; }
#prog i b { display: block; height: 100%; background: #ffd27d; }
#params { left: 72px; top: 300px; font-size: 28px; line-height: 1.6; }
#params .k { color: #ffd27d; }
#panel { left: 72px; top: 330px; width: 600px; }
#panel .hd span { white-space: nowrap; } #panel .hd b { white-space: nowrap; font-size: 22px; }
#panel .hd { font-size: 26px; display: flex; justify-content: space-between; }
#panel .hd b { color: #ffd27d; font-weight: 500; }
#panel .lg { font-size: 22px; margin-top: 8px; opacity: .9; }
#sw { left: 72px; top: 760px; display: flex; gap: 22px; }
#sw .c { width: 250px; }
#sw .c i { display: block; height: 70px; border-radius: 10px; box-shadow: 0 0 0 1.5px rgba(255,241,214,.5); }
#sw .c div { font-size: 21px; margin-top: 8px; white-space: nowrap; }
.lab { position: absolute; font-size: 26px; white-space: nowrap; }
.lab .k { color: #ffd27d; }
.pct { position: absolute; font-family: GeistMono; font-size: 64px; color: #ffe6b5; }
#end { left: 0; right: 0; top: 760px; text-align: center; color: #2a1608; text-shadow: 0 0 18px rgba(255,236,200,.8); }
#end .en { font-family: GeistMono; font-size: 30px; letter-spacing: .5em; }
#end .by { font-size: 28px; margin-top: 18px; opacity: .92; }
</style>
<div id="stage"><canvas id="c" width="1920" height="1080"></canvas><canvas id="ov" width="1920" height="1080"></canvas>
<div id="hud"><div id="chap"></div><div id="prog"></div><div id="params"></div><div id="panel"></div><div id="sw"></div><div id="ui"></div><div id="end"></div></div></div>
<script src="../../_lib/typefx.js"></script>
<script src="sandfilm.js"></script><script src="timeline.js"></script><script src="scenes.js"></script>
<script>
const Q = new URLSearchParams(location.search);
const $ = id => document.getElementById(id);
const D = (h, f, f0, o = {}) => TFX.decode(h, f, f0, Object.assign({ glyphs: 'dots' }, o));   // 字像沙粒一样落定：前沿是“·:•”
const chapterAt = f => { let i = 0; for (let k = 0; k < TL.chapters.length; k++) if (f >= TL.chapters[k][0]) i = k; return i; };
const prog = (f, a, b) => Math.max(0, Math.min(1, (f - a) / (b - a)));
const hex = c => '#' + c.map(v => v.toString(16).padStart(2, '0')).join('').toUpperCase();
const SW = [[0.08, '薄 · 擦过'], [0.45, '中 · 掌抹'], [1.2, '厚 · 倒上']].map(([h, n]) => [h, n, hex(SANDFILM.colorOf(h))]);
const PARAMS = [[22, 200, ['手指划过：中间推空，两边堆起沙脊', '透光 <span class="k">T = e<sup>−k·h</sup></span> · k = 2.6']],
  [236, 474, ['亮 = 擦（推走沙）· 暗 = 倒（加上沙）', '眼白：掌侧一抹，沙厚 1.0 → <span class="k">0.07</span>']]];

let SUM0 = null;
function hud(f, E) {
  const ci = chapterAt(f), [c0, no, ti, sub] = TL.chapters[ci], last = f >= TL.fin, cs = ci === 0 ? -80 : c0;
  const nx = ci + 1 < TL.chapters.length ? TL.chapters[ci + 1][0] : 1e9, cfade = 1 - prog(f, nx - 12, nx);
  $('chap').style.opacity = cfade.toFixed(3); $('prog').style.opacity = (f < TL.fin ? 1 - prog(f, TL.fin - 12, TL.fin) : 0).toFixed(3);
  $('chap').innerHTML = last ? '' : `<div class="no">${D(no + ' / 03', f, cs, { rate: 1 })}</div><div class="ti">${D(ti, f, cs + 3, { rate: 3, kind: 'title' })}</div><div class="sub">${D(sub, f, cs + 14, { rate: 0.8 })}</div>`;
  $('prog').innerHTML = last ? '' : `<i><b style="width:${(Math.min(1, f / TL.fin) * 100).toFixed(1)}%"></b></i>${no} / 03`;
  const pr = PARAMS.find(p => f >= p[0] && f < p[1]); $('params').style.opacity = pr ? (1 - prog(f, pr[1] - 12, pr[1])).toFixed(3) : 0;
  $('params').innerHTML = pr ? pr[2].map((l, i) => `<div class="mono">${D(l, f, pr[0] + i * 14, { rate: 0.7 })}</div>`).join('') : '';
  // 02 截面面板 + 三档颜色
  const inP = f >= TL.ch2 + 20 && f < TL.ch3 - 4;
  const pa = Math.min(prog(f, TL.ch2 + 20, TL.ch2 + 34), 1 - prog(f, TL.ch3 - 20, TL.ch3 - 4));
  $('panel').style.opacity = pa.toFixed(3);
  $('panel').innerHTML = inP ? `<div class="hd mono"><span>${D('扫描线截面', f, TL.ch2 + 22, { rate: 1 })}</span><b>${D('推走 ' + (E && E.mv ? E.mv[0] : '0') + ' · 堆起 ' + (E && E.mv ? E.mv[1] : '0') + ' · 总量 ' + (E && E.sum != null ? E.sum : '100.0') + '%', f, TL.ch2 + 30, { rate: 0.7 })}</b></div><div style="height:250px"></div><div class="lg mono">${D('沙厚 h（褐）· 透过来的光 T（金）', f, TL.ch2 + 40, { rate: 0.6 })}</div>` : '';
  const sa = Math.min(prog(f, 628, 644), 1 - prog(f, TL.ch3 - 20, TL.ch3 - 4));
  $('sw').style.opacity = sa.toFixed(3);
  $('sw').innerHTML = f >= 628 && f < TL.ch3 ? SW.map(([h, n, c], i) => `<div class="c" style="transform:translateY(${(1 - SANDFILM.ease.o(prog(f, 628 + i * 6, 646 + i * 6))) * 30}px)"><i style="background:${c}"></i><div class="mono">${D(c, f, 632 + i * 6, { rate: 0.8 })}</div><div>${D('h ' + h + ' · ' + n, f, 640 + i * 6, { rate: 0.8 })}</div></div>`).join('') : '';
  // 03 界面标注
  let ui = '';
  if (f >= 780 && f < TL.fin) {
    const fa = 1 - prog(f, TL.fin - 16, TL.fin);
    const p = Math.round(72 * SANDFILM.ease.io(prog(f, 814, 872))), sl = Math.round(60 * SANDFILM.ease.io(prog(f, 846, 896)));
    ui += `<div class="lab mono" style="left:400px;top:636px;opacity:${fa}">${D('一指旋开 → <span class="k">按钮</span>', f, 782, { rate: 0.8 })}</div>`;
    if (f >= 814) ui += `<div class="lab mono" style="left:400px;top:1006px;opacity:${fa}">${D('一指绕一圈 → <span class="k">进度</span>', f, 816, { rate: 0.8 })} <span class="k">${p}%</span></div>`;
    if (f >= 820) ui += `<div class="lab mono" style="left:760px;top:636px;opacity:${fa}">${D('推着一团沙走 → <span class="k">滑杆</span>', f, 822, { rate: 0.8 })} <span class="k">${sl}%</span></div>`;
    if (f >= 856) ui += `<div class="lab mono" style="left:1300px;top:636px;opacity:${fa}">${D('拖过去，身后就亮了 → <span class="k">开</span>', f, 860, { rate: 0.8 })}</div>`;
  }
  $('ui').innerHTML = ui;
  // 收束
  $('end').innerHTML = f >= TL.title + 40 ? `<div class="en">${D('SAND ANIMATION', f, TL.title + 40, { rate: 2, kind: 'title' })}</div><div class="by">${D('每天一个设计风格 · 观默 @guanmo_ai', f, TL.sign, { rate: 1.2 })}</div>` : '';
}

// 02 的扫描线 + 截面图（直接从这一帧的沙里取样）
function scan(g, F, f) {
  const a = Math.min(prog(f, TL.ch2 + 20, TL.ch2 + 34), 1 - prog(f, TL.ch3 - 20, TL.ch3 - 4)); if (a <= 0) return null;
  const y = RC[1], x0 = 640, x1 = 1590, n = 300;
  g.save(); g.globalAlpha = a;
  // 扫描线：从左往右亮出来
  const reach = x0 + (x1 - x0) * SANDFILM.ease.o(prog(f, TL.ch2 + 20, TL.ch2 + 50));
  g.strokeStyle = 'rgba(255,214,140,.85)'; g.lineWidth = 2; g.setLineDash([10, 8]); g.beginPath(); g.moveTo(x0, y); g.lineTo(reach, y); g.stroke(); g.setLineDash([]);
  // 面板里的曲线
  const px = 72, py = 382, pw = 600, ph = 240;
  g.fillStyle = 'rgba(18,8,3,.62)'; g.fillRect(px - 14, py - 6, pw + 28, ph + 14);
  const hs = [], Ts = []; for (let i = 0; i <= n; i++) { const x = x0 + (x1 - x0) * i / n; const h = x <= reach ? F.sample(x, y) : 0; hs.push(h); Ts.push(Math.exp(-2.6 * h * 1.12)); }
  g.beginPath(); g.moveTo(px, py + ph * 0.62); hs.forEach((h, i) => g.lineTo(px + pw * i / n, py + ph * 0.62 - Math.min(3.2, h) * 42)); g.lineTo(px + pw, py + ph * 0.62); g.closePath(); g.fillStyle = '#8a5a2c'; g.fill();
  g.fillStyle = '#ffe7b8'; g.fillRect(px, py + ph * 0.62 + 2, pw, 4);
  g.strokeStyle = '#ffd27d'; g.lineWidth = 2.5; g.beginPath(); Ts.forEach((T, i) => { const X = px + pw * i / n, Y = py + ph - 8 - T * 70; i ? g.lineTo(X, Y) : g.moveTo(X, Y); }); g.stroke();
  // 取样点：沿扫描线来回走
  const u = 0.5 + 0.42 * Math.sin((f - TL.ch2) / 40), sx = x0 + (x1 - x0) * u;
  if (sx <= reach) { const h = F.sample(sx, y); g.fillStyle = '#ffd27d'; g.beginPath(); g.arc(sx, y, 7, 0, 7); g.fill(); g.strokeStyle = 'rgba(255,214,140,.9)'; g.lineWidth = 1.5; g.beginPath(); g.moveTo(px + pw * u, py); g.lineTo(px + pw * u, py + ph); g.stroke();
    g.font = '500 22px GeistMono'; g.fillStyle = '#fff1d6'; g.fillText(`h ${h.toFixed(2)} → T ${(Math.exp(-2.6 * h * 1.12) * 100).toFixed(0)}%`, Math.min(sx + 14, 1700), y - 16); }
  g.restore(); return true;
}

(async () => {
  await Promise.all(['300px Brush', '700 30px NotoSC', '500 30px NotoSC', '500 24px GeistMono'].map(s => document.fonts.load(s, '沙画眼睛Aa1%'))); await document.fonts.ready;
  const E = SANDFILM.engine(W, H, ops, baseScene, +(Q.get('res') || 0.5));
  const draw = SANDFILM.renderer($('c').getContext('2d'), W, H);
  const ov = $('ov').getContext('2d');
  for (let f = 0; f < TL.end; f++) hud(f, null);                       // 空跑一遍：把所有出字的时间登记给配乐
  window.events = () => ({ cues: TFX.list(), ops: ops.map(o => ({ f0: o.f0, f1: o.f1, kind: o.kind, r: o.r || 0, palm: !!o.streak })) });
  const sumOf = F => { let s = 0; for (let i = 0; i < F.d.length; i++) s += F.d[i]; return s; };
  const F0 = E.at(TL.ch2).F; SUM0 = sumOf(F0); const D0 = F0.d.slice();   // 沙守恒的参照：涟漪开始前那一刻的总沙量
  window.frame = async f => {
    const { F, fx } = E.at(f);
    draw(F, f, { light: 1 + 0.012 * Math.sin(f / 70) + 0.05 * SANDFILM.ease.io2(prog(f, TL.dot, TL.end)) });   // 最后一撮沙落下，灯慢慢亮一点
    ov.clearRect(0, 0, W, H); SANDFILM.grains(ov, fx, f);
    let sum = null, mv = null; if (f >= TL.ch2 && f < TL.ch3) { sum = (sumOf(F) / SUM0 * 100).toFixed(1); let a = 0, b = 0; for (let i = 0; i < F.d.length; i++) { const d = F.d[i] - D0[i]; if (d < 0) a -= d; else b += d; } const fmt = v => Math.round(v * 4).toLocaleString('en-US'); mv = [fmt(a), fmt(b)]; }
    scan(ov, F, f); hud(f, { sum, mv });
    await new Promise(r => requestAnimationFrame(() => r()));
  };
  if (!Q.get('noinit')) await window.frame(+(Q.get('f') || 0));
  window.ready = true; window.__done = true;
})().catch(e => { console.log('ERR ' + (e.stack || e.message).slice(0, 4000)); });
</script>
