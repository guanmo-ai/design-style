<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><title>赛璐璐 v4 · 8s</title>
<style>
@import url(../../../public/fonts/fontsource/zcool-qingke-huangyou/400.css);
@import url(../../../public/fonts/fontsource/geist-mono/400.css);
@import url(../../../public/fonts/fontsource/geist/700.css);
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:1920px; height:1080px; overflow:hidden; background:#14142B; }
#c { position:absolute; inset:0; width:1920px; height:1080px; display:block; }
.tag { position:absolute; left:64px; top:150px; font-family:'Geist Mono', monospace; font-size:15px; color:#14142B; display:flex; gap:10px; align-items:center; opacity:0; }
.tag b { background:#14142B; color:#FFFDF5; padding:5px 11px; font-weight:400; }
.tag span { background:#FFFDF5; border:3px solid #14142B; padding:3px 10px; }
#title { position:absolute; left:70px; top:660px; font-family:'ZCOOL QingKe HuangYou', sans-serif; font-size:190px; line-height:1; color:#FFFDF5; -webkit-text-stroke:16px #14142B; paint-order:stroke fill; text-shadow:12px 12px 0 #14142B; transform-origin:0 100%; opacity:0; white-space:nowrap; }
#sub { position:absolute; left:76px; top:880px; font-family:'ZCOOL QingKe HuangYou', sans-serif; font-size:32px; color:#14142B; background:#FFFDF5; border:4px solid #14142B; padding:4px 16px; box-shadow:7px 7px 0 #14142B; white-space:nowrap; opacity:0; }
</style></head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<div class="tag" id="tag"><b>赛璐璐 CEL</b><span>3D 字 · 手画质感</span></div>
<div id="title">赛璐璐</div>
<div id="sub"></div>
<script src="../../_lib/glkit.js"></script>
<script src="cel-type.js"></script>
<script src="cel-motion.js"></script>
<script>
const $ = id => document.getElementById(id);
const cl = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const clamp = cl;
const eo3 = x => 1 - Math.pow(1 - cl(x), 3);
const eio = x => { x = cl(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const eback = x => { x = cl(x); const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const CM = window.CelMotion;

// 第二、三次砸：字已经在跟前，只有蓄力 → 反相 → 回弹
function hit(v) {
  const r = { sx: 1, sy: 1, impact: 0, flash: 0, burst: 1, sla: .5, shake: 0 };
  if (v < 0) return r;
  if (v < .12) { const k = eo3(v / .12); r.sy = 1 - .2 * k; r.sx = 1 + .16 * k; r.burst = 1 - .3 * k; r.sla = .4; return r; }
  if (v < .20) { r.impact = 1; r.sy = 1.14; r.sx = .9; r.burst = 1.7; r.sla = 1; r.shake = .12; return r; }
  const u = v - .20, w = Math.cos(u * 22) * Math.exp(-u * 7);
  r.sy = 1 + .14 * w; r.sx = 1 - .1 * w;
  r.flash = u < 1 / 30 ? .8 : 0;
  r.burst = .9 + .8 * Math.exp(-u * 3); r.sla = .45 + .5 * Math.exp(-u * 2); r.shake = .12 * Math.exp(-u * 8);
  return r;
}

function params(t) {
  if (t < 3.2) {
    // 镜头 A：字从深处飞来砸下，之后镜头慢慢环绕
    const lt = Math.max(t - .4, 0);
    const p = CM.params(lt, {});
    const s = CM.state(lt);
    const o = eio((t - 1.6) / 1.6);
    p.cam = [1.9 + .5 * o + s.shake * Math.sin(t * 90), -2.1 + .2 * o + s.shake * Math.cos(t * 77), 4.9 - .3 * o];
    p.time = t;
    p.bars = .7 * eo3(t / .4);
    return p;
  }
  // 镜头 B：切到另一侧的低机位，字转向，推近；3.2s、7.2s 各砸一次
  const u = t - 3.2;
  const h = hit(u < 4 ? u : u - 4);
  const push = eio(u / 4.8);
  return {
    mode: 0, bg: 0, depth: .30, pos: [0, .12, 0], rot: [.12, .38 + .06 * Math.sin(u * .7), -.06], sq: [h.sx, h.sy, h.sx],
    cam: [-1.8 + .3 * push + h.shake * Math.sin(t * 90), -1.5 + h.shake * Math.cos(t * 77), 5.6 - .35 * push], tgt: [0, .14, 0], fov: 1.85,
    impact: h.impact, flash: h.flash, burst: h.burst, sla: h.sla, cen: [.48, .52], time: t, lw: .035, bars: .7
  };
}

const SUB = '3D 字 · 手画质感 · 1 个着色器';
function overlay(t, p) {
  const inv = p.impact > 0;
  $('tag').style.opacity = clamp((t - 1.2) / .4) * (inv ? 0 : 1);
  const tt = t - 5.0;
  if (tt < 0 || inv) { $('title').style.opacity = 0; }
  else {
    const s = 2.2 + (1 - 2.2) * eback(Math.min(tt / .4, 1));
    $('title').style.opacity = clamp(tt / .06);
    $('title').style.transform = `rotate(${-6 + 3 * eo3(tt / .5)}deg) scale(${s})`;
  }
  const n = Math.floor(Math.max(t - 5.5, 0) * 16);
  $('sub').textContent = SUB.slice(0, Math.min(n, SUB.length));
  $('sub').style.opacity = t < 5.5 || inv ? 0 : 1;
}

window.frame = async f => {
  const t = f / 30;
  const p = params(t);
  window.CelType.paint($('c'), p);
  overlay(t, p);
};
(async () => {
  await document.fonts.load('400 400px "ZCOOL QingKe HuangYou"', '咔!');
  await document.fonts.ready;
  await window.frame(0);
  window.ready = true;
})().catch(e => console.log('ERR', e.message));
</script></body></html>
