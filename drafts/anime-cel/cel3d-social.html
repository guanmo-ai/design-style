<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><title>赛璐璐 v2 · 04 发推海报</title>
<style>
@import url(../../public/fonts/fontsource/zcool-qingke-huangyou/400.css);
@import url(../../public/fonts/fontsource/geist/700.css);
@import url(../../public/fonts/fontsource/geist-mono/400.css);
* { margin:0; padding:0; box-sizing:border-box; }
:root { --yel:#FFD23F; --ink:#14142B; --white:#FFFDF5; --red:#FF3B47; }
html, body { width:1920px; height:1080px; overflow:hidden; background:#14142B; color:var(--ink); font-family:'ZCOOL QingKe HuangYou', sans-serif; }
.card { position:absolute; left:360px; top:202px; width:1200px; height:675px; border:6px solid var(--ink); border-radius:22px; overflow:hidden; box-shadow:18px 18px 0 var(--yel); }
.card canvas { position:absolute; inset:0; width:1188px; height:663px; display:block; }
.hook { position:absolute; left:58px; top:54px; font-size:124px; line-height:1.02; color:var(--white); -webkit-text-stroke:16px var(--ink); paint-order:stroke fill; filter:drop-shadow(10px 10px 0 var(--ink)); }
.hook em { font-style:normal; color:var(--red); }
.sub { position:absolute; left:64px; bottom:54px; background:var(--white); border:4px solid var(--ink); padding:10px 18px; font-family:Geist; font-weight:700; font-size:24px; box-shadow:7px 7px 0 var(--ink); }
.meta { position:absolute; right:36px; top:36px; background:var(--ink); color:var(--white); font-family:'Geist Mono', monospace; font-size:13px; padding:8px 12px; }
.out { position:absolute; left:360px; top:910px; width:1200px; display:flex; justify-content:space-between; font-family:'Geist Mono', monospace; font-size:14px; color:rgba(255,253,245,.7); }
</style></head>
<body>
<div class="card">
  <canvas id="bg" width="1188" height="663"></canvas>
  <div class="hook">一帧，<br><em>咔！</em></div>
  <div class="sub">三维渲染 · 手画的质感</div>
  <div class="meta">赛璐璐 v2 · 发推版</div>
</div>
<div class="out"><span>1200 × 675 · 推特卡片比例</span><span>草稿 · 04 / 04</span></div>
<script src="cel3d.js"></script>
<script>
window.__done = false;
document.fonts.ready.then(() => {
  window.Cel3D.paint(document.getElementById('bg'), { t: 1.3, ring: 0.42, cx: 0.68, cy: 0.44, sq: [1.03, 0.97], flash: 0, burst: 1.6, sc: 0.9 });
  window.__done = true;
});
</script></body></html>
