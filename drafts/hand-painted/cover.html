<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>治愈系手绘 · Hand-Painted Anime · 第 0 帧</title>
<style>
@font-face { font-family: 'Serif'; src: url(../../public/fonts/NotoSerifSC-Bold.otf); font-weight: 700; }
@font-face { font-family: 'Fraunces'; src: url(../../public/fonts/Fraunces.ttf); font-weight: 100 900; }
@font-face { font-family: 'FrauncesI'; src: url(../../public/fonts/Fraunces-Italic.ttf); font-weight: 100 900; }
@font-face { font-family: 'GeistMono'; src: url(../../public/fonts/GeistMono.ttf); font-weight: 100 900; }
@font-face { font-family: 'NotoSC'; src: url(../../public/fonts/NotoSansSC-Bold.otf); font-weight: 700; }
@font-face { font-family: 'NotoSC'; src: url(../../public/fonts/NotoSansSC-Medium.otf); font-weight: 500; }
@font-face { font-family: 'NotoSC'; src: url(../../public/fonts/NotoSansSC-Regular.otf); font-weight: 400; }
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1920px; height: 1080px; overflow: hidden; background: #3b8ad8; color: #fff; font-family: NotoSC, sans-serif; }
canvas { position: absolute; left: 0; top: 0; }
.mono { font-family: GeistMono, monospace; letter-spacing: .05em; }
.ov { position: absolute; inset: 0; pointer-events: none; }
.sh { text-shadow: 0 1px 2px rgba(10,30,30,.45), 0 2px 14px rgba(10,30,40,.35); }
.tl { position: absolute; left: 64px; top: 46px; font-size: 12.5px; display: flex; gap: 24px; text-transform: uppercase; color: rgba(255,255,255,.9); }
.tl b { font-weight: 600; color: #fff; }
.vt { position: absolute; right: 70px; top: 96px; font-family: Serif; font-weight: 700; font-size: 88px; line-height: 1.12; color: #fff; text-align: center; width: 96px; text-shadow: 0 2px 30px rgba(20,60,140,.35); }
.vs { position: absolute; right: 178px; top: 104px; font-family: Serif; font-weight: 700; font-size: 19px; line-height: 1.55; color: #fff; text-align: center; width: 24px; }
.en { position: absolute; right: 70px; top: 668px; font-family: FrauncesI; font-weight: 400; font-size: 25px; color: #fff; font-variation-settings: 'SOFT' 100, 'WONK' 1; text-align: right; line-height: 1.25; }
.en small { display: block; font-family: GeistMono; font-style: normal; font-size: 10.5px; letter-spacing: .14em; margin-top: 8px; opacity: .92; }
svg.lines { position: absolute; inset: 0; }
.note { position: absolute; font-size: 12.5px; line-height: 1.6; color: #45453c; background: #fbf7ec; padding: 9px 12px 10px; box-shadow: 0 8px 22px rgba(10,30,30,.22); border-radius: 2px; }
.note .k { display: block; font-family: GeistMono; font-size: 10.5px; letter-spacing: .08em; color: #8a7f68; margin-bottom: 3px; }
.note b { font-family: Serif; font-weight: 700; font-size: 15.5px; display: block; margin-bottom: 2px; color: #2b3a2c; }
.note::before { content: ''; position: absolute; left: 50%; top: -5px; width: 34px; height: 10px; margin-left: -17px; background: rgba(230,214,170,.85); transform: rotate(-3deg); }
.strip { position: absolute; left: 64px; bottom: 74px; display: flex; gap: 14px; align-items: flex-end; }
.strip .cap { font-family: Serif; font-weight: 700; font-size: 16px; line-height: 1.35; color: #fff; width: 18px; text-align: center; margin-right: 6px; align-self: center; }
.fr { position: relative; width: 212px; padding: 6px 6px 26px; background: #fbf7ec; box-shadow: 0 10px 26px rgba(10,30,20,.3); transform: rotate(var(--r)); }
.fr .win { position: relative; width: 200px; height: 132px; overflow: hidden; background: #ccc; }
.fr canvas { position: absolute; }
.fr .t { position: absolute; left: 8px; bottom: 6px; font-size: 11.5px; color: #3b3a33; font-family: NotoSC; font-weight: 500; }
.fr .t i { font-style: normal; font-family: GeistMono; color: #8a8270; margin-right: 6px; font-size: 10px; }
.foot { position: absolute; right: 64px; bottom: 30px; font-size: 11px; color: #2c3a2a; background: rgba(251,247,236,.9); border-radius: 999px; padding: 6px 14px; box-shadow: 0 4px 14px rgba(20,40,20,.18); }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="fg"></canvas>
<div class="ov" id="ov" style="display:none">
  <div class="tl mono sh"><span><b>NO. 025</b></span><span>治愈系手绘 · Hand-Painted Anime</span><span>1985 吉卜力工作室 → 1988 男鹿和雄画《龙猫》的背景 → 今天的治愈系插画与独立游戏</span></div>
  <div class="vt">治<br>愈<br>系<br>手<br>绘</div>
  <div class="vs sh">吉<br>卜<br>力<br>式<br>的<br>夏<br>天</div>
  <div class="en sh">Hand-Painted<br>Anime<small>GOUACHE · WET-IN-WET · COLOR SPOTS</small></div>
  <svg class="lines" id="lines" width="1920" height="1080"></svg>
  <div id="notes"></div>
  <div class="strip" id="strip"><div class="cap sh">作<br>画<br>四<br>步</div></div>
  <div class="foot mono">致敬吉卜力工作室的手绘背景传统 · 非官方，与吉卜力工作室无关 · 原创画面，由代码一笔一笔画出来</div>
</div>
<script src="../_lib/glkit.js"></script>
<script src="paint.js"></script>
<script src="scene.js"></script>
<script src="girl.js"></script>
<script>
const Q = new URLSearchParams(location.search);
(async () => {
  await document.fonts.load('700 92px Serif', '治愈系手绘吉卜力式的夏天作画四步'); await document.fonts.ready;
  const DPR = devicePixelRatio, W = 1920, H = 1080;
  const cv = document.getElementById('gl'); cv.width = W * DPR; cv.height = H * DPR; cv.style.width = W + 'px'; cv.style.height = H + 'px';
  const S = SCENE.cover(W, H);
  await PAINT.render(GLK.create(cv), S);
  const fg = document.getElementById('fg'); fg.width = W * DPR; fg.height = H * DPR; fg.style.width = W + 'px'; fg.style.height = H + 'px';
  const x = fg.getContext('2d'); x.scale(DPR, DPR);
  SCENE.poles(x, S); SCENE.wires(x, S);
  const Zg = 16, [gx, gy] = PAINT.ground(S, PAINT.roadX(S, Zg) - .2, Zg); GIRL.girl(x, gx, gy, 1.45 * S.foc / Zg);
  GIRL.dragonfly(x, 760, 690, 1.2, -.2); GIRL.dragonfly(x, 830, 655, .9, .3);
  window.__done = Q.get('ov') === '0'; if (window.__done) return;
  document.getElementById('ov').style.display = '';

  // —— 细线标注（像写在画上的笔记）——
  let svg = '', html = '';
  const note = (px, py, bx, by, w, k, b, t) => {
    const ax = Math.min(Math.max(px, bx + 14), bx + w - 14), ay = py < by ? by : by + 60;
    svg += `<line x1="${px}" y1="${py}" x2="${ax}" y2="${ay}" stroke="rgba(255,255,255,.95)" stroke-width="1.2"/><circle cx="${px}" cy="${py}" r="4" fill="#fff" stroke="rgba(30,50,40,.5)" stroke-width="1"/>`;
    html += `<div class="note" style="left:${bx}px;top:${by}px;width:${w}px"><span class="k">${k}</span><b>${b}</b>${t}</div>`;
  };
  note(1430, 280, 1290, 92, 270, '01 · 积乱云 · 湿画法', '暗面晕开，亮面收边', '先把纸打湿，云底自己化开；迎光的一侧最后用厚白收出干净的边。');
  note(1110, 780, 760, 690, 268, '02 · 两种画法叠在一起', '人物平涂，背景厚涂', '人物：细线 + 一层影；背景：水粉一层层叠。吉卜力的质感就来自这个对比。');
  note(1470, 720, 1330, 600, 250, '03 · 稻浪', '风 = 一道道翻起的浅色', '稻叶被风压弯，翻出发白的背面；亮纹走多快，风就多快。');
  note(1060, 990, 1250, 860, 300, '04 · 光斑 = 太阳的小孔成像', '叶缝里漏下来的，是太阳', '地上本来是圆，透视一压成了横的椭圆。影子的形状由树冠一团团算出来。');
  document.getElementById('lines').innerHTML = svg; document.getElementById('notes').innerHTML = html;

  // —— 作画四步：同一张画，只画到第几步 ——
  const strip = document.getElementById('strip');
  const steps = [[0, 0, '大色块'], [1, .45, '大笔 · 明暗'], [3, 1, '中笔 · 叶簇'], [4, 1, '色点 · 收尾']];
  const crop = [520, 150, 520, 343];   // 截取：大树 + 云的一角（CSS px）
  for (const [i, [lv, det, name]] of steps.entries()) {
    const fr = document.createElement('div'); fr.className = 'fr'; fr.style.setProperty('--r', [-2.2, 1.4, -.8, 1.8][i] + 'deg');
    fr.innerHTML = `<div class="win"><canvas></canvas></div><div class="t"><i>0${i + 1}</i>${name}</div>`;
    strip.appendChild(fr);
    const c2 = fr.querySelector('canvas'); const sc = 200 / crop[2], d2 = 1.25;
    c2.width = W * sc * DPR * d2; c2.height = H * sc * DPR * d2; c2.style.width = (W * sc) + 'px'; c2.style.height = (H * sc) + 'px';
    c2.style.left = (-crop[0] * sc) + 'px'; c2.style.top = (-crop[1] * sc) + 'px';
    const S2 = SCENE.cover(W, H); S2.levels = lv; S2.detail = det; S2.dpr = sc * DPR * d2;
    await PAINT.render(GLK.create(c2), S2);
  }
  window.__done = true;
})().catch(e => { console.log('ERR', e.message.slice(0, 4000)); window.__done = true; });
</script>
</body>
</html>
