  gr.addColorStop(0, '#FFF4E2'); gr.addColorStop(.55, '#FFE6CF'); gr.addColorStop(1, '#FFD3BE'); g.fillStyle = gr; g.fillRect(0, 0, 2, 512);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; scene.background = t;

  bike.add(mesh(new THREE.BoxGeometry(0.05, 0.4, 0.5).translate(0.5, 0.95, 0), mat('#888')));

}

{

// ---------- 电线杆 + 下垂的电线 ----------
function pole(x, z) {

  for (const dx of [-0.9, 0, 0.9]) scene.add(mesh(new THREE.CylinderGeometry(0.06, 0.06, 0.18, 6).translate(x + dx, 8.62, z), mat('#EDEDED')));
}
pole(-0.9, 2.2); pole(11.0, 2.2); pole(-11.4, 2.2);
const wires = [];
for (const [xa, xb] of [[-11.4, -0.9], [-0.9, 11.0]]) for (const [dy, dz] of [[8.7, 0], [8.7, -0.0], [7.7, 0]]) for (const dx of [-0.9, 0, 0.9]) {

// ---------- 路上：一辆小卡车（车灯亮着）+ 两个行人 ----------
