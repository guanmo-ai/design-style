<!doctype html>
<html><head><meta charset="utf-8"><title>液态玻璃手机屏</title>
<!-- 手机屏（2 倍图）：照片流照常滚，顶上的标题胶囊和底下的标签栏是钉住的液态玻璃（真折射）。
     FRAME_EXT=.png node ../_lib/film-gl.cjs glass-phone.html /tmp/gp 0 1 1 后裁 552×1040；ui.html 里当图片用 -->
<style>
@font-face{font-family:SC;src:url(../../public/fonts/NotoSansSC-Bold.otf);font-weight:700}
@font-face{font-family:SC;src:url(../../public/fonts/NotoSansSC-Medium.otf);font-weight:500}
html,body{margin:0;background:#000}
canvas{position:absolute;left:0;top:0}
</style></head><body>
<canvas id="gl" width="552" height="1040"></canvas><canvas id="ov" width="552" height="1040"></canvas>
<script src="glass-assets.js"></script>
<script>
const W = 552, H = 1040;
const src = document.createElement('canvas'); src.width = W; src.height = H; const c = src.getContext('2d');
const IM = {};
function cover(im, x, y, w, h) { const s = Math.max(w / im.width, h / im.height), sw = w / s, sh = h / s; c.drawImage(im, (im.width - sw) / 2, (im.height - sh) / 2, sw, sh, x, y, w, h); }
function rr(x, y, w, h, r) { c.beginPath(); c.roundRect(x, y, w, h, r); }
function content() {
  c.fillStyle = '#F3F2EE'; c.fillRect(0, 0, W, H);
  // 双列照片流，往上滚了一段：照片正从玻璃下面经过
  const col = [['tokyo', 412], ['citrus', 276], ['stairs', 412], ['dunes', 300]], col2 = [['monstera', 412], ['nook', 412], ['citrus', 276], ['tokyo', 412]];
  const g = 16, cw = (W - 3 * g) / 2;
  [[col, g], [col2, g * 2 + cw]].forEach(([L, x], j) => {
    let y = j ? -150 : -70;
    for (const [n, h] of L) { const hh = h * cw / 276; c.save(); rr(x, y, cw, hh, 22); c.clip(); cover(IM[n], x, y, cw, hh); c.restore(); y += hh + g; }
  });
}
const gl = document.getElementById('gl').getContext('webgl2', { preserveDrawingBuffer: true });
const FS = `#version 300 es
precision highp float;
uniform sampler2D T; uniform vec2 R; uniform vec4 S0; uniform vec4 S1; uniform vec4 S2; uniform vec3 RR; uniform float K;
out vec4 o;
float sdb(vec2 p, vec2 b, float r){ vec2 q = abs(p) - b + r; return length(max(q,0.)) + min(max(q.x,q.y),0.) - r; }
vec3 smp(vec2 p){ return texture(T, clamp(p/R, vec2(0.), vec2(1.))).rgb; }
vec4 lens(vec2 p, vec4 S, float r, float bev, float mag){
  vec2 lp = p - S.xy; float d = sdb(lp, S.zw, r);
  if (d > 0.) return vec4(0.);
  vec2 g = vec2(sdb(lp+vec2(1.,0.),S.zw,r) - sdb(lp-vec2(1.,0.),S.zw,r), sdb(lp+vec2(0.,1.),S.zw,r) - sdb(lp-vec2(0.,1.),S.zw,r));
  g = g / (length(g) + 1e-5);
  float t = clamp(1. + d / bev, 0., 1.);
  float bend = pow(t, 2.4) * bev * 1.25;
  vec2 q = S.xy + lp / mag - g * bend; float ch = bend * .08;
  vec3 c = vec3(smp(q - g*ch).r, smp(q).g, smp(q + g*ch).b);
  c = mix(c, vec3(1.), .16);
  float rim = smoothstep(2.2*K, 0., -d), light = .5 + .5 * dot(g, normalize(vec2(-.55, -.85)));
  c += rim * (.25 + .6 * light) + pow(t, 5.) * max(0., -g.y) * .25 - pow(t, 3.) * max(0., g.y) * .06;
  return vec4(c, 1.);
}
float shadow(vec2 p, vec4 S, float r){ float d = sdb(p - S.xy - vec2(0., 10.*K), S.zw, r); return .2 * exp(-max(d, 0.) / (22.*K)) * step(0., d); }
void main(){
  vec2 p = vec2(gl_FragCoord.x, R.y - gl_FragCoord.y);
  vec3 col = smp(p);
  col *= 1. - shadow(p, S0, RR.x) - shadow(p, S1, RR.y);
  vec4 l = lens(p, S0, RR.x, 20.*K, 1.05); if (l.a > 0.) col = l.rgb;
  l = lens(p, S1, RR.y, 20.*K, 1.05); if (l.a > 0.) col = l.rgb;
  l = lens(p, S2, RR.z, 14.*K, 1.12); if (l.a > 0.) col = l.rgb;
  o = vec4(col, 1.);
}`;
function sh(t, s) { const x = gl.createShader(t); gl.shaderSource(x, s); gl.compileShader(x); if (!gl.getShaderParameter(x, gl.COMPILE_STATUS)) throw gl.getShaderInfoLog(x); return x; }
const pr = gl.createProgram(); gl.attachShader(pr, sh(gl.VERTEX_SHADER, `#version 300 es
in vec2 a; void main(){ gl_Position = vec4(a,0.,1.); }`)); gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, FS)); gl.linkProgram(pr); gl.useProgram(pr);
gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer()); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
const U = n => gl.getUniformLocation(pr, n);
// 形状（2 倍坐标）：顶上标题胶囊、底下标签栏、标签栏里选中的那一滴
const TOP = [W / 2, 140, 180, 40], BAR = [W / 2, H - 90, 240, 52], BLOB = [W / 2 - 132, H - 90, 62, 40];
window.frame = () => {
  content();
  const t = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, src);
  gl.viewport(0, 0, W, H); gl.uniform2f(U('R'), W, H); gl.uniform1f(U('K'), 2);
  gl.uniform4f(U('S0'), ...TOP); gl.uniform4f(U('S1'), ...BAR); gl.uniform4f(U('S2'), ...BLOB); gl.uniform3f(U('RR'), 40, 52, 40);
  gl.drawArrays(gl.TRIANGLES, 0, 3); gl.finish();
  const o = document.getElementById('ov').getContext('2d');
  o.fillStyle = '#0B0C10'; o.textAlign = 'center'; o.font = '700 34px SC'; o.fillText('发现', W / 2, 152);
  ['首页', '发现', '收藏', '我的'].forEach((s, i) => { o.globalAlpha = i === 0 ? 1 : .55; o.font = '700 26px SC'; o.fillText(s, W / 2 - 132 + i * 88, H - 80); });
  o.globalAlpha = 1;
};
Promise.all(Object.entries(PH).map(([k, v]) => new Promise(r => { const im = new Image(); im.onload = () => { IM[k] = im; r(); }; im.src = v; })))
  .then(() => document.fonts.load('700 20px SC', '发现首页')).then(() => { window.frame(0); window.ready = true; });
</script></body></html>
