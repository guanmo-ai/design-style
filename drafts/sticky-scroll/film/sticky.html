<!doctype html>
<html><head><meta charset="utf-8">
<title>粘性滚动 · 开头小样 v4</title>
<style>
@font-face{font-family:Serif;src:url(../../../public/fonts/InstrumentSerif-Regular.ttf)}
@font-face{font-family:Serif;src:url(../../../public/fonts/InstrumentSerif-Italic.ttf);font-style:italic}
@font-face{font-family:Inter;src:url(../../../public/fonts/Inter-Medium.ttf);font-weight:500}
@font-face{font-family:Inter;src:url(../../../public/fonts/Inter-SemiBold.ttf);font-weight:600}
@font-face{font-family:Mono;src:url(../../../public/fonts/GeistMono-Medium.ttf);font-weight:500}
@font-face{font-family:SC;src:url(../../../public/fonts/NotoSansSC-Black.otf);font-weight:900}
@font-face{font-family:SC;src:url(../../../public/fonts/NotoSansSC-Bold.otf);font-weight:700}
@font-face{font-family:SC;src:url(../../../public/fonts/NotoSansSC-Medium.otf);font-weight:500}
html,body{margin:0;background:#F2EFE9;overflow:hidden}
canvas{display:block;position:absolute;left:0;top:0}
</style></head>
<body><canvas id="gl" width="1920" height="1080"></canvas><canvas id="ov" width="1920" height="1080"></canvas>
<script src="assets.js"></script>
<script>
/* 粘性滚动 · 开头小样 v4（9.6 秒 · 60fps）——和布局 02 瀑布流同一套视觉：暖白纸、白卡片、真照片、Instrument Serif、只有一点红。
   整支片子 = 在滚一张长网页：
   第一节“左钉右滚”：左边的标题和一张照片钉住，照片只听滚动进度——慢慢推近，到了步骤的分界就从下往上换成下一张（擦洗）；
     右栏的步骤卡和照片照常滚，按速度糊掉。
   镜头拉远：整张长网页、视口在上面走，左边那块在自己的容器里钉着，到底被顶出视口；下面的规则卡还在原位。推回来。
   第二节“叠卡”：五条规则 = 五张照片卡，一张张钉住叠上去，压在下面的往后缩。
   液态玻璃导航从头钉到尾（真折射，WebGL），选中的那一滴玻璃跟着滑到当前这一节。
   材料自己怎么动：页面在走，它不走。滚动带惯性（τ = 0.5 s ≈ iOS 默认减速），在走的东西按速度运动模糊，钉住的自然清楚。
   每一帧是帧号的纯函数：window.frame(f)。 */
const W = 1920, H = 1080, FPS = 60;
const C = { paper: '#F2EFE9', card: '#FFFFFF', ink: '#141414', ink2: '#6F6A62', red: '#F2462E', line: 'rgba(20,20,20,.08)', night: '#121110' };
const clamp = (x, a = 0, z = 1) => Math.min(Math.max(x, a), z);
const sm = x => { x = clamp(x); return x * x * (3 - 2 * x); };
const smr = x => { x = clamp(x); return x * x * x * (x * (6 * x - 15) + 10); };
function mk(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function txt(c, s, x, y, font, color, align = 'left', ls = 0) {
  c.font = font; c.fillStyle = color; c.textAlign = align; c.textBaseline = 'alphabetic';
  c.letterSpacing = ls + 'px'; c.fillText(s, x, y); c.letterSpacing = '0px';
}
function tw(c, s, font, ls = 0) { c.font = font; c.letterSpacing = ls + 'px'; const w = c.measureText(s).width; c.letterSpacing = '0px'; return w; }
function rr(c, x, y, w, h, r) { c.beginPath(); c.roundRect(x, y, w, h, r); }
const IM = {};
function cover(c, im, x, y, w, h, fx = .5, fy = .5) {
  const s = Math.max(w / im.width, h / im.height), sw = w / s, sh = h / s;
  c.drawImage(im, (im.width - sw) * fx, (im.height - sh) * fy, sw, sh, x, y, w, h);
}

// ---------- 滚动：几次“甩”的叠加，每次 = 快速起手 + 指数衰减 ----------
const TAU = 0.5, RISE = 0.06;
const X = u => u <= 0 ? 0 : 1 - (TAU * Math.exp(-u / TAU) - RISE * Math.exp(-u / RISE)) / (TAU - RISE);
const Xv = u => u <= 0 ? 0 : (Math.exp(-u / TAU) - Math.exp(-u / RISE)) / (TAU - RISE);
const FLICKS = [[-0.12, 1250], [2.1, 900], [3.3, 900], [5.9, 736], [6.75, 736], [7.6, 736], [8.45, 736]];
const scrollAt = t => FLICKS.reduce((s, [t0, A]) => s + A * X(t - t0), 0);
const velAt = t => FLICKS.reduce((s, [t0, A]) => s + A * Xv(t - t0), 0);
// 镜头：2.0 s 拉远到 0.3（看到整张长网页、视口在上面走），4.2 s 推回来，正好落在第一张规则卡钉住的时候
const zoomAt = t => { const z = smr((t - 2.0) / 1.3) * (1 - smr((t - 4.2) / 1.25)); return { k: Math.exp(Math.log(0.3) * z), z }; };

// ---------- 页面（页面坐标；视口 1920×1080）----------
const sticky = (pageY, top, h, end, s) => Math.min(Math.max(pageY - s, top), end - h - s);   // 屏幕 y
const NAV = { top: 26, h: 88, w: 1000 };
const A_END = 2900, STG = { x: 96, y: 150, w: 940, h: 860 };
const A_PIN = A_END - STG.h - STG.y;            // 1890：左边这块钉住的最后一个 scrollY
const B0 = A_END, CARD = { w: 1400, h: 680, gap: 760, top: 150, step: 24 }, NCARD = 5;
const cardY = i => B0 + 300 + i * CARD.gap, cardTop = i => CARD.top + i * CARD.step, cardPin = i => cardY(i) - cardTop(i);
const B_END = cardY(NCARD - 1) + CARD.h + 400;

// ---------- 预先画好的卡片 ----------
const RC = [], MC = [];
function stepCards() {
  const L = [];
  const card = (h, fn) => { const c = mk(650, h), x = c.getContext('2d'); fn(x, h); L.push(c); };
  const white = (x, h) => { rr(x, 0, 0, 650, h, 20); x.fillStyle = C.card; x.fill(); };
  const step = (n, zh, en, d1, d2) => (x, h) => {
    white(x, h);
    txt(x, n, 44, 112, 'italic 96px Serif', C.red);
    txt(x, zh, 44, 222, '900 84px SC', C.ink, 'left', 2);
    txt(x, en, 52 + tw(x, zh, '900 84px SC', 2), 222, 'italic 64px Serif', C.ink2);
    txt(x, d1, 46, 290, '500 32px SC', C.ink2); txt(x, d2, 46, 336, '500 32px SC', C.ink2);
  };
  const photo = n => (x, h) => { x.save(); rr(x, 0, 0, 650, h, 20); x.clip(); cover(x, IM[n], 0, 0, 650, h); x.restore(); };
  card(380, step('01', '钉住', 'Pin', '滚到 top 就停下，', '容器走完才离开。'));
  card(560, photo('stairs'));
  card(380, step('02', '擦洗', 'Scrub', '左边的照片只听滚动进度：', '推近多少、换到哪一张。'));
  card(340, (x, h) => {
    white(x, h);
    txt(x, '1 890', 40, 196, '200px Serif', C.ink, 'left', -4);
    txt(x, 'px', 52 + tw(x, '1 890', '200px Serif', -4), 196, 'italic 72px Serif', C.ink2);
    txt(x, '左边这块钉住的距离 = 容器高 − 元素高', 44, 282, '700 30px SC', C.ink);
  });
  card(560, photo('tokyo'));
  card(380, step('03', '顶走', 'Push', '容器到底，它被推出去，', '下一节接着钉。'));
  let y = STG.y; for (const c of L) { RC.push({ c, y }); y += c.height + 28; }
}
function ruleCards() {
  const R = [
    ['01', '钉在容器里', 'Contain', '父元素有多高，它就能钉多久', 'lake'],
    ['02', '一次只钉一样', 'One at a time', '同一屏只让一个主角停下', 'monstera'],
    ['03', '进度可以倒着走', 'Reversible', '擦洗是滚动的函数，往回滚就倒放', 'citrus'],
    ['04', '惯性交给系统', 'Native inertia', '只改“滚到哪显示什么”，不改滚多快', 'ocean'],
    ['05', '手机上换排法', 'Re-flow', '左钉右滚，到手机上变成图在上、字盖过去', 'nook'],
  ];
  R.forEach(([n, t, en, d, ph], i) => {
    const c = mk(CARD.w, CARD.h), x = c.getContext('2d');
    x.save(); rr(x, 0, 0, CARD.w, CARD.h, 28); x.clip();
    x.fillStyle = C.card; x.fillRect(0, 0, CARD.w, CARD.h);
    cover(x, IM[ph], 700, 0, 700, CARD.h);
    x.restore();
    rr(x, 1, 1, CARD.w - 2, CARD.h - 2, 28); x.strokeStyle = C.line; x.lineWidth = 2; x.stroke();
    txt(x, n, 60, 210, 'italic 200px Serif', C.red, 'left', -4);
    txt(x, t, 64, 360, '900 84px SC', C.ink, 'left', 2);
    txt(x, en, 66, 440, 'italic 60px Serif', C.ink2);
    txt(x, d, 66, 560, '500 32px SC', C.ink2);
    txt(x, `规则 ${n} / 05`, 66, 620, '500 24px Mono', C.ink2);
    MC.push(c);
  });
}

// ---------- 左边钉住的那块：标题 + 一张只听滚动进度的照片 ----------
const SHOTS = ['lake', 'dunes', 'ocean'], CUTS = [.36, .7];
function stage(c, s) {
  const sy = sticky(STG.y, STG.y, STG.h, A_END, s), q = clamp(s / A_PIN), y0 = s + sy;
  c.save(); c.translate(STG.x, y0);
  txt(c, 'Sticky', -8, 150, '196px Serif', C.ink, 'left', -4);
  txt(c, 'Scroll', 520, 150, 'italic 196px Serif', C.ink, 'left', -4);
  txt(c, '粘性滚动', 0, 296, '900 88px SC', C.ink, 'left', 4);
  txt(c, '一块钉住，其余滚过去', 420, 288, '500 34px SC', C.ink2);
  // 照片：推近 + 到分界从下往上换下一张（都按 q 擦洗）
  const mx = 0, my = 346, mw = STG.w, mh = 446;
  c.save(); rr(c, mx, my, mw, mh, 20); c.clip();
  const local = i => { const a = i ? CUTS[i - 1] : 0, z = CUTS[i] ?? 1; return clamp((q - a + .08) / (z - a + .08)); };
  const shot = (i, clipTop) => {
    c.save(); c.beginPath(); c.rect(mx, clipTop, mw, my + mh - clipTop); c.clip();
    const k = 1.14 - .14 * local(i); c.translate(mx + mw / 2, my + mh / 2); c.scale(k, k); c.translate(-(mx + mw / 2), -(my + mh / 2));
    cover(c, IM[SHOTS[i]], mx, my, mw, mh); c.restore();
  };
  shot(0, my);
  for (let i = 1; i < 3; i++) {     // 到分界前后 0.08 的进度里，下一张从下往上盖上来
    const w = smr((q - (CUTS[i - 1] - .08)) / .16);
    if (w > 0) shot(i, my + mh * (1 - w));
  }
  c.restore();
  // 照片上的说明 + 红色进度线
  txt(c, `● 钉住中 · ${String(Math.round(q * 100)).padStart(2, ' ')}%`, mx + 28, my + mh - 30, '500 26px Mono', '#fff');
  rr(c, mx, my + mh + 22, mw, 4, 2); c.fillStyle = 'rgba(20,20,20,.12)'; c.fill();
  rr(c, mx, my + mh + 22, Math.max(4, mw * q), 4, 2); c.fillStyle = C.red; c.fill();
  c.restore();
}

// ---------- 整张页面（页面坐标）----------
function world(c, s, view) {
  const a = view.top, z = view.top + view.h;
  c.fillStyle = C.paper; c.fillRect(0, a, W, z - a);
  for (const r of RC) if (r.y + r.c.height > a && r.y < z) c.drawImage(r.c, 1174, r.y);
  stage(c, s);
  if (z > B0 - 200) {
    c.fillStyle = 'rgba(20,20,20,.12)'; c.fillRect(96, B0, W - 192, 2);
    txt(c, 'Five rules,', 260, B0 + 170, 'italic 120px Serif', C.ink, 'left', -2);
    txt(c, 'stacked.', 260 + tw(c, 'Five rules, ', 'italic 120px Serif', -2), B0 + 170, '120px Serif', C.ink, 'left', -2);
    txt(c, '五条规则，一张叠一张', 264, B0 + 236, '700 36px SC', C.ink2);
    for (let i = 0; i < NCARD; i++) {
      const top = cardTop(i), sy = sticky(cardY(i), top, CARD.h, B_END, s);
      const py = s + sy; if (py > z || py + CARD.h + 20 < a) continue;
      const depth = clamp((s - cardPin(i)) / CARD.gap, 0, NCARD - 1 - i);
      const sc = 1 - 0.045 * depth;
      c.save(); c.translate(W / 2, py); c.scale(sc, sc); c.translate(-W / 2, 0);
      c.shadowColor = 'rgba(20,20,20,.14)'; c.shadowBlur = 40; c.shadowOffsetY = 18;
      c.drawImage(MC[i], (W - CARD.w) / 2, 0);
      c.shadowColor = 'transparent';
      if (depth > 0.001) { c.fillStyle = `rgba(20,20,20,${0.08 * Math.min(depth, 2)})`; rr(c, (W - CARD.w) / 2, 0, CARD.w, CARD.h, 28); c.fill(); }
      c.restore();
    }
  }
}

// ---------- 视图：镜头把页面坐标映射到屏幕 ----------
function viewAt(t, s) {
  const { k, z } = zoomAt(t);
  const fy = s + H / 2 + (2400 - (s + H / 2)) * z;   // 拉远时看两节的交界
  return { k, z, fy, top: fy - H / 2 / k, h: H / k };
}
const buf = mk(W, H), b = buf.getContext('2d');
const acc = mk(W, H), A = acc.getContext('2d');
function sub(t) {
  const s = scrollAt(t), v = viewAt(t, s);
  b.setTransform(1, 0, 0, 1, 0, 0); b.fillStyle = C.night; b.fillRect(0, 0, W, H);
  b.setTransform(v.k, 0, 0, v.k, W / 2 - v.k * W / 2, H / 2 - v.k * v.fy);
  world(b, s, v);
  if (v.z > 0.001) {      // 视口以外压暗，视口描边
    b.fillStyle = `rgba(18,17,16,${0.45 * v.z})`;
    b.beginPath(); b.rect(0, v.top - 10, W, v.h + 20); b.rect(0, s, W, H); b.fill('evenodd');
    b.strokeStyle = `rgba(255,255,255,${v.z})`; b.lineWidth = 5 / v.k; b.strokeRect(0, s, W, H);
  }
  return { s, v };
}

// ---------- WebGL：液态玻璃（折射量 = 边缘的坡度）----------
const gl = document.getElementById('gl').getContext('webgl2', { preserveDrawingBuffer: true, antialias: false });
const VS = `#version 300 es
in vec2 a; void main(){ gl_Position = vec4(a,0.,1.); }`;
const FS = `#version 300 es
precision highp float;
uniform sampler2D T; uniform vec2 R; uniform vec4 S0; uniform vec4 S1; uniform vec2 RR; uniform float K;
out vec4 o;
float sdb(vec2 p, vec2 b, float r){ vec2 q = abs(p) - b + r; return length(max(q,0.)) + min(max(q.x,q.y),0.) - r; }
vec3 smp(vec2 p){ return texture(T, clamp(p/R, vec2(0.), vec2(1.))).rgb; }
vec4 lens(vec2 p, vec4 S, float r, float bev, float mag){
  vec2 lp = p - S.xy; float d = sdb(lp, S.zw, r);
  if (d > 0.) return vec4(0.);
  vec2 g = vec2(sdb(lp+vec2(1.,0.),S.zw,r) - sdb(lp-vec2(1.,0.),S.zw,r), sdb(lp+vec2(0.,1.),S.zw,r) - sdb(lp-vec2(0.,1.),S.zw,r));
  g = g / (length(g) + 1e-5);
  float t = clamp(1. + d / bev, 0., 1.);
  float bend = pow(t, 2.4) * bev * 1.25;
  vec2 q = S.xy + lp / mag - g * bend;
  float ch = bend * .07;
  vec3 c = vec3(smp(q - g*ch).r, smp(q).g, smp(q + g*ch).b);
  c = mix(c, vec3(1.), .1);
  float rim = smoothstep(2.2*K, 0., -d);
  float light = .5 + .5 * dot(g, normalize(vec2(-.55, -.85)));
  c += rim * (.25 + .6 * light);
  c += pow(t, 5.) * max(0., -g.y) * .22;
  c -= pow(t, 3.) * max(0., g.y) * .07;
  return vec4(c, 1.);
}
void main(){
  vec2 p = vec2(gl_FragCoord.x, R.y - gl_FragCoord.y);
  vec3 col = smp(p);
  float d0 = sdb(p - S0.xy - vec2(0., 12.*K), S0.zw, RR.x);
  col *= 1. - .2 * exp(-max(d0, 0.) / (26.*K)) * step(0., d0);
  vec4 l0 = lens(p, S0, RR.x, 22.*K, 1.04); if (l0.a > 0.) col = l0.rgb;
  vec4 l1 = lens(p, S1, RR.y, 16.*K, 1.10); if (l1.a > 0.) col = l1.rgb;
  o = vec4(col, 1.);
}`;
function sh(type, src) { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw gl.getShaderInfoLog(s); return s; }
const prog = gl.createProgram(); gl.attachShader(prog, sh(gl.VERTEX_SHADER, VS)); gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FS)); gl.linkProgram(prog); gl.useProgram(prog);
gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer()); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
const al = gl.getAttribLocation(prog, 'a'); gl.enableVertexAttribArray(al); gl.vertexAttribPointer(al, 2, gl.FLOAT, false, 0, 0);
const tex = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, tex);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
const U = n => gl.getUniformLocation(prog, n);
gl.viewport(0, 0, W, H);

// ---------- 导航：标签和那滴玻璃 ----------
const TABS = ['钉住', '叠卡', '手机'];
const tabAt = s => smr((s - 2450) / 600);
function navGeom(t, s, v) {
  const k = v.k, cy = H / 2 + k * (s + NAV.top + NAV.h / 2 - v.fy), cx = W / 2;
  const tp = tabAt(s), dtp = (tabAt(scrollAt(t + 1 / 120)) - tabAt(scrollAt(t - 1 / 120))) * 60;
  const tx0 = cx - 150, gap = 150;
  const bx = cx + k * ((tx0 + tp * gap) - cx), stretch = Math.min(70, Math.abs(dtp) * 26);
  return { cx, cy, hw: k * NAV.w / 2, hh: k * NAV.h / 2, r: k * NAV.h / 2,
    bx, bhw: k * (62 + stretch), bhh: k * 30 * (1 - Math.min(.18, stretch / 300)), br: k * 30, tp, k, tx0, gap };
}
const ov = document.getElementById('ov').getContext('2d');
function overlay(t, s, v, n) {
  ov.clearRect(0, 0, W, H);
  ov.save(); ov.translate(n.cx, n.cy); ov.scale(n.k, n.k);
  txt(ov, 'Layout 03', -NAV.w / 2 + 44, 12, 'italic 34px Serif', C.ink);
  TABS.forEach((s2, i) => {
    const on = 1 - Math.min(1, Math.abs(n.tp - i));
    ov.globalAlpha = .45 + .55 * on;
    txt(ov, s2, n.tx0 - W / 2 + i * n.gap, 10, '700 26px SC', C.ink, 'center');
  });
  ov.globalAlpha = 1;
  txt(ov, '粘性滚动', NAV.w / 2 - 44, 10, '700 26px SC', C.ink, 'right');
  ov.restore();
  if (v.z > 0.05) {
    ov.globalAlpha = sm((v.z - .4) / .6);
    const sx = W / 2 + v.k * (W - W / 2), sy0 = H / 2 + v.k * (s - v.fy);
    const L = W / 2 - v.k * W / 2;
    ov.strokeStyle = '#fff'; ov.lineWidth = 3; ov.beginPath(); ov.moveTo(sx + 24, sy0); ov.lineTo(sx + 40, sy0); ov.lineTo(sx + 40, sy0 + v.k * H); ov.lineTo(sx + 24, sy0 + v.k * H); ov.stroke();
    txt(ov, '视口', sx + 64, sy0 + 44, '900 44px SC', '#fff');
    txt(ov, '屏幕上看得见的那一截', sx + 64, sy0 + 90, '700 26px SC', 'rgba(255,255,255,.7)');
    const cy0 = H / 2 + v.k * (0 - v.fy), cy1 = H / 2 + v.k * (A_END - v.fy);
    ov.strokeStyle = C.red; ov.setLineDash([12, 10]); ov.beginPath(); ov.moveTo(L - 24, cy0); ov.lineTo(L - 40, cy0); ov.lineTo(L - 40, cy1); ov.lineTo(L - 24, cy1); ov.stroke(); ov.setLineDash([]);
    txt(ov, '容器', L - 64, (cy0 + cy1) / 2 - 6, '900 44px SC', C.red, 'right');
    txt(ov, '左边这块只在这一段里钉住，', L - 64, (cy0 + cy1) / 2 + 40, '700 26px SC', 'rgba(255,255,255,.75)', 'right');
    txt(ov, '到底就被顶走', L - 64, (cy0 + cy1) / 2 + 76, '700 26px SC', 'rgba(255,255,255,.75)', 'right');
    const my = Math.max(H / 2 + v.k * (cardY(0) + CARD.h * .75 - v.fy), sy0 + 230);
    txt(ov, '规则卡', sx + 64, my - 6, '900 44px SC', '#fff');
    txt(ov, '还在原位，滚到顶才钉住', sx + 64, my + 40, '700 26px SC', 'rgba(255,255,255,.75)');
    ov.globalAlpha = 1;
  }
}

const SHUTTER = 0.75;
window.frame = f => {
  const t = f / FPS, v0 = velAt(t);
  const zv = Math.abs(zoomAt(t + 1 / 120).k - zoomAt(t - 1 / 120).k) * 60;
  const N = Math.max(1, Math.min(20, Math.ceil(Math.abs(v0) * zoomAt(t).k * SHUTTER / FPS / 2.5 + zv * 40)));
  for (let k = 0; k < N; k++) {
    const tk = N === 1 ? t : t + (k / (N - 1) - .5) * SHUTTER / FPS;
    sub(tk);
    A.globalAlpha = 1 / (k + 1); A.drawImage(buf, 0, 0);
  }
  A.globalAlpha = 1;
  const s = scrollAt(t), v = viewAt(t, s), n = navGeom(t, s, v);
  gl.bindTexture(gl.TEXTURE_2D, tex); gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, acc);
  gl.uniform2f(U('R'), W, H); gl.uniform1i(U('T'), 0); gl.uniform1f(U('K'), n.k);
  gl.uniform4f(U('S0'), n.cx, n.cy, n.hw, n.hh); gl.uniform4f(U('S1'), n.bx, n.cy, n.bhw, n.bhh); gl.uniform2f(U('RR'), n.r, n.br);
  gl.drawArrays(gl.TRIANGLES, 0, 3); gl.finish();
  overlay(t, s, v, n);
};
const qf = new URLSearchParams(location.search).get('f');
Promise.all([...Object.entries(ASSETS).map(([k, v]) => new Promise(r => { const im = new Image(); im.onload = () => { IM[k] = im; r(); }; im.src = v; })),
  ...['400 10px Serif', 'italic 400 10px Serif', '500 10px Inter', '500 10px Mono', '900 10px SC', '700 10px SC', '500 10px SC'].map(s => document.fonts.load(s, '粘性滚动钉住Aa1'))])
  .then(() => { stepCards(); ruleCards(); window.frame(+(qf || 0)); window.ready = true; });
</script></body></html>
