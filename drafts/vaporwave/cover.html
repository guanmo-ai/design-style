  <path d="M1140,640 L1300,540 L1430,600 L1600,500 L1760,590 L1920,540 L1920,640Z" fill="#1d0640" stroke="#00f0ff" stroke-width="2" filter="url(#glow)"/>

<script>
// 透视网格：竖线收进灭点，横线越近越疏
const g=document.getElementById('grid'),NS='http://www.w3.org/2000/svg',H=640,VX=960;
const L=(x1,y1,x2,y2,o)=>{const l=document.createElementNS(NS,'line');l.setAttribute('x1',x1);l.setAttribute('y1',y1);l.setAttribute('x2',x2);l.setAttribute('y2',y2);if(o!=null)l.setAttribute('stroke-opacity',o);g.appendChild(l)};
for(let i=-30;i<=30;i++){L(VX+i*14,H,VX+i*230,1080)}
const phase=.62; // 地面滚到一半
for(let k=0;k<26;k++){const z=k+phase;const y=H+440*(1/(1+ (26-z)*.18))*1.0;}
for(let k=1;k<30;k++){const z=(k+phase);const y=H+ 3200/( 40/z +0) ;}
// 用简单的 1/z 投影
for(let k=0;k<40;k++){const d=0.6+k*1.0-phase;const y=H+380/d; if(y>H+2&&y<1080) L(0,y,1920,y, Math.min(1,(y-H)/60))}
// 大理石柱
const cols=document.getElementById('cols');
function column(x,top,w,h,broken){
  let s='';const cap=top, sh=top+70;
  // 柱头（爱奥尼涡卷）
  if(!broken){s+=`<rect x="${x-w*.75}" y="${cap}" width="${w*1.5}" height="26" fill="url(#marble)" stroke="#5a3d7a" stroke-width="2"/>`;
  for(const sx of [-1,1]){const cx=x+sx*w*.62,cy=cap+44;
    s+=`<circle cx="${cx}" cy="${cy}" r="26" fill="url(#marble)" stroke="#5a3d7a" stroke-width="2"/><path d="M${cx},${cy} m-4,0 a4,4 0 1,1 8,0 a9,9 0 1,1 -18,0 a14,14 0 1,1 28,0 a19,19 0 1,1 -38,0" fill="none" stroke="#5a3d7a" stroke-width="2"/>`;}
  s+=`<rect x="${x-w*.55}" y="${cap+26}" width="${w*1.1}" height="40" fill="url(#marble)" stroke="#5a3d7a" stroke-width="2"/>`;}
  // 柱身 + 凹槽
  const top2=broken?top:sh;
  const brk=broken?`L${x+w/2},${top2+30} L${x+w*.2},${top2} L${x-w*.05},${top2+40} L${x-w*.3},${top2+8}`:'';
  s+=`<path d="M${x-w/2},${h} L${x-w/2},${top2+ (broken?20:0)} ${broken?'L'+(x-w*.3)+','+(top2+8)+' L'+(x-w*.05)+','+(top2+40)+' L'+(x+w*.2)+','+top2+' L'+(x+w/2)+','+(top2+30):'L'+(x+w/2)+','+top2} L${x+w/2},${h}Z" fill="url(#marble)" stroke="#5a3d7a" stroke-width="2"/>`;
  for(let f=1;f<7;f++){const fx=x-w/2+f*w/7;s+=`<line x1="${fx}" y1="${top2+(broken?44:6)}" x2="${fx}" y2="${h-50}" stroke="#7d5f9c" stroke-opacity=".45" stroke-width="3"/>`}
  s+=`<rect x="${x-w/2}" y="${top2}" width="${w}" height="${h-top2}" filter="url(#veins)" opacity=".5" style="mix-blend-mode:multiply"/>`;
  s+=`<rect x="${x-w*.7}" y="${h-50}" width="${w*1.4}" height="24" fill="url(#marble)" stroke="#5a3d7a" stroke-width="2"/><rect x="${x-w*.8}" y="${h-26}" width="${w*1.6}" height="26" fill="url(#marble)" stroke="#5a3d7a" stroke-width="2"/>`;
  cols.insertAdjacentHTML('beforeend',s);
}
column(250,250,150,1000,false);
column(520,560,110,960,true);
</script>
