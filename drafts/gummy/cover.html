<!doctype html><meta charset="utf-8">
<!-- 果冻软糖 · 第 0 帧：两个“枕头”一样鼓起来的果冻字 + 几只果冻熊。“冻”刚落地被压扁，一只熊还在空中翻。
     字和熊都是距离场 → MarchingCubes（drafts/_3d/sdf.js），材质是透射 + 衰减色 + 清漆。
     cd drafts/_3d && node shoot.cjs ../gummy/cover.html ../gummy/png/cover.png -->
<style>
@font-face{font-family:GM;src:url(/public/fonts/GeistMono.ttf)}
@font-face{font-family:NSB;src:url(/public/fonts/NotoSansSC-Bold.otf)}
@font-face{font-family:NSK;src:url(/public/fonts/NotoSansSC-Black.otf)}
@font-face{font-family:Fre;src:url(/public/fonts/Fredoka.ttf)}
html,body{margin:0;overflow:hidden;background:#000}
#hud{position:absolute;inset:0;pointer-events:none;color:#2A0F52;font-family:GM}
.tl{position:absolute;left:64px;top:52px;font-size:22px;letter-spacing:.06em}
.tr{position:absolute;right:64px;top:52px;font-size:22px;letter-spacing:.06em}

.sub small{display:block;font-family:Fre;font-weight:600;font-size:24px;letter-spacing:.14em;color:#2A0F52aa;margin-bottom:6px}
</style>
<div id="hud"><div class="tl">风格 · GUMMY</div><div class="tr">1922 — 今天</div>
<div class="sub"><small>SQUASH · WOBBLE · GLOW</small>会抖的糖：落下、压扁、晃三下才停</div></div>
<script type="importmap">{"imports":{"three":"/drafts/_3d/node_modules/three/build/three.module.js","three/addons/":"/drafts/_3d/node_modules/three/examples/jsm/"}}</script>
<script type="module">
import { THREE, setup, finish, sun } from '/drafts/_3d/lib.js';
import { envMap, cyc, glowSpot } from '/drafts/_3d/craft.js';
import { glyph2D, pillow, meshSDF, smin, sdEllipsoid } from '/drafts/_3d/sdf.js';
const Q = new URLSearchParams(location.search), PR = +(Q.get('pr') || 2), RES = +(Q.get('res') || 150);
const BG = '#9F7BFF';
const ctx = setup({ pr: PR, bg: BG, tone: 'neutral' });
const { renderer, scene } = ctx;
renderer.toneMappingExposure = 1.0;
scene.environment = envMap(renderer); scene.environmentIntensity = 0.55;
{ const c = cyc(BG, { w: 90, d: 60, r: 12, h: 50 }); c.material.roughness = 0.42; c.material.envMapIntensity = 0.12; scene.add(c); }
const key = sun(scene, { color: '#FFF4E8', intensity: 3.4, pos: [-9, 15, -13], target: [0, 1, 0], size: 13, map: 4096, bias: -0.0003 });   // 逆光：果冻要从后面打才透亮
key.shadow.radius = 10; key.shadow.blurSamples = 20;
const rim = new THREE.DirectionalLight('#FFD8F0', 2.6); rim.position.set(11, 8, -14); scene.add(rim);
const fill = new THREE.DirectionalLight('#FFF6FF', 1.15); fill.position.set(3, 6, 18); scene.add(fill);
// 背景上的一束光：中间亮、四周暗
const bgSpot = new THREE.SpotLight('#E8DCFF', 160, 90, .62, 1, 1.2); bgSpot.position.set(0, 18, 14); bgSpot.target.position.set(0, 10, -30); scene.add(bgSpot, bgSpot.target);
scene.add(new THREE.HemisphereLight('#FFFFFF', '#6C4BD9', 0.35));

const gummy = (col, deep, o = {}) => new THREE.MeshPhysicalMaterial({
  color: col, transmission: 1, thickness: o.th ?? 1.1, roughness: o.rough ?? 0.1, ior: 1.45,
  attenuationColor: deep, attenuationDistance: o.ad ?? 1.3, clearcoat: 1, clearcoatRoughness: 0.08, specularIntensity: 1 });
const C = {
  red: gummy('#FF8088', '#D4001F'), green: gummy('#B8FF8C', '#18B000'), redL: gummy('#FF9AA2', '#FF1030', { ad: 1.8, th: 1.4 }), greenL: gummy('#D2FFB0', '#30D010', { ad: 1.8, th: 1.4 }), yellow: gummy('#FFF8C0', '#FFC800', { ad: 2.2 }),
  orange: gummy('#FFC08C', '#FF4D00'), clear: new THREE.MeshPhysicalMaterial({ color: '#FFF6EE', transmission: .75, thickness: 2, roughness: .3, ior: 1.45, attenuationColor: '#FFE2C8', attenuationDistance: 1.2, clearcoat: 1, clearcoatRoughness: .1, sheen: 1, sheenColor: '#ffffff', sheenRoughness: .6 }), pink: gummy('#FFD6EA', '#FF2E7E', { ad: 1.4 }),
};
await document.fonts.load('400px NSK');

// ---- 两个大字：二维距离场 → 枕头 ----
const SZ = 3.6;
function letter(ch, m, x, z, ry, squash = 1) {
  const d2 = glyph2D(ch, 'NSK', SZ, 480);
  const f = pillow(d2, { h0: 0.28, bulge: 0.9, maxH: 0.62, r: 0.2 });
  const o = meshSDF(f, [0, SZ / 2, 0, SZ * 0.62], RES, m);
  const g = new THREE.Group(); g.add(o); o.position.y = SZ / 2;
  g.position.set(x, 0, z); g.rotation.y = ry;
  g.scale.set(1 / Math.sqrt(squash), squash, 1 / Math.sqrt(squash));
  scene.add(g); return g;
}
letter('果', C.redL, -2.0, 0, 0.1);
letter('冻', C.greenL, 2.05, 0.3, -0.08, 0.84);

// ---- 果冻熊：几个椭球平滑并起来 ----
function bearSDF(x, y, z) {
  let d = sdEllipsoid(x, y - 0.55, z, 0.46, 0.42, 0.34);                       // 头
  d = smin(d, sdEllipsoid(x + 0.33, y - 0.92, z, 0.15, 0.15, 0.12), 0.08);       // 耳
  d = smin(d, sdEllipsoid(x - 0.33, y - 0.92, z, 0.15, 0.15, 0.12), 0.08);
  d = smin(d, sdEllipsoid(x, y + 0.2, z, 0.55, 0.6, 0.38), 0.18);               // 身
  d = smin(d, sdEllipsoid(x + 0.5, y + 0.0, z - 0.06, 0.2, 0.26, 0.18), 0.1);    // 手
  d = smin(d, sdEllipsoid(x - 0.5, y + 0.0, z - 0.06, 0.2, 0.26, 0.18), 0.1);
  d = smin(d, sdEllipsoid(x + 0.3, y + 0.74, z - 0.04, 0.24, 0.24, 0.22), 0.1);  // 脚
  d = smin(d, sdEllipsoid(x - 0.3, y + 0.74, z - 0.04, 0.24, 0.24, 0.22), 0.1);
  d = smin(d, sdEllipsoid(x, y - 0.45, z - 0.3, 0.14, 0.1, 0.1), 0.06);         // 鼻子
  return d;
}
const bearGeo = meshSDF(bearSDF, [0, 0.05, 0, 1.08], 110, C.red).geometry;
function bear(m, pos, rot, s = 1) {
  const o = new THREE.Mesh(bearGeo, m); o.castShadow = true; o.receiveShadow = true;
  o.position.set(...pos); o.rotation.set(...rot); o.scale.setScalar(s); scene.add(o); return o;
}
bear(C.yellow, [-5.4, 1.0, 1.2], [0, .45, -.06], 1.05);
bear(C.orange, [5.6, 1.0, 1.0], [0, -.5, .08], 1.05);
bear(C.clear, [-3.3, .85, 3.6], [0, .3, .1], .85);
bear(C.pink, [3.9, 5.1, 1.2], [.6, -.7, 1.1], .95);
bear(C.yellow, [6.4, 4.4, -1.8], [-.3, .5, -.6], .7);
bear(C.red, [0.6, .7, 4.6], [-.05, -.15, -.12], .72);
// 果冻圈：圆环 + 一点起伏
{ const tg = new THREE.TorusGeometry(.62, .3, 48, 96); const P = tg.attributes.position; for (let i = 0; i < P.count; i++) { const a = Math.atan2(P.getY(i), P.getX(i)); const k = 1 + .05 * Math.sin(a * 9); P.setXYZ(i, P.getX(i) * k, P.getY(i) * k, P.getZ(i)); } tg.computeVertexNormals();
  const ring = (m, pos, rot) => { const o = new THREE.Mesh(tg, m); o.castShadow = true; o.receiveShadow = true; o.position.set(...pos); o.rotation.set(...rot); scene.add(o); };
  ring(C.pink, [3.6, .32, 3.9], [Math.PI / 2 + .08, 0, -.2]); ring(C.yellow, [-4.2, 5.2, -1.2], [.9, .4, .2]); }

// 透光光斑
const spot = (c, x, z, w, d, o) => { const s = glowSpot(c, [w, d], o); s.position.x = x; s.position.z = z; scene.add(s); };
spot('#FF1E3A', -1.5, 1.7, 4.6, 2.6, .7); spot('#3CFF10', 2.6, 2.0, 4.6, 2.6, .6);
spot('#FFAA00', -5.3, 2.4, 2.4, 1.8, .7); spot('#FF5A00', 5.5, 2.2, 2.4, 1.8, .65); spot('#FF6CB0', .8, 5.0, 1.6, 1.2, .55);

const cam = new THREE.PerspectiveCamera(30, 1920 / 1080, 0.1, 200);
cam.position.set(0, 4.0, 17.2); cam.lookAt(0, 2.15, 0);
await document.fonts.ready;
finish(ctx, cam, { ao: true, aoRadius: 0.5, aoDist: 0.25, bloom: 0.18, bloomRadius: 0.5, bloomThreshold: 0.95, vig: 0.3, grain: 0.02 });
</script>
