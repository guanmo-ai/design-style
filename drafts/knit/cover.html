const ball = yarnBall(CREAM, 1.0, mat, 7); ball.position.set(6.2, 1.0, 2.4); scene.add(ball);
{ const [sx, sy, sz] = surf(DONE, ROWS - 1);
  const p0 = new THREE.Vector3(sx, sy, sz).applyMatrix4(new THREE.Matrix4().makeRotationX(-0.12));
