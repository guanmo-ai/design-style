<!doctype html><meta charset="utf-8">
<!-- 新拟态 · 落到网页和手机 App（1920×1080）。node ../_lib/shot.cjs ui.html png/ui.png
     规则：背景和元素同一个色；凸 = 左上白影 + 右下暗影，凹 = 两道影子放进 inset；被选中的状态除了“凹”，还要加一点颜色（只靠影子分不清）。 -->
<link rel="stylesheet" href="../_lib/cand_fonts.css">
<style>
:root{--bg:#E3E8EF;--lt:#FFFFFF;--dk:#A6B4C8;--ink:#2F3650;--mut:#6F7B95;--a1:#7B6CFF;--a2:#FF7AC6}
body{background:var(--bg);font-family:Inter,NotoSC,sans-serif;color:var(--ink);position:relative}
.abs{position:absolute}
.up{background:var(--bg);box-shadow:-12px -12px 24px var(--lt),12px 12px 24px var(--dk)}
.up-s{background:var(--bg);box-shadow:-6px -6px 12px var(--lt),6px 6px 12px var(--dk)}
.in{background:var(--bg);box-shadow:inset 7px 7px 14px var(--dk),inset -7px -7px 14px var(--lt)}
.in-s{background:var(--bg);box-shadow:inset 4px 4px 8px var(--dk),inset -4px -4px 8px var(--lt)}
.gr{background:linear-gradient(135deg,var(--a1),var(--a2))}
.ico{width:64px;height:64px;border-radius:20px;display:flex;align-items:center;justify-content:center}
.room{border-radius:32px;padding:26px;position:relative}
.room b{display:block;font-size:24px;font-weight:600;margin-top:18px}.room span{font-size:17px;color:var(--mut)}
.tg{position:absolute;right:24px;top:30px;width:76px;height:40px;border-radius:20px}
.tg i{position:absolute;top:5px;width:30px;height:30px;border-radius:50%}
.lbl{font:600 15px Inter;letter-spacing:3px;color:var(--mut)}
</style>
