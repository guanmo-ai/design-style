<!doctype html>
<!-- Frutiger Aero · 第 0 帧（1920×1080）
     上半是天，下半是水。一颗大水泡正往上浮，快到水面了；身后一串小泡沿着摆动的路径跟上来。
     这一期的物理：浮力 + 高光不跟着转（高光属于光，不属于球）。
     node ../_lib/shot.cjs cover.html png/cover.png 1920 1080 2 -->
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Sel;src:url(../../public/fonts/Selawik-Semibold.ttf)}
@font-face{font-family:SelL;src:url(../../public/fonts/Selawik-Light.ttf)}
@font-face{font-family:NSB;src:url(../../public/fonts/NotoSansSC-Bold.otf)}
@font-face{font-family:NSM;src:url(../../public/fonts/NotoSansSC-Medium.otf)}
@font-face{font-family:GM;src:url(../../public/fonts/GeistMono.ttf)}
html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#0B6FD6}
canvas{position:absolute;left:0;top:0;width:1920px;height:1080px}
</style></head><body><canvas id="c" width="3840" height="2160"></canvas>
<script>
(async()=>{
await Promise.all(['22px GM','92px Sel','92px SelL','40px NSB','19px NSM','15px GM'].map(f=>document.fonts.load(f)));
const cv=document.getElementById('c'), x=cv.getContext('2d');
const W=1920,H=1080, SEA=500;              // 水面高度
function rnd(s){return ()=>{s=(s*16807)%2147483647;return s/2147483647}}
const R=rnd(7);
const lg=(x0,y0,x1,y1,st)=>{const g=x.createLinearGradient(x0,y0,x1,y1);st.forEach(([o,c])=>g.addColorStop(o,c));return g};
const rg=(x0,y0,r0,x1,y1,r1,st)=>{const g=x.createRadialGradient(x0,y0,r0,x1,y1,r1);st.forEach(([o,c])=>g.addColorStop(o,c));return g};

// ---------- 背景画在离屏画布上（水泡要折射它）----------
const bg=document.createElement('canvas'); bg.width=3840; bg.height=2160;
function paintBG(){
  const b=bg.getContext('2d'); b.scale(2,2);
  const X=x; // 复用渐变工厂
  // 天
  let g=b.createLinearGradient(0,0,0,SEA); g.addColorStop(0,'#0758C9'); g.addColorStop(.55,'#2FA4F2'); g.addColorStop(1,'#CDEFFF');
  b.fillStyle=g; b.fillRect(0,0,W,SEA);
  // 太阳 + 光晕（右上）
  g=b.createRadialGradient(1500,90,0,1500,90,700); g.addColorStop(0,'rgba(255,255,255,.95)'); g.addColorStop(.08,'rgba(255,255,255,.7)'); g.addColorStop(.35,'rgba(200,240,255,.18)'); g.addColorStop(1,'rgba(200,240,255,0)');
  b.fillStyle=g; b.fillRect(0,0,W,SEA);
  // 云：一团团软圆
  const cloud=(cx,cy,s,a)=>{for(let i=0;i<14;i++){const ox=(R()-.5)*260*s, oy=(R()-.6)*50*s, r=(40+R()*60)*s;
    const gg=b.createRadialGradient(cx+ox,cy+oy-r*.3,0,cx+ox,cy+oy,r); gg.addColorStop(0,`rgba(255,255,255,${a})`); gg.addColorStop(.6,`rgba(255,255,255,${a*.6})`); gg.addColorStop(1,'rgba(255,255,255,0)');
    b.fillStyle=gg; b.beginPath(); b.arc(cx+ox,cy+oy,r,0,7); b.fill();}};
  cloud(330,250,1.2,.55); cloud(980,330,.9,.45); cloud(1700,300,1.1,.5); cloud(640,140,.6,.35);
  // 远处的绿岛（水面上的一条丘）
  b.beginPath(); b.moveTo(1080,SEA); 
  b.bezierCurveTo(1200,SEA-70,1380,SEA-118,1540,SEA-112); b.bezierCurveTo(1700,SEA-104,1830,SEA-60,1920,SEA-40); b.lineTo(1920,SEA); b.closePath();
  g=b.createLinearGradient(0,SEA-120,0,SEA); g.addColorStop(0,'#8CE04A'); g.addColorStop(.5,'#4DB52B'); g.addColorStop(1,'#2A8A26'); b.fillStyle=g; b.fill();
  // 岛上的高光带
  b.save(); b.clip(); g=b.createLinearGradient(0,SEA-120,0,SEA-60); g.addColorStop(0,'rgba(255,255,220,.65)'); g.addColorStop(1,'rgba(255,255,220,0)'); b.fillStyle=g; b.fillRect(1080,SEA-130,840,70); b.restore();
  // 白色光带（swoosh）
  const swoosh=(y0,amp,w,a)=>{b.save(); b.globalCompositeOperation='screen';
    for(let k=0;k<3;k++){b.beginPath(); b.moveTo(-50,y0+k*14); b.bezierCurveTo(500,y0-amp+k*10,1200,y0+amp*1.2+k*6,1980,y0-amp*.4+k*12);
      b.lineWidth=w*(1-k*.3); b.strokeStyle=`rgba(255,255,255,${a*(1-k*.3)})`; b.shadowColor='rgba(255,255,255,.9)'; b.shadowBlur=18; b.stroke();}
    b.restore();};
  swoosh(210,90,3,.55); swoosh(380,60,1.6,.4);
  // 水下
  g=b.createLinearGradient(0,SEA,0,H); g.addColorStop(0,'#41D2F2'); g.addColorStop(.35,'#1597D6'); g.addColorStop(1,'#063E86');
  b.fillStyle=g; b.fillRect(0,SEA,W,H-SEA);
  // 焦散：|sin+sin| 叠出来的亮网，越深越淡
  const id=b.getImageData(0,SEA*2,3840,(H-SEA)*2), d=id.data, w2=3840;
  for(let py=0;py<(H-SEA)*2;py++){ const yy=py/2, fade=Math.max(0,1-yy/430)**1.4;
    if(fade<=0) continue;
    for(let px=0;px<w2;px++){ const xx=px/2;
      const u=xx*.018, v=yy*.03;
      let c=Math.sin(u+Math.sin(v*1.7+u*.6)*1.6)+Math.sin(v*1.3-u*.8+Math.sin(u*1.1)*1.4)+Math.sin((u+v)*.9+2.0);
      c=Math.pow(Math.max(0,1-Math.abs(c)*.9),6)*fade*95;
      const i=(py*w2+px)*4; d[i]+=c*.85; d[i+1]+=c; d[i+2]+=c; }}
  b.putImageData(id,0,SEA*2);
  // 水下的光柱（从太阳斜下来）
  b.save(); b.globalCompositeOperation='screen';
  for(let k=0;k<7;k++){const x0=1100+k*120+R()*60, wd=30+R()*70;
    g=b.createLinearGradient(0,SEA,0,H); g.addColorStop(0,'rgba(200,250,255,.10)'); g.addColorStop(1,'rgba(200,250,255,0)');
    b.fillStyle=g; b.beginPath(); b.moveTo(x0,SEA); b.lineTo(x0+wd,SEA); b.lineTo(x0+wd-420,H); b.lineTo(x0-420-wd*.5,H); b.closePath(); b.fill();}
  b.restore();
  // 水面：一条亮线 + 下方的反光带
  g=b.createLinearGradient(0,SEA-2,0,SEA+26); g.addColorStop(0,'rgba(255,255,255,.95)'); g.addColorStop(.2,'rgba(220,255,255,.55)'); g.addColorStop(1,'rgba(220,255,255,0)');
  b.fillStyle=g; b.fillRect(0,SEA-2,W,28);
}
paintBG();
x.drawImage(bg,0,0);
x.scale(2,2);

// ---------- 水泡 ----------
// 高光固定在左上（光在右上？——Aero 的约定是高光在顶部偏左，像窗户的倒影）
function bubble(cx,cy,r,opt={}){
  const mag=opt.mag??1.18, tint=opt.tint??'rgba(120,230,255,.10)';
  // 1) 折射：把身后的背景放大、上下翻一点画进圆里
  x.save(); x.beginPath(); x.arc(cx,cy,r,0,7); x.clip();
  const sw=r*2/mag;
  x.drawImage(bg,(cx-sw/2)*2,(cy-sw/2)*2,sw*2,sw*2,cx-r,cy-r,r*2,r*2);
  x.fillStyle=tint; x.fillRect(cx-r,cy-r,2*r,2*r);
  // 2) 菲涅尔：边缘亮
  x.fillStyle=rg(cx,cy,r*.55,cx,cy,r,[[0,'rgba(255,255,255,0)'],[.75,'rgba(220,250,255,.18)'],[1,'rgba(255,255,255,.75)']]);
  x.fillRect(cx-r,cy-r,2*r,2*r);
  // 3) 底部的焦散月牙
  x.fillStyle=rg(cx+r*.15,cy+r*.95,0,cx+r*.15,cy+r*.95,r*.75,[[0,'rgba(210,255,255,.85)'],[.5,'rgba(160,240,255,.25)'],[1,'rgba(160,240,255,0)']]);
  x.fillRect(cx-r,cy-r,2*r,2*r);
  x.restore();
  // 4) 硬边高光（上部的“窗”）
  x.save(); x.beginPath(); x.ellipse(cx-r*.06,cy-r*.52,r*.62,r*.34,-.08,0,7);
  x.fillStyle=lg(0,cy-r*.86,0,cy-r*.2,[[0,'rgba(255,255,255,.95)'],[1,'rgba(255,255,255,.05)']]); x.fill(); x.restore();
  // 5) 小亮点
  x.fillStyle='rgba(255,255,255,.95)'; x.beginPath(); x.ellipse(cx+r*.58,cy-r*.42,r*.06,r*.035,-.7,0,7); x.fill();
  // 6) 细边
  x.strokeStyle='rgba(255,255,255,.55)'; x.lineWidth=Math.max(1,r*.012); x.beginPath(); x.arc(cx,cy,r-.5,0,7); x.stroke();
}
// 小泡沿着摆动的路径：y 往上，x = A·sin(ωy)
const path=[]; const HX=640, HY=752, HR=218;
for(let i=0;i<7;i++){const t=i/6; const y=HY+HR+30+t*210, xw=HX+Math.sin(t*6+.5)*(14+30*t); path.push([xw,y,Math.max(6,24*(1-t*.7))]);}
// 摆动路径的虚线（给设计师看的轨迹）
x.save(); x.setLineDash([3,7]); x.strokeStyle='rgba(255,255,255,.55)'; x.lineWidth=1.5; x.beginPath();
for(let i=0;i<=80;i++){const t=i/80, y=HY+HR+30+t*210, xw=HX+Math.sin(t*6+.5)*(14+30*t); i?x.lineTo(xw,y):x.moveTo(xw,y);} x.stroke(); x.restore();
for(const [bx,by,br] of path) bubble(bx,by,br,{mag:1.4});
// 散落的泡
[[1180,900,46],[1300,700,22],[1320,940,30],[1120,990,14],[260,780,38],[180,900,18],[330,960,12],[1500,700,26],[1580,820,12],[880,560,16]].forEach(([a,b,c])=>bubble(a,b,c,{mag:1.35}));

// 发光的球形按钮（Aero 的图标语言）
function orb(cx,cy,r,c1,c2,glyph){
  x.save(); x.shadowColor='rgba(0,40,90,.35)'; x.shadowBlur=30; x.shadowOffsetY=12;
  x.fillStyle=rg(cx,cy+r*.35,0,cx,cy,r,[[0,c1],[1,c2]]); x.beginPath(); x.arc(cx,cy,r,0,7); x.fill(); x.restore();
  x.save(); x.beginPath(); x.arc(cx,cy,r,0,7); x.clip();
  x.fillStyle=rg(cx,cy+r*.9,0,cx,cy+r*.9,r*.9,[[0,'rgba(255,255,255,.55)'],[1,'rgba(255,255,255,0)']]); x.fillRect(cx-r,cy-r,2*r,2*r);
  x.restore();
  x.fillStyle='#fff'; x.font=`${r*.95}px Sel`; x.textAlign='center'; x.textBaseline='middle';
  x.save(); x.shadowColor='rgba(0,0,0,.25)'; x.shadowBlur=6; x.shadowOffsetY=2; x.fillText(glyph,cx,cy+r*.04); x.restore();
  x.beginPath(); x.ellipse(cx,cy-r*.45,r*.72,r*.42,0,0,7); x.fillStyle=lg(0,cy-r*.9,0,cy-r*.05,[[0,'rgba(255,255,255,.95)'],[1,'rgba(255,255,255,.08)']]); x.fill();
}

// 大泡：标题在里面
bubble(HX,HY,HR,{mag:1.22,tint:'rgba(140,235,255,.08)'});
x.save(); x.beginPath(); x.arc(HX,HY,HR,0,7); x.clip();
x.textAlign='center'; x.textBaseline='alphabetic';
x.shadowColor='rgba(0,60,120,.45)'; x.shadowBlur=18; x.shadowOffsetY=4;
x.fillStyle='#fff'; x.font='84px Sel'; x.fillText('Frutiger',HX,HY+4);
x.font='84px SelL'; x.fillText('Aero',HX,HY+86);
x.restore();
// 大泡的水面隆起（快破了）
x.save(); x.globalCompositeOperation='screen';
x.fillStyle=rg(HX,SEA,0,HX,SEA,260,[[0,'rgba(255,255,255,.55)'],[1,'rgba(255,255,255,0)']]); x.beginPath(); x.ellipse(HX,SEA,260,16,0,0,7); x.fill(); x.restore();

// 漂着的图标球：三颗，在水面上下
orb(1240,420,62,'#9BF04D','#1E9A1B','✓');
orb(1440,560,52,'#6FD8FF','#0A62C9','✉');
orb(1620,450,44,'#FFC870','#E8650C','♪');

// ---------- 文字层 ----------
x.textBaseline='alphabetic'; x.textAlign='left';
x.fillStyle='#fff'; x.font='22px GM'; x.globalAlpha=.9;
x.fillText('风格 · FRUTIGER AERO',56,62); x.textAlign='right'; x.fillText('2004 — 2013 — 今天',1864,62);
x.globalAlpha=1; x.fillStyle='rgba(255,255,255,.3)'; x.fillRect(1644,80,220,4); x.fillStyle='#fff'; x.fillRect(1644,80,9,4);
x.textAlign='left';
x.save(); x.shadowColor='rgba(0,50,110,.5)'; x.shadowBlur=14;
x.font='40px NSB'; x.fillStyle='#fff'; x.fillText('水、天空、玻璃，还有光泽',56,150);
x.restore();
// 标注（给设计师）
const tag=(ax,ay,tx,ty,t1,t2)=>{x.save(); x.shadowColor='rgba(0,40,100,.6)'; x.shadowBlur=8;x.strokeStyle='rgba(255,255,255,.8)'; x.lineWidth=1.3; x.beginPath(); x.moveTo(ax,ay); x.lineTo(tx,ty); x.stroke();
  x.fillStyle='#fff'; x.beginPath(); x.arc(ax,ay,3.5,0,7); x.fill();
  x.font='19px NSM'; x.fillText(t1,tx+8,ty-4); x.font='15px GM'; x.globalAlpha=.85; x.fillText(t2,tx+8,ty+18); x.globalAlpha=1; x.restore();};
tag(HX+40,HY-HR*.62,960,600,'高光：属于光，不属于球','fixed · top · hard edge');
tag(HX+HR*.98,HY+40,1000,800,'边缘更亮：菲涅尔','rim α .75 → center 0');
tag(HX+22,HY+HR+62,860,1020,'上浮 + 左右晃','vy −120 px/s · x ± 8 sin(2.2t)');
window.__done=true;
})();
</script></body></html>
