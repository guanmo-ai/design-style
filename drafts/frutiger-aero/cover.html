<script>
// 一串泡泡从水底冲上来：越靠下越小越多，带一点上升拖影（第 0 帧就在动）
let s=11;const r=()=>(s=(s*16807)%2147483647)/2147483647;
const host=document.getElementById('bubbles');
for(let i=0;i<70;i++){
  const big=i<16;
  const R=big? 26+r()*70 : 5+r()*18;
  const x= big? (r()<.5? 140+r()*560 : 1220+r()*560) : 120+r()*1680;
  const y= big? 640+r()*420 - (r()<.3?420:0) : 620+r()*470;
  const d=document.createElement('div');
  d.style.cssText=`position:absolute;left:${x-R}px;top:${y-R}px;width:${2*R}px;height:${2*R}px;border-radius:50%;
   background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.95) 0 ${R*.18}px,rgba(255,255,255,0) ${R*.42}px),
              radial-gradient(circle at 50% 50%,rgba(200,250,255,.04) 62%,rgba(220,252,255,.55) 88%,rgba(255,255,255,.9) 100%);
   box-shadow:0 ${R*.35}px ${R*.5}px -${R*.3}px rgba(255,255,255,.35)`;
  host.appendChild(d);
  if(big){const t=document.createElement('div');
    t.style.cssText=`position:absolute;left:${x-R*.55}px;top:${y+R*.7}px;width:${R*1.1}px;height:${R*2.2}px;border-radius:50%;
     background:linear-gradient(rgba(255,255,255,.28),rgba(255,255,255,0));filter:blur(4px)`;host.appendChild(t);}
}
</script>
