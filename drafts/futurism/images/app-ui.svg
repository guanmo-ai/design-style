<rect width="1080" height="1350" fill="#EDE5D3"/><text x="72.0" y="112.0" font-family="'Space Mono', monospace" font-weight="700" font-size="20" fill="#F2501C" letter-spacing="3" text-anchor="start" >FUTURISM · APP</text><text x="72.0" y="180.0" font-family="'Noto Sans SC', 'PingFang SC', sans-serif" font-weight="900" font-size="54" fill="#16130F" letter-spacing="0" text-anchor="start" >如果未来主义来做 App</text><text x="72.0" y="226.0" font-family="'Noto Sans SC', 'PingFang SC', sans-serif" font-weight="400" font-size="22" fill="#776F62" letter-spacing="0" text-anchor="start" >一个骑行页：速度不用仪表盘，用残影和字宽来“看见”。</text><clipPath id="ph"><rect x="72" y="280" width="468" height="990" rx="60"/></clipPath><g clip-path="url(#ph)"><rect x="72" y="280" width="468" height="990" fill="#16130F"/><path d="M25.3 475.4 L559.7 580.9 L560.3 579.1 L78.7 324.6Z" fill="#1F3FD0" fill-opacity="0.9"/><path d="M62.5 759.1 L560.2 611.0 L559.8 609.0 L41.5 640.9Z" fill="#F2501C" fill-opacity="0.85"/><path d="M62.0 868.3 L560.3 660.9 L559.7 659.1 L42.0 811.7Z" fill="#B9BDC3" fill-opacity="0.35"/><text x="106.0" y="336.0" font-family="'Space Mono', monospace" font-weight="700" font-size="18" fill="#EDE5D3" letter-spacing="0" text-anchor="start" >07:42</text><text x="106.0" y="400.0" font-family="'Noto Sans SC', 'PingFang SC', sans-serif" font-weight="700" font-size="18" fill="#B9BDC3" letter-spacing="2" text-anchor="start" >RIDE · 第 12 公里</text><text x="240.1" y="640.0" font-family="'Archivo', 'Noto Sans SC', sans-serif" font-weight="900" font-size="210" fill="#F2501C" letter-spacing="-6" text-anchor="end" style="font-variation-settings:'wdth' 70" opacity="0.047">48</text><text x="258.1" y="640.0" font-family="'Archivo', 'Noto Sans SC', sans-serif" font-weight="900" font-size="210" fill="#F2501C" letter-spacing="-6" text-anchor="end" style="font-variation-settings:'wdth' 78" opacity="0.078">48</text><text x="282.4" y="640.0" font-family="'Archivo', 'Noto Sans SC', sans-serif" font-weight="900" font-size="210" fill="#F2501C" letter-spacing="-6" text-anchor="end" style="font-variation-settings:'wdth' 86" opacity="0.130">48</text><text x="315.2" y="640.0" font-family="'Archivo', 'Noto Sans SC', sans-serif" font-weight="900" font-size="210" fill="#F2501C" letter-spacing="-6" text-anchor="end" style="font-variation-settings:'wdth' 94" opacity="0.216">48</text><text x="359.5" y="640.0" font-family="'Archivo', 'Noto Sans SC', sans-serif" font-weight="900" font-size="210" fill="#F2501C" letter-spacing="-6" text-anchor="end" style="font-variation-settings:'wdth' 102" opacity="0.360">48</text><text x="419.3" y="640.0" font-family="'Archivo', 'Noto Sans SC', sans-serif" font-weight="900" font-size="210" fill="#F2501C" letter-spacing="-6" text-anchor="end" style="font-variation-settings:'wdth' 110" opacity="0.600">48</text><text x="500.0" y="640.0" font-family="'Archivo', 'Noto Sans SC', sans-serif" font-weight="900" font-size="210" fill="#EDE5D3" letter-spacing="-6" text-anchor="end" style="font-variation-settings:'wdth' 118" opacity="1.000">48</text><text x="500.0" y="684.0" font-family="'Space Mono', monospace" font-weight="700" font-size="22" fill="#EDE5D3" letter-spacing="1" text-anchor="end" >KM/H · wdth 118</text><path d="M112 920 C212 800 292 1000 402 880 S492 800 502 780" fill="none" stroke="#B9BDC3" stroke-width="6" stroke-linecap="round" stroke-opacity="0.5"/><circle cx="388.1" cy="837.0" r="14" fill="#F2501C" fill-opacity="0.078"/><circle cx="400.7" cy="830.7" r="14" fill="#F2501C" fill-opacity="0.130"/><circle cx="417.0" cy="822.5" r="14" fill="#F2501C" fill-opacity="0.216"/><circle cx="438.3" cy="811.8" r="14" fill="#F2501C" fill-opacity="0.360"/><circle cx="466.0" cy="798.0" r="14" fill="#F2501C" fill-opacity="0.600"/><circle cx="502.0" cy="780.0" r="14" fill="#EDE5D3" fill-opacity="1.000"/><text x="106.0" y="1070.0" font-family="'Noto Sans SC', 'PingFang SC', sans-serif" font-weight="700" font-size="16" fill="#B9BDC3" letter-spacing="0" text-anchor="start" >平均</text><text x="106.0" y="1126.0" font-family="'Archivo', 'Noto Sans SC', sans-serif" font-weight="900" font-size="48" fill="#EDE5D3" letter-spacing="-1" text-anchor="start" style="font-variation-settings:'wdth' 90" >31.6</text><text x="252.0" y="1070.0" font-family="'Noto Sans SC', 'PingFang SC', sans-serif" font-weight="700" font-size="16" fill="#B9BDC3" letter-spacing="0" text-anchor="start" >爬升</text><text x="252.0" y="1126.0" font-family="'Archivo', 'Noto Sans SC', sans-serif" font-weight="900" font-size="48" fill="#EDE5D3" letter-spacing="-1" text-anchor="start" style="font-variation-settings:'wdth' 75" >412</text><text x="398.0" y="1070.0" font-family="'Noto Sans SC', 'PingFang SC', sans-serif" font-weight="700" font-size="16" fill="#B9BDC3" letter-spacing="0" text-anchor="start" >心率</text><text x="398.0" y="1126.0" font-family="'Archivo', 'Noto Sans SC', sans-serif" font-weight="900" font-size="48" fill="#EDE5D3" letter-spacing="-1" text-anchor="start" style="font-variation-settings:'wdth' 105" >152</text><rect x="66.1" y="1160" width="400" height="72" rx="36" fill="#F2501C" fill-opacity="0.216"/><rect x="76.1" y="1160" width="400" height="72" rx="36" fill="#F2501C" fill-opacity="0.360"/><rect x="89.1" y="1160" width="400" height="72" rx="36" fill="#F2501C" fill-opacity="0.600"/><rect x="106.0" y="1160" width="400" height="72" rx="36" fill="#F2501C" fill-opacity="1.000"/><text x="306.0" y="1207.0" font-family="'Noto Sans SC', 'PingFang SC', sans-serif" font-weight="900" font-size="26" fill="#16130F" letter-spacing="2" text-anchor="middle" >冲刺 SPRINT</text></g><rect x="72" y="280" width="468" height="990" rx="60" fill="none" stroke="#16130F" stroke-width="10"/><line x1="516" y1="580" x2="610" y2="580" stroke="#16130F" stroke-width="1.6"/><circle cx="516" cy="580" r="6" fill="#F2501C"/><circle cx="630" cy="580" r="18" fill="#16130F"/><text x="630.0" y="586.0" font-family="'Space Mono', monospace" font-weight="700" font-size="17" fill="#EDE5D3" letter-spacing="0" text-anchor="middle" >1</text><text x="664.0" y="588.0" font-family="'Noto Sans SC', 'PingFang SC', sans-serif" font-weight="900" font-size="22" fill="#16130F" letter-spacing="0" text-anchor="start" >速度 = 残影数</text><text x="664.0" y="618.0" font-family="'Noto Sans SC', 'PingFang SC', sans-serif" font-weight="400" font-size="17" fill="#776F62" letter-spacing="0" text-anchor="start" >48 km/h 拖 6 层；停下时一层都不剩。</text><text x="664.0" y="644.0" font-family="'Noto Sans SC', 'PingFang SC', sans-serif" font-weight="400" font-size="17" fill="#776F62" letter-spacing="0" text-anchor="start" >间距按真实加速度算。</text><line x1="516" y1="684" x2="610" y2="684" stroke="#16130F" stroke-width="1.6"/><circle cx="516" cy="684" r="6" fill="#F2501C"/><circle cx="630" cy="684" r="18" fill="#16130F"/><text x="630.0" y="690.0" font-family="'Space Mono', monospace" font-weight="700" font-size="17" fill="#EDE5D3" letter-spacing="0" text-anchor="middle" >2</text><text x="664.0" y="692.0" font-family="'Noto Sans SC', 'PingFang SC', sans-serif" font-weight="900" font-size="22" fill="#16130F" letter-spacing="0" text-anchor="start" >字宽跟着速度走</text><text x="664.0" y="722.0" font-family="'Noto Sans SC', 'PingFang SC', sans-serif" font-weight="400" font-size="17" fill="#776F62" letter-spacing="0" text-anchor="start" >数字的 wdth 从 62 拉到 118，</text><text x="664.0" y="748.0" font-family="'Noto Sans SC', 'PingFang SC', sans-serif" font-weight="400" font-size="17" fill="#776F62" letter-spacing="0" text-anchor="start" >字重不变，加速是“变宽”。</text><line x1="516" y1="800" x2="610" y2="800" stroke="#16130F" stroke-width="1.6"/><circle cx="516" cy="800" r="6" fill="#F2501C"/><circle cx="630" cy="800" r="18" fill="#16130F"/><text x="630.0" y="806.0" font-family="'Space Mono', monospace" font-weight="700" font-size="17" fill="#EDE5D3" letter-spacing="0" text-anchor="middle" >3</text><text x="664.0" y="808.0" font-family="'Noto Sans SC', 'PingFang SC', sans-serif" font-weight="900" font-size="22" fill="#16130F" letter-spacing="0" text-anchor="start" >轨迹上只有“现在”在动</text><text x="664.0" y="838.0" font-family="'Noto Sans SC', 'PingFang SC', sans-serif" font-weight="400" font-size="17" fill="#776F62" letter-spacing="0" text-anchor="start" >路线是静的、不拖影；</text><text x="664.0" y="864.0" font-family="'Noto Sans SC', 'PingFang SC', sans-serif" font-weight="400" font-size="17" fill="#776F62" letter-spacing="0" text-anchor="start" >当前位置拖 5 层。</text><line x1="516" y1="1196" x2="610" y2="1196" stroke="#16130F" stroke-width="1.6"/><circle cx="516" cy="1196" r="6" fill="#F2501C"/><circle cx="630" cy="1196" r="18" fill="#16130F"/><text x="630.0" y="1202.0" font-family="'Space Mono', monospace" font-weight="700" font-size="17" fill="#EDE5D3" letter-spacing="0" text-anchor="middle" >4</text><text x="664.0" y="1204.0" font-family="'Noto Sans SC', 'PingFang SC', sans-serif" font-weight="900" font-size="22" fill="#16130F" letter-spacing="0" text-anchor="start" >按下 = 往前冲一下</text><text x="664.0" y="1234.0" font-family="'Noto Sans SC', 'PingFang SC', sans-serif" font-weight="400" font-size="17" fill="#776F62" letter-spacing="0" text-anchor="start" >120ms 内留下 3 层残影，</text><text x="664.0" y="1260.0" font-family="'Noto Sans SC', 'PingFang SC', sans-serif" font-weight="400" font-size="17" fill="#776F62" letter-spacing="0" text-anchor="start" >比缩放更像“出发”。</text><text x="612.0" y="912.0" font-family="'Space Mono', monospace" font-weight="700" font-size="16" fill="#F2501C" letter-spacing="3" text-anchor="start" >TOKENS</text><text x="612.0" y="942.0" font-family="'Space Mono', monospace" font-weight="400" font-size="15" fill="#16130F" letter-spacing="0" text-anchor="start" >--echo-count: 0 – 8</text><text x="612.0" y="966.0" font-family="'Space Mono', monospace" font-weight="400" font-size="15" fill="#16130F" letter-spacing="0" text-anchor="start" >--echo-alpha: 0.6^k</text><text x="612.0" y="990.0" font-family="'Space Mono', monospace" font-weight="400" font-size="15" fill="#16130F" letter-spacing="0" text-anchor="start" >--echo-gap: speed × 1/60s</text><text x="612.0" y="1014.0" font-family="'Space Mono', monospace" font-weight="400" font-size="15" fill="#16130F" letter-spacing="0" text-anchor="start" >--wdth: 62 → 125</text><text x="612.0" y="1038.0" font-family="'Space Mono', monospace" font-weight="400" font-size="15" fill="#16130F" letter-spacing="0" text-anchor="start" >@media (prefers-reduced-motion) → 1 层</text><text x="72.0" y="1310.0" font-family="'Space Mono', monospace" font-weight="400" font-size="15" fill="#776F62" letter-spacing="0" text-anchor="start" >Design Style 风格 014 · @guanmo_ai</text>
</svg>
