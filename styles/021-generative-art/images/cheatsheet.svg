<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350"><title>生成艺术 · cheatsheet</title><defs></defs><rect x="0" y="0" width="1080" height="1350" rx="0" fill="#F3EEE2"/><text x="64" y="68" font-family="JetBrains Mono" font-size="17" font-weight="700" fill="#E8392B" text-anchor="start">DESIGN STYLE / 021 / 02 / RULES</text><text x="1016" y="62" font-family="Noto Sans SC" font-size="25" font-weight="900" fill="#161616" text-anchor="end">观默</text><text x="1016" y="90" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#625E54" text-anchor="end">@guanmo_ai</text><text x="64" y="191" font-family="Noto Sans SC" font-size="74" font-weight="900" fill="#161616" text-anchor="start">五条规则</text><text x="66" y="242" font-family="Noto Sans SC" font-size="24" font-weight="500" fill="#625E54" text-anchor="start">每条规则，都能在画面里看见。</text><rect x="64" y="290" width="952" height="164" rx="16" fill="#FFF9EF" stroke="#CFC7B7" stroke-width="2"/><text x="92" y="352" font-family="JetBrains Mono" font-size="44" font-weight="700" fill="#E8392B" text-anchor="start">01</text><text x="212" y="338" font-family="Noto Sans SC" font-size="28" font-weight="900" fill="#161616" text-anchor="start">换种子，换一张画</text><text x="212" y="378" font-family="Noto Sans SC" font-size="21" font-weight="500" fill="#625E54" text-anchor="start">规则不变，只换随机数起点。</text><text x="212" y="420" font-family="JetBrains Mono" font-size="18" font-weight="700" fill="#2346E0" text-anchor="start">seed = 0x2A7F</text><rect x="64" y="474" width="952" height="164" rx="16" fill="#FFF9EF" stroke="#CFC7B7" stroke-width="2"/><text x="92" y="536" font-family="JetBrains Mono" font-size="44" font-weight="700" fill="#E8392B" text-anchor="start">02</text><text x="212" y="522" font-family="Noto Sans SC" font-size="28" font-weight="900" fill="#161616" text-anchor="start">同种子，可复现</text><text x="212" y="562" font-family="Noto Sans SC" font-size="21" font-weight="500" fill="#625E54" text-anchor="start">保留种子、参数和生成器版本。</text><text x="212" y="604" font-family="JetBrains Mono" font-size="18" font-weight="700" fill="#2346E0" text-anchor="start">random(seed)</text><rect x="64" y="658" width="952" height="164" rx="16" fill="#FFF9EF" stroke="#CFC7B7" stroke-width="2"/><text x="92" y="720" font-family="JetBrains Mono" font-size="44" font-weight="700" fill="#E8392B" text-anchor="start">03</text><text x="212" y="706" font-family="Noto Sans SC" font-size="28" font-weight="900" fill="#161616" text-anchor="start">加权色板</text><text x="212" y="746" font-family="Noto Sans SC" font-size="21" font-weight="500" fill="#625E54" text-anchor="start">比例决定气质，别平均分色。</text><text x="212" y="788" font-family="JetBrains Mono" font-size="18" font-weight="700" fill="#2346E0" text-anchor="start">pick(palette, weights)</text><rect x="64" y="842" width="952" height="164" rx="16" fill="#FFF9EF" stroke="#CFC7B7" stroke-width="2"/><text x="92" y="904" font-family="JetBrains Mono" font-size="44" font-weight="700" fill="#E8392B" text-anchor="start">04</text><text x="212" y="890" font-family="Noto Sans SC" font-size="28" font-weight="900" fill="#161616" text-anchor="start">留间距，才透气</text><text x="212" y="930" font-family="Noto Sans SC" font-size="21" font-weight="500" fill="#625E54" text-anchor="start">有占用网格，才知道哪里该停。</text><text x="212" y="972" font-family="JetBrains Mono" font-size="18" font-weight="700" fill="#2346E0" text-anchor="start">step = 4px; gap = 5px</text><rect x="64" y="1026" width="952" height="164" rx="16" fill="#FFF9EF" stroke="#CFC7B7" stroke-width="2"/><text x="92" y="1088" font-family="JetBrains Mono" font-size="44" font-weight="700" fill="#E8392B" text-anchor="start">05</text><text x="212" y="1074" font-family="Noto Sans SC" font-size="28" font-weight="900" fill="#161616" text-anchor="start">大的先放，小的填缝</text><text x="212" y="1114" font-family="Noto Sans SC" font-size="21" font-weight="500" fill="#625E54" text-anchor="start">少量大形定结构，小形补节奏。</text><text x="212" y="1156" font-family="JetBrains Mono" font-size="18" font-weight="700" fill="#2346E0" text-anchor="start">large -&gt; medium -&gt; small</text><path d="M64 1255L1016 1255" fill="none" stroke="#CFC7B7" stroke-width="2"/><text x="64" y="1298" font-family="JetBrains Mono" font-size="17" font-weight="700" fill="#E8392B" text-anchor="start">GENERATIVE ART</text><text x="1016" y="1298" font-family="Noto Sans SC" font-size="19" font-weight="500" fill="#625E54" text-anchor="end">从一个点长出来。</text></svg>