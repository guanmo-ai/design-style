  <rect width="1080" height="1350" fill="#F6EEDD"/>
<text x="64" y="120" font-family="'Noto Sans SC'" font-weight="900" font-size="64" fill="#3B3552" text-anchor="start" letter-spacing="0">低多边形 · 速查</text>
<text x="66" y="166" font-family="'Noto Sans SC'" font-weight="700" font-size="20" fill="#8A7FA0" text-anchor="start" letter-spacing="4">LOW POLY CHEAT SHEET · 019</text>
<polygon points="92,206 120,256 64,256" fill="#EE6B57"/>
<text x="92" y="248" font-family="'Noto Sans SC'" font-weight="900" font-size="20" fill="#3B3552" text-anchor="middle" letter-spacing="0">1</text>
<text x="138" y="242" font-family="'Noto Sans SC'" font-weight="900" font-size="32" fill="#3B3552" text-anchor="start" letter-spacing="0">一个面，一个颜色</text>
<text x="138" y="276" font-family="'Noto Sans SC'" font-weight="700" font-size="19" fill="#8A7FA0" text-anchor="start" letter-spacing="0">不画渐变：每个三角面只有一种颜色</text>
<polygon points="92,298 120,348 64,348" fill="#F4C54F"/>
<text x="92" y="340" font-family="'Noto Sans SC'" font-weight="900" font-size="20" fill="#3B3552" text-anchor="middle" letter-spacing="0">2</text>
<text x="138" y="334" font-family="'Noto Sans SC'" font-weight="900" font-size="32" fill="#3B3552" text-anchor="start" letter-spacing="0">光一转，面就翻</text>
<text x="138" y="368" font-family="'Noto Sans SC'" font-weight="700" font-size="19" fill="#8A7FA0" text-anchor="start" letter-spacing="0">明暗按面算，光一动，整片面跟着跳</text>
<polygon points="92,390 120,440 64,440" fill="#8CC8EE"/>
<text x="92" y="432" font-family="'Noto Sans SC'" font-weight="900" font-size="20" fill="#3B3552" text-anchor="middle" letter-spacing="0">3</text>
<text x="138" y="426" font-family="'Noto Sans SC'" font-weight="900" font-size="32" fill="#3B3552" text-anchor="start" letter-spacing="0">面越少，越有性格</text>
<text x="138" y="460" font-family="'Noto Sans SC'" font-weight="700" font-size="19" fill="#8A7FA0" text-anchor="start" letter-spacing="0">1280 → 320 → 80：少到刚好认得出</text>
<polygon points="92,482 120,532 64,532" fill="#4DAF72"/>
<text x="92" y="524" font-family="'Noto Sans SC'" font-weight="900" font-size="20" fill="#3B3552" text-anchor="middle" letter-spacing="0">4</text>
<text x="138" y="518" font-family="'Noto Sans SC'" font-weight="900" font-size="32" fill="#3B3552" text-anchor="start" letter-spacing="0">一张卡，一座山</text>
<text x="138" y="552" font-family="'Noto Sans SC'" font-weight="700" font-size="19" fill="#8A7FA0" text-anchor="start" letter-spacing="0">图标、插画、空状态都能用</text>
<polygon points="92,574 120,624 64,624" fill="#C9A6EC"/>
<text x="92" y="616" font-family="'Noto Sans SC'" font-weight="900" font-size="20" fill="#3B3552" text-anchor="middle" letter-spacing="0">5</text>
<text x="138" y="610" font-family="'Noto Sans SC'" font-weight="900" font-size="32" fill="#3B3552" text-anchor="start" letter-spacing="0">三档明暗就够了</text>
<text x="138" y="644" font-family="'Noto Sans SC'" font-weight="700" font-size="19" fill="#8A7FA0" text-anchor="start" letter-spacing="0">亮、中、暗三档，阴影混一点暖紫</text>
<text x="64" y="712" font-family="'Noto Sans SC'" font-weight="900" font-size="28" fill="#3B3552" text-anchor="start" letter-spacing="0">面数 · 1280 → 320 → 80</text>
