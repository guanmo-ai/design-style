<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#7A5C86" flood-opacity=".28"/></filter>
  </defs>
  <rect width="1080" height="1350" fill="#F6EEDD"/>
<text x="64" y="120" font-family="'Noto Sans SC'" font-weight="900" font-size="50" fill="#3B3552" text-anchor="start" letter-spacing="0">四步：从一张纸到低多边形</text>
<text x="66" y="166" font-family="'Noto Sans SC'" font-weight="700" font-size="20" fill="#8A7FA0" text-anchor="start" letter-spacing="4">FOUR STEPS · 019 LOW POLY</text>
<clipPath id="c-paper-64-220"><rect x="64" y="220" width="468" height="420" rx="30"/></clipPath><rect x="64" y="220" width="468" height="420" rx="30" fill="#FBF4E6" filter="url(#sh)"/><image href="frames/paper.jpg" x="64" y="220" width="468" height="420" preserveAspectRatio="xMidYMid slice" clip-path="url(#c-paper-64-220)"/>
<circle cx="104" cy="260" r="24" fill="#3B3552"/>
<text x="104" y="269" font-family="'Noto Sans SC'" font-weight="900" font-size="24" fill="#FFFDF7" text-anchor="middle" letter-spacing="0">1</text>
<text x="68" y="690" font-family="'Noto Sans SC'" font-weight="900" font-size="32" fill="#3B3552" text-anchor="start" letter-spacing="0">一张纸</text>
<text x="68" y="726" font-family="'Noto Sans SC'" font-weight="700" font-size="19" fill="#8A7FA0" text-anchor="start" letter-spacing="0">地形先是平的纸，三角面一片片翻起来</text>
<clipPath id="c-color-548-220"><rect x="548" y="220" width="468" height="420" rx="30"/></clipPath><rect x="548" y="220" width="468" height="420" rx="30" fill="#FBF4E6" filter="url(#sh)"/><image href="frames/color.jpg" x="548" y="220" width="468" height="420" preserveAspectRatio="xMidYMid slice" clip-path="url(#c-color-548-220)"/>
<circle cx="588" cy="260" r="24" fill="#3B3552"/>
<text x="588" y="269" font-family="'Noto Sans SC'" font-weight="900" font-size="24" fill="#FFFDF7" text-anchor="middle" letter-spacing="0">2</text>
<text x="552" y="690" font-family="'Noto Sans SC'" font-weight="900" font-size="32" fill="#3B3552" text-anchor="start" letter-spacing="0">一个面，一个颜色</text>
<text x="552" y="726" font-family="'Noto Sans SC'" font-weight="700" font-size="19" fill="#8A7FA0" text-anchor="start" letter-spacing="0">翻过来就是颜色：每个面只有一种</text>
<clipPath id="c-light-64-780"><rect x="64" y="780" width="468" height="420" rx="30"/></clipPath><rect x="64" y="780" width="468" height="420" rx="30" fill="#FBF4E6" filter="url(#sh)"/><image href="frames/light.jpg" x="64" y="780" width="468" height="420" preserveAspectRatio="xMidYMid slice" clip-path="url(#c-light-64-780)"/>
<circle cx="104" cy="820" r="24" fill="#3B3552"/>
<text x="104" y="829" font-family="'Noto Sans SC'" font-weight="900" font-size="24" fill="#FFFDF7" text-anchor="middle" letter-spacing="0">3</text>
<text x="68" y="1250" font-family="'Noto Sans SC'" font-weight="900" font-size="32" fill="#3B3552" text-anchor="start" letter-spacing="0">三档明暗</text>
<text x="68" y="1286" font-family="'Noto Sans SC'" font-weight="700" font-size="19" fill="#8A7FA0" text-anchor="start" letter-spacing="0">光一转，面就在亮、中、暗之间跳</text>
<clipPath id="c-night-548-780"><rect x="548" y="780" width="468" height="420" rx="30"/></clipPath><rect x="548" y="780" width="468" height="420" rx="30" fill="#FBF4E6" filter="url(#sh)"/><image href="frames/night.jpg" x="548" y="780" width="468" height="420" preserveAspectRatio="xMidYMid slice" clip-path="url(#c-night-548-780)"/>
<circle cx="588" cy="820" r="24" fill="#3B3552"/>
<text x="588" y="829" font-family="'Noto Sans SC'" font-weight="900" font-size="24" fill="#FFFDF7" text-anchor="middle" letter-spacing="0">4</text>
<text x="552" y="1250" font-family="'Noto Sans SC'" font-weight="900" font-size="32" fill="#3B3552" text-anchor="start" letter-spacing="0">入夜混暖紫</text>
<text x="552" y="1286" font-family="'Noto Sans SC'" font-weight="700" font-size="19" fill="#8A7FA0" text-anchor="start" letter-spacing="0">三档一起压暗，阴影往暖紫里混</text>
