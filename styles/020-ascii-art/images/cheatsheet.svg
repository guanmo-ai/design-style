<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350"><title>字符画 · cheatsheet</title><defs></defs><rect x="0" y="0" width="1080" height="1350" rx="0" fill="#06060A"/><text x="64" y="68" font-family="JetBrains Mono" font-size="17" font-weight="700" fill="#FF8A3D" text-anchor="start">DESIGN STYLE / 020 / 02 / RULES</text><text x="1016" y="62" font-family="Noto Sans SC" font-size="25" font-weight="900" fill="#FFF6DA" text-anchor="end">观默</text><text x="1016" y="90" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#ACADD0" text-anchor="end">@guanmo_ai</text><text x="64" y="191" font-family="Noto Sans SC" font-size="74" font-weight="900" fill="#FFF6DA" text-anchor="start">五条规则</text><text x="66" y="242" font-family="Noto Sans SC" font-size="24" font-weight="500" fill="#ACADD0" text-anchor="start">每条规则，都能在画面里看见。</text><rect x="64" y="290" width="952" height="164" rx="16" fill="#12121F" stroke="#35354D" stroke-width="2"/><text x="92" y="352" font-family="JetBrains Mono" font-size="44" font-weight="700" fill="#FF8A3D" text-anchor="start">01</text><text x="212" y="338" font-family="Noto Sans SC" font-size="28" font-weight="900" fill="#FFF6DA" text-anchor="start">越亮，字越满</text><text x="212" y="378" font-family="Noto Sans SC" font-size="21" font-weight="500" fill="#ACADD0" text-anchor="start">先算亮度，再选择字符。</text><text x="212" y="420" font-family="JetBrains Mono" font-size="18" font-weight="700" fill="#7CC6F2" text-anchor="start">ch = ramp[floor(L * 11)]</text><rect x="64" y="474" width="952" height="164" rx="16" fill="#12121F" stroke="#35354D" stroke-width="2"/><text x="92" y="536" font-family="JetBrains Mono" font-size="44" font-weight="700" fill="#FF8A3D" text-anchor="start">02</text><text x="212" y="522" font-family="Noto Sans SC" font-size="28" font-weight="900" fill="#FFF6DA" text-anchor="start">固定等宽字格</text><text x="212" y="562" font-family="Noto Sans SC" font-size="21" font-weight="500" fill="#ACADD0" text-anchor="start">字格位置不动，形状才不乱。</text><text x="212" y="604" font-family="JetBrains Mono" font-size="18" font-weight="700" fill="#7CC6F2" text-anchor="start">cell = 0.6em * 1em</text><rect x="64" y="658" width="952" height="164" rx="16" fill="#12121F" stroke="#35354D" stroke-width="2"/><text x="92" y="720" font-family="JetBrains Mono" font-size="44" font-weight="700" fill="#FF8A3D" text-anchor="start">03</text><text x="212" y="706" font-family="Noto Sans SC" font-size="28" font-weight="900" fill="#FFF6DA" text-anchor="start">颜色跟着光走</text><text x="212" y="746" font-family="Noto Sans SC" font-size="21" font-weight="500" fill="#ACADD0" text-anchor="start">用同一份亮度选择颜色。</text><text x="212" y="788" font-family="JetBrains Mono" font-size="18" font-weight="700" fill="#7CC6F2" text-anchor="start">color = palette[L]</text><rect x="64" y="842" width="952" height="164" rx="16" fill="#12121F" stroke="#35354D" stroke-width="2"/><text x="92" y="904" font-family="JetBrains Mono" font-size="44" font-weight="700" fill="#FF8A3D" text-anchor="start">04</text><text x="212" y="890" font-family="Noto Sans SC" font-size="28" font-weight="900" fill="#FFF6DA" text-anchor="start">位置不动，只换字</text><text x="212" y="930" font-family="Noto Sans SC" font-size="21" font-weight="500" fill="#ACADD0" text-anchor="start">加载、呼吸、转圈都能复用。</text><text x="212" y="972" font-family="JetBrains Mono" font-size="18" font-weight="700" fill="#7CC6F2" text-anchor="start">glyph = sample(x, y, t)</text><rect x="64" y="1026" width="952" height="164" rx="16" fill="#12121F" stroke="#35354D" stroke-width="2"/><text x="92" y="1088" font-family="JetBrains Mono" font-size="44" font-weight="700" fill="#FF8A3D" text-anchor="start">05</text><text x="212" y="1074" font-family="Noto Sans SC" font-size="28" font-weight="900" fill="#FFF6DA" text-anchor="start">先乱码，再落定</text><text x="212" y="1114" font-family="Noto Sans SC" font-size="21" font-weight="500" fill="#ACADD0" text-anchor="start">逐字锁定；完成后显示原文。</text><text x="212" y="1156" font-family="JetBrains Mono" font-size="18" font-weight="700" fill="#7CC6F2" text-anchor="start">noise -&gt; resolve -&gt; hold</text><path d="M64 1255L1016 1255" fill="none" stroke="#35354D" stroke-width="2"/><text x="64" y="1298" font-family="JetBrains Mono" font-size="17" font-weight="700" fill="#FF8A3D" text-anchor="start">ASCII ART</text><text x="1016" y="1298" font-family="Noto Sans SC" font-size="19" font-weight="500" fill="#ACADD0" text-anchor="end">先乱码，再落定。</text></svg>