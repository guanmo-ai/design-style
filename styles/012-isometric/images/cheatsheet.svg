t" >先定 30°/30°（或选定的一对轴），再画任何体积。</text><rect x="90" y="662" width="10" height="10" fill="#1FAE9B" transform="rotate(45 95 667)"/><text x="120.0" y="682.0" font-family="'Geist Mono', 'Inter', ui-monospace, monospace" font-weight="500" font-size="16" fill="#1FAE9B" letter-spacing="0.14em" text-anchor="start" >02</text><text x="200.0" y="682.0" font-family="'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="900" font-size="26" fill="#1B2430" letter-spacing="0.04em" text-anchor="start" >等比例</text><text x="200.0" y="718.0" font-family="'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="500" font-size="16" fill="#6B7380" letter-spacing="0.02em" text-anchor="start" >三轴同一单位。不要偷偷拉长某一边来“更 3D”。</text><rect x="90" y="792" width="10" height="10" fill="#3D5C9E" transform="rotate(45 95 797)"/><text x="120.0" y="812.0" font-family="'Geist Mono', 'Inter', ui-monospace, monospace" font-weight="500" font-size="16" fill="#3D5C9E" letter-spacing="0.14em" text-anchor="start" >03</text><text x="200.0" y="812.0" font-family="'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="900" font-size="26" fill="#1B2430" letter-spacing="0.04em" text-anchor="start" >无透视</text><text x="200.0" y="848.0" font-family="'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="500" font-size="16" fill="#6B7380" letter-spacing="0.02em" text-anchor="start" >平行线保持平行。远处的面和近处一样大。</text><rect x="90" y="922" width="10" height="10" fill="#E0B15A" transform="rotate(45 95 927)"/><text x="120.0" y="942.0" font-family="'Geist Mono', 'Inter', ui-monospace, monospace" font-weight="500" font-size="16" fill="#E0B15A" letter-spacing="0.14em" text-anchor="start" >04</text><text x="200.0" y="942.0" font-family="'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="900" font-size="26" fill="#1B2430" letter-spacing="0.04em" text-anchor="start" >三面三值</text><text x="200.0" y="978.0" font-family="'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="500" font-size="16" fill="#6B7380" letter-spacing="0.02em" text-anchor="start" >顶亮、一侧中、一侧暗。光从固定方向来。</text><rect x="90" y="1052" width="10" height="10" fill="#5C6B7A" transform="rotate(45 95 1057)"/><text x="120.0" y="1072.0" font-family="'Geist Mono', 'Inter', ui-monospace, monospace" font-weight="500" font-size="16" fill="#5C6B7A" letter-spacing="0.14em" text-anchor="start" >05</text><text x="200.0" y="1072.0" font-family="'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="900" font-size="26" fill="#1B2430" letter-spacing="0.04em" text-anchor="start" >叠压做深度</text><text x="200.0" y="1108.0" font-family="'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="500" font-size="16" fill="#6B7380" letter-spacing="0.02em" text-anchor="start" >前后靠遮挡和层次，不靠灭点。</text><text x="90.0" y="1288.0" font-family="'Geist Mono', 'Inter', ui-monospace, monospace" font-weight="400" font-size="13" fill="#6B7380" letter-spacing="0.06em" text-anchor="start" >012 · ISOMETRIC  ·  DO：锁轴等比例   DON’T：灭点近大远小</text><g fill="none" stroke="#1B2430" stroke-width="1.2" opacity="0.28" transform="translate(36,36)"><path d="M-10 0H10M0 -10V10"/></g><g fill="none" stroke="#1B2430" stroke-width="1.2" opacity="0.28" transform="translate(1044,36)"><path d="M-10 0H10M0 -10V10"/></g><g fill="none" stroke="#1B2430" stroke-width="1.2" opacity="0.28" transform="translate(36,1314)"><path d="M-10 0H10M0 -10V10"/></g><g fill="none" stroke="#1B2430" stroke-width="1.2" opacity="0.28" transform="translate(1044,1314)"><path d="M-10 0H10M0 -10V10"/></g></svg>
