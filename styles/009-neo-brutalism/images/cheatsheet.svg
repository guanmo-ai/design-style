ace Mono', 'JetBrains Mono', ui-monospace, 'Noto Sans SC', monospace" font-weight="700" font-size="14" fill="#000000" letter-spacing="0" text-anchor="start" >0 · 8 · 999</text><text x="454.0" y="436.0" font-family="'Noto Sans SC', 'PingFang SC', sans-serif" font-weight="400" font-size="13" fill="#000000" letter-spacing="0" text-anchor="start" opacity="0.7">只选一档</text><rect x="634" y="242" width="170" height="210" rx="0" fill="#000000"/><rect x="628" y="236" width="170" height="210" rx="0" fill="#FFFFFF" stroke="#000000" stroke-width="3"/><rect x="646" y="256" width="22" height="56" fill="#FFD23F" stroke="#000000" stroke-width="3"/><rect x="668" y="256" width="22" height="56" fill="#FF8FD6" stroke="#000000" stroke-width="3"/><rect x="690" y="256" width="22" height="56" fill="#B8F15A" stroke="#000000" stroke-width="3"/><rect x="712" y="256" width="22" height="56" fill="#7AA2FF" stroke="#000000" stroke-width="3"/><rect x="734" y="256" width="22" height="56" fill="#FF7A45" stroke="#000000" stroke-width="3"/><path d="M628 336 H798" stroke="#000000" stroke-width="3"/><text x="642.0" y="364.0" font-family="'Space Mono', 'JetBrains Mono', ui-monospace, 'Noto Sans SC', monospace" font-weight="700" font-size="12" fill="#000000" letter-spacing="0.06em" text-anchor="start" >COLOR</text><text x="642.0" y="392.0" font-family="'Noto Sans SC', 'PingFang SC', sans-serif" font-weight="900" font-size="22" fill="#000000" letter-spacing="0" text-anchor="start" >颜色</text><text x="642.0" y="416.0" font-family="'Space Mono', 'JetBrains Mono', ui-monospace, 'Noto Sans SC', monospace" font-weight="700" font-size="14" fill="#000000" letter-spacing="0" text-anchor="start" >5 色 · 高饱和</text><text x="642.0" y="436.0" font-family="'Noto Sans SC', 'PingFang SC', sans-serif" font-weight="400" font-size="13" fill="#000000" letter-spacing="0" text-anchor="start" opacity="0.7">平涂，无渐变</text><rect x="822" y="242" width="170" height="210" rx="0" fill="#000000"/><rect x="816" y="236" width="170" height="210" rx="0" fill="#FFFFFF" stroke="#000000" stroke-width="3"/><text x="836.0" y="308.0" font-family="'Space Grotesk', 'Archivo', 'Noto Sans SC', sans-serif" font-weight="700" font-size="56" fill="#000000" letter-spacing="-0.04em" text-anchor="start" >Aa</text><path d="M816 336 H986" stroke="#000000" stroke-width="3"/><text x="830.0" y="364.0" font-family="'Space Mono', 'JetBrains Mono', ui-monospace, 'Noto Sans SC', monospace" font-weight="700" font-size="12" fill="#000000" letter-spacing="0.06em" text-anchor="start" >TYPE</text><text x="830.0" y="392.0" font-family="'Noto Sans SC', 'PingFang SC', sans-serif" font-weight="900" font-size="22" fill="#000000" letter-spacing="0" text-anchor="start" >字</text><text x="830.0" y="416.0" font-family="'Space Mono', 'JetBrains Mono', ui-monospace, 'Noto Sans SC', monospace" font-weight="700" font-size="14" fill="#000000" letter-spacing="0" text-anchor="start" >Grotesk 700</text><text x="830.0" y="436.0" font-family="'Noto Sans SC', 'PingFang SC', sans-serif" font-weight="400" font-size="13" fill="#000000" letter-spacing="0" text-anchor="start" opacity="0.7">大、粗、紧</text><rect x="64" y="482" width="26" height="26" fill="#FFD23F" stroke="#000000" stroke-width="3"/><text x="100.0" y="501.0" font-family="'Space Mono', 'JetBrains Mono', ui-monospace, 'Noto Sans SC', monospace" font-weight="700" font-size="14" fill="#000000" letter-spacing="0" text-anchor="start" >#FFD23F</text><rect x="222" y="482" width="26" height="26" fill="#FF8FD6" stroke="#000000" stroke-width="3"/><text x="258.0" y="501.0" font-family="'Space Mono', 'JetBrains Mono', ui-monospace, 'Noto Sans SC', monospace" font-weight="700" font-size="14" fill="#000000" letter-spacing="0" text-anchor="start" >#FF8FD6</text><rect x="380" y="482" width="26" height="26" fill="#B8F15A" stroke="#000000" stroke-width="3"/><text x="416.0" y="501.0" font-family="'Space Mono', 'JetBrains Mono', ui-monospace, 'Noto Sans SC', monospace" font-weight="700" font-size="14" fill="#000000" letter-spacing="0" text-anchor="start" >#B8F15A</text><rect x="538" y="482" width="26" height="26" fill="#7AA2FF" stroke="#000000" stroke-width="3"/><text x="574.0" y="501.0" font-family="'Space Mono', 'JetBrains Mono', ui-monospace, 'Noto Sans SC', monospace" font-weight="700" font-size="14" fill="#000000" letter-spacing="0" text-anchor="start" >#7AA2FF</text><rect x="696" y="482" width="26" height="26" fill="#FF7A45" stroke="#000000" stroke-width="3"/><text x="732.0" y="501.0" font-family="'Space Mono', 'JetBrains Mono', ui-monospace, 'Noto Sans SC', monospace" font-weight="700" font-size="14" fill="#000000" letter-spacing="0" text-anchor="start" >#FF7A45</text><rect x="854" y="482" width="26" height="26" fill="#FFF6E5" stroke="#000000" stroke-width="3"/><text x="890.0" y="501.0" font-family="'Space Mono', 'JetBrains Mono', ui-monospace, 'Noto Sans SC', monospace" font-weight="700" font-size="14" fill="#000000" letter-spacing="0" text-anchor="start" >#FFF6E5</text><text x="64.0" y="566.0" font-family="'Space Mono', 'JetBrains Mono', ui-monospace, 'Noto Sans SC', monospace" font-weight="700" font-size="14" fill="#000000" letter-spacing="0.06em" text-anchor="start" >BUTTON STATES · 按钮三态</text><rect x="64" y="596" width="250" height="72" fill="none" stroke="#000000" stroke-width="1.5" stroke-dasharray="5 5" opacity="0.45"/><rect x="70" y="602" width="250" height="72" rx="0" fill="#000000"/><rect x="64" y="596" width="250" height="72" rx="0" fill="#FFD23F" stroke="#000000" stroke-width="4"/><text x="189.0" y="642.0" font-family="'Noto Sans SC', 'PingFang SC', sans-serif" font-weight="900" font-size="22" fill="#000000" letter-spacing="0" text-anchor="middle" >静止 DEFAULT</text><text x="64.0" y="712.0" font-family="'Space Mono', 'JetBrains Mono', ui-monospace, 'Noto Sans SC', monospace" font-weight="700" font-size="14" fill="#000000" letter-spacing="0" text-anchor="start" >transform: translate(0,0)</text><text x="64.0" y="734.0" font-family="'Space Mono', 'JetBrains Mono', ui-monospace, 'Noto Sans SC', monospace" font-weight="400" font-size="14" fill="#000000" letter-spacing="0" text-anchor="start" opacity="0.7">shadow 6px 6px</text><text x="350.0" y="642.0" font-family="'Archivo', 'Space Grotesk', 'Noto Sans SC', sans-serif" font-weight="900" font-size="28" fill="#000000" letter-spacing="0" text-anchor="middle" >→</text><rect x="384" y="596" width="250" height="72" fill="none" stroke="#000000" stroke-width="1.5" stroke-dasharray="5 5" opacity="0.45"/><rect x="390" y="602" width="250" height="72" rx="0" fill="#000000"/><rect x="382" y="594" width="250" height="72" rx="0" fill="#FFD23F" stroke="#000000" stroke-width="4"/><text x="507.0" y="640.0" font-family="'Noto Sans SC', 'PingFang SC', sans-serif" font-weight="900" font-size="22" fill="#000000" letter-spacing="0" text-anchor="middle" >悬停 HOVER</text><text x="384.0" y="712.0" font-family="'Space Mono', 'JetBrains Mono', ui-monospace, 'Noto Sans SC', monospace" font-weight="700" font-size="14" fill="#000000" letter-spacing="0" text-anchor="start" >transform: translate(-2px,-2px)</text><text x="384.0" y="734.0" font-family="'Space Mono', 'JetBrains Mono', ui-monospace, 'Noto Sans SC', monospace" font-weight="400" font-size="14" fill="#000000" letter-spacing="0" text-anchor="start" opacity="0.7">shadow 8px 8px</text><text x="670.0" y="642.0" font-family="'Archivo', 'Space Grotesk', 'Noto Sans SC', sans-serif" font-weight="900" font-size="28" fill="#000000" letter-spacing="0" text-anchor="middle" >→</text><rect x="704" y="596" width="250" height="72" fill="none" stroke="#000000" stroke-width="1.5" stroke-dasharray="5 5" opacity="0.45"/><rect x="710" y="602" width="250" height="72" rx="0" fill="#FF8FD6" stroke="#000000" stroke-width="4"/><text x="835.0" y="648.0" font-family="'Noto Sans SC', 'PingFang SC', sans-serif" font-weight="900" font-size="22" fill="#000000" letter-spacing="0" text-anchor="middle" >按下 PRESSED</text><text x="704.0" y="712.0" font-family="'Space Mono', 'JetBrains Mono', ui-monospace, 'Noto Sans SC', monospace" font-weight="700" font-size="14" fill="#000000" letter-spacing="0" text-anchor="start" >transform: translate(6px,6px)</text><text x="704.0" y="734.0" font-family="'Space Mono', 'JetBrains Mono', ui-monospace, 'Noto Sans SC', monospace" font-weight="400" font-size="14" fill="#000000" letter-spacing="0" text-anchor="start" opacity="0.7">shadow 0</text><text x="64.0" y="784.0" font-family="'Noto Sans SC', 'PingFang SC', sans-serif" font-weight="500" font-size="15" fill="#000000" letter-spacing="0" text-anchor="start" >按下 = 元素位移的距离 = 阴影的偏移量：阴影被“按”回元素底下。动效 80–120ms，用阶跃或 linear，别弹。</text><rect x="64" y="814" width="952" height="4" fill="#000000"/><rect x="68" y="836" width="52" height="52" rx="0" fill="#000000"/><rect x="64" y="832" width="52" height="52" rx="0" fill="#FFD23F" stroke="#000000" stroke-width="3"/><text x="90.0" y="867.0" font-family="'Archivo', 'Space Grotesk', 'Noto Sans SC', sans-serif" font-weight="900" font-size="22" fill="#000000" letter-spacing="0" text-anchor="middle" >1</text><text x="140.0" y="858.0" font-family="'Noto Sans SC', 'PingFang SC', sans-serif" font-weight="900" font-size="22" fill="#000000" letter-spacing="0" text-anchor="start" >黑框一律到底</text><text x="324.0" y="858.0" font-family="'Noto Sans SC', 'PingFang SC', sans-serif" font-weight="500" font-size="17" fill="#000000" letter-spacing="0" text-anchor="start" >卡片、按钮、输入框、图片都描 3–4px 纯黑框。</text><text x="324.0" y="882.0" font-family="'Noto Sans SC', 'PingFang SC', sans-serif" font-weight="400" font-size="14" fill="#000000" letter-spacing="0" text-anchor="start" opacity="0.6">小心：一处没框，就像忘了做完</text><rect x="68" y="920" width="52" height="52" rx="0" fill="#000000"/><rect x="64" y="916" width="52" height="52" rx="0" fill="#FF8FD6" stroke="#000000" stroke-width="3"/><text x="90.0" y="951.0" font-family="'Archivo', 'Space Grotesk', 'Noto Sans SC', sans-serif" font-weight="900" font-size="22" fill="#000000" letter-spacing="0" text-anchor="middle" >2</text><text x="140.0" y="942.0" font-family="'Noto Sans SC', 'PingFang SC', sans-serif" font-weight="900" font-size="22" fill="#000000" letter-spacing="0" text-anchor="start" >阴影是实块</text><text x="324.0" y="942.0" font-family="'Noto Sans SC', 'PingFang SC', sans-serif" font-weight="500" font-size="17" fill="#000000" letter-spacing="0" text-anchor="start" >阴影 = 同形黑块偏移 4–8px，模糊 0，只朝右下。</text><text x="324.0" y="966.0" font-family="'Noto Sans SC', 'PingFang SC', sans-serif" font-weight="400" font-size="14" fill="#000000" letter-spacing="0" text-anchor="start" opacity="0.6">小心：加一点模糊就退回了 Material</text><rect x="68" y="1004" width="52" height="52" rx="0" fill="#000000"/><rect x="64" y="1000" width="52" height="52" rx="0" fill="#B8F15A" stroke="#000000" stroke-width="3"/><text x="90.0" y="1035.0" font-family="'Archivo', 'Space Grotesk', 'Noto Sans SC', sans-serif" font-weight="900" font-size="22" fill="#000000" letter-spacing="0" text-anchor="middle" >3</text><text x="140.0" y="1026.0" font-family="'Noto Sans SC', 'PingFang SC', sans-serif" font-weight="900" font-size="22" fill="#000000" letter-spacing="0" text-anchor="start" >平涂高饱和</text><text x="324.0" y="1026.0" font-family="'Noto Sans SC', 'PingFang SC', sans-serif" font-weight="500" font-size="17" fill="#000000" letter-spacing="0" text-anchor="start" >5 个颜色平涂，黑字放在任何颜色上都 ≥ 7:1。</text><text x="324.0" y="1050.0" font-family="'Noto Sans SC', 'PingFang SC', sans-serif" font-weight="400" font-size="14" fill="#000000" letter-spacing="0" text-anchor="start" opacity="0.6">小心：同一屏别超过 3 种底色</text><rect x="68" y="1088" width="52" height="52" rx="0" fill="#000000"/><rect x="64" y="1084" width="52" height="52" rx="0" fill="#7AA2FF" stroke="#000000" stroke-width="3"/><text x="90.0" y="1119.0" font-family="'Archivo', 'Space Grotesk', 'Noto Sans SC', sans-serif" font-weight="900" font-size="22" fill="#000000" letter-spacing="0" text-anchor="middle" >4</text><text x="140.0" y="1110.0" font-family="'Noto Sans SC', 'PingFang SC', sans-serif" font-weight="900" font-size="22" fill="#000000" letter-spacing="0" text-anchor="start" >结构露出来</text><text x="324.0" y="1110.0" font-family="'Noto Sans SC', 'PingFang SC', sans-serif" font-weight="500" font-size="17" fill="#000000" letter-spacing="0" text-anchor="start" >网格、分隔线、标签直接画出来，别藏。</text><text x="324.0" y="1134.0" font-family="'Noto Sans SC', 'PingFang SC', sans-serif" font-weight="400" font-size="14" fill="#000000" letter-spacing="0" text-anchor="start" opacity="0.6">小心：“露”≠ 乱：间距仍按 8px 网格</text><rect x="68" y="1172" width="52" height="52" rx="0" fill="#000000"/><rect x="64" y="1168" width="52" height="52" rx="0" fill="#FF7A45" stroke="#000000" stroke-width="3"/><text x="90.0" y="1203.0" font-family="'Archivo', 'Space Grotesk', 'Noto Sans SC', sans-serif" font-weight="900" font-size="22" fill="#000000" letter-spacing="0" text-anchor="middle" >5</text><text x="140.0" y="1194.0" font-family="'Noto Sans SC', 'PingFang SC', sans-serif" font-weight="900" font-size="22" fill="#000000" letter-spacing="0" text-anchor="start" >一个歪的就够</text><text x="324.0" y="1194.0" font-family="'Noto Sans SC', 'PingFang SC', sans-serif" font-weight="500" font-size="17" fill="#000000" letter-spacing="0" text-anchor="start" >贴纸、徽章可以旋转 2–6°，制造手作感。</text><text x="324.0" y="1218.0" font-family="'Noto Sans SC', 'PingFang SC', sans-serif" font-weight="400" font-size="14" fill="#000000" letter-spacing="0" text-anchor="start" opacity="0.6">小心：全歪就成了 Memphis，失去秩序</text><rect x="64" y="1280" width="952" height="0.1" rx="0" fill="#000000" stroke="#000000" stroke-width="0"/><text x="64.0" y="1300.0" font-family="'Noto Sans SC', 'PingFang SC', sans-serif" font-weight="500" font-size="13" fill="#000000" letter-spacing="0" text-anchor="start" >A11Y：黑框让任何底色都满足非文本对比 3:1（WCAG 1.4.11）；焦点环直接加粗到 6px。</text></svg>
