<rect width="1080" height="1350" fill="#FFF6E5"/><rect x="72" y="64" width="952" height="132" rx="0" fill="#000000"/><rect x="64" y="56" width="952" height="132" rx="0" fill="#FFD23F" stroke="#000000" stroke-width="4"/><text x="90.0" y="136.0" font-family="'Archivo', 'Space Grotesk', 'Noto Sans SC', sans-serif" font-weight="900" font-size="68" fill="#000000" letter-spacing="-0.02em" text-anchor="start" style="font-variation-settings:'wdth' 125">NEO-BRUTAL</text><text x="92.0" y="172.0" font-family="'Noto Sans SC', 'PingFang SC', sans-serif" font-weight="700" font-size="20" fill="#000000" letter-spacing="0" text-anchor="start" >速查 · 五个令牌、三种状态、五条规则</text><text x="990.0" y="172.0" font-family="'Space Mono', 'JetBrains Mono', ui-monospace, 'Noto Sans SC', monospace" font-weight="700" font-size="14" fill="#000000" letter-spacing="0" text-anchor="end" >009 · 2021 → NOW</text><rect x="70" y="242" width="170" height="210" rx="0" fill="#000000"/><rect x="64" y="236" width="170" height="210" rx="0" fill="#FFFFFF" stroke="#000000" stroke-width="3"/><rect x="88" y="256" width="100" height="56" fill="#FFFFFF" stroke="#000000" stroke-width="4"/><path d="M64 336 H234" stroke="#000000" stroke-width="3"/><text x="78.0" y="364.0" font-family="'Space Mono', 'JetBrains Mono', ui-monospace, 'Noto Sans SC', monospace" font-weight="700" font-size="12" fill="#000000" letter-spacing="0.06em" text-anchor="start" >BORDER</text><text x="78.0" y="392.0" font-family="'Noto Sans SC', 'PingFang SC', sans-serif" font-weight="900" font-size="22" fill="#000000" letter-spacing="0" text-anchor="start" >描边</text><text x="78.0" y="416.0" font-family="'Space Mono', 'JetBrains Mono', ui-monospace, 'Noto Sans SC', monospace" font-weight="700" font-size="14" fill="#000000" letter-spacing="0" text-anchor="start" >3–4px</text><text x="78.0" y="436.0" font-family="'Noto Sans SC', 'PingFang SC', sans-serif" font-weight="400" font-size="13" fill="#000000" letter-spacing="0" text-anchor="start" opacity="0.7">纯黑，不用