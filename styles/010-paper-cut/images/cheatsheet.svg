<rect width="1080" height="1350" fill="#EDE8DC"/><text x="90.0" y="48.0" font-family="'JetBrains Mono', ui-monospace, monospace" font-weight="500" font-size="14" letter-spacing="1.96" fill="#5C6E72">DESIGN STYLE  /  N°010</text><text x="990.0" y="48.0" font-family="'Noto Sans SC', 'PingFang SC', sans-serif" font-weight="500" font-size="16" text-anchor="end" fill="#5C6E72">每天一个设计风格</text><text x="90.0" y="1314.0" font-family="'JetBrains Mono', ui-monospace, monospace" font-weight="500" font-size="13" letter-spacing="1.56" fill="#5C6E72">010  ·  PAPER CUT</text><text x="990.0" y="1314.0" font-family="'Jost', 'Futura', 'Avenir Next', sans-serif" font-weight="500" font-size="14" letter-spacing="0.56" text-anchor="end" fill="#5C6E72">@guanmo_ai</text><text x="90.0" y="96.0" font-family="'Noto Sans SC', 'PingFang SC', sans-serif" font-weight="900" font-size="36" fill="#142028">五条规则</text><text x="290.0" y="96.0" font-family="'JetBrains Mono', ui-monospace, monospace" font-weight="500" font-size="14" letter-spacing="1.68" fill="#5C6E72">CHEATSHEET</text><rect x="90" y="118" width="64" height="36" rx="8" fill="#071820"/><rect x="164" y="118" width="64" height="36" rx="8" fill="#E23A2B"/><rect x="238" y="118" width="64" height="36" rx="8" fill="#134A5C"/><rect x="312" y="118" width="64" height="36" rx="8" fill="#1B6572"/><rect x="386" y="118" width="64" height="36" rx="8" fill="#287E7C"/><rect x="460" y="118" width="64" height="36" rx="8" fill="#3D9884"/><rect x="534" y="118" width="64" height="36" rx="8" fill="#6BB894"/><rect x="608" y="118" width="64" height="36" rx="8" fill="#B8DCC8"/><rect x="90" y="220" width="900" height="106" rx="14" fill="#F6F3EB" filter="url(#shF)"/><rect x="90" y="220" width="10" height="106" rx="5" fill="#134A5C"/><text x="118.0" y="256.0" font-family="'JetBrains Mono', ui-monospace, monospace" font-weight="500" font-size="14" letter-spacing="1.40" fill="#E23A2B">01</text><text x="118.0" y="282.0" font-family="'Noto Sans SC', 'PingFang SC', sans-serif" font-weight="900" font-size="26" fill="#142028">一层一色</text><text x="118.0" y="310.0" font-family="'Noto Sans SC', 'PingFang SC', sans-serif" font-weight="500" font-size="16" fill="#5C6E72">一张纸只涂一种颜色</text><rect x="90" y="338" width="900" height="106" rx="14" fill="#F6F3EB" filter="url(#shF)"/><rect x="90" y="338" width="10" height="106" rx="5" fill="#1B6572"/><text x="118.0" y="374.0" font-family="'JetBrains Mono', ui-monospace, monospace" font-weight="500" font-size="14" letter-spacing="1.40" fill="#E23A2B">02</text><text x="118.0" y="400.0" font-family="'Noto Sans SC', 'PingFang SC', sans-serif" font-weight="900" font-size="26" fill="#142028">阴影即深度</text><text x="118.0" y="428.0" font-family="'Noto Sans SC', 'PingFang SC', sans-serif" font-weight="500" font-size="16" fill="#5C6E72">层缝里的软影才是纸</text><rect x="90" y="456" width="900" height="106" rx="14" fill="#F6F3EB" filter="url(#shF)"/><rect x="90" y="456" width="10" height="106" rx="5" fill="#287E7C"/><text x="118.0" y="492.0" font-family="'JetBrains Mono', ui-monospace, monospace" font-weight="500" font-size="14" letter-spacing="1.40" fill="#E23A2B">03</text><text x="118.0" y="518.0" font-family="'Noto Sans SC', 'PingFang SC', sans-serif" font-weight="900" font-size="26" fill="#142028">剪影不描细节</text><text x="118.0" y="546.0" font-family="'Noto Sans SC', 'PingFang SC', sans-serif" font-weight="500" font-size="16" fill="#5C6E72">形状是剪出来的</text><rect x="90" y="574" width="900" height="106" rx="14" fill="#F6F3EB" filter="url(#shF)"/><rect x="90" y="574" width="10" height="106" rx="5" fill="#3D9884"/><text x="118.0" y="610.0" font-family="'JetBrains Mono', ui-monospace, monospace" font-weight="500" font-size="14" letter-spacing="1.40" fill="#E23A2B">04</text><text x="118.0" y="636.0" font-family="'Noto Sans SC', 'PingFang SC', sans-serif" font-weight="900" font-size="26" fill="#142028">远慢近快</text><text x="118.0" y="664.0" font-family="'Noto Sans SC', 'PingFang SC', sans-serif" font-weight="500" font-size="16" fill="#5C6E72">层移的量不同，深度就有了</text><rect x="90" y="692" width="900" height="106" rx="14" fill="#F6F3EB" filter="url(#shF)"/><rect x="90" y="692" width="10" height="106" rx="5" fill="#6BB894"/><text x="118.0" y="728.0" font-family="'JetBrains Mono', ui-monospace, monospace" font-weight="500" font-size="14" letter-spacing="1.40" fill="#E23A2B">05</text><text x="118.0" y="754.0" font-family="'Noto Sans SC', 'PingFang SC', sans-serif" font-weight="900" font-size="26" fill="#142028">限色家族，一点红日</text><text x="118.0" y="782.0" font-family="'Noto Sans SC', 'PingFang SC', sans-serif" font-weight="500" font-size="16" fill="#5C6E72">三到六阶同类色 + 一个暖色</text><text x="90.0" y="860.0" font-family="'Noto Sans SC', 'PingFang SC', sans-serif" font-weight="900" font-size="22" fill="#142028">这样做</text><text x="90.0" y="896.0" font-family="'Noto Sans SC', 'PingFang SC', sans-serif" font-weight="500" font-size="16" fill="#5C6E72">一层一色 · 影子落在下一张纸上 · 剪影 · 远层几乎不动</text><text x="90.0" y="960.0" font-family="'Noto Sans SC', 'PingFang SC', sans-serif" font-weight="900" font-size="22" fill="#E23A2B">别这样</text><text x="90.0" y="996.0" font-family="'Noto Sans SC', 'PingFang SC', sans-serif" font-weight="500" font-size="16" fill="#5C6E72">没阴影的贴纸 · 所有层同速平移 · 一层上画渐变细节</text><clipPath id="box901040900220"><rect x="90" y="1040" width="900" height="220" rx="8"/></clipPath><g clip-path="url(#box901040900220)"><rect x="90" y="1040" width="900" height="220" fill="#071820"/><path d="M776.6 1088.4 a15.400000000000002 15.400000000000002 0 1 0 30.800000000000004 0 a15.400000000000002 15.400000000000002 0 1 0 -30.800000000000004 0 ZM815.9 1098.3 L844.4 1098.8 L817.9 1088.5 ZM810.3 1106.7 L836.4 1118.1 L815.9 1098.4 ZM802.0 1112.3 L821.7 1132.8 L810.3 1106.7 ZM792.1 1114.3 L802.4 1140.8 L801.9 1112.3 ZM782.1 1112.3 L781.6 1140.8 L791.9 1114.3 ZM773.7 1106.7 L762.3 1132.8 L782.0 1112.3 ZM768.1 1098.4 L747.6 1118.1 L773.7 1106.7 ZM766.1 1088.5 L739.6 1098.8 L768.1 1098.3 ZM768.1 1078.5 L739.6 1078.0 L766.1 1088.3 ZM773.7 