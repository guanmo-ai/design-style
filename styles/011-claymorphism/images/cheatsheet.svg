<rect width="1080" height="1350" fill="url(#bg)"/><circle cx="90" cy="70" r="170" fill="#A8D4B8" opacity="0.18"/><circle cx="1010" cy="120" r="200" fill="#C4B4E0" opacity="0.16"/><circle cx="100" cy="1260" r="180" fill="#A8C4E0" opacity="0.16"/><circle cx="990" cy="1240" r="160" fill="#E8A8B6" opacity="0.14"/><text x="90.0" y="120.0" font-family="'Noto Sans SC', 'PingFang SC', sans-serif" font-weight="900" font-size="48" fill="#2C3340" letter-spacing="-0.03em" text-anchor="start">Clay</text><text x="90.0" y="168.0" font-family="'Noto Sans SC', 'PingFang SC', sans-serif" font-weight="500" font-size="20" fill="#7C8796" letter-spacing="0.08em" text-anchor="start">速查  ·  四条可执行规则</text><rect x="90" y="210" width="128" height="128" rx="56" fill="url(#g-peach)" style="filter:drop-shadow(10.0px 18.0px 16.0px rgba(138,155,176,0.38)) drop-shadow(3.5px 7.2px 6.4px rgba(138,155,176,0.19))"/><defs><clipPath id="k0"><rect x="90" y="210" width="128" height="128" rx="56"/></clipPath></defs><g clip-path="url(#k0)"><ellipse cx="131.0" cy="243.3" rx="48.6" ry="35.8" fill="#fff" opacity="0.34"/><ellipse cx="179.6" cy="315.0" rx="53.8" ry="41.0" fill="#6E7E90" opacity="0.07"/></g><text x="250.0" y="252.0" font-family="'Noto Sans SC', 'PingFang SC', sans-serif" font-weight="500" font-size="16" fill="#7C8796" letter-spacing="0.12em" text-anchor="start">01</text><text x="250.0" y="292.0" font-family="'Noto Sans SC', 'PingFang SC', sans-serif" font-weight="900" font-size="34" fill="#2C3340" letter-spacing="0.02em" text-anchor="start">胖圆角</text><text x="250.0" y="324.0" font-family="'Noto Sans SC', 'PingFang SC', sans-serif" font-weight="400" font-size="18" fill="#7C8796" letter-spacing="0" text-anchor="start">半径趋近半高。8 px 的系统圆角捏不出体积。</text><rect x="90" y="378" width="128" height="128" rx="40" fill="url(#g-mint)" style="filter:drop-shadow(10.0px 18.0px 16.0px rgba(138,155,176,0.38)) drop-shadow(3.5px 7.2px 6.4px rgba(138,155,176,0.19))"/><defs><clipPath id="k1"><rect x="90" y="378" width="128" height="128" rx="40"/></clipPath></defs><g clip-path="url(#k1)"><ellipse cx="131.0" cy="411.3" rx="48.6" ry="35.8" fill="#fff" opacity="0.34"/><ellipse cx="179.6" cy="483.0" rx="53.8" ry="41.0" fill="#6E7E90" opacity="0.07"/></g><text x="250.0" y="420.0" font-family="'Noto Sans SC', 'PingFang SC', sans-serif" font-weight="500" font-size="16" fill="#7C8796" letter-spacing="0.12em" text-anchor="start">02</text><text x="250.0" y="460.0" font-family="'Noto Sans SC', 'PingFang SC', sans-serif" font-weight="900" font-size="34" fill="#2C3340" letter-spacing="0.02em" text-anchor="start">成对阴影</text><text x="250.0" y="492.0" font-family="'Noto Sans SC', 'PingFang SC', sans-serif" font-weight="400" font-size="18" fill="#7C8796" letter-spacing="0" text-anchor="start">内凹高光 + 外软投影，光向必须一致。</text><rect x="90" y="546" width="128" height="128" rx="40" fill="url(#g-lav)" style="filter:drop-shadow(10.0px 18.0px 16.0px rgba(138,155,176,0.38)) drop-shadow(3.5px 7.2px 6.4px rgba(138,155,176,0.19))"/><defs><clipPath id="k2"><rect x="90" y="546" width="128" height="128" rx="40"/></clipPath></defs><g clip-path="url(#k2)"><ellipse cx="131.0" cy="579.3" rx="48.6" ry="35.8" fill="#fff" opacity="0.34"/><ellipse cx="179.6" cy="651.0" rx="53.8" ry="41.0" fill="#6E7E90" opacity="0.07"/></g><text x="250.0" y="588.0" font-family="'Noto Sans SC', 'PingFang SC', sans-serif" font-weight="500" font-size="16" fill="#7C8796" letter-spacing="0.12em" text-anchor="start">03</text><text x="250.0" y="628.0" font-family="'Noto Sans SC', 'PingFang SC', sans-serif" font-weight="900" font-size="34" fill="#2C3340" letter-spacing="0.02em" text-anchor="start">粉笔 pastel</text><text x="250.0" y="660.0" font-family="'Noto Sans SC', 'PingFang SC', sans-serif" font-weight="400" font-size="18" fill="#7C8796" letter-spacing="0" text-anchor="start">蜜桃 / 薄荷 / 薰衣草。不要饱和原色。</text><rect x="90" y="714" width="128" height="128" rx="40" fill="url(#g-rose)" style="filter:drop-shadow(10.0px 18.0px 16.0px rgba(138,155,176,0.38)) drop-shadow(3.5px 7.2px 6.4px rgba(138,155,176,0.19))"/><defs><clipPath id="k3"><rect x="90" y="714" width="128" height="128" rx="40"/></clipPath></defs><g clip-path="url(#k3)"><ellipse cx="131.0" cy="747.3" rx="48.6" ry="35.8" fill="#fff" opacity="0.16"/><ellipse cx="179.6" cy="819.0" rx="53.8" ry="41.0" fill="#6E7E90" opacity="0.14"/></g><text x="250.0" y="756.0" font-family="'Noto Sans SC', 'PingFang SC', sans-serif" font-weight="500" font-size="16" fill="#7C8796" letter-spacing="0.12em" text-anchor="start">04</text><text x="250.0" y="796.0" font-family="'Noto Sans SC', 'PingFang SC', sans-serif" font-weight="900" font-size="34" fill="#2C3340" letter-spacing="0.02em" text-anchor="start">挤捏反馈</text><text x="250.0" y="828.0" font-family="'Noto Sans SC', 'PingFang SC', sans-serif" font-weight="400" font-size="18" fill="#7C8796" letter-spacing="0" text-anchor="start">按下变扁、内影加深。不要只改透明度。</text><rect x="90" y="920" width="420" height="220" rx="56" fill="url(#g-mint)" style="filter:drop-shadow(10.0px 18.0px 16.0px rgba(138,155,176,0.38)) drop-shadow(3.5px 7.2px 6.4px rgba(138,155,176,0.19))"/><defs><clipPath id="k4"><rect x="90" y="920" width="420" height="220" rx="56"/></clipPath></defs><g clip-path="url(#k4)"><ellipse cx="224.4" cy="977.2" rx="159.6" ry="61.6" fill="#fff" opacity="0.34"/><ellipse cx="384.0" cy="1100.4" rx="176.4" ry="70.4" fill="#6E7E90" opacity="0.07"/></g><text x="300.0" y="1000.0" font-family="'Noto Sans SC', 'PingFang SC', sans-serif" font-weight="700" font-size="18" fill="#2C3340" letter-spacing="0.08em" text-anchor="middle">这样做</text><text x="300.0" y="1048.0" font-family="'Noto Sans SC', 'PingFang SC', sans-serif" font-weight="400" font-size="16" fill="#7C8796" letter-spacing="0" text-anchor="middle">先定光，圆角先写 48</text><text x="300.0" y="1080.0" font-family="'Noto Sans SC', 'PingFang SC', sans-serif" font-weight="400" font-size="16" fill="#7C8796" letter-spacing="0" text-anchor="middle">内外阴影成对</text><rect x="570" y="920" width="420" height="220" rx="8" fill="#F4F6F8" style="filter:drop-shadow(0px 8px 16px rgba(40,50,70,0.16))"/><text x="780.0" y="1000.0" font-family="'Noto Sans SC', 'PingFang SC', sans-serif" font-weight="700" font-size="18" fill="#2C3340" letter-spacing="0.08em" text-anchor="middle">别这样</text><text x="780.0" y="1048.0" font-family="'Noto Sans SC', 'PingFang SC', sans-serif" font-weight="400" font-size="16" fill="#7C8796" letter-spacing="0" text-anchor="middle">尖角 + 单层扁平投影</text><text x="780.0" y="1080.0" font-family="'Noto Sans SC', 'PingFang SC', sans-serif" font-weight="400" font-size="16" fill="#7C8796" letter-spacing="0" text-anchor="middle">新拟态同色浮雕 / 细描边</text><text x="540.0" y="1288.0" font-family="'Noto Sans SC', 'PingFang SC', sans-serif" font-weight="700" font-size="16" fill="#2C3340" letter-spacing="0.06em" text-anchor="middle">先捏体积，再画界面。</text></svg>
