<rect width="1080" height="1350" fill="url(#bg)"/><circle cx="90" cy="70" r="170" fill="#A8D4B8" opacity="0.18"/><circle cx="1010" cy="120" r="200" fill="#C4B4E0" opacity="0.16"/><circle cx="100" cy="1260" r="180" fill="#A8C4E0" opacity="0.16"/><circle cx="990" cy="1240" r="160" fill="#E8A8B6" opacity="0.14"/><text x="90.0" y="120.0" font-family="'Noto Sans SC', 'PingFang SC', sans-serif" font-weight="900" font-size="48" fill="#2C3340" letter-spacing="0.04em" text-anchor="start">捏法</text><text x="90.0" y="168.0" font-family="'Noto Sans SC', 'PingFang SC', sans-serif" font-weight="500" font-size="20" fill="#7C8796" letter-spacing="0.08em" text-anchor="start">四步，从色块到控件</text><rect x="90" y="220" width="200" height="200" rx="56" fill="url(#g-cream)" style="filter:drop-shadow(0.0px 0.0px 0.0px rgba(138,155,176,0.00)) drop-shadow(0.0px 0.0px 0.0px rgba(138,155,176,0.00))"/><text x="340.0" y="290.0" font-family="'Noto Sans SC', 'PingFang SC', sans-serif" font-weight="500" font-size="22" fill="#7C8796" letter-spacing="0.14em" text-anchor="start">1</text><text x="340.0" y="338.0" font-family="'Noto Sans SC', 'PingFang SC', sans-serif" font-weight="900" font-size="40" fill="#2C3340" letter-spacing="0.02em" text-anchor="start">体积</text><text x="340.0" y="384.0" font-family="'Noto Sans SC', 'PingFang SC', sans-serif" font-weight="400" font-size="20" fill="#7C8796" letter-spacing="0" text-anchor="start">先画胖圆角色块，半径 ≥ 48。</text><rect x="90" y="460" width="200" height="200" rx="56" fill="url(#g-sky)" style="filter:drop-shadow(11.0px 19.8px 17.6px rgba(138,155,176,0.42)) drop-shadow(3.8px 7.9px 7.0px rgba(138,155,176,0.21))"/><text x="340.0" y="530.0" font-family="'Noto Sans SC', 'PingFang SC', sans-serif" font-weight="500" font-size="22" fill="#7C8796" letter-spacing="0.14em" text-anchor="start">2</text><text x="340.0" y="578.0" font-family="'Noto Sans SC', 'PingFang SC', sans-serif" font-weight="900" font-size="40" fill="#2C3340" letter-spacing="0.02em" text-anchor="start">外影</text><text x="340.0" y="624.0" font-family="'Noto Sans SC', 'PingFang SC', sans-serif" font-weight="400" font-size="20" fill="#7C8796" letter-spacing="0" text-anchor="start">光的对面放一层软投影。</text><rect x="90" y="700" width="200" height="200" rx="56" fill="url(#g-mint)" style="filter:drop-shadow(10.0px 18.0px 16.0px rgba(138,155,176,0.38)) drop-shadow(3.5px 7.2px 6.4px rgba(138,155,176,0.19))"/><defs><clipPath id="k2"><rect x="90" y="700" width="200" height="200" rx="56"/></clipPath></defs><g clip-path="url(#k2)"><ellipse cx="154.0" cy="752.0" rx="76.0" ry="56.0" fill="#fff" opacity="0.34"/><ellipse cx="230.0" cy="864.0" rx="84.0" ry="64.0" fill="#6E7E90" opacity="0.07"/></g><text x="340.0" y="770.0" font-family="'Noto Sans SC', 'PingFang SC', sans-serif" font-weight="500" font-size="22" fill="#7C8796" letter-spacing="0.14em" text-anchor="start">3</text><text x="340.0" y="818.0" font-family="'Noto Sans SC', 'PingFang SC', sans-serif" font-weight="900" font-size="40" fill="#2C3340" letter-spacing="0.02em" text-anchor="start">内凹</text><text x="340.0" y="864.0" font-family="'Noto Sans SC', 'PingFang SC', sans-serif" font-weight="400" font-size="20" fill="#7C8796" letter-spacing="0" text-anchor="start">朝光 inset 高光，背光 inset 暗。</text><rect x="80" y="956" width="220" height="168" rx="72" fill="url(#g-peach)" style="filter:drop-shadow(4.5px 8.1px 7.2px rgba(138,155,176,0.17)) drop-shadow(1.6px 3.2px 2.9px rgba(138,155,176,0.09))"/><defs><clipPath id="k3"><rect x="80" y="956" width="220" height="168" rx="72"/></clipPath></defs><g clip-path="url(#k3)"><ellipse cx="150.4" cy="999.7" rx="83.6" ry="47.0" fill="#fff" opacity="0.16"/><ellipse cx="234.0" cy="1093.8" rx="92.4" ry="53.8" fill="#6E7E90" opacity="0.15"/></g><text x="340.0" y="1010.0" font-family="'Noto Sans SC', 'PingFang SC', sans-serif" font-weight="500" font-size="22" fill="#7C8796" letter-spacing="0.14em" text-anchor="start">4</text><text x="340.0" y="1058.0" font-family="'Noto Sans SC', 'PingFang SC', sans-serif" font-weight="900" font-size="40" fill="#2C3340" letter-spacing="0.02em" text-anchor="start">按下去</text><text x="340.0" y="1104.0" font-family="'Noto Sans SC', 'PingFang SC', sans-serif" font-weight="400" font-size="20" fill="#7C8796" letter-spacing="0" text-anchor="start">挤扁，内影加深。这才是粘土。</text><text x="540.0" y="1288.0" font-family="'Noto Sans SC', 'PingFang SC', sans-serif" font-weight="700" font-size="18" fill="#2C3340" letter-spacing="0.06em" text-anchor="middle">先捏体积，再画界面。</text></svg>
